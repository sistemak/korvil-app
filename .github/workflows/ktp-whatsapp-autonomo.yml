name: KTP WhatsApp Autônomo 10/10
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  whatsapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instala deps locais 10/10
        run: npm install --legacy-peer-deps
        working-directory: .[STRIPPED 72 bytes]

      - name: Instala deps raiz
        run: npm install --legacy-peer-deps

      - name: Cobrança automática 7 dias antes
        run: node [STRIPPED 94 bytes].js

      - name: Commitar fila atualizada autonomamente
        run: |
          git config user.name "KTP Autônomo"
          git config user.email "autonomo@ktp.com"
          git add [STRIPPED 80 bytes] diff --staged --quiet || git commit -m "🤖 [AUTÔNOMO] atualiza fila whatsapp [skip ci]"
          git push
