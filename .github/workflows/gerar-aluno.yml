name: Gerar Aluno V25 FINAL REAL

on:
  workflow_dispatch:
    inputs:
      tipo:
        description: 'presencial ou online'
        required: true
        type: string
      nome:
        description: 'Nome completo exato da inscrição'
        required: true
        type: string
      primeiroNome:
        description: 'Primeiro nome real exato'
        required: true
        type: string
      caminho:
        description: 'caminho completo opcional'
        required: false
        type: string

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: LIMPEZA TOTAL BUGGY 42-45
        run: |
          set -e
          BASE_PRES="korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/presencial"
          BASE_ON="korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/online"
          for BASE in "$BASE_PRES" "$BASE_ON"; do
            echo "=== Limpando $BASE ==="
            mkdir -p "$BASE"
            rm -rf "$BASE/42" "$BASE/43" "$BASE/44" "$BASE/45" || true
            rm -rf "$BASE"/42-* "$BASE"/43-* "$BASE"/44-* "$BASE"/45-* || true
            rm -f "$BASE"/42-*.json "$BASE"/43-*.json "$BASE"/44-*.json "$BASE"/45-*.json || true
            echo "Restante em $BASE:"
            ls -1 "$BASE" | head -n 50 || true
          done

      - name: Gerar pasta mãe dinâmica real
        run: |
          set -e
          TIPO="${{ inputs.tipo }}"
          if [[ "$TIPO" == *"pres"* ]]; then TIPO="presencial"; else TIPO="online"; fi
          BASE="korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/$TIPO"
          mkdir -p "$BASE"

          # ULTIMO = scan só regex ^[0-9]+-[a-z0-9]+[0-9]+$  (formato mãe número-nome+numero)
          ULTIMO=$(ls -1 "$BASE" 2>/dev/null | grep -E "^[0-9]+-[a-z0-9]+[0-9]+$" | sed -E 's/^([0-9]+)-.*/\1/' | sort -n | tail -n1)
          if [ -z "$ULTIMO" ]; then ULTIMO=0; fi
          PROX=$((ULTIMO+1))

          SLUG=$(echo "${{ inputs.primeiroNome }}" | tr '[:upper:]' '[:lower:]' | iconv -f utf8 -t ascii//TRANSLIT 2>/dev/null | tr -cd 'a-z0-9')
          if [ -z "$SLUG" ]; then SLUG="aluno"; fi
          # primeiroNomeReal = exato como pessoa preencheu na inscrição, sanitizado a-z0-9 lowercase
          PAD=$PROX
          PASTA="$PAD-$SLUG$PROX" # DINAMICO REAL: 46-joao46 NUNCA 42-marcos42 generico
          LOCAL="$BASE/$PASTA"

          echo "✅ PROX=$PROX PASTA=$PASTA LOCAL=$LOCAL"
          echo "PROX=$PROX" >> $GITHUB_ENV
          echo "PASTA=$PASTA" >> $GITHUB_ENV
          echo "LOCAL=$LOCAL" >> $GITHUB_ENV
          echo "TIPO=$TIPO" >> $GITHUB_ENV
          echo "SLUG=$SLUG" >> $GITHUB_ENV

          mkdir -p "$LOCAL/assets/gifs" "$LOCAL/registros"

          # SÓ 5 ARQUIVOS DENTRO DA MÃE - NUNCA FORA
          echo "{\"id\":$PROX,\"pastaMae\":\"$PASTA\",\"arquivo\":\"$PASTA.json\",\"caminho\":\"$TIPO/$PASTA/$PASTA.json\",\"primeiroNome\":\"$SLUG\",\"nomeCompleto\":\"${{ inputs.nome }}\",\"tipo\":\"$TIPO\",\"criadoEm\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"versao\":\"V25\"}" > "$LOCAL/$PASTA.json"
          echo "<!DOCTYPE html><html><body>Assets $PASTA - ${{ inputs.nome }}</body></html>" > "$LOCAL/assets/index.html"
          echo "<!DOCTYPE html><html><body>Gifs $PASTA</body></html>" > "$LOCAL/assets/gifs/index.html"
          touch "$LOCAL/assets/gifs/cutting.mp4"
          echo "<!DOCTYPE html><html><body>Pesos $PASTA - ${{ inputs.nome }} - V25</body></html>" > "$LOCAL/registros/pesos.html"

          echo "✅ Criado SÓ DENTRO DA MÃE: $LOCAL"
          ls -R "$LOCAL"

      - name: Commit real direto no repositorio original
        run: |
          git config user.name "sistemak-bot"
          git config user.email "bot@sistemak.com"
          git add -A
          git commit -m "V25 FINAL REAL - ${{ env.PASTA }} - ${{ inputs.nome }} - NUNCA GENERICO 42-marcos42 - SÓ DENTRO DA MÃE" || echo "nada para commitar"
          git push origin main
