name: inscricao-do-projeto
on:
  workflow_dispatch:
    inputs:
      dados_json:
        description: 'JSON da inscricao'
        required: true
        type: string
      primeiro_nome:
        description: 'primeiro nome'
        required: true
        type: string
      tipo:
        description: 'presencial ou online'
        required: true
        type: string

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar arquivos da inscricao
        run: node korvil/sections/ktp/projetotransformacao/inscricao-do-projeto/gerar.js
        env:
          DADOS_JSON: ${{ inputs.dados_json }}
          PRIMEIRO_NOME: ${{ inputs.primeiro_nome }}
          TIPO: ${{ inputs.tipo }}
      - name: Commit e Push
        run: |
          git config user.name "korvil-bot"
          git config user.email "bot@korvil.com"
          git add korvil/sections/ktp/projetotransformacao/projetos/2026/
          git diff --cached --quiet || git commit -m "feat: nova inscricao ${{ inputs.tipo }} ${{ inputs.primeiro_nome }}"
          git push
