name: inscricao-do-projeto
on:
  workflow_dispatch:
    inputs:
      dados_json:
        description: 'JSON exato TELA 1-2-3'
        required: true
      primeiro_nome:
        description: 'primeiro nome'
        required: true
      tipo:
        description: 'presencial ou online'
        required: true
jobs:
  salvar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: log
        run: echo "Inscrição ${{ inputs.primeiro_nome }} tipo ${{ inputs.tipo }}"
