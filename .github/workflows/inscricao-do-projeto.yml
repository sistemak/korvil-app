name: Criar Aluno Sequencial Exato 01-mag1
on:
  workflow_dispatch:
    inputs:
      primeiro_nome: {description: 'Primeiro nome slug', required: true, type: string}
      tipo: {description: 'presencial ou online', required: true, default: 'presencial', type: choice, options: [presencial, online]}
      nome_completo: {required: true, type: string}
      texto_formatado: {required: true, type: string}
jobs:
  criar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Limpar duplicatas 42-45 e criar estrutura exata 01-mag1
        run: |
          set -e
          # LIMPA 42-45 duplicados se existirem
          for n in 42 43 44 45; do
            for t in presencial online; do
              BASE="korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/$t"
              for p in "$BASE"/$n-*; do
                [ -e "$p" ] && echo "Removendo duplicata $p" && rm -rf "$p"
              done
            done
          done
          TIPO=$(echo "${{ inputs.tipo }}" | tr '[:upper:]' '[:lower:]')
          SLUG=$(echo "${{ inputs.primeiro_nome }}" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9')
          NOME="${{ inputs.nome_completo }}"
          BASE="korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/$TIPO"
          mkdir -p "$BASE"
          ULTIMO=0
          for d in "$BASE"/*; do [ -d "$d" ] || continue; b=$(basename "$d"); num=$(echo "$b" | grep -oE '^[0-9]+' | head -1); [ -z "$num" ] && continue; num=$((10#$num)); [ $num -gt $ULTIMO ] && ULTIMO=$num; done
          PROX=$((ULTIMO+1)); PAD=$(printf "%02d" $PROX); PASTA="${PAD}-${SLUG}"; LOCAL="$BASE/$PASTA"
          [ -d "$LOCAL" ] && echo "ERRO pasta mae ja existe" && exit 1
          mkdir -p "$LOCAL/assets/gifs" "$LOCAL/registros"
          printf "%s" "${{ inputs.texto_formatado }}" > "$LOCAL/$PASTA.json"
          echo "nada ainda" > "$LOCAL/assets/index.html"
          echo "nada ainda" > "$LOCAL/assets/gifs/index.html"
          if [ -f "korvil/sections/ktp/projetotransformacao/assets/gifs/cutting.mp4" ]; then cp "korvil/sections/ktp/projetotransformacao/assets/gifs/cutting.mp4" "$LOCAL/assets/gifs/cutting.mp4"; else touch "$LOCAL/assets/gifs/cutting.mp4"; fi
          cat > "$LOCAL/registros/pesos.html" <<'HTML'
          <!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-TP 2026</title><style>body{font-family:Arial;background:#0a0a0a;color:#fff;padding:20px}.card{display:inline-block;background:#111;border:1px solid #222;padding:15px;margin:5px;border-radius:8px;min-width:160px}</style></head><body><h1>K-TP PROJETO TRANSFORMAÇÃO 11º ANO - 2026</h1><h2 id="titulo"></h2><div class="stats"><div class="card">Semanas: 0</div><div class="card">Peso: -- kg</div><div class="card">Fase Atual: --</div><div class="card">Registro: --</div></div><p>Nenhum peso registrado ainda</p><p>Aguardando primeiro registro</p><script>const pesos=[];const totalRegistros=0;</script></body></html>
          HTML
          git config user.name "KTP Bot"; git config user.email "bot@korvil.com"; git add -A; git commit -m "feat: $TIPO $PASTA - exata 01-mag1 + limpa 42-45"; git push
