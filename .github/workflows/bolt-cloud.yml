name: SOK - KORVIL APP NA NUVEM
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-sok:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa seu repo
        uses: actions/checkout@v4

      - name: Instala Node e pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Baixa Bolt.diy ilimitado
        run: |
          git clone https://github.com/stackblitz-labs/bolt.diy /tmp/bolt
          cd /tmp/bolt
          pnpm install
          pnpm run build
          mkdir -p $GITHUB_WORKSPACE/korvil/sok
          cp -r build/client/* $GITHUB_WORKSPACE/korvil/sok/
          echo "<!-- SOK KORVIL APP BUILD $(date) -->" >> $GITHUB_WORKSPACE/korvil/sok/index.html

      - name: Configura Pages
        uses: actions/configure-pages@v4

      - name: Sobe pro GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: korvil/sok/

      - name: Deploy
        uses: actions/deploy-pages@v4
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
