name: K-AI Groq Agent
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt para K-AI'
        required: false
        default: 'atualize tudo'

jobs:
  kai:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'k-ai') || github.event.issue.title != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout com GH_TOKEN
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GROQ Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROMPT: ${{ github.event.issue.body || github.event.issue.title || inputs.prompt }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "PROMPT=$PROMPT"
          node korvil/sok/k-ai/groq/index.js

      - name: Commit & Push
        run: |
          git config user.name "k-ai-bot"
          git config user.email "k-ai@korvil.app"
          git add -A
          git diff --cached --quiet || git commit -m "k-ai: auto update from issue #${{ github.event.issue.number }} - $PROMPT"
          git push origin main

      - name: Close Issue
        if: github.event_name == 'issues'
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: |
            ✅ K-AI executou com sucesso!
            - Modelo: llama-3.3-70b-versatile
            - Commit pushado em main
            - Arquivos atualizados: 6/6
