name: K-AI Groq Automation
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt para K-AI gerar arquivo'
        required: true
        default: 'crie um componente'
jobs:
  kai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci || npm install
      - name: Run K-AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node korvil/sok/k-ai/groq/agent.js "${{ github.event.inputs.prompt }}"
      - name: Commit generated
        run: |
          git config user.name "k-ai-bot"
          git config user.email "k-ai@korvil.app"
          git add .
          git diff --staged --quiet || git commit -m "k-ai: ${{ github.event.inputs.prompt }}"
          git push || true
