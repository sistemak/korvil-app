name: K-AI GROQ - igual Meta IA

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt manual (ex: crie dashboard.tsx)'
        required: true
        type: string

jobs:
  k-ai:
    if: contains(github.event.issue.title, 'k-ai') || contains(github.event.issue.body, 'k-ai') || contains(github.event.comment.body, 'k-ai') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run K-AI Agent (GROQ via Secrets)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROMPT: ${{ github.event.issue.body || github.event.comment.body || inputs.prompt }}
          GITHUB_EVENT_PATH: ${{ env.GITHUB_EVENT_PATH }}
        run: |
          echo "Prompt length: ${#PROMPT}"
          node korvil/sok/k-ai/groq/agent.js

      - name: Commit changes
        run: |
          git config user.name "k-ai bot"
          git config user.email "k-ai@korvil.app"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "k-ai: ${{ github.event.issue.title || inputs.prompt }} [skip ci]"
            git push origin HEAD:main || git push
          fi

      - name: Close issue and comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo sistemak/korvil-app --reason completed || echo "close failed"
          gh issue comment ${{ github.event.issue.number }} --repo sistemak/korvil-app --body "✅ K-AI executou (GROQ_API_KEY dos Secrets) e commitou. Veja em https://sistemak.github.io/korvil-app/korvil/sok/k-ai/groq/ ou /actions" || true
