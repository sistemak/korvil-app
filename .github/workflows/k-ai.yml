name: K-AI Auto
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  kai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install groq-sdk
      - run: node agent.js "${{ github.event.issue.title }} ${{ github.event.comment.body }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "K-AI"
          git config user.email "k-ai@bot.com"
          git add -A
          git commit -m "K-AI: ${{ github.event.issue.title }}" || exit 0
          git push
