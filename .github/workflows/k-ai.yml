name: K-AI Groq Auto - IA Funcionando de Verdade - Secrets Auto
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: O que a K-AI deve fazer no repo original
        required: true
        type: string
jobs:
  kai:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mostrar prompt recebido
        run: |
          echo "PROMPT: ${{ github.event.issue.body || github.event.comment.body || inputs.prompt }}"
      - name: K-AI Groq - Cria arquivos direto no original - GROQ_API_KEY + GH_TOKEN + NODE dos Secrets
        run: |
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} GH_TOKEN=${{ secrets.GH_TOKEN }} PROMPT="${{ github.event.issue.body || github.event.comment.body || inputs.prompt }}" node korvil/sok/k-ai/groq/index.js
      - name: Commit direto no original sistemak/korvil-app
        run: |
          git config user.name "k-ai"
          git config user.email "k-ai@korvil.app"
          git add .
          git commit -m "k-ai: ${{ github.event.issue.title || inputs.prompt }}" || echo "sem mudanças"
          git push origin main
      - name: Responder conversando na Issue
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "✅ K-AI Groq executou e commitou direto no original!

          Prompt: ${{ github.event.issue.body || github.event.comment.body || inputs.prompt }}

          Arquivos criados via GROQ_API_KEY + GH_TOKEN + NODE dos Secrets já ativos.
          Ver commits: https://github.com/sistemak/korvil-app/commits/main" || true
          gh issue close ${{ github.event.issue.number }} || true
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
