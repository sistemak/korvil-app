name: K-AI Auto
on:
  issues: {types: [opened, reopened]}
  issue_comment: {types: [created]}
jobs:
  kai:
    if: contains(github.event.issue.title, 'k-ai') || contains(github.event.comment.body, 'k-ai')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {token: ${{ secrets.GH_TOKEN }}}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node agent.js "${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ github.event.comment.body }}"
        env: {GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}}
      - run: |
          git config user.name "K-AI"
          git config user.email "kai@korvil.app"
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git
          git add -A
          git diff --staged --quiet || git commit -m "K-AI: ${{ github.event.issue.title }}"
          git push
