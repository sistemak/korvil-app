name: K-AI Auto
on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

jobs:
  kai:
    if: contains(github.event.issue.title, 'k-ai')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i groq-sdk || true
      - run: node agent.js "${{ github.event.issue.title }} ${{ github.event.issue.body }}"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - run: |
          git config user.name "K-AI Bot"
          git config user.email "kai@korvil.app"
          git add -A
          git diff --staged --quiet || git commit -m "K-AI: ${{ github.event.issue.title }}"
          git push
