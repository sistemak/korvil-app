name: KTP WhatsApp Real Grátis
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - name: Enviar mensagens pendentes
        run: node scripts/whatsapp/scheduler.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Commitar status atualizado
        run: |
          git config user.name "KTP Bot"
          git config user.email "bot@ktp.com"
          git add data/scheduled.json
          git diff --staged --quiet || git commit -m "atualiza status whatsapp [skip ci]"
          git push
