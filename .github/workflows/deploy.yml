name: Deploy Korvil
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Deploy at 2026-10-08T03:06:41.781Z
        run: echo "deployed"

  korvil-groq:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Injetar GROQ_API_KEY automatico
        run: |
          echo "Injetando GROQ_API_KEY do Secrets..."
          sed -i "s|GROQ_API_KEY_INJECT|${{ secrets.GROQ_API_KEY }}|g" x.html
          # fallback se seu secret se chamar GROQ
          if grep -q "GROQ_API_KEY_INJECT" x.html; then
            sed -i "s|GROQ_API_KEY_INJECT|${{ secrets.GROQ }}|g" x.html
          fi
          echo "OK injetado"
      - name: Publicar com GH_TOKEN
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
