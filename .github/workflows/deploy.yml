name: Deploy Korvil
on:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Real Deploy at 2026-10-08T03:06:41.781Z
        run: echo "deployed"

  korvil-groq:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Injetar GROQ_API_KEY automatico
        env:
          GROQ_API_KEY_SECRET: ${{ secrets.GROQ_API_KEY }}
          GROQ_SECRET: ${{ secrets.GROQ }}
        run: |
          KEY="$GROQ_API_KEY_SECRET"
          if [ -z "$KEY" ]; then KEY="$GROQ_SECRET"; fi
          sed -i "s|GROQ_API_KEY_INJECT|$KEY|g" x.html
      - name: Publicar automatico com GH_TOKEN
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
