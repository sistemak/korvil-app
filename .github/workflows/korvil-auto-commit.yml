name: Korvil Auto Commit
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: app-not/package-lock.json

      - name: Node env check
        run: |
          node -v
          npm -v
          echo "GH_TOKEN backend configurado via Secrets - não vaza no app publicado"

      - name: Auto-commit logs if needed
        run: |
          git config user.name "korvil-bot"
          git config user.email "bot@korvil.app"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore: auto log [skip ci]" || echo "no changes"
            git push origin main || echo "push skip"
          else
            echo "clean"
          fi
