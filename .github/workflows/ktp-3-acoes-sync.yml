name: K-TP 3 AÃ§Ãµes - Caminhos Exatos - SÃ³ GitHub + NODE
on:
  push:
    paths:
      - 'korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/**'
      - 'korvil/sections/ktp/projetotransformacao/inscricao-do-projeto/**'
  workflow_dispatch:
  repository_dispatch:
    types: [ktp-nova-inscricao]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Garante estrutura caminhos exatos e exclui caminho errado online
        run: |
          git config user.name "K-TP Bot"
          git config user.email "bot@korvil.app"
          # EXCLUI exatamente o que vocÃª mandou excluir
          git rm -rf korvil/sections/ktp/projetotransformacao/online || true
          # Garante sÃ³ os caminhos exatos que vocÃª enviou
          mkdir -p korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/presencial
          mkdir -p korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/online
          touch korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/presencial/.gitkeep
          touch korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/online/.gitkeep
          touch korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/.gitkeep
          git add korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/
          git diff --staged --quiet || git commit -m "fix: caminhos exatos projetos/2026/alunos/presencial e online - exclui korvil/.../online errado - sÃ³ GitHub + NODE"
          git push || true
