name: K-TP 3 AÃ§Ãµes - GH_TOKEN + NODE automÃ¡tico
on:
  repository_dispatch:
    types: [ktp-3-acoes]
  workflow_dispatch:
  push:
    paths:
      - 'korvil/sections/ktp/projetotransformacao/**'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configura GH_TOKEN e NODE escondidos sem vazar
        run: |
          echo "GH_TOKEN ativado via Secrets - nÃ£o vaza"
          echo "NODE v20 ativado"
          node --version
          npm --version
      - name: Verifica estrutura sem duplicar
        run: |
          ls -la korvil/sections/ktp/projetotransformacao/presencial/ || echo "presencial ainda nÃ£o existe, serÃ¡ criado"
          ls -la korvil/sections/ktp/projetotransformacao/online/ || echo "online ainda nÃ£o existe, serÃ¡ criado"
          ls -la korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/ || echo "cronograma ainda nÃ£o existe"
