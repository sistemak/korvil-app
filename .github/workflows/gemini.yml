name: Gemini Proxy
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt do usuario'
        required: true

jobs:
  run-gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
          
      - name: Chamar Gemini
        run: |
          curl -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent" \
          -H "Authorization: Bearer ${{ secrets.GEMINI_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d "{\"contents\":[{\"parts\":[{\"text\":\"${{ github.event.inputs.prompt }}\"}]}]}" \
          -o resultado.json
          
      - name: Salvar resultado
        run: |
          jq -r '.candidates[0].content.parts[0].text' resultado.json > resultado.txt || cat resultado.json > resultado.txt
          
      - name: Commit resultado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Resultado Gemini"
          file_pattern: resultado.txt
