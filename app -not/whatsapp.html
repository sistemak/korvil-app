<body>
<div class="banner">CÓDIGO MESTRE - CLIQUE COMMIT PRA ENVIAR REAL DIRETO</div>
<header><b>K-ONVERSA</b><button id="func">•••</button></header>
<main>
  <div id="tabs"><button onclick="showTab('inicio')">Inicio</button><button onclick="showTab('whatsapp')">WhatsApp</button></div>
  <section id="inicio">Instruções conectar com código...<button onclick="document.getElementById('wp').style.display='block'">Abrir WhatsApp Oficial Aqui Dentro</button>
  <div id="github-commit">
    <input id="gh_token" type="password" placeholder="Cole seu GH_TOKEN real">
    <p style="font-size:11px;opacity:.6">Exemplo formato: hp_RR67zU91Wyp59ES8wH2k4FZ8KS9XcM15PdHG - use seu token real acima</p>
    <input id="repo" value="sistemak/korvil-app">
    <input id="path" value="app -not/whatsapp.html">
    <input id="msg" value="Update K-ONVERSA cyan oficial">
    <button onclick="commitReal()">Commit Real Direto no Original</button>
    <pre id="log">Buscando SHA...</pre>
  </div>
  </section>
  <section id="whatsapp-tab" style="display:none;position:relative">
    <div style="position:absolute;top:0;left:0;right:0;height:48px;background:rgba(0,229,204,.9);z-index:10;display:flex;align-items:center;padding:0 16px;color:#000;font-weight:800">K-ONVERSA • WhatsApp Cyan</div>
    <iframe id="wp" class="whatsapp" src="https://web.whatsapp.com"></iframe>
  </section>
</main>
<script>
// PWA
const manifest={name:"K-ONVERSA",short_name:"K-ONVERSA",id:"k-onversa-cyan-oficial-v4",theme_color:"#00E5CC",background_color:"#0a0a0a",display:"standalone",start_url:"https://sistemak.github.io/korvil-app/app%20-not/whatsapp.html"};
// SW
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
// BeforeInstall
let deferred;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installBtn')?.classList.remove('hidden')});
// Commit Real
async function commitReal(){
  const token=document.getElementById('gh_token').value;
  const repo=document.getElementById('repo').value;
  const path=document.getElementById('path').value.split('/').map(encodeURIComponent).join('/');
  const msg=document.getElementById('msg').value;
  const log=document.getElementById('log');
  try{
    log.textContent='Buscando SHA...';
    const getRes=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json'}});
    if(!getRes.ok) throw new Error('GET fail '+getRes.status);
    const data=await getRes.json();
    const sha=data.sha;
    const content=btoa(unescape(encodeURIComponent(document.documentElement.outerHTML)));
    log.textContent='Enviando commit...';
    const putRes=await fetch(`https://api.github.com/repos/${repo}/contents/${path}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},body:JSON.stringify({message:msg,content,sha})});
    const result=await putRes.json();
    if(!putRes.ok) throw new Error(JSON.stringify(result));
    log.textContent='SUCESSO commit: '+result.commit.sha;
  }catch(e){log.textContent='ERRO: '+e.message}
}
function showTab(t){document.getElementById('inicio').style.display=t==='inicio'?'block':'none';document.getElementById('whatsapp-tab').style.display=t==='whatsapp'?'block':'none'}
</script>


</body></html>
