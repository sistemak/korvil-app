<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>K-ONVERSA</title>
<meta name="theme-color" content="#00E5CC" />
<link rel="manifest" id="manifest-link" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@600;800&display=swap');
  :root{ --cyan:#00E5CC; --bg:#0a0a0a; --card:#111; --muted:#1a1a1a; }
  *{ font-family:'JetBrains Mono', monospace; }
  .syne{ font-family:'Syne', sans-serif; }
  ::-webkit-scrollbar{ width:4px; height:4px; }
  ::-webkit-scrollbar-thumb{ background:var(--cyan); border-radius:99px; }
  .neon{ box-shadow:0 0 12px #00E5CC55, 0 0 24px #00E5CC22; }
  .neon-text{ text-shadow:0 0 8px #00E5CC; }
</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen overflow-hidden">
<!-- HEADER 56px -->
<header class="h-[56px] bg-[#00E5CC] text-black flex items-center justify-between px-4 sticky top-0 z-40">
  <div class="syne font-black text-[18px] tracking-[-0.02em] flex items-center gap-2">
    <div class="w-7 h-7 bg-black text-[#00E5CC] grid place-items-center rounded-[8px] font-black">K</div>
    K-ONVERSA
    <span class="text-[10px] bg-black text-[#00E5CC] px-2 py-0.5 rounded-full ml-1">NODE v3</span>
  </div>
  <div class="flex items-center gap-3">
    <div id="online-dot" class="w-2.5 h-2.5 bg-[#00ff88] rounded-full animate-pulse shadow-[0_0_8px_#00ff88]"></div>
    <button id="func-btn" class="w-9 h-9 bg-black text-[#00E5CC] rounded-full grid place-items-center hover:scale-105 transition">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </div>
</header>

<!-- MINI MENU -->
<div id="func-menu" class="hidden absolute top-[60px] right-4 w-[220px] bg-[#111] border border-[#00E5CC] rounded-[16px] shadow-[0_0_30px_#00E5CC44] z-50 overflow-hidden">
  <button data-action="programar" class="w-full text-left px-4 py-3 hover:bg-[#00E5CC]/10 flex items-center gap-3 text-[13px]"><span class="w-8 h-8 bg-[#00E5CC]/20 rounded-full grid place-items-center">⏰</span>Programar Mensagens</button>
  <button data-action="respostas" class="w-full text-left px-4 py-3 hover:bg-[#00E5CC]/10 flex items-center gap-3 text-[13px]"><span class="w-8 h-8 bg-[#00E5CC]/20 rounded-full grid place-items-center">⚡</span>Respostas Rápidas</button>
  <button data-action="grupo" class="w-full text-left px-4 py-3 hover:bg-[#00E5CC]/10 flex items-center gap-3 text-[13px]"><span class="w-8 h-8 bg-[#00E5CC]/20 rounded-full grid place-items-center">👥</span>Agendar Grupo</button>
  <button data-action="config" class="w-full text-left px-4 py-3 hover:bg-[#00E5CC]/10 flex items-center gap-3 text-[13px]"><span class="w-8 h-8 bg-[#00E5CC]/20 rounded-full grid place-items-center">⚙️</span>Configurações</button>
  <div class="h-[1px] bg-[#00E5CC]/20"></div>
  <button data-action="conectar" class="w-full text-left px-4 py-3 hover:bg-[#00E5CC]/10 flex items-center gap-3 text-[13px] text-[#00E5CC]"><span class="w-8 h-8 bg-[#00E5CC] text-black rounded-full grid place-items-center">↗</span>Conectar WhatsApp</button>
</div>

<!-- APP ROOT -->
<div id="app" class="h-[calc(100vh-56px)] flex"></div>

<!-- PROGRAMAR MODAL -->
<div id="prog-modal" class="hidden fixed inset-0 z-[100] bg-[#0a0a0a]/90 backdrop-blur-[12px] p-4 overflow-y-auto">
  <div class="max-w-[520px] mx-auto bg-[#111] border border-[#00E5CC] rounded-[24px] p-6 shadow-[0_0_40px_#00E5CC33]">
    <div class="flex justify-between items-center mb-6">
      <h2 class="syne text-[22px] font-black">Programar Mensagens</h2>
      <button onclick="closeProg()" class="w-9 h-9 rounded-full bg-[#1a1a1a] grid place-items-center">✕</button>
    </div>
    <label class="text-[11px] opacity-60">MENSAGEM</label>
    <textarea id="msg" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[14px] min-h-[90px] focus:border-[#00E5CC] outline-none" placeholder="Digite sua mensagem automática..."></textarea>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div><label class="text-[11px] opacity-60">DATA</label><input id="date" type="date" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div>
      <div><label class="text-[11px] opacity-60">HORA</label><input id="time" type="time" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <div><label class="text-[11px] opacity-60">REPETIR</label><select id="repeat" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"><option value="uma-vez">Uma vez</option><option value="diario">Diário</option><option value="semanal">Semanal</option><option value="intervalo">A cada X min</option><option value="personalizado">Personalizado</option></select></div>
      <div><label class="text-[11px] opacity-60">INTERVALO (min)</label><input id="interval" type="number" value="30" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div>
    </div>
    <div class="mt-4"><label class="text-[11px] opacity-60">DIAS DA SEMANA</label><div class="flex gap-1.5 mt-2" id="weekdays"></div></div>
    <div class="mt-4"><label class="text-[11px] opacity-60">QUANTIDADE (0=infinito)</label><input id="qty" type="number" value="0" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div>
    <div class="mt-4"><label class="text-[11px] opacity-60">SELECIONAR CONTATOS</label><div id="contacts-chips" class="flex flex-wrap gap-2 mt-2"></div></div>
    <button id="btn-programar" class="w-full mt-6 h-[48px] bg-[#00E5CC] text-black font-black rounded-[12px] syne tracking-wide neon">⚡ Programar Envio Automático</button>
    <div class="mt-6"><h3 class="text-[12px] opacity-60 mb-2">AGENDAMENTOS ATIVOS</h3><div id="sched-list" class="space-y-2"></div></div>
  </div>
</div>

<script>
const HOME_URL = "https://sistemak.github.io/korvil-app/app%20-not/whatsapp.html";
const DB_NAME = "KOnversaDB";
const STORE = "schedules";
let selectedContacts = new Set();
let contacts = JSON.parse(localStorage.getItem("k_contacts")||'[{"id":"1","name":"Cliente VIP","phone":"5511999999999"},{"id":"2","name":"Equipe Vendas","phone":"5511988888888"},{"id":"3","name":"Suporte K","phone":"5511977777777"},{"id":"4","name":"Lead Quente","phone":"5511966666666"},{"id":"5","name":"Grupo Lançamento","phone":"1203630250000000"}]');
const weekdays = ["D","S","T","Q","Q","S","S"];

// PWA ICONS via canvas
function makeIcon(size){
  const c=document.createElement('canvas'); c.width=size; c.height=size;
  const x=c.getContext('2d'); x.fillStyle='#00E5CC'; x.fillRect(0,0,size,size);
  x.fillStyle='#000'; x.font='900 '+(size*0.55)+'px Syne'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('K',size/2,size/2+size*0.05);
  return c.toDataURL();
}
(async()=>{
  const man={ name:"K-ONVERSA", short_name:"K-ONVERSA", id:"k-onversa-cyan-v3-node", start_url: HOME_URL, display:"standalone", background_color:"#0a0a0a", theme_color:"#00E5CC",
    icons:[ {src:makeIcon(192), sizes:"192x192", type:"image/png"}, {src:makeIcon(512), sizes:"512x512", type:"image/png"} ] };
  const blob=new Blob([JSON.stringify(man)],{type:'application/json'}); const url=URL.createObjectURL(blob);
  document.getElementById('manifest-link').href=url;
  // SW via Blob
  const swCode=`
    const CACHE='k-onversa-v3'; self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./']))); self.skipWaiting();});
    self.addEventListener('activate',e=>{e.waitUntil(clients.claim());});
    self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)));});
    self.addEventListener('periodicsync',()=>{checkSchedules();});
    async function checkSchedules(){ const db=await openDB(); const tx=db.transaction('schedules','readonly'); const all=await tx.objectStore('schedules').getAll(); const now=Date.now(); for(const s of all){ if(s.nextTrigger<=now){ self.registration.showNotification('K-ONVERSA',{body:s.message, icon:'${makeIcon(192)}', badge:'${makeIcon(192)}', vibrate:[200,100,200], tag:'k-onversa', requireInteraction:true}); /* fetch POST /api/send */ } } }
    function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('KOnversaDB',1); r.onupgradeneeded=e=>{e.target.result.createObjectStore('schedules',{keyPath:'id'});}; r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e);});}
    setInterval(()=>{checkSchedules();},30000);
  `;
  const swBlob=new Blob([swCode],{type:'application/javascript'}); const swUrl=URL.createObjectURL(swBlob);
  if('serviceWorker' in navigator){ navigator.serviceWorker.register(swUrl); }
})();

// IndexedDB helpers
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=e=>{if(!e.target.result.objectStoreNames.contains(STORE)) e.target.result.createObjectStore(STORE,{keyPath:'id'});}; r.onsuccess=e=>res(e.target.result); r.onerror=e=>rej(e);});}
async function saveSchedule(s){const db=await openDB(); const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(s); return new Promise(r=>tx.oncomplete=r);}
async function getSchedules(){const db=await openDB(); return new Promise(res=>{const tx=db.transaction(STORE,'readonly'); const req=tx.objectStore(STORE).getAll(); req.onsuccess=()=>res(req.result);});}
async function delSchedule(id){const db=await openDB(); const tx=db.transaction(STORE,'readwrite'); tx.objectStore(STORE).delete(id);}

// UI
const app=document.getElementById('app');
let connected = localStorage.getItem('k_onversa_connected')==='1';
let defferedPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); defferedPrompt=e; const b=document.getElementById('install-btn'); if(b) b.classList.remove('hidden');});

function render(){
  if(!connected){
    app.innerHTML=`
      <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-[280px] h-[280px] bg-[#111] border-2 border-[#00E5CC] rounded-[24px] grid place-items-center relative overflow-hidden neon">
          <div class="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,#00E5CC22,transparent_60%)]"></div>
          <div class="relative z-10">
            <div class="w-24 h-24 mx-auto bg-[#00E5CC] rounded-[20px] grid place-items-center text-black font-black text-[40px] syne">K</div>
            <div id="qr-box" class="mt-6 w-[140px] h-[140px] bg-white rounded-[12px] mx-auto grid place-items-center text-black text-[10px] p-2">QR CODE<br/>Aguardando backend /qr</div>
          </div>
        </div>
        <h1 class="syne font-black text-[24px] mt-6">Conectar WhatsApp</h1>
        <p class="text-[13px] opacity-60 max-w-[320px] mt-2">Abra o WhatsApp > Aparelhos conectados > Conectar aparelho e escaneie. Estilo web.whatsapp.com mas cyan neon.</p>
        <button id="btn-connect" class="mt-6 h-[48px] px-8 bg-[#00E5CC] text-black font-black rounded-[14px] syne neon">↗ Conectar Dispositivo</button>
        <button id="install-btn" class="hidden mt-3 h-[40px] px-6 bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] text-[13px]">⬇ Instalar K-ONVERSA PWA</button>
        <div class="mt-4 text-[11px] opacity-40">HOME_URL: ${HOME_URL}</div>
      </div>`;
    document.getElementById('btn-connect').onclick=async()=>{
      const box=document.getElementById('qr-box');
      box.innerHTML='Carregando QR...';
      try{
        const r=await fetch('/qr'); const j=await r.json();
        if(j.qr){ box.innerHTML='<img src="'+j.qr+'" class="w-full h-full object-contain p-1"/>'; }
        else{ box.innerHTML='QR gerado!<br/>Escaneie agora'; }
      }catch{ box.innerHTML='Modo demo: clique novamente para simular conexão'; setTimeout(()=>{ localStorage.setItem('k_onversa_connected','1'); connected=true; render(); },1200); }
      // demo toggle
      if(box.innerHTML.includes('demo')){ localStorage.setItem('k_onversa_connected','1'); connected=true; setTimeout(render,800); }
    };
    const ib=document.getElementById('install-btn'); if(ib) ib.onclick=()=>{ if(defferedPrompt){ defferedPrompt.prompt(); } };
  } else {
    app.innerHTML=`
      <div class="hidden md:flex w-[360px] bg-[#111] border-r border-[#00E5CC]/20 flex-col">
        <div class="p-3"><div class="flex items-center gap-2 bg-[#1a1a1a] border border-[#00E5CC]/20 rounded-full px-3 h-[40px]"><span class="opacity-50">🔍</span><input id="search" placeholder="Pesquisar" class="bg-transparent outline-none text-[13px] w-full"/></div></div>
        <div id="chat-list" class="flex-1 overflow-y-auto"></div>
      </div>
      <div class="flex-1 flex flex-col bg-[#0a0a0a] relative">
        <div class="h-[56px] bg-[#111] border-b border-[#00E5CC]/20 flex items-center justify-between px-4">
          <div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#00E5CC] text-black grid place-items-center font-black">K</div><div><div class="font-bold text-[14px]">Cliente VIP • K-ONVERSA</div><div class="text-[11px] text-[#00E5CC]">online • cyan secure</div></div></div>
          <div class="flex items-center gap-2 text-[#00E5CC]"><span>📞</span><span>📹</span></div>
        </div>
        <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3 bg-[radial-gradient(ellipse_at_top,#00E5CC0a,transparent_50%)]"></div>
        <div class="p-3 flex items-center gap-2 bg-[#111] border-t border-[#00E5CC]/20"><button class="w-9 h-9 rounded-full bg-[#1a1a1a] grid place-items-center">😊</button><button class="w-9 h-9 rounded-full bg-[#1a1a1a] grid place-items-center">📎</button><input id="msg-input" placeholder="Mensagem K-ONVERSA..." class="flex-1 h-[40px] bg-[#1a1a1a] border border-[#00E5CC]/20 rounded-full px-4 text-[13px] outline-none focus:border-[#00E5CC]"/><button id="send" class="w-10 h-10 bg-[#00E5CC] text-black rounded-full grid place-items-center neon">➤</button></div>
      </div>`;
    // populate
    const list=document.getElementById('chat-list'); if(list){ list.innerHTML=contacts.map(c=>`<div class="px-4 py-3 hover:bg-[#00E5CC]/10 cursor-pointer flex gap-3 border-b border-white/5"><div class="w-10 h-10 rounded-full bg-[#1a1a1a] border border-[#00E5CC]/30 grid place-items-center">${c.name[0]}</div><div class="flex-1"><div class="flex justify-between"><span class="text-[13px] font-bold">${c.name}</span><span class="text-[11px] opacity-50">09:41</span></div><div class="text-[12px] opacity-60 truncate">Mensagem cyan neon ativa...</div></div></div>`).join(''); }
    const msgs=document.getElementById('msgs');
    const demoMsgs=[{me:false, text:"Olá! K-ONVERSA cyan conectado 🔥"},{me:true, text:"Perfeito! Sistema NODE ativo com Baileys"},{me:false, text:"Agendamentos automáticos funcionando"},{me:true, text:"Vou programar envio agora mesmo"}];
    if(msgs) msgs.innerHTML=demoMsgs.map(m=>`<div class="flex ${m.me?'justify-end':'justify-start'}"><div class="${m.me?'bg-[#00E5CC] text-black':'bg-[#1a1a1a] border border-[#00E5CC]/20'} max-w-[78%] px-4 py-2.5 rounded-[16px] ${m.me?'rounded-br-[4px]':'rounded-bl-[4px]'} text-[13px]">${m.text}<div class="text-[10px] opacity-60 mt-1 text-right">09:41 ✓✓</div></div></div>`).join('');
    document.getElementById('send')?.addEventListener('click',()=>{
      const i=document.getElementById('msg-input'); if(!i.value) return;
      const div=document.createElement('div'); div.className='flex justify-end'; div.innerHTML='<div class="bg-[#00E5CC] text-black max-w-[78%] px-4 py-2.5 rounded-[16px] rounded-br-[4px] text-[13px]">'+i.value+'<div class="text-[10px] opacity-60 mt-1 text-right">agora ✓</div></div>';
      msgs.appendChild(div); i.value=''; msgs.scrollTop=msgs.scrollHeight;
    });
  }
}
render();

// menu
const menu=document.getElementById('func-menu'); document.getElementById('func-btn').onclick=()=>{menu.classList.toggle('hidden');};
document.addEventListener('click',e=>{ if(!e.target.closest('#func-btn') && !e.target.closest('#func-menu')) menu.classList.add('hidden');});
menu.querySelectorAll('button').forEach(b=>{b.onclick=()=>{menu.classList.add('hidden'); const a=b.dataset.action; if(a==='programar') openProg(); if(a==='conectar'){ localStorage.removeItem('k_onversa_connected'); connected=false; render(); } if(a==='config') openConfig(); }});

// programar modal logic
function openProg(){
  document.getElementById('prog-modal').classList.remove('hidden');
  const wd=document.getElementById('weekdays'); wd.innerHTML=weekdays.map((d,i)=>'<label class="w-8 h-8 rounded-full bg-[#1a1a1a] border border-[#00E5CC]/30 grid place-items-center cursor-pointer has-[:checked]:bg-[#00E5CC] has-[:checked]:text-black text-[12px]"><input type="checkbox" value="'+i+'" class="hidden">'+d+'</label>').join('');
  const chips=document.getElementById('contacts-chips'); chips.innerHTML=contacts.map(c=>'<button data-id="'+c.id+'" class="chip px-3 py-1.5 rounded-full bg-[#1a1a1a] border border-[#00E5CC]/30 text-[12px]">'+c.name+'</button>').join('');
  chips.querySelectorAll('.chip').forEach(el=>{el.onclick=()=>{ const id=el.dataset.id; if(selectedContacts.has(id)){ selectedContacts.delete(id); el.classList.remove('!bg-[#00E5CC]','!text-black'); } else { selectedContacts.add(id); el.classList.add('!bg-[#00E5CC]','!text-black'); } };});
  refreshSched();
}
function closeProg(){ document.getElementById('prog-modal').classList.add('hidden'); }
document.getElementById('btn-programar').onclick=async()=>{
  const msg=document.getElementById('msg').value; const date=document.getElementById('date').value; const time=document.getElementById('time').value;
  const repeat=document.getElementById('repeat').value; const interval=parseInt(document.getElementById('interval').value||'30'); const qty=parseInt(document.getElementById('qty').value||'0');
  const days=[...document.querySelectorAll('#weekdays input:checked')].map(i=>parseInt(i.value));
  if(!msg){ alert('Digite mensagem'); return; }
  let next = date && time ? new Date(date+'T'+time).getTime() : Date.now()+60000;
  const id='sch_'+Date.now();
  const sched={ id, message:msg, contacts:[...selectedContacts], nextTrigger:next, repeat, intervalMin:interval, qty, days, created:Date.now(), sent:0 };
  await saveSchedule(sched);
  // try backend
  try{ await fetch('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'}, body:JSON.stringify(sched)}); }catch{}
  alert('Agendamento criado! Service Worker checa a cada 30s');
  refreshSched();
};
async function refreshSched(){ const list=document.getElementById('sched-list'); const all=await getSchedules(); list.innerHTML=all.length? all.map(s=>'<div class="bg-[#1a1a1a] border border-[#00E5CC]/20 rounded-[12px] p-3 flex justify-between items-center"><div><div class="text-[12px] font-bold truncate max-w-[200px]">'+s.message+'</div><div class="text-[10px] opacity-60">'+new Date(s.nextTrigger).toLocaleString()+' • '+s.repeat+' • '+s.contacts.length+' contatos</div></div><button onclick="delSch(\''+s.id+'\')" class="w-8 h-8 rounded-full bg-red-500/20 text-red-400 grid place-items-center">🗑️</button></div>').join('') : '<div class="text-[12px] opacity-40">Nenhum agendamento ativo</div>'; }
window.delSch=async(id)=>{ await delSchedule(id); refreshSched(); };

// GH TOKEN commit
function openConfig(){
  const html='<div id="cfg" class="fixed inset-0 z-[101] bg-[#0a0a0a]/90 backdrop-blur p-4"><div class="max-w-[520px] mx-auto bg-[#111] border border-[#00E5CC] rounded-[24px] p-6"><div class="flex justify-between items-center mb-4"><h2 class="syne font-black">Commit Real GitHub</h2><button onclick="document.getElementById(\'cfg\').remove()" class="w-8 h-8 rounded-full bg-[#1a1a1a] grid place-items-center">✕</button></div><label class="text-[11px] opacity-60">GH_TOKEN (sessionStorage)</label><input id="gh_token" type="password" placeholder="ghp_..." class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"><div class="grid grid-cols-2 gap-3 mt-3"><div><label class="text-[11px] opacity-60">REPO</label><input id="gh_repo" value="sistemak/korvil-app" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div><div><label class="text-[11px] opacity-60">FILE PATH</label><input id="gh_path" value="app -not/whatsapp.html" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"></div></div><label class="text-[11px] opacity-60 mt-3 block">COMMIT MESSAGE</label><input id="gh_msg" value="feat: update K-ONVERSA cyan v3 node" class="w-full bg-[#1a1a1a] border border-[#00E5CC]/30 rounded-[12px] p-3 mt-1 text-[13px]"><button id="gh_commit" class="w-full mt-4 h-[48px] bg-[#00E5CC] text-black font-black rounded-[12px]">🚀 Commit Real no Repositório Original</button><div id="gh_log" class="mt-3 text-[11px] opacity-60 bg-black/50 p-3 rounded-[12px] min-h-[60px]">Logs aparecerão aqui...</div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  document.getElementById('gh_commit').onclick=async()=>{
    const token=document.getElementById('gh_token').value; const repo=document.getElementById('gh_repo').value; const path=document.getElementById('gh_path').value; const msg=document.getElementById('gh_msg').value; const log=document.getElementById('gh_log');
    if(!token){ log.textContent='Informe GH_TOKEN'; return; }
    sessionStorage.setItem('gh_token', token);
    log.textContent='Buscando SHA...';
    try{
      const getRes=await fetch('https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path),{headers:{Authorization:'Bearer '+token, Accept:'application/vnd.github+json'}});
      let sha=null; if(getRes.ok){ const j=await getRes.json(); sha=j.sha; log.textContent='SHA: '+sha.slice(0,7)+'... enviando...'; }
      else { log.textContent='Arquivo novo (sem SHA), criando...'; }
      const content=btoa(unescape(encodeURIComponent(document.documentElement.outerHTML)));
      const putRes=await fetch('https://api.github.com/repos/'+repo+'/contents/'+encodeURIComponent(path),{method:'PUT', headers:{Authorization:'Bearer '+token, 'Content-Type':'application/json', Accept:'application/vnd.github+json'}, body:JSON.stringify({message:msg, content, sha, committer:{name:'K-ONVERSA BOT', email:'bot@k-onversa.dev'}})});
      const putJ=await putRes.json();
      if(putRes.ok){ log.textContent='✅ Commit OK! '+putJ.commit.html_url; } else { log.textContent='❌ Erro: '+JSON.stringify(putJ); }
    }catch(e){ log.textContent='Erro: '+e.message; }
  };
}
</script>
