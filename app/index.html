<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL APP</title><script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="data:application/json,{'name':'KORVIL APP','short_name':'KORVIL','start_url':'/app/','display':'standalone','background_color':'#000','theme_color':'#00e5ff','icons':[{'src':'https://github.com/sistemak/korvil-app/blob/main/public/korvil/assets/korvil.png?raw=true','sizes':'192x192'}]}">
<style>body{background:#000;color:#fff} #kai-app{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle,#00e5ff,#0097a7);box-shadow:0 0 30px #00e5ff;position:fixed;right:16px;bottom:16px;z-index:9999;animation:pulse 2s infinite}</style>
</head>
<body class="flex flex-col h-screen">
<header class="h-[64px] bg-black border-b border-zinc-900 flex items-center justify-between px-4"><span>☰</span><img src="https://github.com/sistemak/korvil-app/blob/main/public/korvil/assets/korvil.png?raw=true" class="w-10 h-10 rounded-full"><div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center">👤</div></header>
<div class="flex flex-1 overflow-hidden">
<aside class="w-[90px] bg-[#0a0a0a] flex flex-col items-center py-6 gap-6"><div class="flex flex-col items-center"><img src="https://github.com/sistemak/korvil-app/blob/main/korvil/sections/kalma/images/logokalma.png" class="w-10"><span class="text-[9px]">KALMA</span></div><div class="flex flex-col items-center"><img src="https://github.com/sistemak/korvil-app/blob/main/korvil/sections/kafortunado/images/logokafortunado.png" class="w-10"><span class="text-[9px]">KAFORTUNADO</span></div><div class="flex flex-col items-center"><img src="https://github.com/sistemak/korvil-app/blob/main/korvil/sections/ktp/assets/images/logoktp.png" class="w-10 rounded-full border border-green-400 shadow-[0_0_15px_#00ff88]"><span class="text-[9px] text-green-400">KTP</span></div><div class="flex flex-col items-center"><img src="https://github.com/sistemak/korvil-app/blob/main/korvil/sections/sistemak/images/logosistemak.png" class="w-10"><span class="text-[9px]">SISTEMAK</span></div><span class="mt-auto text-[8px] text-zinc-600">v2026.10</span></aside>
<main class="flex-1 bg-black p-4 overflow-auto">
<h1 class="text-xl font-bold">KORVIL APP - Conteúdo Real</h1>
<p class="text-zinc-400 text-sm mt-1">Aqui mostra tudo que foi criado no S.O.K automaticamente (não mostra mais "Conteúdo original preservado")</p>
<div id="app-feed" class="mt-6 grid gap-3"></div>
</main>
</div>
<div id="kai-app" class="flex items-center justify-center flex-col"><img src="https://github.com/sistemak/korvil-app/blob/main/public/korvil/assets/kai.png?raw=true" class="w-8"><span class="text-[9px] text-black font-bold">K-AI</span></div>
<script>
// APP MOSTRA AUTOMATICAMENTE O QUE TEM NO GITHUB
async function loadApp(){
  const base="https://raw.githubusercontent.com/sistemak/korvil-app/main/";
  const feed=document.getElementById('app-feed');
  // Lista automática das seções reais
  feed.innerHTML=`
  <div class='bg-zinc-900 p-4 rounded-xl'>🛒 KORVIL LOJA - <a href='/korvil/sections/centralkorvil/korvil-loja/index.html' class='text-cyan-400'>Abrir loja</a></div>
  <div class='bg-zinc-900 p-4 rounded-xl'>💪 K-TP Fitness - <a href='/korvil/sections/ktp/index.html' class='text-green-400'>Abrir</a></div>
  <div class='bg-zinc-900 p-4 rounded-xl'>🧠 KALMA Saúde - <a href='/korvil/sections/kalma/index.html' class='text-purple-400'>Abrir</a></div>
  <div class='bg-zinc-900 p-4 rounded-xl'>💰 K-AFORTUNADO - <a href='/korvil/sections/kafortunado/index.html' class='text-yellow-400'>Abrir</a></div>
  <div class='bg-zinc-900 p-4 rounded-xl'>⚙️ SISTEMAK - <a href='/korvil/sections/sistemak/index.html' class='text-blue-400'>Abrir</a></div>
  `;
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('data:text/javascript;base64,'+btoa('self.addEventListener("fetch",e=>{})'))}
loadApp();
document.getElementById('kai-app').onclick=()=>location.href='https://github.com/sistemak/korvil-app/blob/main/korvil/sok/k-ai/index.html';
</script>
</body></html>
