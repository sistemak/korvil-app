import Header from './components/Header.jsx'
import ProductCard from './components/ProductCard.jsx'
import Cart from './components/Cart.jsx'
import produtosData from './data/produtos.json'

export default function App(){
  const [produtos] = useState(produtosData)
  const [cart,setCart] = useState([])
  const [showCart,setShowCart] = useState(false)
  const [filtro,setFiltro] = useState('Todos')
  const categorias = ['Todos', ...Array.from(new Set(produtos.map(p=>p.categoria)))]

  const addToCart = (p) => {
    setCart(c=>{
      const ex = c.find(i=>i.id===p.id)
      if(ex) return c.map(i=> i.id===p.id ? {...i, qty: i.qty+1} : i)
      return [...c, {...p, qty:1}]
    })
    setShowCart(true)
  }
  const remove = (id) => setCart(c=>c.filter(i=>i.id!==id))
  const qty = (id,d) => setCart(c=>c.map(i=>{
    if(i.id!==id) return i
    const n = i.qty+d
    return n<=0 ? null : {...i, qty:n}
  }).filter(Boolean))

  const total = useMemo(()=>cart.reduce((s,i)=>s+i.preco*i.qty,0),[cart])
  const count = useMemo(()=>cart.reduce((s,i)=>s+i.qty,0),[cart])
  const filtrados = filtro==='Todos' ? produtos : produtos.filter(p=>p.categoria===filtro)

  return (
    <div className="min-h-screen bg-zinc-950 text-white">
      <Header cartCount={count} onCart={()=>setShowCart(true)}/>
      <div className="max-w-[1200px] mx-auto px-6 py-8">
        <div className="rounded-[32px] bg-gradient-to-br from-zinc-900 to-zinc-950 border border-zinc-800 p-8 md:p-12 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
          <div><h1 className="text-4xl md:text-6xl font-black leading-[0.9] tracking-tighter">WHEY<br/><span className="text-[#00f0ff]">CREATINA</span><br/>PURO DESEMPENHO</h1><p className="text-zinc-400 mt-4 max-w-[420px]">Os melhores suplementos com entrega 24h. Código pronto, checkout real, carrinho funcional.</p></div>
          <div className="flex gap-2 flex-wrap">{categorias.map(cat=><button key={cat} onClick={()=>setFiltro(cat)} className={\`px-4 py-2 rounded-full text-xs font-bold tracking-widest border \${filtro===cat?'bg-[#00f0ff] text-black border-[#00f0ff]':'bg-zinc-800 border-zinc-700 text-zinc-300'}\`}>{cat}</button>)}</div>
        </div>
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
          {filtrados.map(p=><ProductCard key={p.id} p={p} onAdd={addToCart}/>)}
        </div>
      </div>
      {showCart && <Cart items={cart} onClose={()=>setShowCart(false)} onRemove={remove} onQty={qty} total={total}/>}
    </div>
  )
}`}],sh=()=>[{path:"src/App.jsx",lang:"jsx",content:`import { useState, useMemo } from 'react'

const restaurantes = [
  { id:1, nome:'Burger Forja', cat:'Burgers', tempo:'25-35', taxa:4.9, img:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=400', pratos:[{id:101,nome:'Smash Duplo', preco:32.9},{id:102,nome:'Bacon Triple', preco:41.9}] },
  { id:2, nome:'Sushi K-AI', cat:'Japonesa', tempo:'30-40', taxa:4.5, img:'https://images.unsplash.com/photo-1579584425555-c3ce17fd4351?w=400', pratos:[{id:201,nome:'Combo 20 peças', preco:69.9},{id:202,nome:'Temaki Salmão', preco:24.9}] },
  { id:3, nome:'Pizza Turbo', cat:'Pizzas', tempo:'20-30', taxa:3.9, img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400', pratos:[{id:301,nome:'Calabresa G', preco:54.9},{id:302,nome:'Frango Catupiry', preco:59.9}] },
]

export default function App(){
  const [cart,setCart] = useState([])
  const [ativo,setAtivo] = useState(restaurantes[0])
  const total = useMemo(()=>cart.reduce((s,i)=>s+i.preco*i.qty,0),[cart])
  const add = (prato, restNome) => setCart(c=>{ const ex=c.find(i=>i.id===prato.id); return ex? c.map(i=>i.id===prato.id?{...i,qty:i.qty+1}:i) : [...c,{...prato, qty:1, restaurante: restNome}] })
  return (
    <div className="min-h-screen bg-zinc-950 text-white flex flex-col">
      <header className="p-6 flex justify-between items-center border-b border-zinc-800"><span className="font-black tracking-widest text-xl">K-DELIVERY<span className="text-[#00f0ff]"> FORJA</span></span><div className="bg-white text-black px-4 py-1 rounded-full text-xs font-bold">{cart.length} itens • R$ {total.toFixed(2)}</div></header>
      <div className="flex flex-1">
        <div className="w-[320px] border-r border-zinc-800 p-4 space-y-3 overflow-auto">
          {restaurantes.map(r=>(
            <div key={r.id} onClick={()=>setAtivo(r)} className={\`cursor-pointer p-4 rounded-[20px] border flex gap-3 \${ativo.id===r.id?'bg-zinc-900 border-[#00f0ff]/50':'bg-zinc-900/50 border-zinc-800'}\`}><img src={r.img} className="w-14 h-14 rounded-xl object-cover"/><div><p className="font-bold text-sm">{r.nome}</p><p className="text-[11px] text-zinc-400">{r.cat} • {r.tempo}min • R$ {r.taxa}</p></div></div>
          ))}
          <div className="bg-[#00f0ff] text-black rounded-[20px] p-4 mt-6"><p className="font-black text-sm">CARRINHO REAL</p>{cart.map(i=><div key={i.id} className="flex justify-between text-xs mt-2 font-bold"><span>{i.qty}x {i.nome}</span><span>R$ {(i.preco*i.qty).toFixed(2)}</span></div>)}{cart.length===0 && <p className="text-xs mt-2">Vazio</p>}<button className="w-full bg-black text-[#00f0ff] mt-4 py-2 rounded-full text-xs font-black">PEDIR R$ {total.toFixed(2)}</button></div>
