<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-AI FORJA V2 - Criador de Qualquer Coisa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#e0faff;font-family:Inter,sans-serif}
.header{position:sticky;top:0;z-index:99;background:#000;border-bottom:2px solid #00f0ff;box-shadow:0 0 25px rgba(0,240,255,.4);padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:20px;border:1px solid #00f0ff;color:#00f0ff;background:transparent;font-weight:700;font-size:11px;cursor:pointer;transition:.2s}
.btn:hover{background:#00f0ff;color:#000;box-shadow:0 0 20px #00f0ff}
.btn-pri{background:#00f0ff;color:#000;box-shadow:0 0 15px #00f0ff}
.layout{display:grid;grid-template-columns:300px 1fr 360px;gap:10px;padding:10px;height:calc(100vh - 60px)}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:#000;border:1px solid rgba(0,240,255,.25);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 15px rgba(0,240,255,.1)}
.folder{padding:8px 10px;background:rgba(0,240,255,.08);color:#00f0ff;font-weight:800;font-size:11px;display:flex;justify-content:space-between;cursor:pointer}
.file{padding:6px 10px;font-size:11px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid rgba(0,240,255,.07)}
.file:hover{background:rgba(0,240,255,.12)}
.file.ativo{background:#00f0ff;color:#000;font-weight:700}
.preview{flex:1;background:#050505;border:1px solid rgba(0,240,255,.2);border-radius:8px;margin:8px;overflow:auto;padding:10px}
.opcao{border:1px solid rgba(0,240,255,.3);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;transition:.2s}
.opcao:hover{border-color:#00f0ff;box-shadow:0 0 20px rgba(0,240,255,.3);transform:scale(1.02)}
.log{font-size:9px;padding:4px 6px;border-left:2px solid #00f0ff;margin:2px 0;background:rgba(0,240,255,.05)}
</style>
</head>
<body>
<div class="header">
<div style="font-weight:900;color:#00f0ff;text-shadow:0 0 10px #00f0ff">K-AI FORJA V2 • PRETO TURQUESA NEON</div>
<span id="ponto" style="font-size:10px;color:#00f0ff">Ponto 2026 - --</span>
<button class="btn btn-pri" onclick="F.BAIXAR_TUDO()">📦 BAIXAR TUDO</button>
<button class="btn" onclick="F.HISTORICO()">📜 HISTÓRICO</button>
<button class="btn" onclick="F.VER_BANCO()">💾 BANCO FORJA</button>
<button class="btn" onclick="F.ATIVAR()">🎙️ K-AI 5s</button>
<span style="font-size:10px" id="mic">MIC OFF</span>
</div>

<div class="layout">
<div class="panel">
<div style="padding:8px;display:flex;gap:6px;flex-wrap:wrap">
<button class="btn" onclick="F.NOVA_PASTA()">+ PASTA</button>
<button class="btn" onclick="F.NOVO_PROJETO()">+ PROJETO</button>
<button class="btn" onclick="F.EXPANDIR()">📂 EXPANDIR TUDO</button>
</div>
<div id="arvore" style="flex:1;overflow:auto"></div>
<div style="padding:8px;border-top:1px solid rgba(0,240,255,.2);font-size:10px">
<div>💾 Banco Original FORJA</div>
<div id="bancoInfo" style="opacity:.7"></div>
<button class="btn" style="width:100%;margin-top:6px" onclick="F.EXPORTAR_BANCO()">Exportar Banco</button>
</div>
</div>

<div class="panel">
<div style="padding:10px">
<input id="prompt" placeholder="Descreva sua ideia... ex: loja suplementos whey creatina com carrinho" style="width:100%;padding:12px;background:#000;border:2px solid #00f0ff;border-radius:10px;color:#00f0ff;box-shadow:0 0 15px rgba(0,240,255,.3)" oninput="F.ANALISAR(this.value)">
<div id="keywords" style="font-size:10px;margin-top:6px;color:#00f0ff"></div>
<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
<button class="btn" onclick="F.USAR_IDEIA('loja suplementos')">Loja Suplementos</button>
<button class="btn" onclick="F.USAR_IDEIA('app delivery')">App Delivery</button>
<button class="btn" onclick="F.USAR_IDEIA('site portfolio')">Site Portfólio</button>
<button class="btn" onclick="F.USAR_IDEIA('sistema gestão')">Sistema Gestão</button>
<button class="btn" onclick="F.USAR_IDEIA('landing page')">Landing Page</button>
</div>
</div>

<div style="padding:8px;display:flex;gap:6px">
<select id="paleta" onchange="F.MUDAR_COR(this.value)" style="background:#000;border:1px solid #00f0ff;color:#00f0ff;padding:6px;border-radius:8px">
<option value="#00f0ff">Turquesa Neon</option>
<option value="#ff00ff">Roxo Cyberpunk</option>
<option value="#00ff00">Verde Matrix</option>
<option value="#ff6600">Laranja Fogo</option>
<option value="#0066ff">Azul Oceano</option>
<option value="#ffff00">Amarelo Neon</option>
<option value="#ff0066">Rosa Neon</option>
</select>
<button class="btn" onclick="F.GERAR_3()">🚀 GERAR 3 OPÇÕES</button>
</div>

<div id="opcoes" style="padding:8px;max-height:180px;overflow:auto"></div>

<div style="padding:8px;border-top:1px solid rgba(0,240,255,.2);font-weight:700;font-size:11px;color:#00f0ff">👁️ VISUALIZADOR TEMPO REAL</div>
<div id="preview" class="preview">Seu projeto vai aparecer aqui renderizado em tempo real...</div>

<div style="padding:8px;display:flex;gap:6px">
<button class="btn btn-pri" onclick="F.BAIXAR_PROJETO_ATUAL()" style="flex:1">📦 BAIXAR PROJETO ATUAL COMPLETO (ZIP)</button>
<button class="btn" onclick="F.ABRIR_PREVIEW()">↗️ ABRIR</button>
</div>
</div>

<div class="panel">
<div style="padding:8px;font-weight:800;font-size:11px;color:#00f0ff;border-bottom:1px solid rgba(0,240,255,.2)">📝 CÓDIGO VIVO + HISTÓRICO</div>
<div id="editor" style="flex:1;padding:10px;font-family:monospace;font-size:10px;white-space:pre-wrap;overflow:auto;background:#000;color:#80f0ff">Selecione arquivo...</div>
<div id="historico" style="height:140px;overflow:auto;border-top:1px solid rgba(0,240,255,.2)"></div>
</div>
</div>

<script>
const F={
projetoAtual:null, versao:1.0,
db:JSON.parse(localStorage.getItem('FORJA_V2_DB')||'{"projetos":{"Loja-Suplementos":{"/src":["App.jsx","main.jsx"],"/components":["Header.jsx"],"/lojas":["produtos.json"]}}, "arquivos":{}}'),
init(){
 this.versao=parseFloat(localStorage.getItem('FORJA_V')||'1.0');
 this.renderArvore(); this.atualizarPonto(); this.atualizarBanco(); this.initVoz();
 this.log('FORJA V2 iniciada - Banco Original ativo - Ponto 2026 '+new Date().toLocaleString());
},
atualizarPonto(){const d=new Date();document.getElementById('ponto').textContent=`Ponto 2026 - ${d.toLocaleDateString()} ${d.toLocaleTimeString()} - v${this.versao.toFixed(1)}`;},
atualizarBanco(){const total=Object.keys(this.db.projetos).length;const arqs=Object.keys(this.db.arquivos).length;document.getElementById('bancoInfo').textContent=`${total} projetos • ${arqs} arquivos • ${localStorage.length} itens salvos`;},
renderArvore(){
 const c=document.getElementById('arvore'); c.innerHTML='';
 Object.keys(this.db.projetos).forEach(proj=>{
  const fd=document.createElement('div'); fd.className='folder'; fd.innerHTML=`📦 ${proj} <span><button class="btn" style="padding:2px 6px;font-size:8px" onclick="F.BAIXAR_PROJETO('${proj}')">ZIP</button> <button class="btn" style="padding:2px 6px;font-size:8px" onclick="F.ABRIR_PROJETO('${proj}')">ABRIR</button></span>`; fd.onclick=()=>F.ABRIR_PROJETO(proj); c.appendChild(fd);
  const pastas=this.db.projetos[proj];
  Object.keys(pastas).forEach(pasta=>{
   const pd=document.createElement('div'); pd.style.paddingLeft='16px'; pd.className='folder'; pd.style.background='rgba(0,240,255,.04)'; pd.textContent=`📁 ${pasta} (${pastas[pasta].length})`; c.appendChild(pd);
   pastas[pasta].forEach(arq=>{
    const el=document.createElement('div'); el.className='file'; el.style.paddingLeft='32px'; el.innerHTML=`<span>📄 ${arq}</span><span><button class="btn" style="padding:1px 5px;font-size:8px" onclick="event.stopPropagation();F.EDITAR('${proj}','${pasta}','${arq}')">EDITAR</button></span>`; el.onclick=()=>F.EDITAR(proj,pasta,arq); c.appendChild(el);
   });
  });
 });
},
ANALISAR(texto){
 const kws=texto.toLowerCase().split(' ').filter(w=>w.length>3);
 const conceitos=[];
 if(texto.includes('loja')||texto.includes('suplemento')) conceitos.push('e-commerce','produtos','carrinho');
 if(texto.includes('app')) conceitos.push('PWA','mobile','offline');
 if(texto.includes('site')) conceitos.push('landing','SEO','responsivo');
 document.getElementById('keywords').innerHTML=`Keywords: <b>${kws.join(', ')}</b> | Conceitos: <b>${conceitos.join(', ')}</b>`;
},
USAR_IDEIA(ideia){document.getElementById('prompt').value=ideia; this.ANALISAR(ideia); this.GERAR_3();},
GERAR_3(){
 const prompt=document.getElementById('prompt').value||'projeto';
 const opcoes=[
  {nome:'Opção A - Neon Grid', cor:'#00f0ff', desc:'Grid futurista com cards neon, ideal para loja'},
  {nome:'Opção B - Liquid Hero', cor:'#ff00ff', desc:'Hero liquido com gradiente, ideal para landing'},
  {nome:'Opção C - Dashboard OS', cor:'#00ff88', desc:'Dashboard sistema, ideal para gestão'}
 ];
 const c=document.getElementById('opcoes'); c.innerHTML='';
 opcoes.forEach((op,i)=>{
  const div=document.createElement('div'); div.className='opcao';
  div.innerHTML=`<div style="font-weight:800;color:${op.cor}">${op.nome}</div><div style="font-size:10px;opacity:.8">${op.desc}</div><div style="margin-top:6px;display:flex;gap:6px"><button class="btn" onclick="F.APLICAR_OPCAO(${i},'${prompt}')">Usar</button><button class="btn" onclick="F.PREVIEW_OPCAO(${i})">Preview</button><button class="btn" onclick="F.MUDAR_COR('${op.cor}')">Cor ${op.cor}</button></div>`;
  c.appendChild(div);
 });
 this.log(`FORJA gerou 3 opções para: ${prompt} - Ponto 2026`);
},
APLICAR_OPCAO(i,prompt){
 const nome=`${prompt.replace(/\s+/g,'-')}-${Date.now()}`;
 const projeto=nome;
 this.db.projetos[projeto]={"/src":[`${nome}.jsx`,"App.jsx"],"/components":["Header.jsx"],"/banco":["dados.json"]};
 this.db.arquivos[`${nome}.jsx`]=`// Projeto ${prompt} - Opção ${i} - Ponto 2026 ${new Date().toLocaleString()}\nexport default function ${nome.replace(/-/g,'')}(){ return <div style="padding:20px;background:${document.getElementById('paleta').value};color:#000;border-radius:12px"><h1>${prompt}</h1><p>Criado pela FORJA - 3 opções</p></div> }`;
 this.projetoAtual=projeto;
 this.renderArvore(); this.atualizarBanco(); this.PREVIEW_PROJETO(projeto);
 localStorage.setItem('FORJA_V2_DB',JSON.stringify(this.db));
 this.log(`Projeto criado e aplicado: ${projeto} - Ponto 2026 v${(this.versao+=0.1).toFixed(1)}`);
 localStorage.setItem('FORJA_V',this.versao);
},
PREVIEW_PROJETO(proj){
 const p=document.getElementById('preview');
 p.innerHTML=`<div style="padding:12px"><h2 style="color:#00f0ff">${proj}</h2><div style="margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">`+Object.keys(this.db.projetos[proj]||{}).map(pasta=>`<div style="background:rgba(0,240,255,.1);padding:8px;border-radius:8px;border:1px solid #00f0ff"><b>${pasta}</b><br>${(this.db.projetos[proj][pasta]||[]).join('<br>')}</div>`).join('')+`</div><div style="margin-top:10px"><button class="btn btn-pri" onclick="F.BAIXAR_PROJETO('${proj}')">📦 BAIXAR ${proj} COMPLETO</button></div></div>`;
},
MUDAR_COR(cor){document.documentElement.style.setProperty('--neon',cor); document.querySelectorAll('.btn').forEach(b=>b.style.borderColor=cor); document.getElementById('ponto').style.color=cor; this.log(`Cor mudada para ${cor} - Ponto 2026`);},
BAIXAR_PROJETO(proj){
 const zip=new JSZip();
 const pastas=this.db.projetos[proj];
 Object.keys(pastas).forEach(pasta=>{
  const z=zip.folder(pasta.replace('/',''));
  pastas[pasta].forEach(arq=>{
   const conteudo=localStorage.getItem('FILE_'+arq)||this.db.arquivos[arq]||`// ${arq} - projeto ${proj} - Ponto 2026\n// Código completo aqui`;
   z.file(arq,conteudo);
  });
 });
 zip.generateAsync({type:'blob'}).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`${proj}-COMPLETO.zip`;a.click();});
 this.log(`ZIP completo baixado: ${proj} - Ponto 2026`);
},
BAIXAR_TUDO(){
 const zip=new JSZip();
 Object.keys(this.db.projetos).forEach(proj=>{
  const projFolder=zip.folder(proj);
  Object.keys(this.db.projetos[proj]).forEach(pasta=>{
   const f=projFolder.folder(pasta.replace('/',''));
   this.db.projetos[proj][pasta].forEach(arq=>{
    const c=localStorage.getItem('FILE_'+arq)||this.db.arquivos[arq]||`// ${arq}`;
    f.file(arq,c);
   });
  });
 });
 zip.generateAsync({type:'blob'}).then(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FORJA-TUDO-${new Date().toISOString().slice(0,10)}.zip`;a.click();});
},
EDITAR(proj,pasta,arq){
 this.projetoAtual=proj;
 const conteudo=localStorage.getItem('FILE_'+arq)||this.db.arquivos[arq]||`// ${arq} - ${proj}/${pasta}\n// Edite aqui e veja preview tempo real`;
 document.getElementById('editor').textContent=conteudo;
 document.getElementById('editor').contentEditable=true;
 document.getElementById('editor').oninput=(e)=>{localStorage.setItem('FILE_'+arq,e.target.textContent); this.PREVIEW_PROJETO(proj); this.log(`Editado: ${arq} - preview atualizado tempo real - Ponto 2026`);};
 this.PREVIEW_PROJETO(proj);
},
HISTORICO(){
 const h=document.getElementById('historico');
 h.innerHTML='<div style="padding:8px;font-weight:800;color:#00f0ff">📜 HISTÓRICO - Ponto 2026</div>'+Array.from(document.querySelectorAll('.log')).map(l=>l.outerHTML).join('');
},
VER_BANCO(){alert(`Banco Original FORJA\nProjetos: ${Object.keys(this.db.projetos).length}\nArquivos: ${Object.keys(this.db.arquivos).length}\nTudo salvo em localStorage FORJA_V2_DB\nPonto 2026 ${new Date().toLocaleString()}`);},
EXPORTAR_BANCO(){const data=JSON.stringify(this.db,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FORJA-BANCO-ORIGINAL.json';a.click();},
BAIXAR_PROJETO_ATUAL(){if(this.projetoAtual) this.BAIXAR_PROJETO(this.projetoAtual); else alert('Selecione um projeto primeiro');},
ABRIR_PROJETO(proj){this.projetoAtual=proj; this.PREVIEW_PROJETO(proj); this.log(`Projeto aberto: ${proj} - mostrando todos arquivos e pastas - Ponto 2026`);},
NOVA_PASTA(){const n=prompt('Nome pasta:'); if(!n) return; if(!this.projetoAtual){this.projetoAtual='Meu-Projeto'; this.db.projetos[this.projetoAtual]={};} const p='/'+n; if(!this.db.projetos[this.projetoAtual][p]) this.db.projetos[this.projetoAtual][p]=[]; this.renderArvore(); localStorage.setItem('FORJA_V2_DB',JSON.stringify(this.db));},
NOVO_PROJETO(){const n=prompt('Nome projeto:'); if(!n) return; this.db.projetos[n]={"/src":["App.jsx"]}; this.projetoAtual=n; this.renderArvore(); localStorage.setItem('FORJA_V2_DB',JSON.stringify(this.db));},
EXPANDIR(){this.renderArvore();},
ATIVAR(){alert('Fale K-AI criar loja suplementos - 5s timeout ativo - Ponto 2026');},
initVoz(){try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=new SR(); rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true; rec.onresult=e=>{let t=''; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; if(t.toLowerCase().includes('k-ai')||t.toLowerCase().includes('kai')||t.toLowerCase().includes('jarvis')){document.getElementById('prompt').value=t.replace(/k-ai|kai|jarvis/gi,'').trim(); this.ANALISAR(document.getElementById('prompt').value); this.GERAR_3();}}; rec.start(); document.getElementById('mic').textContent='MIC ATIVO - FALE K-AI';}catch(e){}},
log(t){const d=document.getElementById('historico'); const el=document.createElement('div'); el.className='log'; el.textContent=t; d.prepend(el);}
};
window.onload=()=>F.init();
</script>
</body>
</html>
