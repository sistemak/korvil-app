<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>KORVIL IA - PERMANENTE</title>
<style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}input{width:90%;padding:12px;font-size:16px}</style>
</head>
<body>
<h1>🤖 KORVIL IA - ATIVA 24H</h1>
<p id="status">IA PERMANENTE - @K-TP.p - sistemak - ONLINE ✅</p>
<input id="msg" placeholder="Digite: status da ia">
<button onclick="responder()">Enviar</button>
<div id="chat"></div>
<script>
function responder(){
 let m=document.getElementById('msg').value.toLowerCase();
 let c=document.getElementById('chat');
 if(m.includes('status')) c.innerHTML+='<p>✅ IA ATIVA PERMANENTE - Workflow Success 11s</p>';
 else c.innerHTML+='<p>🤖 KORVIL: '+m+' - registrado em '+new Date().toLocaleString()+'</p>';
}
</script>
</body>
</html>
