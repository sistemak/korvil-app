export function useDownload(){
  const downloadZip = async (files) => {
    const zip = new window.JSZip()
    files.forEach(f => {
      const folder = f.folder.replace(/^\\//,'') || 'root'
      const zipFolder = folder==='root' ? zip : zip.folder(folder)
      zipFolder.file(f.name, f.content)
    })
    const blob = await zip.generateAsync({type: 'blob', compression:'DEFLATE'})
    const url = URL.createObjectURL(blob)
    const a = document.createElement('a')
    a.href=url; a.download='k-ai-jarvis-10000.zip'
    a.click()
  }
  return { downloadZip }
}`},{id:"9",folder:"/",name:"package.json",lang:"json",content:`{
