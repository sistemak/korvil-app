function log(msg, cls="info"){
  const el = document.getElementById("log");
  el.innerHTML += `<span class="${cls}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

function modeloZerado(aluno){
  const hoje = new Date().toLocaleDateString("pt-BR");
  const tipoLabel = aluno.tipo.toUpperCase();
  return `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-TP 2026 - pesos - ${aluno.id}</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;padding:20px}
.card{display:inline-block;background:#111;border:1px solid #222;padding:15px;margin:5px;border-radius:8px;min-width:160px}
</style>
</head>
<body>
<h1>K-TP PROJETO TRANSFORMAÇÃO 11º ANO - 2026</h1>
<h2>${aluno.id.toUpperCase()} - REGISTRO DE PESOS - ${aluno.nome} | ${tipoLabel} | Atualizado: ${hoje}</h2>
<div class="stats">
<div class="card">Semanas: 0</div>
<div class="card">Peso: -- kg</div>
<div class="card">Fase Atual: --</div>
<div class="card">Registro: --</div>
</div>
<p>Nenhum peso registrado ainda</p>
<p>Aguardando primeiro registro - Segunda 00h00 até Sexta 00h00 BRT</p>
<script>
const pesos = [];
const totalRegistros = 0;
<\/script>
</body>
</html>`;
}

async function criarTudo(){
  const token = document.getElementById("token").value.trim();
  if(!token){ alert("Cole o GH_TOKEN!"); return; }

  const btn = document.getElementById("btnCommit");
  btn.disabled = true;
  btn.innerText = "⏳ CRIANDO 42 ARQUIVOS...";

  for(let i=0;i<ALUNOS.length;i++){
    const aluno = ALUNOS[i];
    const path = `${BASE_PATH}/${aluno.tipo}/${aluno.id}/registros/pesos.html`;
    const url = `https://api.github.com/repos/${REPO}/contents/${path}`;

    try{
      log(`[${i+1}/42] ${aluno.id} -> ${path}...`);

      // pega sha se já existe
      let sha = null;
      let resCheck = await fetch(url, { headers: { Authorization: `token ${token}` } });
      if(resCheck.ok){
        let data = await resCheck.json();
        sha = data.sha;
      }

      const conteudo = modeloZerado(aluno);
      const base64 = btoa(unescape(encodeURIComponent(conteudo)));

      const body = {
        message: `KTP 2026 - cria zera pesos.html ${aluno.id} - sem registros - ${new Date().toISOString()}`,
        content: base64,
        branch: "main",
       ...(sha? {sha} : {})
      };

      const res = await fetch(url, {
        method: "PUT",
        headers: {
          Authorization: `token ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      if(res.ok){
        log(`✅ OK ${aluno.id} criado zerado`, "ok");
      } else {
        let err = await res.text();
        log(`❌ ERRO ${aluno.id}: ${err}`, "err");
      }

      await new Promise(r=>setTimeout(r,400));

    }catch(e){
      log(`❌ EXCEÇÃO ${aluno.id}: ${e.message}`, "err");
    }
  }

  log("==== FINALIZADO TODOS 42 ARQUIVOS ZERADOS ====", "ok");
  btn.disabled = false;
  btn.innerText = "🚀 COMMIT - CRIAR TODOS OS 42 ARQUIVOS AGORA";
}
</script>
