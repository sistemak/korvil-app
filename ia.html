<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL V3 - IA REAL</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column}
#top{background:#111;padding:12px;text-align:center;border-bottom:1px solid #0f0;color:#0f0;font-weight:bold;font-size:14px}
#chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:18px;max-width:88%;line-height:1.5;white-space:pre-wrap}
.user{background:#0f0;color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.bot{background:#1c1c1c;border:1px solid #2a2a2a;align-self:flex-start;border-bottom-left-radius:4px}
#bar{display:flex;padding:12px;background:#111;gap:8px;position:sticky;bottom:0}
#inp{flex:1;padding:14px 16px;border-radius:24px;border:1px solid #333;background:#222;color:#fff;outline:none;font-size:16px}
button{padding:14px 20px;border-radius:24px;background:#0f0;color:#000;border:0;font-weight:bold;cursor:pointer}
.typing{opacity:.6;font-style:italic}
</style>
</head>
<body>
<div id="top">🧠 KORVIL V3 - IA REAL - ONLINE 24H - @K-TP.p ✅</div>
<div id="chat">
<div class="msg bot">Salve @K-TP.p! Agora sou V3 com cérebro de verdade. Pode perguntar QUALQUER coisa que eu respondo igual Meta AI, com internet. O que quer saber?</div>
</div>
<div id="bar">
<input id="inp" placeholder="Pergunte qualquer coisa...">
<button onclick="falar()">Enviar</button>
</div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp');
let hist=[{role:"system",content:"Você é KORVIL, IA permanente criada por sistemak @K-TP.p. Hospedado em sistemak.github.io/korvil-app. Você é brasileiro, fala igual Meta AI, prestativo, direto, divertido, responde em pt-br. Você está ONLINE 24H. Workflow: Success 11s. Se perguntarem status, diga que está 100% ativo."}];

function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}

async function falar(){
 let txt=inp.value.trim(); if(!txt) return;
 add(txt,'user'); inp.value='';
 hist.push({role:"user",content:txt});
 let load=add('🤖 KORVIL digitando...','bot typing');
 try{
  const resp = await puter.ai.chat(hist, {model:"gpt-4o-mini"});
  load.remove();
  add('🤖 '+resp, 'bot');
  hist.push({role:"assistant",content:resp});
 }catch(e){
  load.textContent='🤖 Erro, mas tô online! Tenta de novo. '+e;
 }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')falar()});
</script>
</body>
</html>
