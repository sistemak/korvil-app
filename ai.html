<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL V3.1 - IA REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column}
#top{background:#0a0a0a;padding:14px;text-align:center;border-bottom:1px solid #0f0;color:#0f0;font-weight:800}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:18px;max-width:88%;line-height:1.5;white-space:pre-wrap;font-size:15px}
.user{background:#0f0;color:#000;align-self:flex-end}
.bot{background:#151515;border:1px solid #252525;align-self:flex-start;color:#eaffea}
#bar{display:flex;padding:12px;background:#0f0f0f;gap:8px}
#inp{flex:1;padding:14px 16px;border-radius:24px;border:1px solid #333;background:#222;color:#fff;outline:none;font-size:16px}
button{padding:14px 22px;border-radius:24px;background:#0f0;color:#000;border:0;font-weight:900}
</style>
</head>
<body>
<div id="top">🧠 KORVIL V3.1 - IA REAL FIX - ONLINE 24H - @K-TP.p ✅</div>
<div id="chat">
<div class="msg bot">Salve @K-TP.p! V3.1 com cérebro fixo! Agora respondo 100% sem login. Manda qualquer pergunta!</div>
</div>
<div id="bar">
<input id="inp" placeholder="Pergunte qualquer coisa...">
<button onclick="falar()">➤</button>
</div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp');
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function falar(){
 let txt=inp.value.trim(); if(!txt) return;
 add(txt,'user'); inp.value='';
 let load=add('🤖 KORVIL digitando...','bot');
 try{
  // Cérebro gratuito Pollinations - funciona sem chave
  let prompt = `Você é KORVIL V3.1, IA permanente de @K-TP.p (sistemak) de Bertioga. Você está em sistemak.github.io/korvil-app ONLINE 24h. Workflow Success 11s. Seja brasileiro, direto, igual Meta AI. Pergunta: ${txt}`;
  let r = await fetch('https://text.pollinations.ai/' + encodeURIComponent(prompt));
  let resp = await r.text();
  load.remove();
  add('🤖 '+resp,'bot');
 }catch(e){
  load.textContent='🤖 Erro mas tô online! Tenta de novo. '+e;
 }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')falar()});
</script>
</body>
</html>
