</html>`,tm=`// gesture.js - MediaPipe Hands + Real Camera Switch (front/back)
import { Hands } from '@mediapipe/hands';
import { Camera } from '@mediapipe/camera_utils';

const video = document.getElementById('input_video');
let currentFacing = 'user'; // user=frontal, environment=traseira
let cam = null;

const hands = new Hands({
  locateFile: (file) => \`https://cdn.jsdelivr.net/npm/@mediapipe/hands/\${file}\`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.8,
  minTrackingConfidence: 0.8
});

let state = { pinch: false, fist: false, open: false, scale: 1, facing: currentFacing };

hands.onResults((results) => {
  if(!results.multiHandLandmarks) return;
  for(const landmarks of results.multiHandLandmarks){
    const thumb = landmarks[4], index = landmarks[8];
    const dist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
    state.pinch = dist < 0.05;
    const folded = landmarks.slice(8,21).every(p => p.y > landmarks[0].y);
    state.fist = folded;
    state.open = !folded && dist > 0.12;
    if(results.multiHandLandmarks.length === 2){
      const d = Math.hypot(
        results.multiHandLandmarks[0][0].x - results.multiHandLandmarks[1][0].x,
        results.multiHandLandmarks[0][0].y - results.multiHandLandmarks[1][0].y
      );
      state.scale = Math.min(Math.max(d * 2.5, 0.5), 3.0);
    }
  }
  window.dispatchEvent(new CustomEvent('jarvis-gesture', { detail: state }));
});

async function startCamera(facingMode = currentFacing){
  if(cam) await cam.stop();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
