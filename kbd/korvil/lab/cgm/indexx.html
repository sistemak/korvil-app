<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>KORVIL G15 FULL BODY - COMMANDS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;touch-action:none;user-select:none;font-family:'Courier New',monospace}
body{background:#030712;color:#00f0ff;overflow:hidden;width:100vw;height:100vh}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);background-size:30px 30px;z-index:1}
.scanlines{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 50%,rgba(0,0,0,.25) 50%);background-size:100% 4px;z-index:2;pointer-events:none}
#video{position:absolute;width:100vw;height:100vh;object-fit:cover;transform:scaleX(-1);opacity:.3;filter:grayscale(40%) contrast(140%) brightness(.6);z-index:1}
#canvas{position:absolute;top:0;left:0;width:100vw;height:100vh;z-index:3;pointer-events:none}
#menu{position:absolute;top:10px;left:10px;width:250px;max-height:96vh;overflow-y:auto;background:rgba(5,12,24,.95);border:1px solid #00f0ff;padding:10px;border-radius:8px;z-index:20;backdrop-filter:blur(8px)}
#menu::-webkit-scrollbar{width:4px} #menu::-webkit-scrollbar-thumb{background:#00f0ff}
.menu-title{font-size:11px;font-weight:bold;display:flex;justify-content:space-between;margin-bottom:8px;text-shadow:0 0 5px #00f0ff}
.separador{font-size:8px;color:#ff00ea;margin:10px 0 4px;border-top:1px dashed rgba(0,240,255,.3);padding-top:6px;letter-spacing:2px}
.btn{width:100%;padding:6px;margin:2px 0;background:rgba(0,240,255,.08);border:1px solid #00f0ff;color:#00f0ff;font-size:9px;font-weight:bold;cursor:pointer;border-radius:4px;transition:.15s;text-align:left}
.btn:hover,.btn.active{background:rgba(0,240,255,.3);color:#fff;box-shadow:0 0 10px #00f0ff;border-color:#fff}
.btn.body-part{border-color:#ff00ea;color:#ff9aff;background:rgba(255,0,234,.08)}
.btn.body-part.active{background:rgba(255,0,234,.35);color:#fff;box-shadow:0 0 15px #ff00ea}
.btn.full{background:rgba(255,230,0,.15);border-color:#ffe600;color:#ffe600}
.btn.full.active{background:#ffe600;color:#000}
.cubo{position:absolute;width:70px;height:70px;border:2px solid #00f0ff;background:rgba(0,240,255,.12);box-shadow:0 0 15px rgba(0,240,255,.4);border-radius:6px;cursor:grab;z-index:5;display:flex;align-items:center;justify-content:center;font-size:9px}
#lixeira{position:absolute;bottom:15px;left:15px;width:50px;height:50px;border:2px dashed #ff3366;border-radius:10px;background:rgba(255,51,102,.1);display:flex;align-items:center;justify-content:center;font-size:20px;z-index:10}
#lixeira.ativo{transform:scale(1.3);background:rgba(255,0,68,.4);box-shadow:0 0 25px #ff0044}
#alvo{position:absolute;left:50%;top:50%;width:110px;height:110px;border-radius:50%;border:4px dashed #ffff00;transform:translate(-50%,-50%);display:none;z-index:4;box-shadow:0 0 20px #ffff00}
#status{position:absolute;bottom:15px;right:15px;color:#00f0ff;font-size:9px;background:rgba(5,12,24,.85);border:1px solid #00f0ff;padding:8px;border-radius:4px;min-width:240px;z-index:10}
#msg{position:absolute;top:15px;width:100%;text-align:center;color:#00ffff;font-size:13px;z-index:15;text-shadow:0 0 10px #00ffff;pointer-events:none}
#commandLog{position:absolute;top:45px;right:15px;width:280px;max-height:40vh;overflow-y:auto;background:rgba(0,0,0,.6);border:1px solid #00ff66;padding:6px;font-size:8px;color:#00ff66;z-index:15;border-radius:4px}
</style>
</head>
<body>
<div class="grid-bg"></div><div class="scanlines"></div>
<div id="msg">G15 FULL BODY // TODOS HOLOGRAMAS ATIVOS</div>
<div id="commandLog">> COMMANDS LOG:</div>

<div id="menu">
  <div class="menu-title"><span>> KORVIL G15 COMMANDS</span><span>v6.0</span></div>

  <div class="separador">> HEAD / EYE - CAPACETE</div>
  <button class="btn body-part active" data-part="capacete">⛑ CAPACETE [ON]</button>
  <button class="btn" onclick="COMMANDS.EYE_SCAN()">EYE_SCAN()</button>
  <button class="btn" onclick="COMMANDS.EYE_TRACK()">EYE_TRACK()</button>
  <button class="btn" onclick="COMMANDS.EYE_FOCUS()">EYE_FOCUS()</button>

  <div class="separador">> HAND_R - BRAÇO/LUVA DIR</div>
  <button class="btn body-part active" data-part="braco_d">ᒐ BRAÇO DIR [ON]</button>
  <button class="btn body-part active" data-part="luva_d">🧤 LUVA DIR [ON]</button>
  <button class="btn" onclick="COMMANDS.HAND_R_SCAN()">HAND_R_SCAN()</button>
  <button class="btn" onclick="COMMANDS.HAND_R_TRACK()">HAND_R_TRACK()</button>
  <button class="btn" onclick="COMMANDS.HAND_R_GESTURE()">HAND_R_GESTURE()</button>

  <div class="separador">> HAND_L - BRAÇO/LUVA ESQ</div>
  <button class="btn body-part active" data-part="braco_e">ᒍ BRAÇO ESQ [ON]</button>
  <button class="btn body-part active" data-part="luva_e">🧤 LUVA ESQ [ON]</button>
  <button class="btn" onclick="COMMANDS.HAND_L_SCAN()">HAND_L_SCAN()</button>
  <button class="btn" onclick="COMMANDS.HAND_L_TRACK()">HAND_L_TRACK()</button>
  <button class="btn" onclick="COMMANDS.HAND_L_GESTURE()">HAND_L_GESTURE()</button>

  <div class="separador">> TORSO</div>
  <button class="btn body-part active" data-part="peitoral">▭ PEITORAL [ON]</button>
  <button class="btn body-part active" data-part="cinto">⬔ CINTO [ON]</button>
  <button class="btn" onclick="COMMANDS.CHEST_SCAN()">CHEST_SCAN()</button>

  <div class="separador">> KNEE_L - PERNA ESQ</div>
  <button class="btn body-part active" data-part="coxa_e">⬓ COXA ESQ [ON]</button>
  <button class="btn body-part active" data-part="canela_e">⟦ CANELA ESQ [ON]</button>
  <button class="btn body-part active" data-part="bota_e">👢 BOTA ESQ [ON]</button>
  <button class="btn" onclick="COMMANDS.KNEE_L_SCAN()">KNEE_L_SCAN()</button>
  <button class="btn" onclick="COMMANDS.KNEE_L_TRACK()">KNEE_L_TRACK()</button>
  <button class="btn" onclick="COMMANDS.KNEE_L_MOVE()">KNEE_L_MOVE()</button>

  <div class="separador">> KNEE_R - PERNA DIR</div>
  <button class="btn body-part active" data-part="coxa_d">⬓ COXA DIR [ON]</button>
  <button class="btn body-part active" data-part="canela_d">⟧ CANELA DIR [ON]</button>
  <button class="btn body-part active" data-part="bota_d">👢 BOTA DIR [ON]</button>
  <button class="btn" onclick="COMMANDS.KNEE_R_SCAN()">KNEE_R_SCAN()</button>
  <button class="btn" onclick="COMMANDS.KNEE_R_TRACK()">KNEE_R_TRACK()</button>
  <button class="btn" onclick="COMMANDS.KNEE_R_MOVE()">KNEE_R_MOVE()</button>

  <div class="separador">> SISTEMA</div>
  <button class="btn full active" id="btn_full">☢ CORPO TODO [ON]</button>
  <button class="btn active" id="btn_luva">MODO LUVAS [ON]</button>
  <button class="btn" id="novo">+ NOVO CUBO</button>
  <button class="btn" id="limpar">RESETAR</button>
  <button class="btn" id="cor">COR HUD</button>
</div>

<div id="lixeira">🗑</div><div id="alvo"></div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="cubo1" class="cubo" style="left:calc(50% - 40px);top:calc(50% - 40px)">CUBO</div>
<div id="status"><div>SISTEMA: <span id="st-text">FULL BODY ONLINE</span></div><div>PARTES: <span id="st-parts">13</span> | GESTO: <span id="st-gesto">-</span></div></div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script>
const AudioContext=window.AudioContext||window.webkitAudioContext;let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new AudioContext()}
function play(f,t='sine',d=.12,v=.12){if(!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch{}}
const SFX={scan:()=>{play(400,'sawtooth',.3,.15);play(900,'sine',.2,.1)},track:()=>{play(600,'square',.1,.12);setTimeout(()=>play(1200,'square',.1,.1),100)},focus:()=>{play(1500,'sine',.2,.15);setTimeout(()=>play(2000,'sine',.3,.12),150)}};
const logEl=document.getElementById('commandLog');
function log(cmd){const d=document.createElement('div');d.textContent=`[${new Date().toLocaleTimeString()}] ${cmd}`;logEl.prepend(d);if(logEl.children.length>20)logEl.lastChild.remove();document.getElementById('msg').innerText=cmd}

const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);
let cores=['#00f0ff','#ff00ea','#ffe600','#00ff66','#ff3366'],corAtual=0;
let activeParts=new Set(['capacete','peitoral','braco_e','braco_d','luva_e','luva_d','cinto','coxa_e','coxa_d','canela_e','canela_d','bota_e','bota_d']);
let poseLandmarks=null,handLandmarks=null,luvaAtiva=true,luvaPega=false,contagemLuva=0,luvaPos={x:innerWidth/2,y:innerHeight/2};
let eyeState={scanning:false,tracking:true,focus:1}, handRState={scanning:false,tracking:true,gesture:0}, handLState={scanning:false,tracking:true,gesture:0};
let kneeLState={scanning:false,tracking:true,move:0}, kneeRState={scanning:false,tracking:true,move:0}, chestState={scanning:false,tracking:true,armor:100};

// === TODOS OS COMMANDS ===
const COMMANDS={
  EYE_SCAN(){initAudio();SFX.scan();eyeState.scanning=!eyeState.scanning;log(`COMMANDS.EYE_SCAN() => ${eyeState.scanning?'ATIVO':'OFF'}`);if(eyeState.scanning){let i=0;const it=setInterval(()=>{eyeState.focus=Math.random();i++;if(i>20){clearInterval(it);eyeState.scanning=false;log('EYE_SCAN() COMPLETO - 3 ALVOS DETECTADOS');SFX.focus() }},150)}},
  EYE_TRACK(){eyeState.tracking=!eyeState.tracking;SFX.track();log(`COMMANDS.EYE_TRACK() => ${eyeState.tracking?'TRACKING HEAD':'FIXO'}`)},
  EYE_FOCUS(){eyeState.focus=eyeState.focus>1.5?0.5:eyeState.focus+0.5;SFX.focus();log(`COMMANDS.EYE_FOCUS() => ZOOM ${eyeState.focus.toFixed(1)}x`)},

  HAND_R_SCAN(){handRState.scanning=!handRState.scanning;SFX.scan();log(`COMMANDS.HAND_R_SCAN() => SCANNING MÃO DIR`);setTimeout(()=>{log('HAND_R: GESTO PINÇA DETECTADO - 98%');handRState.scanning=false},1200)},
  HAND_R_TRACK(){handRState.tracking=!handRState.tracking;SFX.track();log(`COMMANDS.HAND_R_TRACK() => ${handRState.tracking?'TRACKING ATIVO':'PAUSADO'}`)},
  HAND_R_GESTURE(){handRState.gesture=(handRState.gesture+1)%4;SFX.focus();const g=['ABERTA','FECHADA','PINÇA','PAZ'];log(`COMMANDS.HAND_R_GESTURE() => ${g[handRState.gesture]}`)},

  HAND_L_SCAN(){handLState.scanning=!handLState.scanning;SFX.scan();log(`COMMANDS.HAND_L_SCAN() => SCANNING MÃO ESQ`);setTimeout(()=>{log('HAND_L: SINCRONIA 100%');handLState.scanning=false},1200)},
  HAND_L_TRACK(){handLState.tracking=!handLState.tracking;SFX.track();log(`COMMANDS.HAND_L_TRACK() => ${handLState.tracking?'TRACKING ATIVO':'PAUSADO'}`)},
  HAND_L_GESTURE(){handLState.gesture=(handLState.gesture+1)%4;SFX.focus();log(`COMMANDS.HAND_L_GESTURE() => CICLO ${handLState.gesture}`)},

  CHEST_SCAN(){chestState.scanning=true;SFX.scan();log('COMMANDS.CHEST_SCAN() => VARRIDO PEITORAL');setTimeout(()=>{chestState.scanning=false;log('CHEST: BATIMENTOS 72BPM - OK')},1000)},
  CHEST_TRACK(){chestState.tracking=!chestState.tracking;SFX.track();log(`COMMANDS.CHEST_TRACK() => ${chestState.tracking?'CENTRO TRACKING':'LIVRE'}`)},
  CHEST_ARMOR(){chestState.armor=chestState.armor>=100?40:100;SFX.focus();log(`COMMANDS.CHEST_ARMOR() => INTEGRIDADE ${chestState.armor}%`)},

  KNEE_L_SCAN(){kneeLState.scanning=true;SFX.scan();log('COMMANDS.KNEE_L_SCAN() => SCANNING JOELHO ESQ');setTimeout(()=>{kneeLState.scanning=false;log('KNEE_L: ARTICULAÇÃO OK - 0% DESGASTE')},900)},
  KNEE_L_TRACK(){kneeLState.tracking=!kneeLState.tracking;SFX.track();log(`COMMANDS.KNEE_L_TRACK() => ${kneeLState.tracking?'TRACKING PERNA ESQ':'FIXO'}`)},
  KNEE_L_MOVE(){kneeLState.move+=0.3;SFX.focus();log(`COMMANDS.KNEE_L_MOVE() => FLEXÃO ${(Math.sin(kneeLState.move)*30).toFixed(0)}°`)},

  KNEE_R_SCAN(){kneeRState.scanning=true;SFX.scan();log('COMMANDS.KNEE_R_SCAN() => SCANNING JOELHO DIR');setTimeout(()=>{kneeRState.scanning=false;log('KNEE_R: ARTICULAÇÃO OK')},900)},
  KNEE_R_TRACK(){kneeRState.tracking=!kneeRState.tracking;SFX.track();log(`COMMANDS.KNEE_R_TRACK() => ${kneeRState.tracking?'TRACKING PERNA DIR':'FIXO'}`)},
  KNEE_R_MOVE(){kneeRState.move+=0.3;SFX.focus();log(`COMMANDS.KNEE_R_MOVE() => EXTENSÃO ${(Math.sin(kneeRState.move)*30).toFixed(0)}°`)},
};

function drawHoloPart(name,x,y,scale=1,state={}){
  ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
  ctx.strokeStyle=cores[corAtual];ctx.shadowColor=cores[corAtual];ctx.shadowBlur=state.scanning?25:12;ctx.lineWidth=state.scanning?3:2;
  ctx.fillStyle=state.scanning?`rgba(0,255,102,0.25)`:`rgba(0,240,255,0.15)`;
  if(name.includes('capacete')){ctx.beginPath();ctx.arc(0,0,45* (state.focus||1),0,Math.PI*2);ctx.stroke();ctx.strokeRect(-35,-10,70,25);ctx.fillRect(-35,-10,70,25);if(eyeState.scanning){ctx.beginPath();ctx.moveTo(-40,0);ctx.lineTo(40,0);ctx.stroke();ctx.moveTo(0,-40);ctx.lineTo(0,40);ctx.stroke()}}
  else if(name.includes('peitoral')){ctx.strokeRect(-60,-45,120,90);ctx.fillRect(-60,-45,120,90);ctx.strokeRect(-15,-15,30,30);if(chestState.scanning){ctx.fillStyle='rgba(0,255,102,0.4)';ctx.fillRect(-60,-45+Math.random()*90,120,4)}}
  else if(name.includes('braco')){ctx.strokeRect(-20,-50,40,100);ctx.fillRect(-20,-50,40,100);for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(-20,-20+i*20);ctx.lineTo(20,-20+i*20);ctx.stroke()}}
  else if(name.includes('luva')){ctx.strokeRect(-22,-25,44,50);ctx.fillRect(-22,-25,44,50);for(let i=0;i<4;i++){ctx.strokeRect(-18+i*10,25,6,18)}if(state.gesture==2){ctx.beginPath();ctx.arc(0,-10,10,0,Math.PI*2);ctx.stroke()}}
  else if(name.includes('coxa')||name.includes('canela')){let flex=state.move?Math.sin(state.move)*15:0;ctx.save();ctx.rotate(flex*Math.PI/180);ctx.strokeRect(-28,-55,56,110);ctx.fillRect(-28,-55,56,110);ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.stroke();ctx.restore();}
  else if(name.includes('bota')){ctx.strokeRect(-26,-15,52,30);ctx.fillRect(-26,-15,52,12);ctx.strokeRect(-30,15,60,25);ctx.fillRect(-30,15,60,25)}
  else if(name.includes('cinto')){ctx.strokeRect(-70,-12,140,24);ctx.fillRect(-12,-12,24,24)}
  ctx.fillStyle='#fff';ctx.font='8px Courier New';ctx.textAlign='center';ctx.fillText(name.toUpperCase(),0,70);
  ctx.restore();
}

function getPosePoint(idx){if(!poseLandmarks)return null;const p=poseLandmarks[idx];return{x:(1-p.x)*canvas.width,y:p.y*canvas.height}}
const handsDetector=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
handsDetector.setOptions({maxNumHands:2,modelComplexity:1,minDetectionConfidence:.6,minTrackingConfidence:.6});
handsDetector.onResults(r=>{if(r.multiHandLandmarks&&r.multiHandLandmarks.length>0){handLandmarks=r.multiHandLandmarks[0].map(lm=>({x:1-lm.x,y:lm.y}))}});

const poseDetector=new Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`});
poseDetector.setOptions({modelComplexity:1,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.5});
poseDetector.onResults(r=>{poseLandmarks=r.poseLandmarks||null});

function renderLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const head=getPosePoint(0), rHand=getPosePoint(16), lHand=getPosePoint(15), chest=getPosePoint(12), rKnee=getPosePoint(26), lKnee=getPosePoint(25), rFoot=getPosePoint(28), lFoot=getPosePoint(27);
  // Se não tem pose, usa layout fixo igual luva
  if(!poseLandmarks){
    const cx=canvas.width*0.7, cy=canvas.height*0.5;
    const map={capacete:[cx,cy-180],peitoral:[cx,cy-80],braco_d:[cx+90,cy-20],braco_e:[cx-90,cy-20],luva_d:[cx+110,cy+50],luva_e:[cx-110,cy+50],cinto:[cx,cy+10],coxa_d:[cx+30,cy+85],coxa_e:[cx-30,cy+85],canela_d:[cx+30,cy+175],canela_e:[cx-30,cy+175],bota_d:[cx+30,cy+250],bota_e:[cx-30,cy+250]};
    for(let p of activeParts){if(map[p]){let s={};if(p.includes('capacete'))s=eyeState;if(p.includes('luva_d')||p.includes('braco_d'))s=handRState;if(p.includes('luva_e')||p.includes('braco_e'))s=handLState;if(p.includes('coxa_e')||p.includes('canela_e')||p.includes('bota_e'))s=kneeLState;if(p.includes('coxa_d')||p.includes('canela_d')||p.includes('bota_d'))s=kneeRState;if(p.includes('peitoral')||p.includes('cinto'))s=chestState;drawHoloPart(p,map[p][0],map[p][1],1,s)}}
  } else {
    if(head&&activeParts.has('capacete'))drawHoloPart('capacete',head.x,head.y-30,1.2,eyeState);
    if(chest&&activeParts.has('peitoral'))drawHoloPart('peitoral',chest.x,chest.y,1,chestState);
    if(rHand){if(activeParts.has('braco_d'))drawHoloPart('braco_d',rHand.x,rHand.y-40,1,handRState);if(activeParts.has('luva_d'))drawHoloPart('luva_d',rHand.x,rHand.y,1,handRState)}
    if(lHand){if(activeParts.has('braco_e'))drawHoloPart('braco_e',lHand.x,lHand.y-40,1,handLState);if(activeParts.has('luva_e'))drawHoloPart('luva_e',lHand.x,lHand.y,1,handLState)}
    if(lKnee){if(activeParts.has('coxa_e'))drawHoloPart('coxa_e',lKnee.x,lKnee.y-30,1,kneeLState);if(activeParts.has('canela_e'))drawHoloPart('canela_e',lKnee.x,lKnee.y+40,1,kneeLState)}
    if(rKnee){if(activeParts.has('coxa_d'))drawHoloPart('coxa_d',rKnee.x,rKnee.y-30,1,kneeRState);if(activeParts.has('canela_d'))drawHoloPart('canela_d',rKnee.x,rKnee.y+40,1,kneeRState)}
    if(lFoot&&activeParts.has('bota_e'))drawHoloPart('bota_e',lFoot.x,lFoot.y,1,kneeLState);
    if(rFoot&&activeParts.has('bota_d'))drawHoloPart('bota_d',rFoot.x,rFoot.y,1,kneeRState);
    if(activeParts.has('cinto')&&chest)drawHoloPart('cinto',chest.x,chest.y+60,1,chestState);
  }
  // luvas docking igual antes
  if(handLandmarks&&luvaAtiva){
    const hx=handLandmarks[9].x*canvas.width, hy=handLandmarks[9].y*canvas.height;
    if(!luvaPega){const d=Math.hypot(hx-luvaPos.x,hy-luvaPos.y);if(d<80){contagemLuva+=0.02;ctx.strokeStyle='#ffe600';ctx.lineWidth=4;ctx.beginPath();ctx.arc(luvaPos.x,luvaPos.y,60,0,Math.PI*2*(contagemLuva/3));ctx.stroke();if(contagemLuva>=3){luvaPega=true;contagemLuva=0;document.getElementById('alvo').style.display='none';log('LUVAS CONECTADAS - FULL BODY TRACKING ON')}}}
    else{luvaPos.x=hx;luvaPos.y=hy;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(luvaPos.x,luvaPos.y,45+i*15,0,Math.PI*2);ctx.strokeStyle=`rgba(0,240,255,${1-i*.3})`;ctx.lineWidth=2;ctx.stroke()}}
  }
  requestAnimationFrame(renderLoop);
}
renderLoop();

// camera
navigator.mediaDevices.getUserMedia({video:{width:1280,height:720}}).then(s=>{
  video.srcObject=s; const cam=new Camera(video,{onFrame:async()=>{await handsDetector.send({image:video});await poseDetector.send({image:video})},width:1280,height:720}); cam.start();
  document.getElementById('st-text').textContent='FULL BODY TRACKING ON';
});
document.getElementById('btn_full').onclick=()=>{initAudio();const all=['capacete','peitoral','braco_e','braco_d','luva_e','luva_d','cinto','coxa_e','coxa_d','canela_e','canela_d','bota_e','bota_d'];if(activeParts.size>=all.length)activeParts.clear();else all.forEach(p=>activeParts.add(p));document.getElementById('st-parts').textContent=activeParts.size;SFX.scan();log(`COMMANDS.FULL_BODY_${activeParts.size>0?'ENABLE':'DISABLE'}()`)};
document.querySelectorAll('.body-part').forEach(b=>b.onclick=()=>{const p=b.dataset.part;if(activeParts.has(p))activeParts.delete(p);else activeParts.add(p);b.classList.toggle('active');document.getElementById('st-parts').textContent=activeParts.size});
document.getElementById('novo').onclick=()=>{const c=document.createElement('div');c.className='cubo';c.style.left='50%';c.style.top='50%';document.body.appendChild(c)};
document.getElementById('limpar').onclick=()=>{document.querySelectorAll('.cubo').forEach(c=>c.remove())};
document.getElementById('cor').onclick=()=>{corAtual=(corAtual+1)%cores.length};
document.getElementById('btn_luva').onclick=function(){luvaAtiva=!luvaAtiva;this.classList.toggle('active');luvaPega=false;document.getElementById('alvo').style.display=luvaAtiva?'block':'none'};
</script>
</body>
</html>
