<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Mesa Holográfica - Homem de Ferro</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #030814;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #webcam {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 220px;
      height: 165px;
      transform: scaleX(-1); /* Espelhar webcam */
      border: 2px solid #00f0ff;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      z-index: 2;
    }
    #hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #00f0ff;
      text-shadow: 0 0 8px #00f0ff;
      z-index: 2;
      pointer-events: none;
    }
    .hud-title {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 3px;
    }
    .hud-status {
      font-size: 14px;
      margin-top: 5px;
      opacity: 0.8;
    }
  </style>

  <!-- Three.js para renderização 3D -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands para detecção de gestos -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="hud-overlay">
    <div class="hud-title">MARK VII // HOLO-INTERFACE</div>
    <div class="hud-status" id="gesto-status">Aguardando detecção de mão...</div>
  </div>

  <div id="canvas-container"></div>
  <video id="webcam" autoplay playsinline></video>

  <script>
    // --- 1. CONFIGURAÇÃO DO THREE.JS (CENA HOLOGRÁFICA) ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    
    // Adicionar neblina/brilho no fundo
    scene.fog = new THREE.FogExp2(0x030814, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    // Grid holográfico estilo "mesa"
    const gridHelper = new THREE.GridHelper(20, 40, 0x00f0ff, 0x004466);
    gridHelper.position.y = -2;
    scene.add(gridHelper);

    // Objeto Holográfico (Núcleo de Energia / Arc Reactor)
    const holoGroup = new THREE.Group();
    
    // Esfera central aramada (Wireframe)
    const coreGeo = new THREE.IcosahedronGeometry(1.5, 2);
    const coreMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });
    const coreMesh = new THREE.Mesh(coreGeo, coreMat);
    holoGroup.add(coreMesh);

    // Anel externo holográfico
    const ringGeo = new THREE.TorusGeometry(2.2, 0.05, 16, 100);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true });
    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
    holoGroup.add(ringMesh);

    scene.add(holoGroup);

    // Light
    const pointLight = new THREE.PointLight(0x00f0ff, 2, 50);
    pointLight.position.set(0, 5, 5);
    scene.add(pointLight);

    // --- 2. LÓGICA DE CONTROLE DE GESTOS ---
    let lastHandX = 0;
    let lastHandY = 0;
    const statusText = document.getElementById('gesto-status');

    function processarGestos(landmarks) {
      // Ponto indicador (8) e polegar (4)
      const indexTip = landmarks[8];
      const thumbTip = landmarks[4];
      const wrist = landmarks[0];

      // Calcular distância entre o polegar e o indicador (Gesto de Pinça/Zoom)
      const pinchDistance = Math.hypot(
        indexTip.x - thumbTip.x,
        indexTip.y - thumbTip.y
      );

      // Mover o objeto holográfico seguindo a mão
      const handX = (1 - indexTip.x - 0.5) * 10; // Espelhado + escala
      const handY = (0.5 - indexTip.y) * 6;

      // 1. GESTO DE ROTACIONAR (Mover a mão livremente)
      const deltaX = handX - lastHandX;
      const deltaY = handY - lastHandY;
      
      holoGroup.rotation.y += deltaX * 0.5;
      holoGroup.rotation.x += deltaY * 0.5;

      lastHandX = handX;
      lastHandY = handY;

      // 2. GESTO DE PINÇA (ZOOM / ESCALA DO HOLOGRAMA)
      if (pinchDistance < 0.08) {
        // Pinça fechada: reduz a escala
        holoGroup.scale.lerp(new THREE.Vector3(0.5, 0.5, 0.5), 0.1);
        statusText.innerText = "GESTO: Mudar Escala (Reduzir / Pinça)";
      } else if (pinchDistance > 0.25) {
        // Mão bem aberta: expande a escala
        holoGroup.scale.lerp(new THREE.Vector3(1.8, 1.8, 1.8), 0.1);
        statusText.innerText = "GESTO: Mudar Escala (Expandir / Mão Aberta)";
      } else {
        // Escala normal
        holoGroup.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
        statusText.innerText = "GESTO: Rotação / NAVEGAÇÃO";
      }
    }

    // --- 3. CONFIGURAÇÃO DO MEDIAPIPE HANDS ---
    const videoElement = document.getElementById('webcam');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.7
    });

    hands.onResults((results) => {
      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        processarGestos(results.multiHandLandmarks[0]);
      } else {
        statusText.innerText = "Aguardando detecção de mão...";
      }
    });

    const cameraMediaPipe = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });
    cameraMediaPipe.start();

    // --- 4. LOOP DE ANIMAÇÃO DO THREE.JS ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotação contínua e suave do anel holográfico
      ringMesh.rotation.z += 0.01;
      ringMesh.rotation.x += 0.005;

      renderer.render(scene, camera);
    }
    animate();

    // Ajustar ao redimensionar tela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
