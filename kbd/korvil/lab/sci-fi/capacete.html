<!DOCTYPE html> 
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"> 
<title>HUD CAPACETE MARK-85 3D REAL-TIME</title> 
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script> 
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script> 
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI', Roboto, sans-serif; }

/* Espelhamento limpo da câmera */
#video{ 
    position:fixed; 
    inset:0; 
    width:100vw; 
    height:100vh; 
    object-fit:cover; 
    z-index:1; 
    transform: scaleX(-1); 
    filter: brightness(.45) contrast(1.2) saturate(.8); 
    will-change: transform;
}

#canvas{ 
    position:fixed; 
    inset:0; 
    width:100vw; 
    height:100vh; 
    z-index:5; 
    pointer-events:none; 
    will-change: transform;
}

/* HUD Superior */
#ui{ 
    position:fixed; 
    top:25px; 
    left:0; 
    width:100%; 
    z-index:20; 
    text-align:center; 
    color:#00f3ff; 
    font-size:20px; 
    font-weight: 900;
    letter-spacing:4px; 
    text-shadow: 0 0 10px rgba(0,243,255,0.8); 
}

#status{ 
    margin-top:6px; 
    font-size:14px; 
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffaa00;
    text-shadow: 0 0 8px rgba(255,170,0,0.8);
}

#scanTexto{ 
    position:absolute; 
    top:50%; 
    left:50%; 
    transform:translate(-50%,-50%); 
    color:#ff1100; 
    font-size:32px; 
    font-weight: 900;
    letter-spacing: 5px;
    display:none; 
    text-shadow: 0 0 20px #ff1100; 
    z-index:25; 
}

#menuOlhoE{ 
    position:absolute; 
    background: rgba(5, 15, 25, 0.9); 
    border: 2px solid #00f3ff; 
    padding: 10px 16px; 
    border-radius: 8px; 
    display: none; 
    color: #00f3ff; 
    font-size: 14px; 
    font-weight: bold;
    z-index: 25; 
    box-shadow: 0 0 15px rgba(0,243,255,0.6);
    backdrop-filter: blur(4px);
    line-height: 1.5;
}

#scanlines{ 
    position:fixed; 
    inset:0; 
    z-index:10; 
    pointer-events:none; 
    background: repeating-linear-gradient( to bottom, rgba(0,243,255,.02) 0px, rgba(0,243,255,.02) 2px, transparent 3px, transparent 6px ); 
}
</style> 
</head> 
<body> 
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="scanlines"></div> 
<div id="scanTexto">VARREDURA TÁTICA...</div>
<div id="menuOlhoE">SISTEMA VISUAL:<br>1x = NOTURNO<br>2x = RAIO-X</div>

<div id="ui"> S.I.S.T.E.M.A. MARK-85
<div id="status">INICIALIZANDO MOTOR 60FPS...</div>
</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
const status = document.getElementById("status");
const scanTexto = document.getElementById("scanTexto");
const menuOlhoE = document.getElementById("menuOlhoE");

let faceTarget = null;
let smoothFace = null;
let miraAtiva = false, modoVisao = 'normal';
let piscadaD = 0, piscadaE = 0, tempoPiscada = 0, time = 0;

// Sistema de partículas pré-calculado
const particles = Array.from({length: 35}, () => ({
    x: (Math.random() - 0.5) * 2.8,
    y: (Math.random() - 0.5) * 2.8,
    z: Math.random() * 2 + 0.5,
    size: Math.random() * 2 + 1,
    speed: Math.random() * 0.02 + 0.01
}));

function resize(){ 
    canvas.width = window.innerWidth; 
    canvas.height = window.innerHeight; 
}
resize(); 
window.addEventListener("resize", resize);

/* FACE MESH - OTIMIZADO PARA ALTA VELOCIDADE NO CELULAR */
const faceMesh = new FaceMesh({ 
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}` 
});

faceMesh.setOptions({ 
    maxNumFaces: 1, 
    refineLandmarks: false, // Desativado para máximo desempenho/FPS
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

faceMesh.onResults(res => { 
    if(res.multiFaceLandmarks && res.multiFaceLandmarks[0]) {
        faceTarget = res.multiFaceLandmarks[0];
    } else {
        faceTarget = null;
    }
});

/* INTERPOLAÇÃO (LERP) PARA RASTREAMENTO ULTRA-SUAVE SEM LAG */
function lerp(a, b, t) { return a + (b - a) * t; }

function updateSmoothFace() {
    if (!faceTarget) { smoothFace = null; return; }
    if (!smoothFace) { smoothFace = JSON.parse(JSON.stringify(faceTarget)); return; }

    // Interpolação acelerada (0.45) para tempo de resposta instantâneo
    for (let i = 0; i < faceTarget.length; i++) {
        smoothFace[i].x = lerp(smoothFace[i].x, faceTarget[i].x, 0.45);
        smoothFace[i].y = lerp(smoothFace[i].y, faceTarget[i].y, 0.45);
        smoothFace[i].z = lerp(smoothFace[i].z, faceTarget[i].z, 0.45);
    }
}

/* LOOP DE RENDERIZAÇÃO REAL-TIME */
function draw(){
    time += 0.03;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    updateSmoothFace();

    if(smoothFace) {
        drawIronMan3D(smoothFace);
    }

    requestAnimationFrame(draw);
}
draw();

/* DESENHO REALISTA 3D DO CAPACETE MARK-85 */
function drawIronMan3D(f){
    // Espelhamento correto do eixo X
    const getX = (pt) => (1 - pt.x) * canvas.width;
    const getY = (pt) => pt.y * canvas.height;

    const olhoD = { x: getX(f[33]), y: getY(f[33]) };  // Ponto fixo olho direito
    const olhoE = { x: getX(f[263]), y: getY(f[263]) };// Ponto fixo olho esquerdo
    const nariz = { x: getX(f[1]), y: getY(f[1]) };
    const boca = { x: getX(f[13]), y: getY(f[13]) };
    const testa = { x: getX(f[10]), y: getY(f[10]) };
    const queixo = { x: getX(f[152]), y: getY(f[152]) };

    const cx = (olhoD.x + olhoE.x) / 2;
    const cy = (testa.y + queixo.y) / 2;

    const larguraOlhos = Math.hypot(olhoD.x - olhoE.x, olhoD.y - olhoE.y);
    const alturaRosto = Math.hypot(testa.x - queixo.x, testa.y - queixo.y);
    
    if (larguraOlhos === 0 || alturaRosto === 0) return;

    const raioX = larguraOlhos * 2.1;
    const raioY = alturaRosto * 0.72;

    // Rotação 3D (Roll, Yaw, Pitch)
    const angle = Math.atan2(olhoE.y - olhoD.y, olhoE.x - olhoD.x);
    const rotY = (nariz.x - cx) / larguraOlhos; 
    const rotX = (nariz.y - cy) / alturaRosto;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);
    ctx.transform(1, rotX * 0.2, rotY * 0.3, 1, 0, 0); // Transformação Perspectiva 3D

    /* 1. PARTICULAS 3D FLUTUANTES */
    for(let i=0; i<particles.length; i++){
        let p = particles[i];
        p.z -= p.speed;
        if(p.z <= 0.1) p.z = 2.5;
        const px = (p.x * raioX) / p.z;
        const py = (p.y * raioY) / p.z;
        
        ctx.beginPath();
        ctx.arc(px, py, (p.size / p.z), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0, 243, 255, ${0.7 / p.z})`;
        ctx.fill();
    }

    /* 2. ESTRUTURA BLINDADA DO CAPACETE MARK-85 */
    // Gradient metálico holográfico
    let grad = ctx.createLinearGradient(-raioX, -raioY, raioX, raioY);
    grad.addColorStop(0, 'rgba(0, 243, 255, 0.85)');
    grad.addColorStop(0.5, 'rgba(0, 120, 255, 0.4)');
    grad.addColorStop(1, 'rgba(0, 243, 255, 0.85)');

    // Casco Externo
    ctx.beginPath();
    ctx.ellipse(0, -raioY * 0.05, raioX, raioY, 0, Math.PI * 0.88, Math.PI * 0.12);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 4;
    ctx.stroke();

    // Placas de Contorno Angular (Queixo/Bochechas Homem de Ferro)
    ctx.beginPath();
    ctx.moveTo(-raioX * 0.82, -raioY * 0.1);
    ctx.lineTo(-raioX * 0.7, raioY * 0.4);
    ctx.lineTo(-raioX * 0.4, raioY * 0.92);
    ctx.lineTo(raioX * 0.4, raioY * 0.92);
    ctx.lineTo(raioX * 0.7, raioY * 0.4);
    ctx.lineTo(raioX * 0.82, -raioY * 0.1);
    ctx.strokeStyle = '#00f3ff';
    ctx.lineWidth = 3;
    ctx.stroke();

    /* 3. OLHOS LUMINOSOS DO HOMEM DE FERRO (VISOR ANGULAR 3D) */
    const drawIronEye3D = (eyeX, eyeY, isRight) => {
        const side = isRight ? 1 : -1;
        const ex = eyeX - cx;
        const ey = eyeY - cy;

        ctx.save();
        ctx.translate(ex, ey);

        // Formato Angular do Olho
        ctx.beginPath();
        ctx.moveTo(-22 * side, -10);
        ctx.lineTo(18 * side, -15);
        ctx.lineTo(26 * side, 2);
        ctx.lineTo(-12 * side, 10);
        ctx.closePath();

        // Brilho Intenso
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = '#00f3ff';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
    };

    drawIronEye3D(olhoD.x, olhoD.y, true);
    drawIronEye3D(olhoE.x, olhoE.y, false);

    /* 4. VISEIRA DE ENERGIA PULSANTE */
    const visorPulse = Math.sin(time * 5) * 3;
    ctx.beginPath();
    ctx.ellipse(0, -raioY * 0.08, raioX * 0.85 + visorPulse, raioY * 0.28, 0, 0, Math.PI);
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.75)';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore(); // Restaura matriz 3D

    /* 5. ARCTAC-NÚKLEO FRONTAL */
    const nx = (olhoD.x + olhoE.x) / 2;
    const ny = testa.y - 12;
    for(let i = 0; i < 2; i++){
        const r = 10 + i * 12 + ((time * 30 + i * 15) % 25);
        const opacity = Math.max(0, 1 - (r / 50));
        ctx.beginPath();
        ctx.arc(nx, ny, r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(0, 243, 255, ${opacity})`;
        ctx.lineWidth = 2;
        ctx.stroke();
    }

    /* 6. CONEXÕES DA MALHA DE COMBATE */
    const pontos = [olhoD, olhoE, nariz, boca];
    ctx.beginPath();
    pontos.forEach((p, i) => {
        if(i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
    });
    ctx.closePath();
    ctx.strokeStyle = 'rgba(0, 243, 255, 0.3)';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    /* 7. MIRA RED-LOCK (OLHO DIREITO) */
    if(miraAtiva){
        const mx = olhoD.x, my = olhoD.y;
        ctx.strokeStyle = '#ff1100'; 
        ctx.lineWidth = 2.5; 

        ctx.beginPath(); ctx.arc(mx, my, 30 + Math.sin(time * 6) * 3, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(mx, my, 10, 0, Math.PI * 2); ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(mx - 22, my); ctx.lineTo(mx + 22, my);
        ctx.moveTo(mx, my - 22); ctx.lineTo(mx, my + 22);
        ctx.stroke();

        ctx.font = '900 13px Segoe UI, sans-serif';
        ctx.fillStyle = '#ff1100';
        ctx.fillText("ALVO FIXADO", mx + 35, my + 4);
    }

    /* 8. MENU HUD (OLHO ESQUERDO) */
    if(menuOlhoE.style.display === 'block'){
        menuOlhoE.style.left = Math.max(10, olhoE.x - 200) + 'px';
        menuOlhoE.style.top = (olhoE.y - 20) + 'px';
    }
}

/* COMANDOS POR PISCADA DE OLHO COM DETECÇÃO RÁPIDA */
setInterval(()=>{
    if(!smoothFace) return;
    const olhoD = smoothFace[145].y - smoothFace[159].y;
    const olhoE = smoothFace[374].y - smoothFace[386].y;
    const agora = Date.now();

    // Piscada Olho Direito
    if(olhoD < 0.016 && agora - tempoPiscada > 350){
        piscadaD++; tempoPiscada = agora;
        if(piscadaD === 1){ 
            miraAtiva = !miraAtiva; 
            status.textContent = miraAtiva ? "MIRA 3D: TRAVADA" : "SISTEMA: PRONTO"; 
        }
        if(piscadaD === 2 && miraAtiva){
            scanTexto.style.display = 'block';
            status.textContent = "SISTEMA ESCANEANDO...";
            setTimeout(()=>{ scanTexto.style.display = 'none'; status.textContent = "MIRA 3D: TRAVADA"; }, 2500);
        }
        setTimeout(() => piscadaD = 0, 700);
    }

    // Piscada Olho Esquerdo
    if(olhoE < 0.016 && agora - tempoPiscada > 350){
        piscadaE++; tempoPiscada = agora;
        if(piscadaE === 1){ 
            menuOlhoE.style.display = 'block'; 
            setTimeout(() => menuOlhoE.style.display = 'none', 2000); 
        }
        if(piscadaE === 2){ modoVisao = modoVisao === 'normal' ? 'noturna' : 'normal'; aplicarVisao(); }
        if(piscadaE === 3){ modoVisao = 'raio-x'; aplicarVisao(); }
        setTimeout(() => piscadaE = 0, 900);
    }
}, 80);

function aplicarVisao(){
    if(modoVisao === 'noturna'){ 
        video.style.filter = 'brightness(.3) contrast(1.8) saturate(0) hue-rotate(90deg)'; 
        status.textContent = "VISÃO: NOTURNA (VERDE)"; 
    }
    if(modoVisao === 'raio-x'){ 
        video.style.filter = 'brightness(.9) contrast(2.2) saturate(0) invert(1)'; 
        status.textContent = "VISÃO: RAIO-X BIO"; 
    }
    if(modoVisao === 'normal'){ 
        video.style.filter = 'brightness(.45) contrast(1.2) saturate(.8)'; 
        status.textContent = "SISTEMA: PRONTO"; 
    }
}

/* INICIALIZAÇÃO E OTIMIZAÇÃO DA CÂMERA */
async function start(){
    try{
        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user", 
                width: { ideal: 1280 }, 
                height: { ideal: 720 },
                frameRate: { ideal: 60, max: 60 }
            }
        });
        video.srcObject = stream;
        status.textContent = "MARK-85 ONLINE (60 FPS)";
        
        const camera = new Camera(video, {
            onFrame: async () => { await faceMesh.send({image: video}); },
            width: 1280,
            height: 720
        });
        camera.start();
    }catch(e){ 
        status.textContent = "ERRO NA CÂMERA"; 
    }
}
start();
</script> 
</body>
</html>
