function getChildren(path){
  let children={};
  folders.forEach(f=>{
    if(f.startsWith(path+'/')){
      let rest=f.substring(path.length+1);
      if(rest && !rest.includes('/')){
        if(!children[rest]) children[rest]={type:"folder", nome:rest.toUpperCase(), disponivel:true};
      }
    }
  });
  for(let key in data){
    if(key.startsWith(path+'/')){
      let rest=key.substring(path.length+1);
      if(rest && !rest.includes('/')){
        children[rest]=data[key];
      }
    }
  }
  return children;
}

function renderTree(){
  let el=document.getElementById('tree');
  el.innerHTML='';
  folders.forEach(path=>{
    let depth=(path.match(/\//g)||[]).length - 1;
    let name=path.split('/').pop();
    let div=document.createElement('div');
    div.className='item'+(selectedPath===path?' active':'');
    div.style.marginLeft=(depth*10)+'px';
    let isSetor=path.includes('ktp')?' <span class="badge yellow">01 SETOR K-TP</span>':'';
    div.innerHTML=`<span>📁 ${name.toUpperCase()}${isSetor}</span><span><button onclick="event.stopPropagation();baixarPastaPath('${path}')" style="font-size:7px">📁 ZIP</button></span>`;
    div.onclick=()=>{selectedPath=path; renderTree(); renderVisual(path);};
    el.appendChild(div);
  });
  for(let key in data){
    if(data[key].type==='product'){
      let depth=(key.match(/\//g)||[]).length - 1;
      let div=document.createElement('div');
      div.className='item'+(selectedPath===key?' active':'');
      div.style.marginLeft=(depth*10+16)+'px';
      let disp=data[key].disponivel===false?'🔴':'🟢';
      div.innerHTML=`<span>${disp} 📦 ${data[key].nome} <span class="badge green">R$${data[key].preco||0}</span> <span class="badge">${data[key].marca||''}</span></span>`;
      div.onclick=()=>{selectedPath=key; renderTree(); renderVisual(key);};
      el.appendChild(div);
    }
  }
}

    html+=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px">`;
    keys.forEach(k=>{
      let ch=children[k];
      let fullPath=path+'/'+k;
      let isProd=ch.type==='product';
      if(isProd){
        let disp=ch.disponivel===false?'🔴 INDISPONÍVEL':'🟢 DISPONÍVEL';
        html+=`<div class="card" style="border-left:3px solid ${ch.disponivel!==false?'#00ff88':'#ff4d6d'};cursor:pointer" onclick="selectedPath='${fullPath}';renderTree();renderVisual('${fullPath}')"><b style="font-size:11px">${ch.nome}</b><br><span style="font-size:8px">${ch.marca||''} • ${ch.tipo||''} • ${ch.subtipo||''} • ${disp} • Estoque: ${ch.estoque||0}</span><br><span style="font-size:7px">Embalagens: ${(ch.embalagens||[]).map(e=>e.nome).join(', ')} | Tamanhos: ${(ch.tamanhos||[]).map(t=>t.nome).join(', ')}</span><br><div style="margin-top:4px;display:flex;gap:3px"><button style="font-size:7px" onclick="event.stopPropagation();baixarPastaPath('${fullPath}')">📦 ZIP</button><button style="font-size:7px" onclick="event.stopPropagation();editarItemPath('${fullPath}')">✎ Editar</button><button style="font-size:7px" onclick="event.stopPropagation();duplicarItemPath('${fullPath}')">⧉ Duplicar</button></div></div>`;
      } else {
        html+=`<div class="card" style="cursor:pointer" onclick="selectedPath='${fullPath}';renderTree();renderVisual('${fullPath}')"><b>📁 ${ch.nome||k}</b><br><span style="font-size:8px">${Object.keys(getChildren(fullPath)).length} itens - clique pra abrir na direita</span><br><div style="margin-top:4px;display:flex;gap:3px"><button style="font-size:7px" onclick="event.stopPropagation();baixarPastaPath('${fullPath}')">📁 ZIP COM TUDO DENTRO</button><button style="font-size:7px" onclick="event.stopPropagation();renomearItemPath('${fullPath}')">🏷 Renomear</button></div></div>`;
      }
    });
    html+=`</div>`;
  } else {
    let prod=node;
    html=`<div class="card" style="border-left:4px solid #00f5ff"><div style="display:flex;justify-content:space-between;flex-wrap:wrap"><div><div style="font-size:8px;color:#8b949e">EXATO • ${path}</div><h2 style="font-size:14px;margin:2px 0" contenteditable="true" onblur="updateField('${path}','nome',this.innerText)">${prod.nome}</h2><div style="font-size:10px">Marca: <b>${prod.marca||''}</b> | Tipo: <b>${prod.tipo||''}</b> | Subtipo: <b>${prod.subtipo||''}</b> | Preço: R$ <span contenteditable="true" style="border-bottom:1px dashed #333" onblur="updateField('${path}','preco',this.innerText)">${prod.preco||0}</span> | Estoque: <span contenteditable="true" style="border-bottom:1px dashed #333" onblur="updateField('${path}','estoque',this.innerText)">${prod.estoque||0}</span> | ${prod.disponivel!==false?'🟢 DISPONÍVEL':'🔴 INDISPONÍVEL'}</div></div><div style="text-align:right"><div style="font-size:9px">DISPONÍVEL NO ESTOQUE?</div><div class="toggle ${prod.disponivel!==false?'on':''}" onclick="toggleDisp('${path}')"></div><div style="font-size:8px">${prod.disponivel!==false?'🟢 SIM - TEM NO ESTOQUE':'🔴 NÃO - SEM ESTOQUE'}</div></div></div><div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button class="btn" onclick="baixarPastaPath('${path}')">📦 ZIP DESTE PRODUTO COM TODOS ARQUIVOS EXATOS</button><button class="btn btn-ghost" onclick="editarItemPath('${path}')">✎ Editar</button><button class="btn btn-ghost" onclick="duplicarItemPath('${path}')">⧉ Duplicar</button><button class="btn btn-ghost" onclick="excluirItemPath('${path}')" style="background:#ff4d6d;color:#fff">✕ Excluir</button></div></div>`;
    function section(field, title){
      if(!prod[field]) return '';
      let h=`<div class="card"><b style="font-size:10px;color:#00f5ff">${title} - cada um com disponível/indisponível + preço + estoque</b><div style="margin-top:4px">`;
      (prod[field]||[]).forEach((it,i)=>{
        h+=`<div style="display:flex;gap:3px;align-items:center;margin:3px 0;background:#0d1117;padding:5px;border-radius:6px"><input value="${it.nome}" style="flex:1;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','${field}',${i},'nome',this.value)"><input type="number" value="${it.preco||''}" placeholder="R$" style="width:55px;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','${field}',${i},'preco',this.value)"><div class="toggle ${it.disponivel!==false?'on':''}" onclick="toggleSub('${path}','${field}',${i})"></div><span style="font-size:7px">${it.disponivel!==false?'🟢 DISP - TEM ESTOQUE':'🔴 INDISP'}</span><button onclick="removeSub('${path}','${field}',${i})" style="font-size:7px">X</button></div>`;
      });
      h+=`<button onclick="addSub('${path}','${field}')" style="font-size:8px">+ Adicionar ${title.split(' ')[0]}</button></div></div>`;
      return h;
    }
    html+=section('modelos','1. MODELOS (Concentrado, Isolado, Hidrolisado, Monohidratada, Creapure etc)');
    html+=section('sabores','2. SABORES (Chocolate, Baunilha, Morango etc)');
    if(prod.quantidades || prod.embalagens){
      html+=`<div class="card"><b style="font-size:10px;color:#00f5ff">07 EMBALAGEM / TAM - 21 opções - SUPLEMENTOS: Pote 150g, 250g, 300g, 500g, 900g, 1kg, 1.8kg, 600g, Refil 900g, 1.8kg, 1kg, Sache 30g, Caixa 30x30g, Barra 60g, Caixa 12x60g</b><div style="margin-top:4px">`;
      (prod.quantidades||[]).forEach((it,i)=>{
        html+=`<div style="display:flex;gap:3px;align-items:center;margin:3px 0;background:#0d1117;padding:5px;border-radius:6px"><input value="${it.nome}" style="flex:1;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','quantidades',${i},'nome',this.value)"><span style="font-size:8px">${it.gramas||''}</span><input type="number" value="${it.preco||''}" style="width:55px;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','quantidades',${i},'preco',this.value)"><div class="toggle ${it.disponivel!==false?'on':''}" onclick="toggleSub('${path}','quantidades',${i})"></div></div>`;
      });
      html+=`</div>`;
      html+=`<div style="margin-top:6px"><b style="font-size:10px;color:#00f5ff">EMBALAGENS</b><div style="margin-top:4px">`;
      (prod.embalagens||[]).forEach((it,i)=>{
        html+=`<div style="display:flex;gap:3px;align-items:center;margin:3px 0;background:#0d1117;padding:5px;border-radius:6px"><input value="${it.nome}" style="flex:1;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','embalagens',${i},'nome',this.value)"><div class="toggle ${it.disponivel!==false?'on':''}" onclick="toggleSub('${path}','embalagens',${i})"></div></div>`;
      });
      html+=`</div></div></div>`;
    }
    if(prod.cores) html+=section('cores','2. CORES');
    if(prod.tamanhos){
      html+=`<div class="card"><b style="font-size:10px;color:#00f5ff">TAMANHOS VESTUÁRIO: PP, P, M, G, GG, XG, XXL (17.P,18.M,19.G,20.GG,21.XG) - cada tamanho com disponível</b><div style="margin-top:4px">`;
      (prod.tamanhos||[]).forEach((it,i)=>{
        html+=`<div style="display:flex;gap:3px;align-items:center;margin:3px 0;background:#0d1117;padding:5px;border-radius:6px"><input value="${it.nome}" style="flex:1;background:#161b22;border:1px solid #333;color:#fff;border-radius:4px;padding:4px;font-size:10px" oninput="updateSub('${path}','tamanhos',${i},'nome',this.value)"><div class="toggle ${it.disponivel!==false?'on':''}" onclick="toggleSub('${path}','tamanhos',${i})"></div><span style="font-size:7px">${it.disponivel!==false?'🟢 DISP':'🔴 INDISP'}</span></div>`;
      });
      html+=`</div></div>`;
    }
  }
  document.getElementById('visual').innerHTML=html;
}

// FUNÇÕES GERAIS - 20 funções funcionando
function criarNovo(){
  let nome=prompt('Nome da nova pasta/produto?');
  if(!nome) return;
  let isProd=confirm('É produto? OK=Produto, Cancelar=Pasta');
  let key=selectedPath+'/'+nome.toLowerCase().replace(/[^a-z0-9]/g,'-');
  if(isProd){
    data[key]={nome:nome, type:"product", disponivel:true, preco:99, estoque:10, modelos:[{nome:"Modelo Padrão",disponivel:true,preco:99}], cores:[], tamanhos:[{nome:"PP",disponivel:true},{nome:"P",disponivel:true},{nome:"M",disponivel:true},{nome:"G",disponivel:true},{nome:"GG",disponivel:true},{nome:"XG",disponivel:true},{nome:"XXL",disponivel:true}], fotos:[], descricao:""};
  } else {
    data[key]={nome:nome, type:"folder", disponivel:true};
    folders.push(key);
  }
  save(); renderTree(); renderVisual(selectedPath);
}
function editarItem(){ let nome=prompt('Novo nome?', data[selectedPath]?data[selectedPath].nome:selectedPath.split('/').pop()); if(nome && data[selectedPath]){ data[selectedPath].nome=nome; save(); renderTree(); renderVisual(selectedPath); } }
function editarItemPath(path){ selectedPath=path; editarItem(); }
function moverItem(){ let dest=prompt('Mover para qual caminho completo? Ex: korvil-app/sections/kstore/setores-loja/ktp/fitness/categorias/vestuario/feminino'); if(!dest) return; moveNode(selectedPath, dest); }
function moveNode(src, dest){ if(!src||!dest||src===dest)return; if(dest.startsWith(src+'/')){alert('Não pode mover pra dentro dela mesma!');return;} let newPath=dest+'/'+src.split('/').pop(); if(data[src]){ data[newPath]=data[src]; delete data[src]; for(let key in data){ if(key.startsWith(src+'/')){ let nk=key.replace(src,newPath); data[nk]=data[key]; delete data[key]; } } } else { for(let key in data){ if(key===src||key.startsWith(src+'/')){ let nk=key.replace(src,newPath); data[nk]=data[key]; delete data[key]; } } let idx=folders.indexOf(src); if(idx>=0) folders[idx]=newPath; folders.forEach((f,i)=>{ if(f.startsWith(src+'/')) folders[i]=f.replace(src,newPath); }); } save(); selectedPath=newPath; renderTree(); renderVisual(newPath); }
function excluirItem(){ if(!confirm('Excluir '+selectedPath+'?'))return; delete data[selectedPath]; for(let k in data){ if(k.startsWith(selectedPath+'/')) delete data[k]; } folders=folders.filter(f=>!f.startsWith(selectedPath)); save(); renderTree(); document.getElementById('visual').innerHTML='<div class="card">Excluído - código fonte atualizado exato</div>'; }
function excluirItemPath(path){ selectedPath=path; excluirItem(); }
function renomearItem(){ let nome=prompt('Renomear para?', data[selectedPath]?data[selectedPath].nome:selectedPath.split('/').pop()); if(!nome) return; if(data[selectedPath]) data[selectedPath].nome=nome; save(); renderTree(); renderVisual(selectedPath); }
function renomearItemPath(path){ selectedPath=path; renomearItem(); }
function duplicarItem(){ let src=selectedPath; if(!data[src]){alert('Só produtos podem ser duplicados por enquanto');return;} let newKey=src+'-copia'; data[newKey]=JSON.parse(JSON.stringify(data[src])); data[newKey].nome=data[src].nome+' Cópia'; save(); renderTree(); renderVisual(newKey); }
function duplicarItemPath(path){ selectedPath=path; duplicarItem(); }
function arquivarItem(){ if(data[selectedPath]){ data[selectedPath].arquivado=true; data[selectedPath].disponivel=false; save(); renderTree(); renderVisual(selectedPath); alert('Arquivado - disponível = false'); } }
function restaurarItem(){ if(data[selectedPath]){ data[selectedPath].arquivado=false; data[selectedPath].disponivel=true; save(); renderTree(); renderVisual(selectedPath); alert('Restaurado - disponível = true'); } }
function exportarDados(){ let jsonStr=JSON.stringify(data,null,2); let blob=new Blob([jsonStr],{type:"application/json"}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download="KORVIL_EXPORT_JSON.json"; a.click(); let csv="nome,marca,tipo,preco,estoque,disponivel\n"; for(let k in data){ if(data[k].type==='product'){ csv+=`"${data[k].nome}","${data[k].marca||''}","${data[k].tipo||''}",${data[k].preco||0},${data[k].estoque||0},${data[k].disponivel}\n`; } } let blob2=new Blob([csv],{type:"text/csv"}); let url2=URL.createObjectURL(blob2); let a2=document.createElement('a'); a2.href=url2; a2.download="KORVIL_EXPORT_CSV.csv"; a2.click(); }
function importarDados(){ let input=document.createElement('input'); input.type='file'; input.accept='.json'; input.onchange=(e)=>{ let file=e.target.files[0]; let reader=new FileReader(); reader.onload=(ev)=>{ try{ let imported=JSON.parse(ev.target.result); Object.assign(data, imported); save(); renderTree(); renderVisual(selectedPath); alert('Importado com sucesso!'); }catch(err){ alert('Erro ao importar JSON'); } }; reader.readAsText(file); }; input.click(); }
function clonarSetor(){ let newPath="korvil-app/sections/kstore/setores-loja/ktp-copia"; if(confirm('Clonar setor K-TP inteiro para K-TP-copia?')){ for(let key in data){ if(key.includes('/ktp/')){ let nk=key.replace('/ktp/','/ktp-copia/'); data[nk]=JSON.parse(JSON.stringify(data[key])); } } folders.forEach(f=>{ if(f.includes('/ktp/')){ let nf=f.replace('/ktp/','/ktp-copia/'); if(!folders.includes(nf)) folders.push(nf); } }); if(!folders.includes(newPath)) folders.push(newPath); save(); renderTree(); alert('Setor K-TP clonado para K-TP-copia com tudo dentro!'); } }
function vincularProdutos(){ let prod=prompt('Digite nome do produto pra vincular com '+selectedPath+'?'); if(prod){ if(data[selectedPath]){ if(!data[selectedPath].vinculados) data[selectedPath].vinculados=[]; data[selectedPath].vinculados.push(prod); save(); renderVisual(selectedPath); alert('Vinculado: '+prod); } } }
function baixarPasta(){ baixarPastaPath(selectedPath); }
async function baixarPastaPath(path){
  let zip=new JSZip();
  for(let key in data){ if(key===path||key.startsWith(path+'/')){ let folder=zip.folder(key); let prod=data[key]; if(prod.type==='product'){ folder.file("produto.json", JSON.stringify(prod,null,2)); folder.file("index.html", `<html><body><h1>${prod.nome}</h1></body></html>`); } else { folder.file("index.html", `<html><body><h1>${prod.nome||key.split('/').pop()}</h1></body></html>`); } } }
  folders.forEach(f=>{ if(f===path||f.startsWith(path+'/')){ let folder=zip.folder(f); folder.file("index.html", `<html><body><h1>${f.split('/').pop()}</h1></body></html>`); } });
  let content=await zip.generateAsync({type:"blob"});
  let url=URL.createObjectURL(content);
  let a=document.createElement('a'); a.href=url; a.download=path.replace(/\//g,'_')+"_EXATO_COM_TUDO_DENTRO.zip"; a.click();
}
function baixarArquivos(){ let key=selectedPath; let prod=data[key]; if(prod&&prod.type==='product'){ let html=`<html><body><h1>${prod.nome}</h1><p>R$${prod.preco}</p></body></html>`; let blob=new Blob([html],{type:"text/html"}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download="index.html"; a.click(); } else { alert('Selecione um produto pra baixar arquivos HTML'); } }
function compactarZip(){ downloadZipExato(); }
async function downloadZipExato(){
  let zip=new JSZip();
  folders.forEach(f=>{ let folder=zip.folder(f); folder.file("index.html", `<html><body><h1>${f.split('/').pop()}</h1></body></html>`); });
  for(let key in data){ let folder=zip.folder(key); let prod=data[key]; folder.file("produto.json", JSON.stringify(prod,null,2)); folder.file("index.html", `<html><body><h1>${prod.nome}</h1></body></html>`); }
  let content=await zip.generateAsync({type:"blob"});
  let url=URL.createObjectURL(content);
  let a=document.createElement('a'); a.href=url; a.download="KORVIL_ZIP_DESDE_KORVIL_LOJA_EXATO_TUDO.zip"; a.click();
}
function descompactarZip(){ let input=document.createElement('input'); input.type='file'; input.accept='.zip'; input.onchange=async (e)=>{ let file=e.target.files[0]; let zip=new JSZip(); let loaded=await zip.loadAsync(file); let newData={}; for(let path in loaded.files){ let entry=loaded.files[path]; if(!entry.dir){ let content=await entry.async("string"); if(path.endsWith("produto.json")){ try{ let prod=JSON.parse(content); let key=path.replace("/produto.json",""); newData[key]=prod; }catch{} } } } Object.assign(data, newData); save(); renderTree(); alert('ZIP descompactado e importado! '+Object.keys(newData).length+' produtos'); }; input.click(); }
function converter(){ let prod=data[selectedPath]; if(prod&&prod.type==='product'){ let html=`<html><body><h1>${prod.nome}</h1><p>PDF gerado de ${prod.nome}</p></body></html>`; let blob=new Blob([html],{type:"text/html"}); let url=URL.createObjectURL(blob); window.open(url,'_blank'); alert('Convertido HTML para PDF/Imagem - abrindo em nova aba (use Ctrl+P pra salvar como PDF)'); } else { alert('Selecione um produto pra converter'); } }
function compartilhar(){ let path=selectedPath; let link=window.location.origin+window.location.pathname+"#"+encodeURIComponent(path); navigator.clipboard.writeText(link).then(()=>{ alert('Link compartilhável copiado: '+link); }).catch(()=>{ prompt('Copie o link:', link); }); }
function backupTotal(){ downloadZipExato(); let jsonStr=JSON.stringify({data, folders},null,2); let blob=new Blob([jsonStr],{type:"application/json"}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download="KORVIL_BACKUP_TOTAL_"+new Date().toISOString().slice(0,10)+".json"; a.click(); alert('Backup total feito - ZIP + JSON'); }
function limparCache(){ if(confirm('Limpar cache/filtros? Isso limpa localStorage deste editor')){ localStorage.removeItem(STORAGE); alert('Cache limpo! Recarregue a página'); location.reload(); } }
function toggleDisp(path){ if(data[path]){ data[path].disponivel=data[path].disponivel===false?true:false; save(); renderTree(); renderVisual(path); } }
function updateField(path, field, val){ if(data[path]){ data[path][field]=val; save(); } }
function updateSub(path, field, idx, subfield, val){ if(data[path]&&data[path][field]&&data[path][field][idx]){ data[path][field][idx][subfield]=val; } }
function toggleSub(path, field, idx){ if(data[path]&&data[path][field]&&data[path][field][idx]){ data[path][field][idx].disponivel=data[path][field][idx].disponivel===false?true:false; save(); renderVisual(path); } }
function addSub(path, field){ if(!data[path])return; if(!data[path][field]) data[path][field]=[]; data[path][field].push({nome:"Novo "+field, disponivel:true, preco:0, gramas: field==='quantidades'?"500g":undefined}); save(); renderVisual(path); }
function removeSub(path, field, idx){ if(data[path]&&data[path][field]){ data[path][field].splice(idx,1); save(); renderVisual(path); } }

renderTree();
renderVisual(selectedPath);
save();
</script>
