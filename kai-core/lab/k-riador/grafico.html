<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KORVIL 4D - COMBINADOR REALTIME</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
  :root { --ciano:#00f0ff; --bg:#000510; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
  body { background: var(--bg); color: var(--ciano); overflow: hidden; }

  /* LAYOUT NOVO */
 .topbar { height: 60px; background: rgba(0,20,40,0.9); border-bottom: 2px solid var(--ciano); display: flex; align-items: center; padding: 0 20px; box-shadow: 0 0 30px #00f0ff55; }
 .topbar h1 { font-size: 18px; font-weight: 900; text-shadow: 0 0 15px var(--ciano); }
 .menu-rapido { display: flex; gap: 8px; margin-left: 30px; }
 .btn-menu { padding: 8px 12px; background: #001828; border: 1px solid var(--ciano); border-radius: 8px; color: var(--ciano); cursor: pointer; font-size: 11px; }
 .btn-menu.active { background: var(--ciano); color: #000; }

 .container { display: flex; height: calc(100vh - 60px); gap: 10px; padding: 10px; }

  /* FORMULARIO QUADRADO */
 .panel-form { width: 32%; background: rgba(0,10,30,0.7); border: 2px solid var(--ciano); border-radius: 15px; padding: 15px; display: flex; flex-direction: column; box-shadow: 0 0 40px #00f0ff44; }
 .form-box { background: #000a18; border: 1px solid var(--ciano); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
 .form-box h3 { font-size: 12px; margin-bottom: 8px; color: #ff00ff; }
  select, input { width: 100%; padding: 10px; margin-bottom: 8px; background: #000; color: var(--ciano); border: 1px solid var(--ciano); border-radius: 6px; font-size: 12px; }
 .btn-add { width: 100%; padding: 12px; background: linear-gradient(90deg, var(--ciano), #ff00ff); color: #000; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; }
 .tabela-dados { flex: 1; overflow-y: auto; font-size: 10px; }
 .tabela-dados table { width: 100%; border-collapse: collapse; }
 .tabela-dados th { background: #002244; position: sticky; top: 0; }
 .tabela-dados td, th { border: 1px solid #00f0ff33; padding: 4px; text-align: center; }

  /* GRAFICOS */
 .panel-grafico { width: 68%; display: flex; flex-direction: column; gap: 10px; }
 .abas-grafico { display: flex; gap: 8px; }
 .aba { padding: 10px 15px; background: rgba(0,20,40,0.8); border: 1px solid var(--ciano); border-radius: 10px; cursor: pointer; font-size: 11px; }
 .aba.active { background: var(--ciano); color: #000; font-weight: 900; }
 .canvas-box { flex: 1; background: rgba(0,10,30,0.7); border: 2px solid var(--ciano); border-radius: 15px; position: relative; }
  canvas { width: 100%!important; height: 100%!important; border-radius: 15px; }

  /* INFO DAS ESCOLHAS */
 .info-combo { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 10px; border: 1px solid var(--ciano); font-size: 10px; }
 .info-combo span { color: #ff00ff; }

  /* LEGENDA FASES */
 .legend { display: flex; gap: 5px; font-size: 9px; margin-top: 5px; }
 .tag { padding: 3px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>⚡ KORVIL 4D COMBINADOR</h1>
  <div class="menu-rapido">
    <div class="btn-menu active" onclick="trocarMenu('dados')">DADOS</div>
    <div class="btn-menu" onclick="trocarMenu('analise')">ANÁLISE IA</div>
    <div class="btn-menu" onclick="trocarMenu('export')">EXPORTAR</div>
  </div>
</div>

<div class="container">
  <div class="panel-form">
    <div class="form-box">
      <h3>1. SELECIONAR ESTRUTURA</h3>
      <select id="setor" onchange="carregarTudo()"></select>
      <select id="area" onchange="carregarServicos()"></select>
      <select id="servico"></select>
    </div>

    <div class="form-box">
      <h3>2. ADICIONAR VALORES JAN-NOV</h3>
      <div id="inputsMeses"></div>
      <button class="btn-add" onclick="adicionarServico()">+ ADICIONAR AO GRAFICO</button>
    </div>

    <div class="legend">
      <div class="tag" style="background:#ff0000">F1 Jan-Fev</div>
      <div class="tag" style="background:#ff8800">F2 Mar-Mai</div>
      <div class="tag" style="background:#ffff00; color:#000">F3 Jun-Ago</div>
      <div class="tag" style="background:#00ff00; color:#000">F4 Set-Nov</div>
      <div class="tag" style="background:#ff00ff">Dez</div>
    </div>

    <div class="tabela-dados">
      <table id="tabela"><thead><tr><th>Serviço</th><th>F1</th><th>F2</th><th>F3</th><th>F4</th><th>Dez</th><th>Total</th><th>X</th></tr></thead><tbody></tbody></table>
    </div>
  </div>

  <div class="panel-grafico">
    <div class="abas-grafico">
      <div class="aba active" onclick="trocarAba('3d')">3D COMBINADO</div>
      <div class="aba" onclick="trocarAba('fases')">POR FASE</div>
      <div class="aba" onclick="trocarAba('comparativo')">COMPARATIVO</div>
    </div>
    <div class="canvas-box">
      <div class="info-combo" id="infoCombo">Nenhuma combinação ainda</div>
      <canvas id="canvas3d"></canvas>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez*'];
const FASE_MAP = {0:0,1:0,2:1,3:1,4:1,5:2,6:2,7:2,8:3,9:3,10:3,11:4};
const CORES_FASE = {0:0xff0000,1:0xff8800,2:0xffff00,3:0x00ff00,4:0xff00ff};

const DB = {
  "Sistema K": {"Serviços Gerais": ["Eletricista", "Carpinteiro", "Faxineira", "Pintor", "Encanador"],"Tecnologia": ["Dev FrontEnd", "Dev BackEnd", "UX/UI", "Tráfego Pago", "Social Media"]},
  "K-TP": {"Educação Física": ["Treinamento Personalizado", "Consultoria Online", "Plano Alimentar", "Avaliação Física", "Treino Funcional"]},
  "K-AFORTUNADO": {"Empreendedorismo": ["Consultoria Negócios", "Mentoria 1:1", "Plano de Negócio", "Gestão Financeira", "Marketing Digital"],"Finanças": ["Consultoria Investimentos", "Mentoria Financeira", "Planejamento Orçamento", "Controle Gastos", "Educação Financeira"]},
  "K-ALMA": {"Saúde": ["Terapeuta", "Massoterapeuta", "Dentista", "Fisioterapeuta", "Nutricionista"],"Beleza": ["Cabeleireiro", "Barbeiro", "Manicure", "Maquiador", "Estética Facial"]}
};

let data = {}; let scene, camera, renderer, controls, bars = []; let abaAtual = '3d';

// INIT
function init() {
  const setorSel = document.getElementById('setor');
  Object.keys(DB).forEach(s => setorSel.innerHTML += `<option value="${s}">${s}</option>`);
  carregarTudo(); initThree(); animate();
  gerarInputsMeses();
}
function gerarInputsMeses(){
  const box = document.getElementById('inputsMeses');
  box.innerHTML = '';
  MESES.slice(0,11).forEach((m,i)=>{
    box.innerHTML += `<label style="font-size:10px">${m}</label><input type="number" id="mes-${i}" value="0" oninput="updatePreview()">`;
  });
}
function carregarTudo() {
  const setor = document.getElementById('setor').value;
  const areaSel = document.getElementById('area'); areaSel.innerHTML = '';
  Object.keys(DB[setor]).forEach(a => areaSel.innerHTML += `<option value="${a}">${a}</option>`);
  carregarServicos();
}
function carregarServicos() {
  const setor = document.getElementById('setor').value;
  const area = document.getElementById('area').value;
  const servSel = document.getElementById('servico'); servSel.innerHTML = '';
  DB[setor][area].forEach(s => servSel.innerHTML += `<option value="${s}">${s}</option>`);
}

// LOGICA REALTIME + COMBINACOES UNICAS
function adicionarServico() {
  const serv = document.getElementById('servico').value;
  const setor = document.getElementById('setor').value;
  const area = document.getElementById('area').value;
  const id = `${setor} > ${area} > ${serv}`;
  if(data[id]) return alert('Já adicionado!');

  let valores = [];
  for(let i=0;i<11;i++) valores[i] = parseFloat(document.getElementById(`mes-${i}`).value) || 0;

  const soma = valores.reduce((a,b)=>a+b,0);
  const dez = Math.round(soma / 11 * 1.15); // CALCULO REAL
  valores[11] = dez;

  data[id] = {valores, setor, area, serv};
  renderizarTabela();
  updateGrafico();
}
function renderizarTabela(){
  const tbody = document.querySelector('#tabela tbody');
  tbody.innerHTML = '';
  Object.keys(data).forEach(id=>{
    const d = data[id];
    const f = [0,0,0,0]; // F1,F2,F3,F4
    d.valores.slice(0,11).forEach((v,i)=> f[FASE_MAP[i]] += v);
    const total = d.valores.reduce((a,b)=>a+b,0);
    tbody.innerHTML += `<tr><td>${d.serv}</td><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${d.valores[11]}</td><td>${total}</td><td><button onclick="remover('${id}')">X</button></td></tr>`;
  });
}
function remover(id){ delete data[id]; renderizarTabela(); updateGrafico(); }

// 3D REALTIME
function initThree() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x000010);
  camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
  camera.position.set(20, 15, 30);
  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('canvas3d'), antialias: true});
  renderer.setSize(document.querySelector('.canvas-box').offsetWidth, document.querySelector('.canvas-box').offsetHeight);
  controls = new OrbitControls(camera, renderer.domElement); controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
  scene.add(new THREE.PointLight(0x00f0ff, 5, 100).position.set(20,20,20));
  scene.add(new THREE.AmbientLight(0x004488));
}
function updateGrafico(){
  bars.forEach(b => scene.remove(b)); bars = [];
  let servIdx = 0;
  const totalServicos = Object.keys(data).length;

  // INFO DAS ESCOLHAS
  document.getElementById('infoCombo').innerHTML = `
    <b>COMBINAÇÃO ATIVA:</b><br>
    Serviços: <span>${totalServicos}</span><br>
    Setores: <span>${new Set(Object.values(data).map(d=>d.setor)).size}</span><br>
    Áreas: <span>${new Set(Object.values(data).map(d=>d.area)).size}</span>
  `;

  if(abaAtual === '3d'){
    Object.keys(data).forEach(id => {
      data[id].valores.forEach((val, mes) => {
        const height = val / 100 + 0.2;
        const geo = new THREE.BoxGeometry(0.8, height, 0.8);
        const mat = new THREE.MeshPhongMaterial({color: 0x00f0ff, emissive: CORES_FASE[FASE_MAP[mes]], transparent: true, opacity: 0.8});
        const bar = new THREE.Mesh(geo, mat);
        bar.position.set(mes*1.3 - 7, height/2, servIdx*2.5);
        scene.add(bar); bars.push(bar);
      });
      servIdx++;
    });
  }
  if(abaAtual === 'fases'){
    // GRAFICO POR FASE - SOMA REAL
    let somaFases = [0,0,0,0,0];
    Object.values(data).forEach(d=> d.valores.forEach((v,i)=> somaFases[FASE_MAP[i]] += v ));
    somaFases.forEach((val, fase)=>{
      const height = val / 200 + 0.5;
      const geo = new THREE.CylinderGeometry(1.5, 1.5, height, 32);
      const mat = new THREE.MeshPhongMaterial({color: CORES_FASE[fase], emissive: CORES_FASE[fase]});
      const bar = new THREE.Mesh(geo, mat);
      bar.position.set(fase*4 - 8, height/2, 0);
      scene.add(bar); bars.push(bar);
    });
  }
}

function trocarAba(aba){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('active'));
  document.querySelector(`[onclick="trocarAba('${aba}')"]`).classList.add('active');
  abaAtual = aba; updateGrafico();
}
function trocarMenu(m){
  document.querySelectorAll('.btn-menu').forEach(a=>a.classList.remove('active'));
  document.querySelector(`[onclick="trocarMenu('${m}')"]`).classList.add('active');
}
function updatePreview(){} // placeholder
window.adicionarServico = adicionarServico;
window.remover = remover;
window.trocarAba = trocarAba;
window.trocarMenu = trocarMenu;
window.carregarTudo = carregarTudo;
window.carregarServicos = carregarServicos;

function animate() {
  requestAnimationFrame(animate);
  bars.forEach((b,i) => { b.rotation.y += 0.005; });
  if(controls) controls.update();
  renderer.render(scene, camera);
}
window.onload = init;
</script>
</body>
</html>
