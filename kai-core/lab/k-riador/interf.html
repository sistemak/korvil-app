<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS HOLO</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "@mediapipe/hands": "https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js",
    "@mediapipe/camera_utils": "https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none}

  /* CAMERA FICA ATRÁS INVISÍVEL MAS RODANDO */
  #camera{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;opacity:0.01;pointer-events:none}

  /* HOLOGRAMA FICA NA FRENTE */
  #cena{position:fixed;top:0;left:0;width:100%;height:100%;z-index:2;background:radial-gradient(ellipse at center, #001a2e 0%, #000 100%)}

 .grid{position:fixed;bottom:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,247,255,0.15) 1px, transparent 1px),linear-gradient(90deg, rgba(0,247,255,0.15) 1px, transparent 1px);background-size:50px 50px;transform:perspective(1000px) rotateX(75deg);z-index:2}

 .hud{position:fixed;top:20px;width:100%;text-align:center;color:#00f7ff;font-family:monospace;font-size:15px;z-index:3;text-shadow:0 0 10px #00f7ff}

 .lixeira{position:fixed;bottom:10%;left:6%;width:80px;height:80px;border:4px dashed #ff0044;border-radius:50%;z-index:3;transition:0.2s}
 .lixeira.on{border-color:#ffaa00;box-shadow:0 0 50px #ffaa00;transform:scale(1.3)}
</style>
</head>
<body>

<video id="camera" autoplay playsinline muted></video>
<div id="cena"></div>
<div class="grid"></div>
<div class="lixeira" id="lixeira"></div>
<div class="hud">JARVIS v6.0 | <span id="status">TOQUE PARA PERMITIR CÂMERA</span></div>

<script type="module">
import * as THREE from 'three';
import { Hands } from '@mediapipe/hands';
import { Camera } from '@mediapipe/camera_utils';

// ===== 1. THREE TELA CHEIA =====
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);
document.getElementById('cena').appendChild(renderer.domElement);
camera.position.set(0,2,5);camera.lookAt(0,0,0);
scene.add(new THREE.AmbientLight(0x00f7ff,1));

// BRACELETE NO CENTRO DO CHÃO
const bracelete=new THREE.Group();bracelete.position.set(0,0,0);scene.add(bracelete);
bracelete.add(new THREE.Mesh(new THREE.TorusGeometry(1.5,0.15,16,100),new THREE.MeshPhongMaterial({color:0x00f7ff,wireframe:true})));
const pecas=[];[-1.5,0,1.5].forEach((x,i)=>{
  const geo=i===1?new THREE.BoxGeometry(0.3,0.4,0.15):new THREE.CylinderGeometry(0.25,0.25,0.15,6);
  const p=new THREE.Mesh(geo,new THREE.MeshPhongMaterial({color:0x00ff88,emissive:0x00ff88}));
  p.position.set(x,0,0);bracelete.add(p);pecas.push(p);
});

// CUBO TESTE
const cubo=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5),new THREE.MeshPhongMaterial({color:0xffaa00,emissive:0xffaa00}));
cubo.position.set(2.5,0.25,0);scene.add(cubo);

// LIXEIRA
const lix=new THREE.Group();lix.position.set(-3,0,-2);scene.add(lix);
lix.add(new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.3,0.6,16),new THREE.MeshPhongMaterial({color:0xff0044})));
const circulo=new THREE.Mesh(new THREE.RingGeometry(2,2.2,32),new THREE.MeshBasicMaterial({color:0xff0044,transparent:true,opacity:0.1,side:2}));
circulo.rotation.x=-1.57;lix.add(circulo);

// ===== 2. CÂMERA + MÃOS =====
const video=document.getElementById('camera');
let maoDir=null, segurando=null;

async function start(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
  video.srcObject=stream;
  document.getElementById('status').innerText='CÂMERA OK - USE A MÃO DIREITA';

  const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
  hands.setOptions({maxNumHands:1, minDetectionConfidence:0.7});
  hands.onResults(onResults);
  new Camera(video,{onFrame:async()=>{await hands.send({image:video})},width:640,height:480}).start();
}

// PRECISA DE TOQUE NO CELULAR PRA LIGAR A CAMERA
document.body.addEventListener('click',start,{once:true});

function get3D(lm){return new THREE.Vector3((lm.x-0.5)*10,(0.5-lm.y)*7,lm.z*5)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function onResults(res){
  if(!res.multiHandLandmarks) return;
  maoDir=res.multiHandLandmarks[0];

  const pos=get3D(maoDir[8]);
  const punho=dist(maoDir[4],maoDir[8])<0.06;
  const aberta=dist(maoDir[4],maoDir[8])>0.18;

  // PEGAR
  if(punho &&!segurando){
    if(cubo.position.distanceTo(pos)<0.7){segurando=cubo;document.getElementById('status').innerText='SEGURANDO CUBO'}
    pecas.forEach(p=>{if(p.position.clone().add(bracelete.position).distanceTo(pos)<0.6){segurando=p;scene.add(p)}})
  }

  // ARRASTAR
  if(segurando){
    segurando.position.copy(pos);segurando.position.y=0.25;
    segurando.rotation.x+=0.05;segurando.rotation.y+=0.05;

    const d=segurando.position.distanceTo(lix.position);
    if(d<2.2){document.getElementById('lixeira').classList.add('on');circulo.material.opacity=0.4;
      if(aberta){
        const dir=lix.position.clone().sub(segurando.position).normalize();
        segurando.position.add(dir.multiplyScalar(0.25));
        if(d<0.6){
          if(segurando===cubo){cubo.position.set(2.5,0.25,0)}else{scene.remove(segurando)}
          segurando=null;document.getElementById('status').innerText='DESCARTADO'
        }
      }
    }else{document.getElementById('lixeira').classList.remove('on');circulo.material.opacity=0.1}

    if(aberta && d>2.2){segurando=null;document.getElementById('status').innerText='SOLTO'}
  }
}

function animate(){requestAnimationFrame(animate);bracelete.rotation.y+=0.002;renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
