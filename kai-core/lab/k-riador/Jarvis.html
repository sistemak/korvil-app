<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K.R.I.A.D.O.R - JARVIS</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:'Arial';
  }
  .jarvis{
    position:relative;
    width:400px;
    height:400px;
  }
  .circulo{
    position:absolute;
    width:100%;
    height:100%;
    border:2px solid #00f7ff;
    border-radius:50%;
    box-shadow:0 0 40px #00f7ff, inset 0 0 40px #00f7ff;
    animation: girar 12s linear infinite;
  }
  .circulo:nth-child(2){width:80%;height:80%;top:10%;left:10%;animation: girar 8s linear infinite reverse}
  .circulo:nth-child(3){width:60%;height:60%;top:20%;left:20%;animation: girar 6s linear infinite}
  
  .linha{
    position:absolute;
    width:100%;
    height:2px;
    background:linear-gradient(90deg, transparent, #00f7ff, transparent);
    top:50%;
    box-shadow:0 0 10px #00f7ff;
  }
  
  .texto{
    position:absolute;
    bottom:-60px;
    width:100%;
    text-align:center;
    color:#00f7ff;
    font-size:22px;
    letter-spacing:3px;
    text-shadow:0 0 15px #00f7ff;
    animation: piscar 2s infinite;
  }
  
  @keyframes girar{100%{transform:rotate(360deg)}}
  @keyframes piscar{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
  <div class="jarvis">
    <div class="circulo"></div>
    <div class="circulo"></div>
    <div class="circulo"></div>
    <div class="linha"></div>
    <div class="texto">JARVIS ONLINE</div>
  </div>

<script>
  // Move o holograma com o mouse
  document.addEventListener('mousemove', e => {
    const jarvis = document.querySelector('.jarvis');
    let x = (window.innerWidth/2 - e.clientX)/25;
    let y = (window.innerHeight/2 - e.clientY)/25;
    jarvis.style.transform = `rotateX(${y}deg) rotateY(${x}deg)`;
  });
</script>
</body>
</html>
