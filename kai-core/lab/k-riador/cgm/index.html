<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>KORVIL G15 ULTRA x HOLOGRAMA CGM 5.0 (AI & TOUCH)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      touch-action: none;
      user-select: none;
      font-family: 'Courier New', Courier, monospace;
    }

    body {
      background: #030712;
      color: #00f0ff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
      z-index: 1;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 2;
    }

    #video {
      position: absolute;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0.35;
      filter: grayscale(40%) contrast(140%) brightness(0.6);
      z-index: 1;
      transition: filter 0.5s ease;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 3;
      pointer-events: none;
    }

    #menu {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 210px;
      background: rgba(5, 12, 24, 0.85);
      border: 1px solid #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2), inset 0 0 10px rgba(0, 240, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    .menu-title {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 0 5px #00f0ff;
      display: flex;
      justify-content: space-between;
    }

    .btn {
      width: 100%;
      padding: 8px;
      margin: 4px 0;
      background: rgba(0, 240, 255, 0.08);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.15s ease;
    }

    .btn:hover, .btn.active {
      border-color: #ffffff;
      box-shadow: 0 0 12px #00f0ff;
      background: rgba(0, 240, 255, 0.3);
      color: #fff;
    }

    .btn:active {
      transform: scale(0.95);
      background: #00f0ff;
      color: #000;
    }

    .cubo {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 2px solid #00f0ff;
      background: rgba(0, 240, 255, 0.12);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.1);
      border-radius: 6px;
      cursor: grab;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      letter-spacing: 1px;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.1s ease-out;
    }

    .cubo::after {
      content: '+';
      opacity: 0.5;
    }

    .cubo.segurado {
      border-color: #ff00ea;
      background: rgba(255, 0, 234, 0.2);
      box-shadow: 0 0 25px #ff00ea, inset 0 0 15px #ff00ea;
      z-index: 8;
    }

    #lixeira {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 60px;
      height: 60px;
      border: 2px dashed #ff3366;
      border-radius: 10px;
      background: rgba(255, 51, 102, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      z-index: 10;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
    }

    #lixeira.ativo {
      border-color: #ff0044;
      background: rgba(255, 0, 68, 0.35);
      transform: scale(1.25);
      box-shadow: 0 0 25px #ff0044;
    }

    #alvo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px dashed #ffff00;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 4;
      box-shadow: 0 0 20px #ffff00, inset 0 0 20px #ffff00;
    }

    #status {
      position: absolute;
      bottom: 20px;
      right: 20px;
      color: #00f0ff;
      font-size: 10px;
      background: rgba(5, 12, 24, 0.85);
      border: 1px solid #00f0ff;
      padding: 8px 12px;
      border-radius: 4px;
      min-width: 220px;
      z-index: 10;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .calib-bar { width: 100%; height: 4px; background: #001122; border-radius: 2px; margin-top: 6px; }
    .calib-fill { height: 100%; width: 0%; background: #00ff66; transition: 0.1s; }
    
    #msg {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      color: #00ffff;
      font-size: 16px;
      z-index: 10;
      text-shadow: 0 0 10px #00ffff;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanlines"></div>
<div id="msg">SISTEMA INICIALIZADO // COMANDO DE VOZ ATIVO</div>

<div id="menu">
  <div class="menu-title">
    <span>> CGM HOLO ULTRA</span>
    <span>v5.0</span>
  </div>
  <button class="btn" id="btn_luva">MODO LUVAS</button>
  <button class="btn" id="calibrar">CALIBRAR GESTOS</button>
  <button class="btn" id="novo">+ NOVO CUBO</button>
  <button class="btn" id="limpar">RESETAR</button>
  <button class="btn" id="cor">COR HUD</button>
  <button class="btn" id="voz">VOZ / MIC: ON</button>
  <div class="calib-bar"><div class="calib-fill" id="calibFill"></div></div>
</div>

<div id="lixeira">🗑️</div>
<div id="alvo"></div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="cubo1" class="cubo" style="left:calc(50% - 40px); top:calc(50% - 40px);"></div>

<div id="status">
  <div>SISTEMA: <span id="st-text">AGUARDANDO</span></div>
  <div>GESTO: <span id="st-gesto">NENHUM</span></div>
  <div>OBJETOS: <span id="st-obj">1</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script>
// --- AUDIO & HÁPTICO (VIBRAÇÃO) ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let vozLigada = true;

function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function vibrar(ms = 30) { if (navigator.vibrate) navigator.vibrate(ms); }

function playSound(freq, type = 'sine', duration = 0.1, vol = 0.1) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}

const SFX = {
  click: () => { playSound(800, 'square', 0.05, 0.08); vibrar(20); },
  grab: () => { playSound(300, 'sawtooth', 0.12, 0.08); vibrar(40); },
  trash: () => { playSound(150, 'sawtooth', 0.25, 0.12); vibrar(70); },
  spawn: () => { playSound(600, 'sine', 0.1, 0.1); setTimeout(() => playSound(900, 'sine', 0.1, 0.08), 50); vibrar(30); },
  sucesso: () => { playSound(1200, 'sine', 0.1, 0.1); setTimeout(() => playSound(1500, 'sine', 0.1, 0.08), 100); vibrar([40, 30, 40]); }
};

const falas = window.speechSynthesis;
function falar(texto) {
  if (!vozLigada) return;
  falas.cancel();
  let msg = new SpeechSynthesisUtterance(texto);
  msg.lang = 'pt-BR';
  msg.rate = 1.1;
  falas.speak(msg);
}

// --- COMANDOS DE VOZ CONTINUOS (WEB SPEECH API) ---
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const command = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
    msg.innerText = "COMANDO DE VOZ: " + command.toUpperCase();
    
    if (command.includes("novo") || command.includes("cubo")) criarCubo();
    if (command.includes("limpar") || command.includes("resetar")) document.getElementById('limpar').click();
    if (command.includes("cor") || command.includes("mudar cor")) document.getElementById('cor').click();
    if (command.includes("luva") || command.includes("luvas")) document.getElementById('btn_luva').click();
    if (command.includes("calibrar")) iniciarCalibragem();
  };

  recognition.onerror = () => recognition.start();
  recognition.onend = () => { if(vozLigada) recognition.start(); };
  recognition.start();
}

// --- VARIÁVEIS DOM E CANVAS ---
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const msg = document.getElementById('msg');
const alvo = document.getElementById('alvo');
const stText = document.getElementById('st-text');
const stObj = document.getElementById('st-obj');
const stGesto = document.getElementById('st-gesto');
const lixeira = document.getElementById('lixeira');
const btnLuva = document.getElementById('btn_luva');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// --- ESTADOS DE SESSÃO & LERP (SUAVIZAÇÃO) ---
let cubos = [document.getElementById('cubo1')];
let luvaAtiva = false;
let luvaPega = false;
let contagemLuva = 0;
let ultimoClique = 0;
let cooldownGesto = 0;
let appScreen = null;
let loadingPercent = 0;

let cores = ['#00f0ff', '#ff00ea', '#ffe600', '#00ff66', '#ff3366'];
let corAtual = 0;

let luvaPos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
let smoothedHand1 = null;
let smoothedHand2 = null;

let etapaCalibragem = 0;
let calibrado = true;
let calibValues = { abrir: 0.32, punho: 0.12, pinca: 0.06 };
let tempoCalib = 0;
let distPincaAnterior = null;

const buttonsHolo = [
  { id: 'GRID', icon: '■', y_offset: -50, active: false },
  { id: 'MAPA', icon: '⚙', y_offset: 0, active: false },
  { id: 'FECHAR', icon: '⚡', y_offset: 50, active: false },
];

// FILTRO LERP PARA REVERBERAÇÃO SUAVE (ANTI-TREMOR)
function lerp(start, end, amt) {
  return start + (end - start) * amt;
}

function smoothLandmarks(prev, current, factor = 0.35) {
  if (!prev) return current;
  return current.map((lm, i) => ({
    x: lerp(prev[i].x, lm.x, factor),
    y: lerp(prev[i].y, lm.y, factor),
    z: lerp(prev[i].z, lm.z, factor)
  }));
}

// --- MATEMÁTICA E GESTOS ---
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function isPinca(h) { return dist(h[4], h[8]) < calibValues.pinca; }
function isMaoFechada(h) { return dist(h[8], h[5]) < calibValues.punho && dist(h[12], h[9]) < calibValues.punho; }
function isMaoAberta(h) { return dist(h[8], h[0]) > calibValues.abrir && dist(h[12], h[0]) > calibValues.abrir; }

function identificarGesto(h) {
  if (isPinca(h)) return "PINÇA";
  if (isMaoFechada(h)) return "PUNHO";
  if (isMaoAberta(h)) return "ABERTO";
  if (h[8].y < h[6].y && h[12].y < h[10].y) return "PAZ";
  if (h[8].y < h[6].y) return "APONTAR";
  if (h[4].y < h[3].y) return "LIKE";
  if (h[4].y > h[2].y) return "DISLIKE";
  return "NEUTRO";
}

// --- MEDIAPIPE CONFIG ---
const handsDetector = new Hands({
  locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

handsDetector.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

handsDetector.onResults(results => {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.shadowColor = cores[corAtual];
  ctx.shadowBlur = 15;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const rawHand1 = results.multiHandLandmarks[0].map(lm => ({ x: 1 - lm.x, y: lm.y, z: lm.z }));
    const rawHand2 = results.multiHandLandmarks[1] ? results.multiHandLandmarks[1].map(lm => ({ x: 1 - lm.x, y: lm.y, z: lm.z })) : null;

    // Aplicação da Suavização LERP
    smoothedHand1 = smoothLandmarks(smoothedHand1, rawHand1);
    if (rawHand2) smoothedHand2 = smoothLandmarks(smoothedHand2, rawHand2);
    else smoothedHand2 = null;

    const gesto1 = identificarGesto(smoothedHand1);
    stGesto.textContent = gesto1;

    // Desenhar esqueletos futuristas
    drawHandSkeleton(smoothedHand1, cores[corAtual]);
    if (smoothedHand2) drawHandSkeleton(smoothedHand2, '#ff00ea');

    // MODO LUVAS / HOLOGRAMA
    if (luvaAtiva) {
      processarModoLuva(smoothedHand1, smoothedHand2);
    } else {
      drawHologramBase(smoothedHand1);
      if (appScreen) drawAppScreen(smoothedHand1);
      if (smoothedHand2) checkButtonClick(smoothedHand2[8], smoothedHand1);
    }

    // MULTITOUCH PINCH TO SCALE (REDIMENSIONAMENTO COM DUAS MÃOS)
    if (smoothedHand1 && smoothedHand2 && isPinca(smoothedHand1) && isPinca(smoothedHand2)) {
      const dAtual = dist(smoothedHand1[8], smoothedHand2[8]);
      if (distPincaAnterior) {
        const delta = (dAtual - distPincaAnterior) * 300;
        cubos.forEach(c => {
          let currentW = parseFloat(c.style.width || 80);
          let newW = Math.max(40, Math.min(200, currentW + delta));
          c.style.width = `${newW}px`;
          c.style.height = `${newW}px`;
        });
      }
      distPincaAnterior = dAtual;
    } else {
      distPincaAnterior = null;
    }

    checarCalibragem(smoothedHand1);
    executarAcao(gesto1, smoothedHand2 ? identificarGesto(smoothedHand2) : "NEUTRO", smoothedHand1);
  } else {
    stText.textContent = "AGUARDANDO MÃOS...";
    smoothedHand1 = null;
    smoothedHand2 = null;
  }
});

// --- RENDERIZAÇÃO EM CANVAS ---
function drawHandSkeleton(landmarks, color) {
  window.drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: color, lineWidth: 2 });
  window.drawLandmarks(ctx, landmarks, { color: color, radius: 3 });
}

function drawHologramBase(landmarks) {
  const cx = landmarks[9].x * canvas.width;
  const cy = landmarks[9].y * canvas.height;

  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, 40 + i * 20, 0, 2 * Math.PI);
    ctx.strokeStyle = `rgba(0,240,255,${0.8 - i * 0.2})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  const bx_base = landmarks[4].x * canvas.width + 60;
  const by_base = landmarks[4].y * canvas.height;

  buttonsHolo.forEach(b => {
    b.x = bx_base;
    b.y = by_base + b.y_offset;
    drawHexagon(b.x, b.y, 20, b.active);
    ctx.fillStyle = '#fff';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(b.id, b.x, b.y + 4);
  });
}

function drawHexagon(x, y, radius, active) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const angle = Math.PI / 3 * i - Math.PI / 6;
    const px = x + radius * Math.cos(angle);
    const py = y + radius * Math.sin(angle);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.fillStyle = active ? 'rgba(0,240,255,0.8)' : 'rgba(0,240,255,0.15)';
  ctx.fill();
  ctx.strokeStyle = '#00f0ff';
  ctx.stroke();
}

function drawAppScreen(landmarks) {
  const x = landmarks[9].x * canvas.width - 150;
  const y = landmarks[9].y * canvas.height - 180;
  const w = 300; const h = 140;

  ctx.fillStyle = 'rgba(5, 12, 24, 0.85)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = cores[corAtual];
  ctx.strokeRect(x, y, w, h);

  if (appScreen === 'loading') {
    ctx.fillStyle = '#00f0ff';
    ctx.font = '18px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(`CARREGANDO... ${loadingPercent}%`, x + w / 2, y + h / 2);
    ctx.fillRect(x + 20, y + h - 25, (w - 40) * (loadingPercent / 100), 6);
  } else if (appScreen === 'mapa') {
    ctx.fillStyle = '#00ff66';
    ctx.font = '12px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText("SISTEMA DE MAPEAMENTO G15", x + w / 2, y + 30);
    ctx.strokeStyle = 'rgba(0,255,102,0.3)';
    ctx.beginPath();
    ctx.arc(x + w / 2, y + 80, 30, 0, Math.PI * 2);
    ctx.stroke();
  }
}

function updateLoading() {
  if (appScreen === 'loading' && loadingPercent < 100) {
    loadingPercent += 4;
  } else if (loadingPercent >= 100) {
    appScreen = 'mapa';
  }
  requestAnimationFrame(updateLoading);
}
updateLoading();

// --- LÓGICA DE DOCKING/LUVA ---
function processarModoLuva(mao1, mao2) {
  let palmaX = mao1[9].x * canvas.width;
  let palmaY = mao1[9].y * canvas.height;

  if (!luvaPega) {
    alvo.style.display = "block";
    const distancia = Math.hypot(palmaX - luvaPos.x, palmaY - luvaPos.y);

    if (distancia < 80) {
      contagemLuva += 1 / 30;
      msg.innerText = `SINCRO LUVAS: ${Math.ceil(3 - contagemLuva)}s`;
      ctx.strokeStyle = "#ffe600";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(luvaPos.x, luvaPos.y, 60, 0, Math.PI * 2 * (contagemLuva / 3));
      ctx.stroke();

      if (contagemLuva >= 3) {
        luvaPega = true;
        contagemLuva = 0;
        alvo.style.display = "none";
        msg.innerText = "LUVAS CONECTADAS";
        SFX.sucesso();
        falar("Luvas ativadas");
      }
    } else {
      contagemLuva = 0;
      msg.innerText = "ALINHE A PALMA AO CÍRCULO";
    }
    return;
  }

  luvaPos.x = palmaX;
  luvaPos.y = palmaY;

  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(luvaPos.x, luvaPos.y, 45 + (i * 15), 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(0,240,255,${1 - (i * 0.3)})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function checkButtonClick(indexPoint, baseHand) {
  const ix = indexPoint.x * canvas.width;
  const iy = indexPoint.y * canvas.height;

  buttonsHolo.forEach(b => {
    const d = Math.hypot(ix - b.x, iy - b.y);
    if (d < 25 && !b.active && (Date.now() - ultimoClique > 500)) {
      b.active = true;
      ultimoClique = Date.now();
      SFX.click();

      if (b.id === 'GRID') { appScreen = 'loading'; loadingPercent = 0; }
      if (b.id === 'MAPA') { appScreen = 'mapa'; }
      if (b.id === 'FECHAR') { appScreen = null; }

      setTimeout(() => b.active = false, 400);
    }
  });
}

// --- CONTROLE DE ACOES ---
function executarAcao(g1, g2, h1) {
  if (!calibrado || Date.now() < cooldownGesto) return;
  const combo = g2 === "NEUTRO" ? g1 : g1 + " " + g2;

  if (g1 === "PINÇA" && h1) {
    const x = h1[8].x * canvas.width;
    const y = h1[8].y * canvas.height;
    
    cubos.forEach(c => {
      const cx = c.offsetLeft + (c.offsetWidth / 2);
      const cy = c.offsetTop + (c.offsetHeight / 2);
      if (Math.hypot(x - cx, y - cy) < 60) {
        c.style.left = `${x - (c.offsetWidth / 2)}px`;
        c.style.top = `${y - (c.offsetHeight / 2)}px`;
      }
    });
  }

  const acoes = {
    "LIKE": () => document.getElementById('cor').click(),
    "DISLIKE": () => { if (cubos.length) { cubos.pop().remove(); stObj.textContent = cubos.length; SFX.trash(); } },
    "ABERTO ABERTO": () => document.getElementById('limpar').click(),
    "PAZ PAZ": () => criarCubo()
  };

  if (acoes[combo]) {
    cooldownGesto = Date.now() + 800;
    stGesto.textContent = combo;
    falar("Comando " + combo);
    SFX.click();
    acoes[combo]();
  }
}

// --- CALIBRAGEM ---
function iniciarCalibragem() {
  etapaCalibragem = 1; calibrado = false;
  document.getElementById('calibFill').style.width = '0%';
  stText.textContent = "CALIBRANDO 1/3";
  falar("Mostre a mão aberta");
}

function checarCalibragem(h) {
  if (etapaCalibragem === 0) return;
  tempoCalib += 0.05;
  document.getElementById('calibFill').style.width = (tempoCalib * 33) + '%';

  if (etapaCalibragem === 1 && isMaoAberta(h) && tempoCalib > 1.5) {
    calibValues.abrir = dist(h[8], h[0]) * 0.9;
    etapaCalibragem = 2; tempoCalib = 0;
    stText.textContent = "CALIBRANDO 2/3"; falar("Feche o punho"); SFX.sucesso();
  } else if (etapaCalibragem === 2 && isMaoFechada(h) && tempoCalib > 1.5) {
    calibValues.punho = dist(h[8], h[5]) * 1.2;
    etapaCalibragem = 3; tempoCalib = 0;
    stText.textContent = "CALIBRANDO 3/3"; falar("Faça pinça com os dedos"); SFX.sucesso();
  } else if (etapaCalibragem === 3 && isPinca(h) && tempoCalib > 1.5) {
    calibValues.pinca = dist(h[4], h[8]) * 1.1;
    etapaCalibragem = 0; calibrado = true; tempoCalib = 0;
    document.getElementById('calibFill').style.width = '100%';
    stText.textContent = "PRONTO"; falar("Calibragem concluída"); SFX.sucesso();
  }
}

// --- GERENCIAMENTO DE INTERFACE E CUBOS ---
function criarCubo(x, y) {
  initAudio();
  const c = document.createElement('div');
  c.className = 'cubo';
  c.style.left = `${x || (window.innerWidth / 2 - 40)}px`;
  c.style.top = `${y || (window.innerHeight / 2 - 40)}px`;
  c.style.borderColor = cores[corAtual];
  c.style.boxShadow = `0 0 15px ${cores[corAtual]}`;

  let isDragging = false, offsetX = 0, offsetY = 0;
  c.addEventListener('pointerdown', (e) => {
    initAudio(); isDragging = true;
    offsetX = e.clientX - c.offsetLeft; offsetY = e.clientY - c.offsetTop;
    c.classList.add('segurado'); SFX.grab(); c.setPointerCapture(e.pointerId);
  });
  c.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    c.style.left = `${e.clientX - offsetX}px`;
    c.style.top = `${e.clientY - offsetY}px`;
    const lixRect = lixeira.getBoundingClientRect();
    lixeira.classList.toggle('ativo', Math.hypot(e.clientX - (lixRect.left + 30), e.clientY - (lixRect.top + 30)) < 80);
  });
  c.addEventListener('pointerup', (e) => {
    if (!isDragging) return; isDragging = false; c.classList.remove('segurado');
    const lixRect = lixeira.getBoundingClientRect();
    if (Math.hypot(e.clientX - (lixRect.left + 30), e.clientY - (lixRect.top + 30)) < 80) {
      SFX.trash(); c.remove(); cubos = cubos.filter(item => item !== c); stObj.textContent = cubos.length;
    }
    lixeira.classList.remove('ativo');
  });

  document.body.appendChild(c);
  cubos.push(c);
  stObj.textContent = cubos.length;
  SFX.spawn();
}

document.getElementById('novo').onclick = () => criarCubo();
document.getElementById('limpar').onclick = () => { initAudio(); SFX.trash(); cubos.forEach(c => c.remove()); cubos = []; stObj.textContent = 0; };
document.getElementById('cor').onclick = () => { initAudio(); SFX.click(); corAtual = (corAtual + 1) % cores.length; document.getElementById('cor').style.color = cores[corAtual]; };
document.getElementById('calibrar').onclick = () => iniciarCalibragem();
document.getElementById('voz').onclick = () => { vozLigada = !vozLigada; document.getElementById('voz').innerText = vozLigada ? 'VOZ / MIC: ON' : 'VOZ / MIC: OFF'; };

btnLuva.onclick = () => {
  initAudio();
  luvaAtiva = !luvaAtiva;
  btnLuva.classList.toggle("active");
  luvaPega = false;
  contagemLuva = 0;
  alvo.style.display = luvaAtiva ? "block" : "none";
  msg.innerText = luvaAtiva ? "ALINHE A PALMA DA MÃO AO CÍRCULO" : "MODO LIVRE ATIVO";
  SFX.click();
};

// --- INICIALIZAÇÃO DE CÂMERA & CONTRASTE DINÂMICO ---
navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } })
  .then(stream => {
    video.srcObject = stream;
    const camera = new Camera(video, {
      onFrame: async () => { await handsDetector.send({ image: video }); },
      width: 1280, height: 720
    });
    camera.start().then(() => { stText.textContent = "SISTEMA ONLINE"; });
  })
  .catch(err => {
    stText.textContent = "ERRO CAMERA";
    msg.innerText = "FALHA AO ABRIR CÂMERA";
  });
</script>
