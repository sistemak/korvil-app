<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOPYRIGHT PRO V1.0</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI', Arial;background:#0a0a0a;color:#eee;display:flex;flex-direction:column;height:100vh}
    header{background:linear-gradient(90deg,#6a00ff,#00d4ff);padding:15px;text-align:center}
    header h1{font-size:22px;letter-spacing:2px}
    header p{font-size:12px;opacity:0.8}
    
    .container{flex:1;display:flex;padding:20px;gap:20px}
    .box{flex:1;background:#111;border:1px solid #333;border-radius:8px;padding:15px}
    .box h2{color:#00d4ff;font-size:16px;margin-bottom:10px}
    
    textarea{width:100%;height:200px;background:#000;color:#0f0;border:1px solid #00d4ff;border-radius:5px;padding:10px;font-family:'Courier New';resize:none}
    
    button{width:100%;padding:12px;margin-top:10px;background:#6a00ff;color:#fff;border:none;border-radius:5px;font-weight:bold;cursor:pointer}
    button:hover{background:#00d4ff;color:#000}
    
    footer{text-align:center;padding:10px;font-size:11px;background:#000;border-top:1px solid #333;color:#888}
    .marca{color:#00d4ff;font-weight:bold}
  </style>
</head>
<body>
  <header>
    <h1>⚡ KOPYRIGHT PRO ⚡</h1>
    <p>Gerador de Copyright e Proteção de Conteúdo</p>
  </header>
  
  <div class="container">
    <div class="box">
      <h2>1. SEU TEXTO/CÓDIGO</h2>
      <textarea id="entrada" placeholder="Cole aqui seu texto, código ou ideia..."></textarea>
      <button onclick="gerar()">GERAR COPYRIGHT</button>
    </div>
    
    <div class="box">
      <h2>2. RESULTADO COM PROTEÇÃO</h2>
      <textarea id="saida" readonly placeholder="O copyright gerado vai aparecer aqui..."></textarea>
      <button onclick="copiar()">COPIAR</button>
    </div>
  </div>
  
  <footer>
    © <span id="ano"></span> <span class="marca">KOPYRIGHT PRO</span> - Todos os direitos reservados. KORVIL LAB
  </footer>

<script>
document.getElementById('ano').innerText = new Date().getFullYear();

function gerar(){
  const texto = document.getElementById('entrada').value;
  if(!texto) { alert("Cole algo primeiro"); return; }
  
  const ano = new Date().getFullYear();
  const hash = btoa(texto).slice(0,8);
  
  const resultado = `/* ===================================
   KOPYRIGHT PRO - REGISTRO ${hash}
   © ${ano} KORVIL. Todos os direitos reservados.
   Protegido por KOPYRIGHT PRO V1.0
   Uso não autorizado é crime.
   =================================== */

${texto}

/* FIM DO REGISTRO - KOPYRIGHT PRO */`;
  
  document.getElementById('saida').value = resultado;
}

function copiar(){
  const saida = document.getElementById('saida');
  saida.select();
  document.execCommand('copy');
  alert('Copiado!');
}
</script>
</body>
</html>
