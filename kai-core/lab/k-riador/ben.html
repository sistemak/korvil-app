<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMNITRIX 3D REAL - REALITY LINK</title>

  <!-- MOTOR THREE.JS, MEDIAPIPE E ESTILOS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #000; height: 100vh; overflow: hidden; font-family: 'Orbitron', sans-serif; color: #FFF; }

    /* RASTREAMENTO E CANVASES */
    #webcam { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); opacity: 0.25; z-index: 1; }
    #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; }

    /* EFEITO FLASH DE TRANSFORMAÇÃO */
    #transform-flash {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #00FF66; opacity: 0; z-index: 100; pointer-events: none;
      transition: opacity 0.1s ease-out;
    }

    /* CONTROLES E HUD */
    .hud {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(0,20,0,0.85); border: 2px solid #00FF66;
      padding: 15px; border-radius: 12px; box-shadow: 0 0 25px #00FF66;
      font-family: 'Rajdhani', sans-serif; min-width: 280px;
    }
    .hud h2 { font-family: 'Orbitron'; color: #00FF66; font-size: 16px; margin-bottom: 5px; }
    .status-tag { display: inline-block; padding: 3px 8px; background: rgba(0,255,102,0.2); border-radius: 4px; font-size: 12px; color: #00FF66; margin-top: 5px; }

    /* CONTROLES DO PAINEL */
    .panel {
      position: absolute; right: 20px; top: 20px; z-index: 10;
      display: flex; flex-direction: column; gap: 10px; width: 260px;
    }
    .btn {
      padding: 12px; background: rgba(0,0,0,0.8); border: 2px solid #00FF66;
      color: #00FF66; font-family: 'Orbitron'; font-weight: 700; font-size: 12px;
      border-radius: 8px; cursor: pointer; transition: 0.2s; text-align: center;
      box-shadow: 0 0 10px rgba(0,255,102,0.3);
    }
    .btn:hover { background: #00FF66; color: #000; box-shadow: 0 0 25px #00FF66; }
    .btn-active { background: #00FF66; color: #000; }
  </style>
</head>
<body>

  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas3d"></canvas>
  <div id="transform-flash"></div>

  <div class="hud">
    <h2>OMNITRIX ALIEN FORCE</h2>
    <div>Status: <span id="wrist-status" class="status-tag">Procurando Pulso...</span></div>
    <div>Alien: <span id="alien-name" style="color:#FFF; font-weight:bold;">FOGO FÁTUO</span></div>
    <div style="font-size:11px; margin-top:8px; opacity:0.8;">
      • <b>Apertar Dial:</b> Pressione com a outra mão ou clique no botão.<br>
      • <b>Girar Alien:</b> Use as setas ou botões do painel.
    </div>
  </div>

  <div class="panel">
    <button class="btn" id="pop-btn" onclick="toggleOmnitrixPop()">POP-UP DIAL (ABRIR)</button>
    <button class="btn" onclick="nextAlien()">GIRAR ALIEN (PRÓXIMO)</button>
    <button class="btn btn-active" onclick="triggerTransform()">TRANSFORMAR!</button>
  </div>

  <script>
    // LISTA DOS 10 ALIENS EXATOS DO VÍDEO
    const ALIENS = [
      { name: "FOGO FÁTUO (Swampfire)", color: 0x00FF66, type: "plant" },
      { name: "MACACO ARANHA (Spidermonkey)", color: 0x00FF66, type: "monkey" },
      { name: "CROMADO (Chromastone)", color: 0x00FF66, type: "crystal" },
      { name: "FRIAGEM (Big Chill)", color: 0x00FF66, type: "wings" },
      { name: "ENORMOSSAURO (Humungousaur)", color: 0x00FF66, type: "giant" },
      { name: "JETRAY", color: 0x00FF66, type: "manta" },
      { name: "GOSMA (Goop)", color: 0x00FF66, type: "blob" },
      { name: "TEMPESTADE DE CÉREBROS (Brainstorm)", color: 0x00FF66, type: "crab" },
      { name: "ECO ECO (Echo Echo)", color: 0x00FF66, type: "small" },
      { name: "ALIEN X", color: 0x00FF66, type: "cosmic" }
    ];

    let currentAlienIdx = 0;
    let isPoppedUp = false;
    let scene, camera, renderer, omnitrixGroup, dialGroup, holoGroup;
    let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // SINTETIZADOR DE ÁUDIO DO OMNITRIX
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'pop') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
        gain.gain.setValueAtTime(0.4, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      } else if (type === 'turn') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
        osc.frequency.setValueAtTime(900, now + 0.05);
        gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      } else if (type === 'transform') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now);
        osc.frequency.linearRampToValueAtTime(1800, now + 0.8);
        gain.gain.setValueAtTime(0.6, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
      }
      osc.start(now); osc.stop(now + 0.8);
    }

    // CONSTRUÇÃO DO OMNITRIX 3D COMPLETO
    function init3D() {
      const canvas = document.getElementById('canvas3d');
      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 8);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dirLight = new THREE.DirectionalLight(0x00FF66, 1.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      omnitrixGroup = new THREE.Group();
      dialGroup = new THREE.Group();
      holoGroup = new THREE.Group();

      // 1. BRAÇADEIRA E BASE
      const strapMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
      const strapGeo = new THREE.CylinderGeometry(1.4, 1.4, 1.2, 32, 1, true);
      const strapMesh = new THREE.Mesh(strapGeo, strapMat);
      strapMesh.rotation.z = Math.PI / 2;
      omnitrixGroup.add(strapMesh);

      // CORPO DO DIAL (Cinza / Verde)
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
      const bodyGeo = new THREE.CylinderGeometry(1.2, 1.3, 0.4, 32);
      const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
      omnitrixGroup.add(bodyMesh);

      // 2. TAMPA POP-UP COM SÍMBOLO DO OMNITRIX
      const dialMat = new THREE.MeshStandardMaterial({ color: 0x00FF66, emissive: 0x00AA44, metalness: 0.5 });
      const dialBase = new THREE.Mesh(new THREE.CylinderGeometry(1.0, 1.0, 0.2, 32), bodyMat);
      
      // Símbolo da Ampulheta
      const symbolGeo = new THREE.ConeGeometry(0.6, 0.1, 4);
      const symbolMesh1 = new THREE.Mesh(symbolGeo, dialMat);
      const symbolMesh2 = new THREE.Mesh(symbolGeo, dialMat);
      symbolMesh1.rotation.y = Math.PI / 4;
      symbolMesh2.rotation.y = (Math.PI * 5) / 4;
      symbolMesh1.position.y = 0.11; symbolMesh2.position.y = 0.11;

      dialGroup.add(dialBase);
      dialGroup.add(symbolMesh1);
      dialGroup.add(symbolMesh2);
      dialGroup.position.y = 0.2;

      omnitrixGroup.add(dialGroup);
      dialGroup.add(holoGroup);
      scene.add(omnitrixGroup);

      renderHologramAlien();
      window.addEventListener('resize', onResize);
    }

    // DESENHO FIEL DAS SILHUETAS HOLOGRÁFICAS 3D DOS ALIENS
    function renderHologramAlien() {
      holoGroup.clear();
      if (!isPoppedUp) return;

      const current = ALIENS[currentAlienIdx];
      const mat = new THREE.MeshBasicMaterial({ color: 0x00FF66, wireframe: true, transparent: true, opacity: 0.8 });
      const alienMesh = new THREE.Group();

      // CONE DE LUZ HOLOGRÁFICA DO OMNITRIX
      const beamGeo = new THREE.CylinderGeometry(0.8, 0.2, 1.5, 16, 1, true);
      const beamMat = new THREE.MeshBasicMaterial({ color: 0x00FF66, transparent: true, opacity: 0.2, side: THREE.DoubleSide });
      const beam = new THREE.Mesh(beamGeo, beamMat);
      beam.position.y = 0.8;
      holoGroup.add(beam);

      // MONTAGEM DA ANATOMIA 3D BASEADA NO TIPO DE ALIEN
      if (current.type === "plant" || current.type === "giant") { // Swampfire / Humungousaur
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.2, 1.2, 8), mat);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), mat);
        head.position.y = 0.8;
        alienMesh.add(body, head);
      } else if (current.type === "wings") { // Friagem
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.1, 1.0, 8), mat);
        const wing1 = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.8), mat);
        const wing2 = wing1.clone();
        wing1.position.set(-0.6, 0.3, 0); wing2.position.set(0.6, 0.3, 0);
        alienMesh.add(body, wing1, wing2);
      } else { // Estrutura Genérica
        const body = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 2), mat);
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mat);
        head.position.y = 0.6;
        alienMesh.add(body, head);
      }

      alienMesh.position.y = 1.5;
      holoGroup.add(alienMesh);
      document.getElementById('alien-name').innerText = current.name;
    }

    // AÇÕES E INTERAÇÕES
    function toggleOmnitrixPop() {
      isPoppedUp = !isPoppedUp;
      playSound('pop');
      document.getElementById('pop-btn').innerText = isPoppedUp ? "FECHAR DIAL" : "POP-UP DIAL (ABRIR)";
      
      dialGroup.position.y = isPoppedUp ? 0.8 : 0.2;
      renderHologramAlien();
    }

    function nextAlien() {
      if (!isPoppedUp) toggleOmnitrixPop();
      currentAlienIdx = (currentAlienIdx + 1) % ALIENS.length;
      playSound('turn');
      dialGroup.rotation.y += Math.PI / 5;
      renderHologramAlien();
    }

    function triggerTransform() {
      playSound('transform');
      const flash = document.getElementById('transform-flash');
      flash.style.opacity = '0.95';
      setTimeout(() => flash.style.opacity = '0', 250);

      dialGroup.position.y = 0.2;
      isPoppedUp = false;
      holoGroup.clear();
      document.getElementById('pop-btn').innerText = "POP-UP DIAL (ABRIR)";
    }

    // FIXAÇÃO NO PULSO (RASTREAMENTO MEDIAPIPE)
    function initCamera() {
      const video = document.getElementById('webcam');
      const tag = document.getElementById('wrist-status');

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.6 });

      hands.onResults(results => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          tag.innerText = "OMNITRIX PRESO AO PULSO!";
          tag.style.color = "#00FF66";

          const wrist = results.multiHandLandmarks[0][0]; // Articulação do pulso
          omnitrixGroup.position.x = (0.5 - wrist.x) * 6;
          omnitrixGroup.position.y = (0.5 - wrist.y) * 4;
          omnitrixGroup.position.z = (wrist.z || 0) * 3;
        } else {
          tag.innerText = "Modo Livre (Posicione a Mão)";
          omnitrixGroup.position.set(0, 0, 0);
        }
      });

      const cam = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640, height: 480
      });
      cam.start();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (holoGroup.children.length > 0) {
        holoGroup.children[holoGroup.children.length - 1].rotation.y += 0.02;
      }
      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = () => {
      init3D();
      animate();
      initCamera();
    };
  </script>
</body>
</html>
