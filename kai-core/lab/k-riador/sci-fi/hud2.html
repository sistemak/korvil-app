    * {

    /* VISÃO INTERNA DO CAPACETE */
    .helmet-inner-frame{overflow:hidden;filter:drop-shadow(0 0 14px rgba(0,240,255,.12));}
    .helmet-top-glow{position:absolute;left:8%;right:8%;top:-3%;height:20%;border-top:3px solid rgba(0,240,255,.48);border-left:18px solid transparent;border-right:18px solid transparent;border-radius:50% 50% 0 0;box-shadow:0 -10px 35px rgba(0,240,255,.12),inset 0 8px 18px rgba(0,0,0,.8);}
    .helmet-left-shell,.helmet-right-shell{position:absolute;top:4%;bottom:7%;width:15%;background:linear-gradient(90deg,rgba(0,0,0,.98),rgba(2,18,27,.82),rgba(0,0,0,.35));border:1px solid rgba(0,240,255,.18);box-shadow:inset 0 0 45px rgba(0,0,0,.95);}
    .helmet-left-shell{left:-2%;clip-path:polygon(0 4%,72% 0,100% 13%,82% 38%,92% 67%,72% 91%,25% 100%,0 95%);border-right-color:rgba(0,240,255,.42);}
    .helmet-right-shell{right:-2%;transform:scaleX(-1);clip-path:polygon(0 4%,72% 0,100% 13%,82% 38%,92% 67%,72% 91%,25% 100%,0 95%);border-right-color:rgba(0,240,255,.42);}
    .helmet-chin-shell{position:absolute;left:12%;right:12%;bottom:-5%;height:19%;background:linear-gradient(to top,rgba(0,0,0,.99),rgba(2,16,24,.86),transparent);border-top:2px solid rgba(0,240,255,.28);border-radius:0 0 48% 48%;clip-path:polygon(0 35%,12% 8%,29% 0,71% 0,88% 8%,100% 35%,91% 100%,9% 100%);box-shadow:inset 0 18px 40px rgba(0,0,0,.9);}
    .helmet-visor-outline{position:absolute;left:7%;right:7%;top:3%;bottom:5%;border:1px solid rgba(0,240,255,.34);border-radius:48% 48% 24% 24% / 18% 18% 12% 12%;box-shadow:inset 0 0 25px rgba(0,240,255,.08),0 0 12px rgba(0,240,255,.08);}
    .helmet-tech{position:absolute;top:16%;font-size:7px;letter-spacing:.28em;color:rgba(0,240,255,.32);writing-mode:vertical-rl;} .helmet-tech-left{left:2.5%;transform:rotate(180deg);} .helmet-tech-right{right:2.5%;}
    .helmet-chin-label{position:absolute;bottom:2.2%;left:50%;transform:translateX(-50%);font-size:6px;letter-spacing:.38em;color:rgba(0,240,255,.24);white-space:nowrap;}
    @media(max-width:640px){.helmet-left-shell,.helmet-right-shell{width:19%;}.helmet-visor-outline{left:5%;right:5%;}.helmet-top-glow{left:5%;right:5%;}.helmet-chin-shell{left:8%;right:8%;}.helmet-tech{display:none;}}
</style>

  <!-- Visão computacional: reconhecimento facial, olhos e objetos -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</head>
<body class="bg-black text-cyan-400 overflow-hidden select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function JarvisHUD() {
      // Estados do Sistema
      const [bootStep, setBootStep] = useState(0);
      const [power, setPower] = useState(88);
      const [altitude, setAltitude] = useState(85000);
      const [coreTemp, setCoreTemp] = useState(74);
      const [thrusterOutput, setThrusterOutput] = useState(92);
      const [chestIntegrity, setChestIntegrity] = useState(98);
      
      const [aimPos, setAimPos] = useState({ x: 50, y: 45 });
      const [faceBox, setFaceBox] = useState({ x: 50, y: 42, w: 24, h: 30, locked: false });
      const [flightEngaged, setFlightEngaged] = useState(false);
      const [camOffline, setCamOffline] = useState(false);

      const [commandLog, setCommandLog] = useState("INICIALIZANDO SUBSISTEMAS DA ARMADURA...");
      const videoRef = useRef(null);
      const faceMeshRef = useRef(null);
      const visionTimerRef = useRef(null);
      const objectModelRef = useRef(null);
      const lastEyeStateRef = useRef({ right:true, left:true });
      const blinkStartedAtRef = useRef({ right:0, left:0 });
      const blinkHandledRef = useRef({ right:false, left:false });
      const blinkCooldownRef = useRef(0);
      const faceDetectedRef = useRef(false);
      const recognitionRef = useRef(null);
      const aimActiveRef = useRef(false);
      const prioritiesRef = useRef([]);
      const selectedPriorityRef = useRef(0);
      const [faceDetected, setFaceDetected] = useState(false);
      const [aimActive, setAimActive] = useState(false);
      const [isScanning, setIsScanning] = useState(false);
      const [scanResults, setScanResults] = useState([]);
      const [priorities, setPriorities] = useState([]);
      const [selectedPriority, setSelectedPriority] = useState(0);
      const [voiceStatus, setVoiceStatus] = useState('AGUARDANDO COMANDO OCULAR');
      useEffect(() => { aimActiveRef.current = aimActive; }, [aimActive]);
      useEffect(() => { prioritiesRef.current = priorities; }, [priorities]);
      useEffect(() => { selectedPriorityRef.current = selectedPriority; }, [selectedPriority]);
      useEffect(() => { faceDetectedRef.current = faceDetected; }, [faceDetected]);

      // ==================== RECONHECIMENTO FACIAL + GESTOS OCULARES ====================
      const speak = (text) => {
        try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang='pt-BR'; u.rate=.95; window.speechSynthesis.speak(u); } catch(e) {}
      };

      const startVoiceChoice = () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { setVoiceStatus('VOZ NÃO DISPONÍVEL'); return; }
        try {
          if (recognitionRef.current) recognitionRef.current.abort();
          const r = new SR(); recognitionRef.current = r; r.lang='pt-BR'; r.continuous=false; r.interimResults=false;
          r.onstart=()=>setVoiceStatus('OUVINDO // DIGA OPÇÃO 1, 2 OU 3');
          r.onresult=(e)=>{
            const t=(e.results?.[0]?.[0]?.transcript||'').toLowerCase(); let n=-1;
            if (/\b(1|um|uma|primeira|primeiro)\b/.test(t)) n=0;
            else if (/\b(2|dois|duas|segunda|segundo)\b/.test(t)) n=1;
            else if (/\b(3|três|tres|terceira|terceiro)\b/.test(t)) n=2;
            if(n>=0 && prioritiesRef.current[n]) { setSelectedPriority(n); speak(`Opção ${n+1}: ${prioritiesRef.current[n].title}`); setVoiceStatus(`OPÇÃO ${n+1} SELECIONADA`); }
          };
          r.onend=()=>setVoiceStatus('OPÇÃO SELECIONADA // PISQUE OS DOIS OLHOS PARA EXECUTAR'); r.start();
        } catch(e) { setVoiceStatus('MICROFONE OCUPADO // USE O GESTO DOS DOIS OLHOS'); }
      };

      const executePriority = (p) => {
        if(!p) return; const n=selectedPriorityRef.current+1;
        setCommandLog(`EXECUTANDO OPÇÃO ${n}: ${p.title.toUpperCase()}`); speak(`Executando opção ${n}. ${p.title}.`); setVoiceStatus(`EXECUTANDO // ${p.title.toUpperCase()}`);
        if(p.action==='person') setCommandLog('ACOMPANHAMENTO VISUAL DA PESSOA DETECTADA ATIVADO');
        else if(p.action==='details') setCommandLog('ANÁLISE DETALHADA DO AMBIENTE ATIVADA');
        else setCommandLog('REGISTRO VISUAL DO AMBIENTE ATIVADO');
      };

      const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
      // EAR robusto: cada olho é medido independentemente e calibrado para a câmera.
      const eyeEAR=(lm,p1,p2,p3,p4,p5,p6)=>{
        const vertical=(dist(lm[p3],lm[p4])+dist(lm[p5],lm[p6]))/2;
        const horizontal=Math.max(dist(lm[p1],lm[p2]),0.001);
        return vertical/horizontal;
      };

      const runEnvironmentScan = async () => {
        if(isScanning) return; setIsScanning(true); setCommandLog('SCAN OCULAR ATIVADO // ANALISANDO AMBIENTE...'); setVoiceStatus('ESCANEANDO AMBIENTE'); speak('Iniciando escaneamento do ambiente.');
        let detections=[];
        try {
          if(!objectModelRef.current && window.cocoSsd) objectModelRef.current=await window.cocoSsd.load();
          if(objectModelRef.current && videoRef.current) detections=await objectModelRef.current.detect(videoRef.current,20,.35);
        } catch(e) { console.warn('Scanner:',e); }
        const mapped=detections.map((d,i)=>({id:i+1,className:d.class,score:Math.round(d.score*100),description:d.class==='person'?'Pessoa detectada no campo visual.':['dog','cat','bird','horse','sheep','cow'].includes(d.class)?`Animal detectado: ${d.class}.`:`Objeto detectado: ${d.class}.`,box:d.bbox}));
        if(faceDetectedRef.current && !mapped.some(x=>x.className==='person')) mapped.unshift({id:1,className:'person',score:94,description:'Pessoa detectada e rosto localizado pela visão computacional.'});
        if(!mapped.length) mapped.push({id:1,className:'environment',score:72,description:'Ambiente visível, sem objeto reconhecido com confiança suficiente.'});
        setScanResults(mapped.slice(0,12));
        const hasPerson=mapped.some(x=>x.className==='person'), animals=mapped.filter(x=>['dog','cat','bird','horse','sheep','cow'].includes(x.className)), objects=mapped.filter(x=>x.className!=='person'&&x.className!=='environment'&&!animals.includes(x));
        const p=[hasPerson?{title:'Avaliar pessoa detectada',detail:'Manter o rosto no campo visual e acompanhar a situação.',action:'person'}:null,animals.length?{title:'Verificar animal detectado',detail:`Há ${animals.length} animal(is) no campo visual.`,action:'details'}:null,objects.length?{title:'Analisar objetos do ambiente',detail:`Foram identificados ${objects.length} objeto(s) com confiança suficiente.`,action:'details'}:null,{title:'Registrar panorama do ambiente',detail:'Conservar o estado atual para análise visual.',action:'record'}].filter(Boolean).slice(0,3);
        setPriorities(p); setSelectedPriority(0); setIsScanning(false); setVoiceStatus('O QUE QUER FAZER, SENHOR?'); setCommandLog('SCAN CONCLUÍDO // 3 PRIORIDADES GERADAS // AGUARDANDO ESCOLHA'); speak('O que quer fazer, senhor.'); setTimeout(startVoiceChoice,700);
      };

      // Reconhecimento contínuo do rosto + detecção de piscadas.
      // O visor é espelhado, portanto o X do rosto também é espelhado.
      useEffect(() => {
        let cancelled=false;
        if(!window.FaceMesh) return;
        const mesh=new window.FaceMesh({locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
        mesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:.55,minTrackingConfidence:.55});
        mesh.onResults(results=>{
          if(cancelled) return;
          const face=results.multiFaceLandmarks?.[0];
          if(!face){
            setFaceDetected(false);
            setFaceBox(prev=>({...prev,locked:false}));
            lastEyeStateRef.current={right:true,left:true};
            return;
          }
          setFaceDetected(true);
          faceDetectedRef.current=true;

          const xs=face.map(p=>p.x), ys=face.map(p=>p.y);
          const minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
          const cx=(minX+maxX)/2, cy=(minY+maxY)/2;
          const fw=Math.min(50,Math.max(18,(maxX-minX)*100*1.45));
          const fh=Math.min(58,Math.max(24,(maxY-minY)*100*1.45));

          // O vídeo está scaleX(-1), então o quadro precisa acompanhar a imagem espelhada.
          setFaceBox({x:(1-cx)*100,y:cy*100,w:fw,h:fh,locked:true});
          setAimPos({x:(1-cx)*100,y:cy*100});

          // Landmarks MediaPipe: olho direito da pessoa e olho esquerdo da pessoa.
          const rightEAR=eyeEAR(face,33,133,159,145,158,153);
          const leftEAR =eyeEAR(face,362,263,386,374,385,380);
          // Threshold mais tolerante para webcam: aberto ~0.25-0.35, fechado geralmente <0.20-0.22.
          const rightClosed=rightEAR<0.205;
          const leftClosed=leftEAR<0.205;
          const now=performance.now();
          const wasRightOpen=lastEyeStateRef.current.right;
          const wasLeftOpen=lastEyeStateRef.current.left;

          // Inicia o evento no fechamento e confirma ao reabrir o olho.
          if(rightClosed && wasRightOpen){ blinkStartedAtRef.current.right=now; blinkHandledRef.current.right=false; }
          if(leftClosed && wasLeftOpen){ blinkStartedAtRef.current.left=now; blinkHandledRef.current.left=false; }

          const rightReleased=!rightClosed && !blinkHandledRef.current.right && blinkStartedAtRef.current.right>0;
          const leftReleased =!leftClosed  && !blinkHandledRef.current.left  && blinkStartedAtRef.current.left>0;

          if(rightReleased){
            const duration=now-blinkStartedAtRef.current.right;
            if(duration>=45 && duration<=650 && now-blinkCooldownRef.current>350){
              blinkHandledRef.current.right=true; blinkCooldownRef.current=now;
              // Se os dois olhos também estavam fechados neste ciclo, o evento duplo será tratado pelo olho esquerdo.
              if(!leftClosed){
                setAimActive(prev=>{
                  const next=!prev; aimActiveRef.current=next;
                  setCommandLog(next?'MIRA OCULAR DIREITA ATIVADA // TRAVA NO ROSTO':'MIRA OCULAR DIREITA DESATIVADA');
                  speak(next?'Mira ativada, senhor.':'Mira desativada, senhor.');
                  return next;
                });
              }
            }
            blinkStartedAtRef.current.right=0;
          }

          if(leftReleased){
            const duration=now-blinkStartedAtRef.current.left;
            if(duration>=45 && duration<=650 && now-blinkCooldownRef.current>350){
              blinkHandledRef.current.left=true; blinkCooldownRef.current=now;
              if(!rightClosed){
                if(aimActiveRef.current) runEnvironmentScan();
                else {setCommandLog('OLHO ESQUERDO DETECTADO // ATIVE A MIRA COM O OLHO DIREITO'); speak('Ative a mira primeiro com o olho direito.');}
              }
            }
            blinkStartedAtRef.current.left=0;
          }

          // Piscada dos dois olhos: detecta o fechamento simultâneo e executa a prioridade escolhida.
          if(rightClosed && leftClosed && wasRightOpen && wasLeftOpen && now-blinkCooldownRef.current>500){
            blinkCooldownRef.current=now;
            blinkHandledRef.current={right:true,left:true};
            blinkStartedAtRef.current={right:0,left:0};
            if(aimActiveRef.current && prioritiesRef.current.length){
              executePriority(prioritiesRef.current[selectedPriorityRef.current] || prioritiesRef.current[0]);
            } else {
              setCommandLog('PISCADA DUPLA DETECTADA // NENHUMA OPÇÃO PRONTA PARA EXECUÇÃO');
              speak('Nenhuma opção pronta para execução, senhor.');
            }
          }

          lastEyeStateRef.current={right:!rightClosed,left:!leftClosed};
        });
        faceMeshRef.current=mesh;
        const timer=setInterval(async()=>{
          const v=videoRef.current;
          if(v&&v.readyState>=2){try{await mesh.send({image:v});}catch(e){}}
        },70);
        visionTimerRef.current=timer;
        return()=>{cancelled=true;clearInterval(timer);try{mesh.close();}catch(e){}};
      },[]);

      // Sequência de Inicialização (Boot)
      useEffect(() => {
        const bootTimers = [
          setTimeout(() => setBootStep(1), 600),
          setTimeout(() => setBootStep(2), 1200),
          setTimeout(() => setBootStep(3), 1800),
          setTimeout(() => setBootStep(4), 2400),
          setTimeout(() => {
            setBootStep(5);
            setCommandLog("BEM-VINDO, SENHOR. TODOS OS SISTEMAS MARK 42 ESTÃO OPERACIONAIS.");
          }, 3000)
        ];

        return () => bootTimers.forEach(clearTimeout);
      }, []);

      // Inicialização da Câmera (Com Fallback para Módulo Grid)
      useEffect(() => {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                videoRef.current.onloadedmetadata=()=>{ videoRef.current.play().catch(()=>{}); setCommandLog('CÂMERA ONLINE // PROCURANDO ROSTO AUTOMATICAMENTE...'); };
              }
            })
            .catch(() => {
              setCamOffline(true);
            });
        } else {
          setCamOffline(true);
        }
      }, []);

      // Simulação Telemétrica Contínua
      useEffect(() => {
        if (bootStep < 5) return;

        const interval = setInterval(() => {
          setAltitude(prev => Math.max(1000, prev + (flightEngaged ? 120 : (Math.random() * 40 - 20))));
          setCoreTemp(prev => Math.min(100, Math.max(50, prev + (flightEngaged ? 0.8 : (Math.random() * 2 - 1)))));
          setPower(prev => Math.max(5, prev - (flightEngaged ? 0.05 : 0.01)));

          // Leve oscilação natural na mira
          setAimPos(prev => ({
            x: Math.min(80, Math.max(20, prev.x + (Math.random() * 2 - 1))),
            y: Math.min(80, Math.max(20, prev.y + (Math.random() * 2 - 1)))
          }));
        }, 300);

        return () => clearInterval(interval);
      }, [bootStep, flightEngaged]);

      // Alternar Modo de Voo / Pós-Combustor
      const toggleFlight = () => {
        setFlightEngaged(prev => {
          const next = !prev;
          if (next) {
            setCommandLog("PÓS-COMBUSTOR ENGAJADO // MÓDULO DE VOO EM ALTA ALTITUDE ATIVO");
            setThrusterOutput(100);
          } else {
            setCommandLog("ESTABILIZADORES REATIVADOS // RETORNANDO AO VOO DE CRUZEIRO");
            setThrusterOutput(92);
          }
          return next;
        });
      };

      return (
        <div className="relative w-screen h-screen bg-black overflow-hidden font-mono">
          
          {/* Feed da Câmera Principal */}
          <video 
            ref={videoRef}
            autoPlay 
            muted 
            playsInline 
            className="absolute inset-0 w-full h-full object-cover"
            style={{ transform: 'scaleX(-1)', filter: 'contrast(1.15) brightness(0.9) saturate(0.9)' }}
          />

          {/* Grid de Substituição caso a Câmera esteja Offline */}
          {camOffline && (
            <div className="absolute inset-0 bg-[#020a12]">
              <div 
                className="absolute inset-0 opacity-[0.15]"
                style={{
                  backgroundImage: 'linear-gradient(rgba(0,229,255,0.3) 1px, transparent 1px), linear-gradient(90deg, rgba(0,229,255,0.3) 1px, transparent 1px)',
                  backgroundSize: '40px 40px'
                }}
              />
              <div className="absolute inset-0 flex items-center justify-center">
                <span className="text-cyan-400/40 text-xs tracking-[0.4em]">
                  FEED DE CÂMERA OFFLINE // MODO DE GRADE ATIVO
                </span>
              </div>
            </div>
          )}

          {/* Efeitos de Lente e Vignette HUD */}
          <div className="absolute inset-0 pointer-events-none z-[15]">
            <div className="absolute inset-0" style={{ background: 'radial-gradient(ellipse at center, transparent 34%, rgba(0,0,0,0.18) 58%, rgba(0,0,0,0.78) 82%, rgba(0,0,0,0.98) 100%)' }} />
            <div className="helmet-inner-frame absolute inset-0">
              <div className="helmet-top-glow" />
              <div className="helmet-left-shell" />
              <div className="helmet-right-shell" />
              <div className="helmet-chin-shell" />
              <div className="helmet-visor-outline" />
              <div className="helmet-tech helmet-tech-left">HELMET // L</div>
              <div className="helmet-tech helmet-tech-right">R // HELMET</div>
              <div className="helmet-chin-label">VISOR INTERNO • MARK 42</div>
            </div>
          </div>

          {/* Linha de Varredura Sweep */}
          <div 
            className="absolute left-0 right-0 h-[2px] bg-cyan-400/20 pointer-events-none z-20 top-1/2 mix-blend-screen opacity-60"
            style={{ animation: 'scanSweep 4s linear infinite' }}
          />

                <span className="text-[10px] md:text-xs text-cyan-200 tracking-wide min-h-[1.2em]">
                  {commandLog}
                  <span className="ml-1 inline-block w-[8px] h-[12px] bg-cyan-300 align-middle" style={{ animation: 'blink 1s infinite' }} />
                </span>
              </div>
            </div>

            {/* Botoeira Central de Ação */}
            <div className="flex justify-center items-end gap-3 md:gap-6 pb-3 md:pb-4 px-3">
              <div className="hidden md:flex items-center gap-2 text-[7px] text-white/30">
                <div className="w-16 h-[2px] bg-white/10">
                  <div className="h-full bg-cyan-400" style={{ width: `${thrusterOutput}%` }} />
                </div>
                <span>ESTABILIZADORES</span>
              </div>

              <button 
                onClick={toggleFlight}
                className={`pointer-events-auto relative px-6 md:px-10 py-2.5 md:py-3 border text-[11px] md:text-[13px] tracking-[0.35em] transition-all duration-300 ${
                  flightEngaged 
                    ? "bg-orange-500 text-black border-orange-300 shadow-[0_0_30px_rgba(255,140,0,0.8)]" 
                    : "bg-black/60 text-cyan-300 border-cyan-400/60 hover:bg-cyan-950/40 hover:shadow-[0_0_24px_rgba(0,240,255,0.5)] backdrop-blur"
                }`}
              >
                <span className="relative z-10">
                  {flightEngaged ? "VOO ENGAJADO // 85K FT" : "ENGAJAR VOO"}
                </span>
                <div 
                  className="absolute inset-0 border border-cyan-400/20 pointer-events-none"
                  style={{ clipPath: 'polygon(8% 0, 100% 0, 92% 100%, 0 100%)' }}
                />
              </button>

              <div className="hidden md:flex items-center gap-2 text-[7px] text-white/30">
                <span>ENERGIA</span>
                <div className="w-16 h-[2px] bg-white/10">
                  <div className="h-full bg-orange-400" style={{ width: `${power}%` }} />
                </div>
              </div>
            </div>

          </div>

          {/* Efeito Visual do Pós-Combustor em Voo */}
          {flightEngaged && (
            <div 
              className="absolute inset-0 z-30 pointer-events-none border-[3px] border-orange-400/50"
              style={{ boxShadow: 'inset 0 0 120px rgba(255,140,0,0.35)', animation: 'flicker 0.15s infinite' }}
            >
              <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-orange-300 text-[12px] tracking-[0.6em] border border-orange-400 px-4 py-2 bg-black/60">
                PÓS-COMBUSTOR ATIVO
              </div>
            </div>
          )}

          {/* Grão de Ruído de Fundo */}
          <div 
            className="absolute inset-0 pointer-events-none opacity-[0.06] mix-blend-overlay"
            style={{
              backgroundImage: `url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E")`
            }}
          />

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <React.StrictMode>
        <JarvisHUD />
      </React.StrictMode>
    );
  </script>
</body>
</html>
