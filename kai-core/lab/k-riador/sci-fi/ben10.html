
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Omnitrix 3D / AR Interactive - Aliens & Efeitos</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* Vídeo da câmera (espelhado) */
    #webcam {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }
    /* Canvas 3D para Three.js */
    #canvas3d {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
    }
    /* Flash de Transformação */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #00ff66;
      opacity: 0;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
    }
    /* Overlay UI */
    #ui-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 3;
      color: #00ff66;
      text-shadow: 0 0 10px #00ff66;
      font-size: 15px;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #00ff66;
      max-width: 320px;
    }
    #info-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 3;
      color: #00ff66;
      background: rgba(0, 20, 5, 0.9);
      border: 2px solid #00ff66;
      box-shadow: 0 0 20px #00ff66;
      padding: 20px;
      border-radius: 12px;
      width: 260px;
      display: none;
      text-align: center;
    }
    #info-panel h2 {
      margin: 10px 0 5px 0;
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #003311;
      border-radius: 4px;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

<div id="container">
  <video id="webcam" autoplay playsinline></video>
  <canvas id="canvas3d"></canvas>
  <div id="flash-overlay"></div>

  <div id="ui-overlay">
    <div style="font-size: 18px; font-weight: bold; margin-bottom: 5px;">OMNITRIX OS v4.0</div>
    <div>Status: <span id="status-text" class="status-badge">Aguardando Mão...</span></div>
    <hr style="border-color: #00ff66; margin: 10px 0;">
    <small>
      • <b>Modo Livre:</b> Giro 360° no centro.<br>
      • <b>Aproximar Pulso:</b> Trava no pulso.<br>
      • <b>Mão de Ação (Indicador):</b><br>
        - 2x Toque no botão lateral: Abre Holograma.<br>
        - Mover horizontalmente: Girar Carrossel.<br>
        - 2x Toque no Alien: <b>Transformação!</b>
    </small>
  </div>

  <div id="info-panel">
    <div style="font-size: 12px; color: #88ffaa;">ALIEN SELECIONADO</div>
    <h2 id="shape-title">NENHUM</h2>
    <div id="alien-desc" style="font-size: 12px; color: #aaffcc; margin-bottom: 10px;"></div>
    <div id="shape-preview" style="width: 100%; height: 120px;"></div>
  </div>
</div>

<script>
  // --- BANCO DE DADOS DOS 10 ALIENS ---
  const ALIENS_DATA = [
    { name: "Chama", desc: "Controle de Fogo e Calor Pyronita", type: "chama" },
    { name: "XLR8", desc: "Velocidade Supersônica Kinecelereano", type: "xlr8" },
    { name: "Quatro Braços", desc: "Força Bruta e Resistência Tetramand", type: "quatrobracos" },
    { name: "Diamante", desc: "Manipulação de Cristal Petrosettita", type: "diamante" },
    { name: "Insectóide", desc: "Voo Agil e Jatos de Ácido Lepidoptero", type: "insectoide" },
    { name: "Massa Cinzenta", desc: "Super Inteligência Galvânica", type: "massacinzenta" },
    { name: "Ultra T", desc: "Tecnopatia e Fusão Tecnológica", type: "ultrat" },
    { name: "Bala de Canhão", desc: "Blindagem e Esfera de Impacto", type: "baladecanhao" },
    { name: "Aquático", desc: "Natação de Alta Velocidade e Dentes Afiados", type: "aquatico" },
    { name: "Fantasmático", desc: "Invisibilidade e Intangibilidade", type: "fantasmatico" }
  ];

  // --- SINTETIZADOR DE ÁUDIO (Web Audio API - Sem necessidade de arquivos externos) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'beep') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now);
      osc.stop(now + 0.08);
    } else if (type === 'open') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(900, now + 0.25);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'transform') {
      // Som explosivo de transformação
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(600, now + 0.1);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.6);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.6);
      osc.start(now);
      osc.stop(now + 0.6);
    }
  }

  // --- VARIÁVEIS GLOBAIS ---
  let scene, camera, renderer;
  let omnitrixGroup, coreDial, mainButton;
  let holoGroup, holoCarousel, holoItems = [];
  let pointerHoloMesh;
  let attachedToWrist = false;
  
  let isHoloOpen = false;
  let currentCarouselIndex = 0;
  let targetCarouselRotation = 0;
  let lastTouchTime = 0;
  let dragStartX = null;

  let wristHand = null;
  let actionHand = null;

  // --- INICIALIZAÇÃO THREE.JS ---
  function init3D() {
    const canvas = document.getElementById('canvas3d');
    renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0x00ff66, 1.8);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    buildOmnitrix();
    buildPointer();

    window.addEventListener('resize', onWindowResize);
  }

  // --- MODELAGEM DO OMNITRIX ---
  function buildOmnitrix() {
    omnitrixGroup = new THREE.Group();

    const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.8 });
    const greyMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.2, metalness: 0.9 });
    const greenGlowMat = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
    const holoMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true, transparent: true, opacity: 0.7 });

    // Pulseira Base
    const bandGeo = new THREE.CylinderGeometry(1.2, 1.2, 1.4, 32, 1, true);
    const band = new THREE.Mesh(bandGeo, blackMat);
    band.rotation.x = Math.PI / 2;
    omnitrixGroup.add(band);

    // Anel Prata Exterior
    const rimGeo = new THREE.CylinderGeometry(1.4, 1.4, 0.4, 32);
    const rim = new THREE.Mesh(rimGeo, greyMat);
    rim.rotation.x = Math.PI / 2;
    omnitrixGroup.add(rim);

    // Núcleo Central
    coreDial = new THREE.Group();
    const coreBaseGeo = new THREE.CylinderGeometry(1.1, 1.1, 0.5, 32);
    const coreBase = new THREE.Mesh(coreBaseGeo, blackMat);
    coreBase.rotation.x = Math.PI / 2;
    coreDial.add(coreBase);

    // Símbolo Clássico da Ampulheta
    const shape = new THREE.Shape();
    shape.moveTo(-0.6, -0.6);
    shape.lineTo(0.6, 0.6);
    shape.lineTo(-0.6, 0.6);
    shape.lineTo(0.6, -0.6);
    shape.closePath();

    const extrudeSettings = { depth: 0.1, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
    const hourglassGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    const hourglass = new THREE.Mesh(hourglassGeo, greenGlowMat);
    hourglass.position.z = 0.26;
    coreDial.add(hourglass);

    // Botão de Ativação
    const btnGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
    mainButton = new THREE.Mesh(btnGeo, greenGlowMat);
    mainButton.position.set(1.1, 0, 0);
    mainButton.rotation.z = -Math.PI / 2;
    omnitrixGroup.add(mainButton);

    omnitrixGroup.add(coreDial);

    // --- CARROSSEL HOLOGRÁFICO DOS ALIENS ---
    holoGroup = new THREE.Group();
    holoGroup.position.set(0, 0, 1.5);
    holoGroup.visible = false;

    holoCarousel = new THREE.Group();
    holoGroup.add(holoCarousel);

    const radius = 2.8;
    ALIENS_DATA.forEach((alien, i) => {
      const angle = (i / ALIENS_DATA.length) * Math.PI * 2;
      const alienMesh = createAlien3DModel(alien.type, holoMat);

      const itemGroup = new THREE.Group();
      itemGroup.position.x = Math.sin(angle) * radius;
      itemGroup.position.z = Math.cos(angle) * radius;
      itemGroup.add(alienMesh);

      itemGroup.userData = { index: i, name: alien.name, desc: alien.desc, type: alien.type };
      holoCarousel.add(itemGroup);
      holoItems.push(itemGroup);
    });

    omnitrixGroup.add(holoGroup);
    omnitrixGroup.scale.set(0.8, 0.8, 0.8);
    scene.add(omnitrixGroup);
  }

  // --- GERADOR DE MODELOS/SILHUETAS HOLOGRÁFICAS 3D DOS ALIENS ---
  function createAlien3DModel(type, material) {
    const group = new THREE.Group();

    switch(type) {
      case 'chama': // Chamas/Picos
        const headC = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 5), material);
        headC.position.y = 0.2;
        group.add(headC);
        break;
      case 'xlr8': // Cabeça em ponta aerodinâmica
        const helmet = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.9, 4), material);
        helmet.rotation.z = -Math.PI / 3;
        group.add(helmet);
        break;
      case 'quatrobracos': // Ombro largo + 4 braços geométricos
        const bodyQ = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.5, 0.3), material);
        const arm1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.6, 0.2), material);
        arm1.position.set(0.5, 0.2, 0);
        const arm2 = arm1.clone(); arm2.position.set(-0.5, 0.2, 0);
        const arm3 = arm1.clone(); arm3.position.set(0.5, -0.2, 0);
        const arm4 = arm1.clone(); arm4.position.set(-0.5, -0.2, 0);
        group.add(bodyQ, arm1, arm2, arm3, arm4);
        break;
      case 'diamante': // Estrutura de Cristal Aguda
        const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.5, 0), material);
        crystal.scale.set(0.6, 1.2, 0.6);
        group.add(crystal);
        break;
      case 'insectoide': // Corpo + Asas Holográficas
        const bodyI = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.2, 0.7), material);
        const wing1 = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.3), material);
        wing1.position.set(0.3, 0.2, 0);
        const wing2 = wing1.clone(); wing2.position.set(-0.3, 0.2, 0);
        group.add(bodyI, wing1, wing2);
        break;
      case 'massacinzenta': // Estrutura Pequena Humanoide
        const smallHead = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), material);
        const smallBody = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.3), material);
        smallBody.position.y = -0.25;
        group.add(smallHead, smallBody);
        break;
      case 'ultrat': // Formas Circuitos / Toros Flutuantes
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.08, 8, 16), material);
        const coreU = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), material);
        group.add(ring, coreU);
        break;
      case 'baladecanhao': // Esfera de Blindagem Segura
        const ball = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), material);
        group.add(ball);
        break;
      case 'aquatico': // Cauda/Silhueta de Barbatana
        const headA = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.8, 6), material);
        headA.rotation.x = Math.PI;
        group.add(headA);
        break;
      case 'fantasmatico': // Forma Fluida Flutuante
        const ghost = new THREE.Mesh(new THREE.DodecahedronGeometry(0.4, 1), material);
        ghost.scale.set(0.7, 1.1, 0.7);
        group.add(ghost);
        break;
    }
    return group;
  }

  function buildPointer() {
    const geo = new THREE.SphereGeometry(0.15, 16, 16);
    const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff, wireframe: true, transparent: true, opacity: 0.8 });
    pointerHoloMesh = new THREE.Mesh(geo, mat);
    pointerHoloMesh.visible = false;
    scene.add(pointerHoloMesh);
  }

  function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  // --- ANIMAÇÃO CONTÍNUA ---
  function animate() {
    requestAnimationFrame(animate);

    if (!attachedToWrist) {
      omnitrixGroup.position.set(0, 0, 0);
      omnitrixGroup.rotation.y += 0.01;
      omnitrixGroup.rotation.x = Math.sin(Date.now() * 0.001) * 0.2;
    }

    if (isHoloOpen) {
      holoCarousel.rotation.y += (targetCarouselRotation - holoCarousel.rotation.y) * 0.1;
      holoItems.forEach(item => {
        item.children[0].rotation.y += 0.02;
      });
    }

    renderer.render(scene, camera);
  }

  // --- PROCESSAMENTO DA CÂMERA E MÃOS ---
  function onResults(results) {
    const statusText = document.getElementById('status-text');

    if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
      attachedToWrist = false;
      pointerHoloMesh.visible = false;
      statusText.innerText = "Giro Livre (360°)";
      statusText.style.color = "#00ff66";
      return;
    }

    wristHand = null;
    actionHand = null;

    if (results.multiHandLandmarks.length === 1) {
      wristHand = results.multiHandLandmarks[0];
    } else if (results.multiHandLandmarks.length >= 2) {
      wristHand = results.multiHandLandmarks[0];
      actionHand = results.multiHandLandmarks[1];
    }

    // 1. Acoplar e Rastrear o Pulso
    if (wristHand) {
      attachedToWrist = true;
      statusText.innerText = "Fixado no Pulso";
      statusText.style.color = "#00ffff";

      const wrist = wristHand[0];
      const vector = new THREE.Vector3(
        (1 - wrist.x) * 2 - 1,
        -(wrist.y * 2 - 1),
        0.5
      );
      vector.unproject(camera);
      const dir = vector.sub(camera.position).normalize();
      const pos = camera.position.clone().add(dir.multiplyScalar(8));

      omnitrixGroup.position.copy(pos);

      const middleFinger = wristHand[9];
      const dx = (1 - middleFinger.x) - (1 - wrist.x);
      const dy = -(middleFinger.y - wrist.y);
      const angle = Math.atan2(dy, dx);

      omnitrixGroup.rotation.set(0, 0, angle - Math.PI / 2);
    }

    // 2. Ponteiro e Comandos de Gestos
    if (actionHand) {
      const indexTip = actionHand[8];
      const pointerVec = new THREE.Vector3(
        (1 - indexTip.x) * 2 - 1,
        -(indexTip.y * 2 - 1),
        0.5
      );
      pointerVec.unproject(camera);
      const dir = pointerVec.sub(camera.position).normalize();
      const pointerPos = camera.position.clone().add(dir.multiplyScalar(7.5));

      pointerHoloMesh.position.copy(pointerPos);
      pointerHoloMesh.visible = true;

      checkGestures(pointerPos, indexTip);
    } else {
      pointerHoloMesh.visible = false;
      dragStartX = null;
    }
  }

  // --- RECONHECIMENTO DE GESTOS E CLIQUES ---
  function checkGestures(pointerPos, rawIndexLandmark) {
    const now = Date.now();

    // Clique no Botão do Relógio
    const btnWorldPos = new THREE.Vector3();
    mainButton.getWorldPosition(btnWorldPos);
    
    if (pointerPos.distanceTo(btnWorldPos) < 0.8) {
      if (now - lastTouchTime < 400 && now - lastTouchTime > 100) {
        toggleHologram();
        lastTouchTime = 0;
      } else if (now - lastTouchTime >= 400) {
        lastTouchTime = now;
      }
      return;
    }

    // Interações Holográficas
    if (isHoloOpen) {
      // Arraste Lateral para Navegação
      const currentX = 1 - rawIndexLandmark.x;
      if (dragStartX === null) {
        dragStartX = currentX;
      } else {
        const deltaX = currentX - dragStartX;
        if (Math.abs(deltaX) > 0.05) {
          if (deltaX > 0) {
            rotateCarousel(-1);
          } else {
            rotateCarousel(1);
          }
          playSound('beep');
          dragStartX = currentX;
        }
      }

      // Duplo Clique para Selecionar / Transformar
      const holoWorldPos = new THREE.Vector3();
      holoGroup.getWorldPosition(holoWorldPos);

      if (pointerPos.distanceTo(holoWorldPos) < 1.2) {
        if (now - lastTouchTime < 400 && now - lastTouchTime > 100) {
          triggerTransformation();
          lastTouchTime = 0;
        } else if (now - lastTouchTime >= 400) {
          lastTouchTime = now;
        }
      }
    }
  }

  function toggleHologram() {
    isHoloOpen = !isHoloOpen;
    holoGroup.visible = isHoloOpen;
    playSound('open');
    
    if (isHoloOpen) {
      holoGroup.scale.set(0.01, 0.01, 0.01);
      let s = 0.01;
      const interval = setInterval(() => {
        s += 0.1;
        holoGroup.scale.set(s, s, s);
        if (s >= 1) clearInterval(interval);
      }, 16);
    }
  }

  function rotateCarousel(dir) {
    currentCarouselIndex = (currentCarouselIndex + dir + ALIENS_DATA.length) % ALIENS_DATA.length;
    targetCarouselRotation = -(currentCarouselIndex / ALIENS_DATA.length) * Math.PI * 2;
  }

  // --- TRANSFORMAÇÃO E EFEITOS VISUAIS EM TELA CHEIA ---
  function triggerTransformation() {
    const selected = ALIENS_DATA[currentCarouselIndex];
    
    // 1. Som de Transformação
    playSound('transform');

    // 2. Flash Verde de Tela Cheia
    const flash = document.getElementById('flash-overlay');
    flash.style.opacity = '0.9';
    setTimeout(() => {
      flash.style.opacity = '0';
    }, 300);

    // 3. Atualiza Painel do Alien Selecionado
    const panel = document.getElementById('info-panel');
    const title = document.getElementById('shape-title');
    const desc = document.getElementById('alien-desc');
    const preview = document.getElementById('shape-preview');

    panel.style.display = 'block';
    title.innerText = selected.name;
    desc.innerText = selected.desc;

    // Renderiza Prévia 3D do Alien na Interface
    preview.innerHTML = '';
    const miniScene = new THREE.Scene();
    const miniCam = new THREE.PerspectiveCamera(50, 1, 0.1, 10);
    miniCam.position.z = 2;
    const miniRenderer = new THREE.WebGLRenderer({ alpha: true });
    miniRenderer.setSize(220, 120);
    preview.appendChild(miniRenderer.domElement);

    const mat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true });
    const mesh = createAlien3DModel(selected.type, mat);
    miniScene.add(mesh);

    function renderMini() {
      if (panel.style.display === 'block') {
        requestAnimationFrame(renderMini);
        mesh.rotation.y += 0.03;
        miniRenderer.render(miniScene, miniCam);
      }
    }
    renderMini();

    toggleHologram();
  }

  // --- WEBCAM ---
  function initCamera() {
    const videoElement = document.getElementById('webcam');

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onResults);

    const cameraUtils = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 1280,
      height: 720
    });

    cameraUtils.start();
  }

  window.onload = () => {
    init3D();
    animate();
    initCamera();
  };
</script>
</body>
</html>
