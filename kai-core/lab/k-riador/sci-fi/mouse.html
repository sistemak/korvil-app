<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Air Mouse - Conexão KRACT & QR Code</title>

  <!-- CDNs: MediaPipe, QR Code Generator, QR Code Scanner e MQTT.js -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/html5-qrcode" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow-y: auto;
      padding: 20px 0;
    }

    .container {
      width: 90%;
      max-width: 500px;
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h1 { font-size: 1.4rem; color: #58a6ff; margin-bottom: 8px; }

    .btn {
      background: #238636;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-secondary { background: #1f6feb; }
    .btn-kract { background: #8957e5; }
    .btn:disabled { background: #30363d; color: #8b949e; cursor: not-allowed; }

    .kract-box {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: left;
    }

    .kract-box label {
      display: block;
      font-size: 0.8rem;
      color: #8b949e;
      margin-bottom: 4px;
    }

    .kract-box input {
      width: 100%;
      padding: 8px 12px;
      margin-bottom: 10px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 0.9rem;
    }

    #status {
      font-size: 0.85rem;
      color: #8b949e;
      margin-bottom: 12px;
      padding: 8px;
      background: #0d1117;
      border-radius: 6px;
    }

    #scanner-container {
      width: 100%;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 12px;
      display: none;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      margin-bottom: 12px;
    }

    video, canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    canvas { position: absolute; top: 0; left: 0; }

    #qr-container {
      margin-top: 10px;
      padding: 12px;
      background: #21262d;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    #qrcode { background: #fff; padding: 8px; border-radius: 6px; }

    #pointer {
      position: fixed;
      width: 24px;
      height: 24px;
      background: rgba(88, 166, 255, 0.9);
      border: 2px solid #fff;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: none;
      z-index: 9999;
      box-shadow: 0 0 12px rgba(88, 166, 255, 0.8);
    }

    .click-target {
      margin-top: 12px;
      padding: 12px;
      background: #21262d;
      border: 1px dashed #58a6ff;
      border-radius: 8px;
      color: #58a6ff;
    }
  </style>
</head>
<body>

  <div id="pointer"></div>

  <div class="container">
    <h1>Air Mouse - KRACT Sync</h1>
    <div id="status">Conectando ao servidor MQTT...</div>

    <!-- Bloco KRACT -->
    <div class="kract-box">
      <label for="kractUser">Usuário KRACT:</label>
      <input type="text" id="kractUser" placeholder="Ex: usuario1">
      
      <label for="kractPass">Senha KRACT:</label>
      <input type="password" id="kractPass" placeholder="Ex: 1234">

      <button id="kractBtn" class="btn btn-kract">🔑 Conectar com KRACT (10s)</button>
    </div>

    <button id="btBtn" class="btn">1. Conectar Bluetooth (Ativar)</button>
    <button id="scanBtn" class="btn btn-secondary">📷 Escanear QR Code de Outra Tela</button>

    <div id="scanner-container">
      <div id="reader"></div>
    </div>

    <div id="viewport">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="canvas"></canvas>
    </div>

    <div id="qr-container">
      <p style="font-size: 0.8rem; color: #8b949e;">QR Code de Pareamento desta Tela:</p>
      <div id="qrcode"></div>
      <div style="font-family: monospace; font-size: 0.8rem; color: #79c0ff;">
        Sala: <span id="room-id">---</span>
      </div>
    </div>

    <div class="click-target" id="targetArea">
      Área de Teste (Passe o cursor aqui)
    </div>
  </div>

  <script>
    const btBtn = document.getElementById('btBtn');
    const scanBtn = document.getElementById('scanBtn');
    const kractBtn = document.getElementById('kractBtn');
    const statusDiv = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const scannerContainer = document.getElementById('scanner-container');
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pointer = document.getElementById('pointer');
    const targetArea = document.getElementById('targetArea');

    let prevX = 0, prevY = 0;
    const SMOOTHING = 0.35;
    let isPinching = false;
    let client, roomId, html5QrCode;
    let kractTimeout = null;
    let peerConnected = false;
    const myClientId = "client_" + Math.random().toString(36).substring(2, 8);

    // 1. GERENCIAMENTO DE SALA & QR CODE
    const urlParams = new URLSearchParams(window.location.search);
    roomId = urlParams.get('room') || 'room_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('room-id').textContent = roomId;

    function updateQRCode(newRoom) {
      document.getElementById("qrcode").innerHTML = "";
      new QRCode(document.getElementById("qrcode"), {
        text: `${window.location.origin}${window.location.pathname}?room=${newRoom}`,
        width: 110,
        height: 110
      });
    }
    updateQRCode(roomId);

    // 2. CONEXÃO MQTT WSS (MQTT.JS)
    function initMQTT() {
      // Conexão via WebSocket Seguro (WSS) na porta 8884 do HiveMQ
      client = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
        clientId: myClientId,
        keepalive: 60
      });

      client.on('connect', () => {
        statusDiv.textContent = `🟢 Conectado ao servidor! Sala: ${roomId}`;
        statusDiv.style.color = "#3fb950";
        subscribeToRoom(roomId);
      });

      client.on('message', (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          if (data.sender === myClientId) return; // Ignora próprias mensagens

          if (data.type === "ping") {
            peerConnected = true;
            if (kractTimeout) clearInterval(kractTimeout);
            sendMQTTMessage({ type: "pong", sender: myClientId });
            statusDiv.textContent = `🟢 KRACT Conectado! Dispositivos sincronizados.`;
            statusDiv.style.color = "#3fb950";
          } else if (data.type === "pong") {
            peerConnected = true;
            if (kractTimeout) clearInterval(kractTimeout);
            statusDiv.textContent = `🟢 KRACT Conectado! Dispositivos sincronizados.`;
            statusDiv.style.color = "#3fb950";
          } else if (data.x !== undefined) {
            moveVirtualPointer(data.x, data.y, data.pinch);
          }
        } catch(e) { console.error(e); }
      });

      client.on('error', (err) => {
        statusDiv.textContent = "Erro de Conexão MQTT: " + err.message;
        statusDiv.style.color = "#f85149";
      });
    }

    function subscribeToRoom(newRoomId) {
      if (client && client.connected) {
        if (roomId) client.unsubscribe(`airmouse/${roomId}`);
        roomId = newRoomId;
        document.getElementById('room-id').textContent = roomId;
        updateQRCode(roomId);
        client.subscribe(`airmouse/${roomId}`);
      }
    }

    function sendMQTTMessage(payloadObj) {
      if (client && client.connected) {
        client.publish(`airmouse/${roomId}`, JSON.stringify(payloadObj));
      }
    }

    initMQTT();

    // 3. LOGICA KRACT (USUÁRIO E SENHA IGUAIS)
    async function hashKractKey(str) {
      const encoder = new TextEncoder();
      const data = encoder.encode(str);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
    }

    kractBtn.addEventListener('click', async () => {
      const user = document.getElementById('kractUser').value.trim().toLowerCase();
      const pass = document.getElementById('kractPass').value.trim();

      if (!user || !pass) {
        alert("Preencha o Usuário e a Senha KRACT!");
        return;
      }

      // Gera ID único da sala com base no par (usuário + senha)
      const kractHash = await hashKractKey(`kract_${user}_${pass}`);
      const kractRoom = `kract_${kractHash}`;

      peerConnected = false;
      subscribeToRoom(kractRoom);

      let secondsLeft = 10;
      statusDiv.textContent = `⏳ Aguardando segundo dispositivo... (${secondsLeft}s)`;
      statusDiv.style.color = "#d29922";
      kractBtn.disabled = true;

      // Anuncia entrada na sala KRACT
      sendMQTTMessage({ type: "ping", sender: myClientId });

      if (kractTimeout) clearInterval(kractTimeout);

      kractTimeout = setInterval(() => {
        secondsLeft--;
        // Envia ping contínuo durante os 10s para garantir
        sendMQTTMessage({ type: "ping", sender: myClientId });

        if (peerConnected) {
          clearInterval(kractTimeout);
          kractBtn.disabled = false;
          return;
        }

        if (secondsLeft > 0) {
          statusDiv.textContent = `⏳ Aguardando segundo dispositivo... (${secondsLeft}s)`;
        } else {
          clearInterval(kractTimeout);
          kractBtn.disabled = false;

          if (!peerConnected) {
            statusDiv.textContent = "❌ Falha KRACT: O outro dispositivo não conectou dentro dos 10s.";
            statusDiv.style.color = "#f85149";
          }
        }
      }, 1000);
    });

    // 4. SCANNER DE QR CODE
    scanBtn.addEventListener('click', () => {
      scannerContainer.style.display = "block";
      statusDiv.textContent = "Aponte a câmera para o QR Code da outra tela...";

      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 10, qrbox: { width: 200, height: 200 } },
        (decodedText) => {
          try {
            const scannedUrl = new URL(decodedText);
            const scannedRoom = scannedUrl.searchParams.get('room');
            if (scannedRoom) {
              html5QrCode.stop();
              scannerContainer.style.display = "none";
              subscribeToRoom(scannedRoom);
            }
          } catch(e) {
            html5QrCode.stop();
            scannerContainer.style.display = "none";
            subscribeToRoom(decodedText);
          }
        },
        () => {}
      );
    });

    // 5. ATIVAÇÃO BLUETOOTH
    btBtn.addEventListener('click', async () => {
      try {
        statusDiv.textContent = "Buscando Bluetooth...";
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['generic_access']
        });

        statusDiv.textContent = `Ativado por: ${device.name || 'Dispositivo BT'}`;
        statusDiv.style.color = "#3fb950";
        btBtn.disabled = true;

        startCamera();
      } catch (err) {
        statusDiv.textContent = "Erro BT: " + err.message;
        statusDiv.style.color = "#f85149";
      }
    });

    // 6. DETECÇÃO DE GESTOS (MEDIAPIPE)
    function startCamera() {
      viewport.style.display = "block";
      pointer.style.display = "block";

      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(onResults);

      const camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 640,
        height: 480
      });

      camera.start();
    }

    function onResults(results) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        const indexTip = landmarks[8];
        const thumbTip = landmarks[4];

        const normX = 1 - indexTip.x;
        const normY = indexTip.y;

        const dist = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);
        const pinchActive = dist < 0.07;

        ctx.fillStyle = pinchActive ? "#f85149" : "#3fb950";
        ctx.beginPath();
        ctx.arc(indexTip.x * canvas.width, indexTip.y * canvas.height, 8, 0, 2 * Math.PI);
        ctx.fill();

        sendMQTTMessage({
          sender: myClientId,
          x: normX,
          y: normY,
          pinch: pinchActive
        });

        moveVirtualPointer(normX, normY, pinchActive);
      }
    }

    function moveVirtualPointer(normX, normY, pinchActive) {
      const screenX = normX * window.innerWidth;
      const screenY = normY * window.innerHeight;

      const currX = prevX ? prevX + (screenX - prevX) * SMOOTHING : screenX;
      const currY = prevY ? prevY + (screenY - prevY) * SMOOTHING : screenY;
      prevX = currX;
      prevY = currY;

      pointer.style.display = "block";
      pointer.style.left = `${currX}px`;
      pointer.style.top = `${currY}px`;

      if (pinchActive) {
        pointer.style.background = "rgba(255, 123, 114, 0.9)";
        if (!isPinching) {
          isPinching = true;
          const elem = document.elementFromPoint(currX, currY);
          if (elem) elem.click();
        }
      } else {
        pointer.style.background = "rgba(88, 166, 255, 0.9)";
        isPinching = false;
      }
    }

    targetArea.addEventListener('click', () => {
      targetArea.style.background = "#2ea043";
      targetArea.style.color = "#fff";
      targetArea.textContent = "¡Conexão & Clique Confirmados!";
      setTimeout(() => {
        targetArea.style.background = "#21262d";
        targetArea.style.color = "#58a6ff";
        targetArea.textContent = "Área de Teste (Passe o cursor aqui)";
      }, 2000);
    });
  </script>
</body>
</html>
