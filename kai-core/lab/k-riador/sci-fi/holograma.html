<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CGM LUVA UI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    overflow:hidden;
    touch-action:none;
}

#video{
    position:absolute;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:1;

    /* espelho */
    transform:scaleX(-1);

    filter:
        brightness(.3)
        contrast(1.2);
}

#canvas{
    position:absolute;
    width:100vw;
    height:100vh;
    z-index:2;

    /* espelho igual ao vídeo */
    transform:scaleX(-1);
}

#msg{
    position:absolute;
    top:20px;
    left:0;
    width:100%;

    z-index:5;

    text-align:center;

    color:#00ffff;

    font-family:
    "Courier New",
    monospace;

    font-size:18px;

    text-shadow:
    0 0 10px #00ffff,
    0 0 20px #00ffff;
}

#alvo{
    position:absolute;

    left:50%;
    top:50%;

    width:120px;
    height:120px;

    border-radius:50%;

    border:4px dashed #ffff00;

    transform:
    translate(-50%,-50%);

    display:none;

    z-index:4;

    box-shadow:
    0 0 20px #ffff00,
    0 0 40px #ffff00;
}

.btn{
    position:absolute;

    bottom:30px;
    left:50%;

    transform:translateX(-50%);

    z-index:6;

    padding:15px 35px;

    border-radius:30px;

    border:3px solid #00ffff;

    background:
    rgba(0,255,255,.08);

    color:#00ffff;

    font-size:18px;

    font-family:
    "Courier New",
    monospace;
}

.btn.active{
    background:#00ffff;
    color:#000;

    box-shadow:
    0 0 15px #00ffff,
    0 0 35px #00ffff;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

<div id="msg">
Clique em LUVAS para ativar
</div>

<div id="alvo"></div>

<video
id="video"
autoplay
playsinline
muted>
</video>

<canvas id="canvas"></canvas>

<button
id="btn_luva"
class="btn">
LUVAS
</button>
<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const msg = document.getElementById("msg");
const alvo = document.getElementById("alvo");
const btn = document.getElementById("btn_luva");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let luvaAtiva = false;
let luvaPega = false;

let hands = null;

let contagem = 0;

let ultimoClique = 0;

let luvaPos = {
    x: canvas.width / 2,
    y: canvas.height / 2
};

window.addEventListener("resize",()=>{

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

});

const handsDetector = new Hands({

    locateFile:file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});

handsDetector.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:0.5,

    minTrackingConfidence:0.5

});

handsDetector.onResults(results=>{

    hands = results.multiHandLandmarks || null;

});

function loop(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 20;

    if(
        luvaAtiva &&
        hands
    ){
        desenharLuvas(hands);
    }

    requestAnimationFrame(loop);

}

loop();

navigator.mediaDevices
.getUserMedia({

    video:{
        width:1280,
        height:720
    }

})
.then(stream=>{

    video.srcObject = stream;

    const camera = new Camera(video,{

        onFrame:async()=>{

            await handsDetector.send({
                image:video
            });

        },

        width:1280,
        height:720

    });

    camera.start();

})
.catch(err=>{

    msg.innerText =
    "erro ao abrir câmera";

    console.error(err);

});

btn.onclick = ()=>{

    luvaAtiva = !luvaAtiva;

    btn.classList.toggle("active");

    luvaPega = false;

    contagem = 0;

    alvo.style.display =
    luvaAtiva
    ? "block"
    : "none";

    msg.innerText =
    luvaAtiva
    ? "coloque a palma da mão no círculo"
    : "clique em LUVAS para ativar";

};
function desenharLuvas(handsData){

    const mao1 = handsData[0];
    const mao2 = handsData[1] || null;

    if(!mao1){

        if(!luvaPega){
            contagem = 0;
        }

        return;
    }

    let palmaX =
        mao1[9].x *
        canvas.width;

    let palmaY =
        mao1[9].y *
        canvas.height;

    if(!luvaPega){

        alvo.style.display = "block";

        const distancia = Math.hypot(
            palmaX - luvaPos.x,
            palmaY - luvaPos.y
        );

        if(distancia < 80){

            contagem += 1/60;

            msg.innerText =
            `segure no alvo ${Math.ceil(3-contagem)}s`;

            ctx.strokeStyle="#ffff00";
            ctx.lineWidth=5;

            ctx.beginPath();

            ctx.arc(
                luvaPos.x,
                luvaPos.y,
                70,
                0,
                Math.PI*2*(contagem/3)
            );

            ctx.stroke();

            if(contagem >= 3){

                luvaPega = true;

                contagem = 0;

                alvo.style.display="none";

                msg.innerText =
                "luva ativada";

            }

        }else{

            contagem = 0;

            msg.innerText =
            "coloque a palma da mão no círculo";

        }

        return;
    }

    luvaPos.x = palmaX;
    luvaPos.y = palmaY;

    for(let i=0;i<3;i++){

        ctx.beginPath();

        ctx.arc(
            luvaPos.x,
            luvaPos.y,
            55+(i*18),
            0,
            Math.PI*2
        );

        ctx.strokeStyle =
        `rgba(0,255,255,${
            1-(i*0.3)
        })`;

        ctx.lineWidth = 3;

        ctx.stroke();

    }

    const botoes = [

        {
            texto:"MENU",
            offsetY:-70
        },

        {
            texto:"MAPA",
            offsetY:0
        },

        {
            texto:"ARMA",
            offsetY:70
        }

    ];

    botoes.forEach(botao=>{

        const ladoHUD =
        mao1[9].x < 0.5
        ? 110
        : -110;

        let bx =
        luvaPos.x + ladoHUD;

        let by =
        luvaPos.y +
        botao.offsetY;

        if(bx < 70){
            bx = 70;
        }

        if(bx > canvas.width-70){
            bx = canvas.width-70;
        }

        ctx.fillStyle =
        "rgba(0,255,255,.15)";

        ctx.fillRect(
            bx-45,
            by-22,
            90,
            44
        );

        ctx.strokeStyle =
        "#00ffff";

        ctx.strokeRect(
            bx-45,
            by-22,
            90,
            44
        );

        ctx.fillStyle =
        "#ffffff";

        ctx.font =
        "16px Courier New";

        ctx.textAlign =
        "center";

        ctx.fillText(
            botao.texto,
            bx,
            by+5
        );
        if(mao2){

            let indX =
                mao2[8].x *
                canvas.width;

            let indY =
                mao2[8].y *
                canvas.height;

            let poleX =
                mao2[4].x *
                canvas.width;

            let poleY =
                mao2[4].y *
                canvas.height;

            const distanciaPinca =
                Math.hypot(
                    indX - poleX,
                    indY - poleY
                );

            const dentroBotao =

                indX > bx - 45 &&
                indX < bx + 45 &&

                indY > by - 22 &&
                indY < by + 22;

            if(
                distanciaPinca < 45 &&
                dentroBotao &&
                Date.now() - ultimoClique > 600
            ){

                ultimoClique = Date.now();

                msg.innerText =
                botao.texto + " ATIVADO";

                ctx.strokeStyle =
                "#00ff00";

                ctx.lineWidth = 4;

                ctx.strokeRect(
                    bx-50,
                    by-27,
                    100,
                    54
                );

                setTimeout(()=>{

                    msg.innerText =
                    "luva ativa";

                },1000);

            }

            ctx.beginPath();

            ctx.arc(
                indX,
                indY,
                10,
                0,
                Math.PI*2
            );

            ctx.fillStyle =
            "#00ffff";

            ctx.fill();

            ctx.beginPath();

            ctx.moveTo(
                indX,
                indY
            );

            ctx.lineTo(
                poleX,
                poleY
            );

            ctx.strokeStyle =
            "#00ffff";

            ctx.lineWidth = 3;

            ctx.stroke();

        }

    });

}
</script>

</body>
</html>
