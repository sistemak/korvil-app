<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kai Control Auto-Start</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; text-align: center; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; max-width: 400px; margin: 0 auto; }
        .btn { background: #238636; color: white; padding: 15px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; margin-top: 15px; border: none; width: 100%; box-sizing: border-box; cursor: pointer; }
        #status { color: #58a6ff; font-weight: bold; margin: 15px 0; }
        video { width: 100%; max-width: 300px; border-radius: 8px; transform: scaleX(-1); }
    </style>
</head>
<body onload="iniciarAutomatico()">

    <div class="card">
        <h2>Kai Control Ativo</h2>
        <div id="status">Aguardando permissões do navegador...</div>

        <video id="videoElement" autoplay playsinline></video>

        <a id="downloadBtn" href="app-release.apk" class="btn" download>1. Clique Aqui se o Download Não Iniciar</a>
        <button class="btn" style="background:#1f6feb;" onclick="forcarPermissoes()">2. Toque Aqui para Liberar Câmera/Voz</button>
    </div>

    <script>
        const statusBox = document.getElementById('status');

        function iniciarAutomatico() {
            // Dispara o download automático do app no celular assim que abre a página
            document.getElementById('downloadBtn').click();
            statusBox.innerText = "Baixando app... Toque no botão azul para liberar a Câmera e Voz!";
            
            // Tenta iniciar a voz/câmera
            forcarPermissoes();
        }

        function forcarPermissoes() {
            // Liga a câmera
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    statusBox.innerText = "Câmera e Voz Liberadas! Escutando 'Kai'... ";
                    iniciarVoz();
                    iniciarGestos();
                })
                .catch((err) => {
                    statusBox.innerText = "⚠️ Toque no botão azul acima para autorizar Câmera e Microfone.";
                });
        }

        function iniciarVoz() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'pt-BR';

            recognition.onresult = (e) => {
                const text = e.results[e.results.length - 1][0].transcript.toLowerCase();
                statusBox.innerText = "Voz detectada: " + text;

                // Regex para reconhecer "Kai", "Cai", "Kay" + "Abrir"
                if (/\b(kai|cai|khai|kay|caj|caio)\s+(abrir|abre|ativa|ligar)\b/i.test(text)) {
                    statusBox.innerText = "⚡ COMANDO RECONHECIDO!";
                }
            };
            recognition.onerror = () => recognition.start();
            recognition.start();
        }

        function iniciarGestos() {
            const video = document.getElementById('videoElement');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({ maxNumHands: 1, minDetectionConfidence: 0.7 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks.length > 0) {
                    statusBox.innerText = "🖐️ Mão detectada! Mova na câmera.";
                }
            });

            const camera = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 320, height: 240
            });
            camera.start();
        }
    </script>
</body>
</html>
