<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>POWER RANGERS - GO GO POWER RANGERS</title>
<style>
* {margin:0;padding:0;box-sizing:border-box}
body {
  background:radial-gradient(circle at center, #000011 0%, #000 100%);
  display:flex;justify-content:center;align-items:center;height:100vh;
  overflow:hidden;perspective:2500px;font-family:'Orbitron',sans-serif;
}

/* FUNDO COMANDO */
.comando-grid {
  position:absolute;width:300%;height:300%;
  background-image:linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size:100px 100px;transform:rotateX(70deg) translateZ(-700px);
  animation:gridMove 50s linear infinite
}
@keyframes gridMove {100%{transform:rotateX(70deg) translateZ(-700px) translateY(100px)}}

/* MORPHER */
.morpher {
  width:420px;height:420px;border-radius:50%;position:relative;z-index:5;
  background:radial-gradient(circle, #FFFFFF 0%, #CCCCCC 40%, #222 80%);
  box-shadow:0 0 400px #FFF, inset 0 0 200px #FFF;
  border:10px solid #FFF;cursor:pointer;animation:morpherPulse 5s infinite
}
.morpher-core {
  width:220px;height:220px;border-radius:50%;background:#000;
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;color:#FFF;
  font-weight:900;font-size:32px;border:6px solid #FFF;box-shadow:0 0 100px #FFF
}

/* HOLOGRAMA RANGER */
.holo-ranger {
  position:absolute;bottom:500px;width:700px;height:700px;
  opacity:0;transition:1.8s cubic-bezier(0.16,1,0.3,1);transform:scale(0.3) rotateY(180deg)
}
.holo-ranger.ativo {opacity:1;transform:scale(1) rotateY(0)}
.ranger-avatar {
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-size:250px;filter:drop-shadow(0 0 120px currentColor);
  animation:rangerFloat 4s ease-in-out infinite
}

/* ZORD ATRÁS */
.zord-bg {
  position:absolute;bottom:50px;width:1200px;height:600px;
  opacity:0;transition:2s;transform:scale(0.5) translateY(200px);pointer-events:none
}
.zord-bg.ativo {opacity:0.4;transform:scale(1) translateY(0)}
.zord-img {
  font-size:400px;filter:drop-shadow(0 0 100px gold);animation:zordFloat 6s ease-in-out infinite
}

/* RAIO DE MORPH */
.morph-ray {
  position:absolute;top:50%;left:50%;width:0;height:0;
  background:radial-gradient(circle, rgba(255,255,255,0.8) 0%, transparent 70%);
  transform:translate(-50%,-50%);transition:1s;z-index:20
}
.morph-ray.ativo {width:2000px;height:2000px}

/* CORPO RANGER */
.ranger-body {
  position:absolute;bottom:70px;width:320px;height:520px;opacity:0;transition:1s;
  transform-style:preserve-3d;z-index:10
}
.ranger-body.ativo {opacity:0.95;animation:rotateRanger 12s infinite linear}
.ranger-modelo {
  width:100%;height:100%;border-radius:120px 120px 50px 50px;
  background:linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.05));
  border:4px solid;box-shadow:inset 0 0 120px rgba(255,255,255,0.4)
}

/* PAINEL EQUIPE */
.painel-equipe {
  position:absolute;right:60px;width:400px;background:rgba(255,255,255,0.08);
  border:3px solid #FFF;border-radius:30px;padding:30px;backdrop-filter:blur(30px);
  transform:translateX(500px);transition:1.2s;z-index:30
}
.painel-equipe.ativo {transform:translateX(0)}
.painel-equipe h2 {color:#FFF;text-shadow:0 0 30px #FFF;margin-bottom:25px;text-align:center}
.btn-ranger {
  width:100%;padding:20px;margin:12px 0;border:0;color:#FFF;border-radius:18px;
  font-weight:900;cursor:pointer;transition:0.4s;font-size:18px;text-transform:uppercase;
  box-shadow:0 0 40px currentColor
}
.btn-ranger:hover {transform:scale(1.1) translateX(-15px)}

/* CORES */
.red {background:linear-gradient(90deg, #FF0000, #CC0000); color:#FF0000}
.blue {background:linear-gradient(90deg, #0000FF, #0000CC); color:#0000FF}
.yellow {background:linear-gradient(90deg, #FFFF00, #CCCC00); color:#FFFF00}
.black {background:linear-gradient(90deg, #222222, #000); color:#FFFFFF}
.pink {background:linear-gradient(90deg, #FF00FF, #CC00CC); color:#FF00FF}

/* BOTÕES ESPECIAIS */
.btn-zord {background:linear-gradient(90deg, #FFD700, #FFA500); color:#000}
.btn-megazord {background:linear-gradient(90deg, #FFF, #AAA); color:#000}

/* TELA MORPH 5S */
.morph-screen {
  position:absolute;top:0;left:0;width:100%;height:100%;background:#000;
  display:none;justify-content:center;align-items:center;flex-direction:column;z-index:99
}
.morph-screen.ativo {display:flex}
.morph-screen h1 {color:#FFF;font-size:100px;text-shadow:0 0 100px #FFF;animation:morphText 5s}
.morph-lightning {
  width:100%;height:100%;position:absolute;
  background:repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.3) 20px);
  animation:lightning 0.1s infinite
}
.go-go {
  position:absolute;bottom:100px;font-size:60px;color:#FFD700;text-shadow:0 0 60px #FFD700;
  animation:goGo 1s infinite
}

@keyframes morpherPulse {50%{box-shadow:0 0 500px #FFF}}
@keyframes rangerFloat {50%{transform:translateY(-30px)}}
@keyframes zordFloat {50%{transform:translateY(-40px)}}
@keyframes rotateRanger {100%{transform:rotateY(360deg)}}
@keyframes morphText {0%{transform:scale(0.3)} 20%{transform:scale(1.4)} 100%{transform:scale(1)}}
@keyframes lightning {0%{opacity:0} 50%{opacity:1}}
@keyframes goGo {50%{transform:scale(1.2)}}
</style>
</head>
<body>

<div class="comando-grid"></div>
<div class="morph-ray" id="morphRay"></div>

<!-- ZORD ATRÁS -->
<div class="zord-bg" id="zordBg">
  <div class="zord-img" id="zordImg">🦖</div>
</div>

<!-- HOLOGRAMA RANGER -->
<div class="holo-ranger" id="holoRanger">
  <div class="ranger-avatar" id="rangerAvatar">🦸</div>
</div>

<!-- CORPO RANGER -->
<div class="ranger-body" id="rangerBody">
  <div class="ranger-modelo" id="rangerModelo"></div>
</div>

<!-- PAINEL EQUIPE -->
<div class="painel-equipe" id="painel">
  <h2>SELECIONE SEU RANGER</h2>
  <button class="btn-ranger red" onclick="morphar('VERMELHO', '🦸', '#FF0000', '🦖')">RANGER VERMELHO</button>
  <button class="btn-ranger blue" onclick="morphar('AZUL', '🦸', '#0000FF', '🦣')">RANGER AZUL</button>
  <button class="btn-ranger yellow" onclick="morphar('AMARELO', '🦸', '#FFFF00', '🦁')">RANGER AMARELO</button>
  <button class="btn-ranger black" onclick="morphar('PRETO', '🦸', '#FFFFFF', '🐺')">RANGER PRETO</button>
  <button class="btn-ranger pink" onclick="morphar('ROSA', '🦸', '#FF00FF', '🐆')">RANGER ROSA</button>
  <button class="btn-ranger btn-zord" onclick="chamarZord()">CHAMAR ZORD</button>
  <button class="btn-ranger btn-megazord" onclick="formarMegazord()">FORMAR MEGAZORD</button>
</div>

<!-- MORPHER -->
<div class="morpher" onclick="ativarPainel()">
  <div class="morpher-core">MORPH</div>
</div>

<!-- TELA MORPH -->
<div class="morph-screen" id="morphScreen">
  <div class="morph-lightning"></div>
  <h1 id="morphText">IT'S MORPHIN TIME</h1>
  <div class="go-go">GO GO POWER RANGERS!</div>
</div>

<audio id="sndMorph" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>
<audio id="sndGoGo" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAABErAAABAAgAZGF0YQAAAAA="></audio>

<script>
let painelAberto = false;
let rangerAtual = null;

const falas = window.speechSynthesis;
function falar(texto) {
  let msg = new SpeechSynthesisUtterance(texto);
  msg.lang = 'pt-BR'; msg.rate = 1.1; msg.pitch = 1.2;
  falas.speak(msg);
}

function tocarSom(id) {
  document.getElementById(id).currentTime = 0;
  document.getElementById(id).play().catch(()=>{});
}

function ativarPainel() {
  painelAberto = !painelAberto;
  document.getElementById('painel').classList.toggle('ativo');
  tocarSom('sndMorph');
  if(painelAberto) falar('Sistema Morpher Ativado');
}

function morphar(cor, emoji, corHex, zordEmoji) {
  if(!painelAberto) ativarPainel();
  rangerAtual = cor;
  tocarSom('sndMorph');
  tocarSom('sndGoGo'); // SOM GO GO
  
  // RAIO DE MORPH
  document.getElementById('morphRay').classList.add('ativo');
  
  // ZORD APARECE ATRÁS
  document.getElementById('zordBg').classList.add('ativo');
  document.getElementById('zordImg').innerText = zordEmoji;
  
  // HOLOGRAMA
  document.getElementById('holoRanger').classList.add('ativo');
  document.getElementById('rangerAvatar').innerText = emoji;
  document.getElementById('rangerAvatar').style.color = corHex;
  
  // CORPO
  document.getElementById('rangerBody').classList.add('ativo');
  document.getElementById('rangerModelo').style.borderColor = corHex;
  document.getElementById('rangerModelo').style.background = 
    `linear-gradient(rgba(${parseInt(corHex.slice(1,3),16)},${parseInt(corHex.slice(3,5),16)},${parseInt(corHex.slice(5,7),16)},0.3), transparent)`;
  
  // TELA MORPH 5S
  document.getElementById('morphScreen').classList.add('ativo');
  document.getElementById('morphText').innerText = `IT'S MORPHIN TIME! RANGER ${cor}`;
  falar(`É hora de Morphar! Ranger ${cor}. GO GO POWER RANGERS!`);
  
  setTimeout(()=>{
    document.getElementById('morphScreen').classList.remove('ativo');
    document.getElementById('morphRay').classList.remove('ativo');
  }, 5000);
}

function chamarZord() {
  falar('Zords, venham ao meu comando!');
  document.getElementById('zordBg').classList.add('ativo');
  document.getElementById('zordBg').style.opacity = '0.8';
  document.getElementById('holoRanger').classList.add('ativo');
  document.getElementById('rangerAvatar').innerText = '🦖';
  document.getElementById('rangerAvatar').style.color = '#FFD700';
}

function formarMegazord() {
  falar('Formar Megazord!');
  document.getElementById('morphScreen').classList.add('ativo');
  document.getElementById('morphText').innerText = 'FORMAR MEGAZORD!';
  document.getElementById('rangerAvatar').innerText = '🤖';
  document.getElementById('rangerAvatar').style.color = '#FFF';
  document.getElementById('zordBg').classList.add('ativo');
  document.getElementById('zordImg').innerText = '🤖';
  document.getElementById('zordImg').style.fontSize = '500px';
  setTimeout(()=>{document.getElementById('morphScreen').classList.remove('ativo')}, 5000);
}
</script>

</body></html>
