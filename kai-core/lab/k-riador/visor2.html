
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>visor ironman cgm</title>
<style>
  body { margin:0; background:#000; overflow:hidden; font-family:'Courier New'; }
  #cam1 { position:absolute; width:100vw; height:100vh; object-fit:cover; filter:brightness(0.5); transform:scaleX(-1); }
  #hud { position:absolute; width:100vw; height:100vh; pointer-events:none; }
  #miniCam { position:absolute; width:300px; height:200px; bottom:20px; right:20px; border:2px solid #0ff; box-shadow:0 0 20px #0ff; object-fit:cover; }
  #scanBox { position:absolute; width:300px; height:200px; bottom:20px; right:20px; border:2px solid #f00; display:none; overflow:hidden; }
  #scanFeed { width:100%; height:100%; object-fit:cover; transform-origin:center center; }
  #info { position:absolute; top:20px; left:20px; color:#0ff; font-size:12px; text-shadow:0 0 10px #0ff; }
 .anel { position:absolute; border:2px solid #0ff; border-radius:50%; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<video id="cam1" autoplay playsinline muted></video>
<video id="cam2" autoplay playsinline muted style="display:none"></video>
<canvas id="hud"></canvas>

<div id="info">
  STATUS: ONLINE<br>
  SCAN: <span id="scanStatus">OFF</span><br>
  ZOOM: <span id="zoomStatus">1.0x</span>
</div>

<div id="scanBox">
  <video id="scanFeed" autoplay playsinline muted></video>
</div>

<script>
const cam1 = document.getElementById('cam1');
const cam2 = document.getElementById('cam2');
const scanFeed = document.getElementById('scanFeed');
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');
const scanBox = document.getElementById('scanBox');

let faceLm = null;
let scannerAtivo = false;
let zoom = 1.0;
let sobrancelhaD = 0, sobrancelhaE = 0;
let piscouD = false, piscouE = false, sequenciaScan = 0;

function resize(){hud.width=innerWidth; hud.height=innerHeight;} resize(); onresize=resize;

// FACE MESH PRA OLHO E SOBRANCELHA
const faceMesh = new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5});

faceMesh.onResults(res=>{
  ctx.clearRect(0,0,hud.width,hud.height);
  ctx.shadowColor='#00ffff'; ctx.shadowBlur=15;
  if(res.multiFaceLandmarks[0]){
    faceLm = res.multiFaceLandmarks[0];
    desenharHUD();
    detectarGestos();
  }
});

// DESENHAR HUD IRONMAN
function desenharHUD(){
  const cx = hud.width/2, cy = hud.height/2;

  // Anéis no rosto
  for(let i=0;i<3;i++){
    ctx.beginPath(); ctx.arc(cx, cy-50, 100+i*30, 0, 6.28);
    ctx.strokeStyle=`rgba(0,255,255,${0.8-i*0.2})`; ctx.lineWidth=2; ctx.stroke();
  }

  // Pontos nos olhos
  ctx.beginPath(); ctx.arc(faceLm[468].x*hud.width, faceLm[468].y*hud.height, 5, 0, 6.28); ctx.fillStyle='#0ff'; ctx.fill(); // olho D
  ctx.beginPath(); ctx.arc(faceLm[473].x*hud.width, faceLm[473].y*hud.height, 5, 0, 6.28); ctx.fillStyle='#0ff'; ctx.fill(); // olho E

  // Mira vermelha no olho direito quando scan ativo
  if(scannerAtivo){
    const x = faceLm[468].x*hud.width, y = faceLm[468].y*hud.height;
    ctx.strokeStyle='#f00'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(x,y,30,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x-20,y); ctx.lineTo(x+20,y); ctx.moveTo(x,y-20); ctx.lineTo(x,y+20); ctx.stroke();
  }
}

// DETECTAR GESTOS
function detectarGestos(){
  const olhoD = faceLm[468].y - faceLm[145].y; // distancia olho
  const olhoE = faceLm[473].y - faceLm[374].y;
  const sobD = faceLm[70].y - faceLm[105].y; // sobrancelha D
  const sobE = faceLm[300].y - faceLm[336].y; // sobrancelha E

  // 1. SCAN: Piscar D depois E
  if(olhoD<0.01 &&!piscouD){piscouD=1; sequenciaScan=1; setTimeout(()=>piscouD=0,800);}
  if(sequenciaScan==1 && olhoE<0.01 &&!piscouE){piscouE=1; ativarScanner(); setTimeout(()=>{piscouE=0;sequenciaScan=0;},800);}

  // 2. ZOOM+ : Sobrancelha D
  if(sobD>0.05){
    sobrancelhaD++;
    if(sobrancelhaD>5){ zoom += 0.1; if(zoom>20)zoom=20; } // segura aumenta rapido
    else { zoom += 0.2; if(zoom>20)zoom=20; } // 1 click
  } else sobrancelhaD=0;

  // 3. ZOOM- : Sobrancelha E
  if(sobE>0.05){
    sobrancelhaE++;
    if(sobrancelhaE>5){ zoom -= 0.1; if(zoom<1)zoom=1; }
    else { zoom -= 0.2; if(zoom<1)zoom=1; }
  } else sobrancelhaE=0;

  document.getElementById('zoomStatus').innerText = zoom.toFixed(1)+'x';
  if(scannerAtivo) scanFeed.style.transform = `scale(${zoom})`;
}

function ativarScanner(){
  scannerAtivo =!scannerAtivo;
  scanBox.style.display = scannerAtivo? 'block' : 'none';
  document.getElementById('scanStatus').innerText = scannerAtivo? 'ON' : 'OFF';
  if(scannerAtivo) zoom = 1.0;
}

// LIGAR 2 CAMERAS
async function start(){
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d=>d.kind==='videoinput');

  // CAM1 = notebook frente
  navigator.mediaDevices.getUserMedia({video:{deviceId:cams[0].deviceId,width:1280,height:720}}).then(s=>{cam1.srcObject=s;new Camera(cam1,{onFrame:async()=>await faceMesh.send({image:cam1})}).start();});

  // CAM2 = webcam externa pro scanner
  if(cams[1]){
    navigator.mediaDevices.getUserMedia({video:{deviceId:cams[1].deviceId,width:1280,height:720}}).then(s=>{cam2.srcObject=s; scanFeed.srcObject=s;});
  } else { alert("Conecta uma webcam externa pra usar o scanner"); }
}

start();
</script>
</body>
</html>
