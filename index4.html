<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORJA GEMINI AQ</title>
<style>
body{background:#050505;color:#00ff88;font-family:monospace;padding:15px}
h2{text-align:center}
textarea,button{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #00ff88;color:#00ff88;border-radius:5px;font-size:14px}
button{cursor:pointer;font-weight:bold;background:#00ff88;color:#000}
#log{border:1px solid #00ff88;padding:10px;height:350px;overflow:auto;background:#000;border-radius:5px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>🔥 FORJA GEMINI COM AQ 🔥</h2>
<textarea id="prompt" rows="5" placeholder="Digite: faça um site de vendas"></textarea>
<button onclick="enviar()">ENVIAR PRA IA</button>
<div id="log">Aguardando...</div>

<script>
const log = t => document.getElementById('log').innerText += t + "\n";

async function enviar(){
  const prompt = document.getElementById('prompt').value;
  if(!prompt) return alert("Digite um prompt");
  document.getElementById('log').innerText = "Enviando...\n";
  
  const repo = window.location.hostname.split('.')[0]; // pega nome do repo
  const owner = window.location.pathname.split('/')[1];
  
  // Chama o workflow do github
  const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/gemini.yml/dispatches`, {
    method: 'POST',
    headers: {
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      ref: "main",
      inputs: {prompt: prompt}
    })
  });
  
  if(r.status === 204) {
    log("✅ Enviado! Aguarde 10s e atualize a página F5");
    log("A resposta vai aparecer no arquivo resultado.txt do repo");
  } else {
    log("❌ Erro: " + r.status + ". Ative o workflow em Actions");
  }
}
</script>
</body>
</html>
