<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI GITHUB PAGES</title>
<style>
body{background:#050505;color:#00ff88;font-family:Consolas,monospace;padding:15px;max-width:800px;margin:auto}
h2{color:#00ff88;text-align:center}
.desc{background:#001100;border:1px dashed #00ff88;padding:10px;margin:10px 0;border-radius:5px;font-size:12px;white-space:pre-wrap}
input,textarea,button{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #00ff88;color:#00ff88;border-radius:5px;font-family:inherit;box-sizing:border-box}
button{cursor:pointer;font-weight:bold;background:#00ff88;color:#000;font-size:16px}
#resposta{border:1px solid #00ff88;padding:15px;min-height:350px;background:#000;border-radius:5px;white-space:pre-wrap}
.ok{color:#00ff00}
.err{color:#ff0000}
</style>
</head>
<body>
<h2>🔥 GEMINI NO GITHUB PAGES 🔥</h2>

<div class="desc"><b>LEMBRETE - TOKENS DE EXEMPLO:</b>
IA GEMINI: A.Q.Ab8RN6JaDwr0O_UzNIpdnsqTIA7li4zymx1K2gSz_OSouKr-Uw
Github token g.hp_2QIJJlBAS2TXg3bPN3HN7yuipxabw42V5MyO
SÃO FALSOS! COLE OS SEUS REAIS ABAIXO</div>

<label>1. Cole seu AQ_TOKEN:</label>
<input id="aqtoken" type="password" placeholder="A.Q.xxxxxxxxxxxxxxxx">

<label>2. Cole seu GH_TOKEN:</label>
<input id="ghtoken" type="password" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">

<button onclick="salvarTudo()">SALVAR OS 2 TOKENS</button>
<div id="status"></div>

<label>3. Digite o Prompt:</label>
<textarea id="prompt" rows="5">Faça um site de vendas moderno</textarea>
<button onclick="chamarGemini()">ENVIAR PRA IA</button>

<label>4. Resposta do Gemini:</label>
<div id="resposta">Aguardando...</div>

<script>
window.onload = function(){
  const aq = localStorage.getItem('aq');
  const gh = localStorage.getItem('gh');
  if(aq) document.getElementById('aqtoken').value = aq;
  if(gh) document.getElementById('ghtoken').value = gh;
  if(aq || gh) document.getElementById('status').innerHTML = '<span class="ok">✅ Tokens já carregados</span>';
}
function salvarTudo(){
  localStorage.setItem('aq', document.getElementById('aqtoken').value);
  localStorage.setItem('gh', document.getElementById('ghtoken').value);
  document.getElementById('status').innerHTML = '<span class="ok">✅ Salvo!</span>';
}
async function chamarGemini(){
  const AQ = localStorage.getItem('aq');
  if(!AQ) return alert("Salve o AQ_TOKEN primeiro");
  const div = document.getElementById('resposta');
  div.innerHTML = 'Pensando...';
  try {
    // USA PROXY DO CORS PRA LIBERAR NO GITHUB
    const r = await fetch(`https://corsproxy.io/?https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${AQ}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({contents: [{parts: [{text: document.getElementById('prompt').value}]}]})
    });
    const data = await r.json();
    if(data.error) {div.innerHTML = `<span class="err">ERRO: ${data.error.message}</span>`; return;}
    div.innerText = data.candidates[0].content.parts[0].text;
  } catch(e) {
    div.innerHTML = `<span class="err">ERRO: ${e.message}</span>`;
  }
}
</script>
</body>
</html>
