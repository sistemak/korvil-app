<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FORJA AQ + GH</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:15px}
input,textarea,button{width:100%;padding:12px;margin:8px 0;background:#111;border:1px solid #0f0;color:#0f0}
button{background:#0f0;color:#000;font-weight:bold;cursor:pointer}
#log{border:1px solid #0f0;padding:10px;height:300px;overflow:auto}
</style>
</head>
<body>
<h2>FORJA GEMINI - 2 CAMPOS</h2>
<input id="aq" type="password" placeholder="Cole o AQ... aqui">
<input id="gh" type="password" placeholder="Cole o ghp_... aqui embaixo">
<button onclick="salvar()">SALVAR OS 2</button>
<textarea id="p" rows="4">Faça um site de vendas</textarea>
<button onclick="enviar()">ENVIAR PRA IA</button>
<div id="log"></div>

<script>
function salvar(){
  localStorage.setItem('t', document.getElementById('aq').value + '\n' + document.getElementById('gh').value);
  alert("2 Tokens salvos!");
}

async function enviar(){
  const tudo = localStorage.getItem('t').split('\n');
  const GH = tudo[1]; // linha 2 é o GH_TOKEN
  
  const owner = location.hostname.split('.')[0];
  const repo = location.pathname.split('/')[1];
  
  document.getElementById('log').innerText = "Enviando...";
  
  await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/Gemini%20Proxy/dispatches`, {
    method: 'POST',
    headers: {'Authorization': 'Bearer ' + GH},
    body: JSON.stringify({ref: "main", inputs: {prompt: document.getElementById('p').value}})
  });
  
  document.getElementById('log').innerText = "✅ Enviado!\n\nVá em ACTIONS > Gemini Proxy > resultado.txt";
}
</script>
</body>
</html>
