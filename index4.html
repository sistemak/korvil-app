<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>FORJA AQ DIRETO</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;padding:20px}
input,textarea,button{width:100%;padding:10px;margin:5px 0;background:#111;border:1px solid #0f0;color:#0f0}
#log{border:1px solid #333;padding:10px;height:300px;overflow:auto}
</style>
</head>
<body>
<h2>FORJA GEMINI AQ</h2>
<input id="token" placeholder="Cole seu AQ... aqui 1 vez só" type="password">
<button onclick="salvar()">SALVAR TOKEN</button>
<textarea id="p" rows="4">Faça um site de vendas</textarea>
<button onclick="enviar()">ENVIAR PRA IA</button>
<div id="log"></div>

<script>
function salvar(){
  localStorage.setItem('aq', document.getElementById('token').value);
  alert("Token salvo!");
}

async function enviar(){
  const TOKEN = localStorage.getItem('aq');
  const log = t => document.getElementById('log').innerText += t + "\n";
  log("Enviando...");
  
  const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?access_token="+TOKEN,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:document.getElementById('p').value}]}]})
  });
  
  const data = await r.json();
  if(data.error) log("ERRO: "+data.error.message);
  else log(data.candidates[0].content.parts[0].text);
}
</script>
</body>
</html>
