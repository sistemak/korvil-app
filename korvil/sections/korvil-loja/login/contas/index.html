<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Contas</title>
<style>body{background:#000;color:#fff;font-family:monospace;padding:24px} a{color:#ff6a00}</style></head>
<body><h2 style="color:#ff6a00">KORVIL CONTAS - Pasta Mãe</h2>
<p>Path final: <code>korvil/sections/korvil-loja/login/contas/{pasta-mae}/{pasta-mae}.json</code></p>
<p>Ex: <code>sistema-k/sistema-k.json</code> contém todos dados exatamente como preencher no Index login.</p>
<div id="lista">Carregando...</div>
<script>
async function load(){
  try{
    const res = await fetch('_index.json');
    const txt = await res.text();
    let data; try{ data = JSON.parse(txt); }catch{ document.getElementById('lista').textContent='Sem _index.json'; return; }
    document.getElementById('lista').innerHTML = data.map(c=>'<div style="border:1px solid #222;padding:12px;margin:8px 0;border-radius:10px"><b>'+c.pasta_mae+'</b> - '+c.nome_completo+' - '+c.email+'<br/><small>'+c.arquivo+'</small> - <a href="'+c.pasta_mae+'/'+c.arquivo+'" target="_blank">ver JSON</a></div>').join('');
  }catch(e){ document.getElementById('lista').textContent='Erro: '+e.message; }
}
load();
</script>
</body></html>
