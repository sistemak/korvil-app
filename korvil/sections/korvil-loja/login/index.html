<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0A0A0A;color:#fff;font-family:Inter,system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:28px;width:100%;max-width:420px}
h1{color:#FF4D00;font-size:28px;letter-spacing:-1px}input{width:100%;background:#0A0A0A;border:1px solid #2a2a2a;border-radius:10px;padding:12px 14px;color:#fff;margin-top:10px}
button{width:100%;margin-top:14px;background:#FF4D00;color:#000;font-weight:800;padding:12px;border-radius:10px;border:0;cursor:pointer}
small{color:#888}
</style>
</head>
<body>
<div class="card">
<h1>KORVIL</h1><small>Crie sua conta - uso único</small>
<input id="nome" placeholder="Nome completo" />
<input id="email" placeholder="E-mail" />
<input id="senha" type="password" placeholder="Senha (min 6)" />
<input id="confirma" type="password" placeholder="Confirmar senha" />
<button id="btnCriar">CRIAR CONTA E COMMIT REAL</button>
<div id="log" style="margin-top:12px;font-size:12px;color:#aaa;white-space:pre-wrap"></div>
</div>
<script>
// CORREÇÃO: funciona no browser, sem Buffer
function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function gerarNomeArquivo(nomeCompleto){
  const partes = nomeCompleto.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().split(/\s+/).filter(Boolean);
  const primeiro = partes[0];
  const i2 = partes[1]?.[0] || '';
  const i3 = partes[2]?.[0] || '';
  let n = primeiro;
  if(i2) n += `-${i2}`;
  if(i3) n += `-${i3}`;
  return `${n}.json`;
}
// Primeiro uso único
if(localStorage.getItem('korvil_user') && localStorage.getItem('korvil_primeiro_uso_feito')){
  location.href='../index.html';
}
function validar(){
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const confirma = document.getElementById('confirma').value;
  if(nome.length < 3) throw new Error('Nome mínimo 3 letras');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('E-mail inválido');
  if(senha.length < 6) throw new Error('Senha mínimo 6');
  if(senha !== confirma) throw new Error('Senhas não conferem');
  return {nome,email,senha};
}
async function commitRealConta(nomeArq, conteudo, token){
  const path = `korvil/sections/korvil-loja/login/contas/${nomeArq}`;
  const url = `https://api.github.com/repos/sistemak/korvil-app/contents/${path}`;
  let sha;
  try{
    const getRes = await fetch(`${url}?ref=main`, {headers:{Authorization: `token ${token}`, Accept:'application/vnd.github.v3+json'}});
    if(getRes.ok){ const d = await getRes.json(); sha = d.sha; }
    else if(getRes.status !== 404){ const e = await getRes.json(); throw new Error(getRes.status+': '+e.message); }
  }catch(err){ if(!String(err).includes('404')) throw err; }
  const putRes = await fetch(url, {
    method:'PUT',
    headers:{Authorization: `token ${token}`, Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: JSON.stringify({
      message: `KORVIL AUTO: nova conta ${nomeArq}`,
      content: utf8ToBase64(JSON.stringify(conteudo,null,2)),
      sha: sha || undefined,
      branch:'main'
    })
  });
  const result = await putRes.json();
  if(!putRes.ok){
    if(putRes.status===401) throw new Error('Token inválido! Crie novo em github.com/settings/tokens/new com permissão repo');
    if(putRes.status===403) throw new Error('403 Rate limit ou sem permissão repo');
    throw new Error(`${putRes.status}: ${result.message}`);
  }
  return result;
}
document.getElementById('btnCriar').onclick = async ()=>{
  const log = document.getElementById('log');
  try{
    const {nome,email,senha} = validar();
    const token = localStorage.getItem('loja_github_token');
    if(!token) throw new Error('Cole token em TOKEN + COMMIT antes de criar conta');
    const nomeArq = gerarNomeArquivo(nome);
    const conteudo = {
      id: Date.now().toString(36),
      arquivo: nomeArq,
      nome_completo: nome,
      email,
      senha_hash: btoa(senha),
      cpf: '', whatsapp: '', cep:'', rua:'', numero:'', bairro:'', cidade:'', estado:'',
      foto_perfil: '',
      criado_em: new Date().toISOString(),
      atualizado_em: new Date().toISOString()
    };
    log.textContent = '→ commitando '+nomeArq+'...';
    await commitRealConta(nomeArq, conteudo, token);
    localStorage.setItem('korvil_user', JSON.stringify(conteudo));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    log.textContent += '\n✓ conta criada e commitado!';
    setTimeout(()=> location.href='../index.html', 900);
  }catch(e){ log.textContent = '✗ '+e.message; }
};
</script>
</body>
</html>
