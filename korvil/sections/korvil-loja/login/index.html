<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KORVIL - Criar Conta | Pasta Mãe + JSON Real</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:Inter,system-ui,Arial}
.top{border-bottom:2px solid #ff6a00;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.top b{color:#ff6a00;letter-spacing:2px}
.form-wrap{max-width:880px;margin:32px auto;padding:24px;border:1px solid #1f1f1f;border-radius:18px;background:#0a0a0a}
h1{margin:0 0 8px;font-size:28px}h1 span{color:#ff6a00}
label{font-size:12px;color:#aaa;display:block;margin:14px 0 6px;text-transform:uppercase;letter-spacing:1px}
input,select{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#111;color:#fff;outline:none}
input:focus{border-color:#ff6a00}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.btn{width:100%;margin-top:22px;padding:16px;border-radius:12px;border:0;background:#ff6a00;color:#000;font-weight:900;font-size:16px;cursor:pointer;letter-spacing:1px}
.btn:disabled{opacity:.5}
.preview{margin-top:18px;padding:14px;background:#111;border:1px dashed #333;border-radius:12px;font-family:monospace;font-size:12px;color:#ff8c42;word-break:break-all}
.foto-preview{width:92px;height:92px;border-radius:50%;object-fit:cover;border:2px solid #ff6a00;display:none;margin-top:10px}
</style>
</head>
<body>
<div class="top"><b>KORVIL LOJA</b><small id="pathPreview" style="color:#666"></small></div>
<div class="form-wrap">
<h1>CRIAR CONTA <span>→ PASTA MÃE + JSON</span></h1>
<p style="color:#777;font-size:13px;margin:0 0 18px">Todos os dados exatamente como preencher vão para <code>login/contas/{pasta-mae}/{pasta-mae}.json</code></p>

<label>Foto Perfil (1000161809.png)</label>
<input type="file" id="foto" accept="image/*"/>
<img id="fotoPrev" class="foto-preview"/>

<label>Nome Completo *</label>
<input id="nome" placeholder="Sistema K" required/>

<div class="grid2">
<div><label>Email *</label><input id="email" type="email" placeholder="sistemak.srv@gmail.com" required/></div>
<div><label>WhatsApp</label><input id="whatsapp" placeholder="(13)99769-0898"/></div>
</div>

<div class="grid2">
<div><label>Senha *</label><input id="senha" type="password" required/></div>
<div><label>Confirmar Senha *</label><input id="confSenha" type="password" required/></div>
</div>

<div class="grid2">
<div><label>CPF</label><input id="cpf" placeholder="453.814.988-88"/></div>
<div><label>CEP</label><input id="cep" placeholder="11250-524" maxlength="9"/></div>
</div>

<div class="grid2">
<div><label>Número</label><input id="numero" placeholder="2407"/></div>
<div><label>Rua</label><input id="rua" placeholder="Rua Oswaldo Cruz"/></div>
</div>

<div class="grid2">
<div><label>Bairro</label><input id="bairro" placeholder="Jardim Vicente de Carvalho"/></div>
<div><label>Cidade</label><input id="cidade" placeholder="Bertioga"/></div>
</div>

<div class="grid2">
<div><label>Estado UF</label><input id="estado" placeholder="SP" maxlength="2" style="text-transform:uppercase"/></div>
<div><label>ViaCEP Status</label><input id="viaStatus" disabled placeholder="Aguardando CEP..."/></div>
</div>

<button class="btn" id="btnCriar">CRIAR CONTA → PASTA MÃE + JSON</button>
<div class="preview" id="logBox">Pronto para criar...</div>
</div>

<script>
function gerarPastaMae(nome){
  const sem = nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9\s-]/g,'').trim();
  const partes = sem.split(/\s+/).filter(Boolean);
  if(!partes.length) return '';
  if(partes.length===1) return partes[0];
  const primeiro = partes[0];
  const iniciais = partes.slice(1).map(p=>p[0]);
  return [primeiro, ...iniciais].join('-');
}
async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
let fotoBase64 = '';

document.getElementById('foto').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    fotoBase64 = r.result;
    const img = document.getElementById('fotoPrev');
    img.src = fotoBase64;
    img.style.display='block';
  };
  r.readAsDataURL(file);
});

document.getElementById('cep').addEventListener('blur', async e=>{
  const cep = e.target.value.replace(/\D/g,'');
  if(cep.length!==8) return;
  document.getElementById('viaStatus').value='Buscando ViaCEP...';
  try{
    const res = await fetch('https://viacep.com.br/ws/'+cep+'/json/');
    const txt = await res.text();
    let data;
    try{ data = JSON.parse(txt); }catch{
      // Corrige Unexpected token '<' da foto - nunca res.json() direto
      document.getElementById('viaStatus').value='Erro ViaCEP, preencha manual';
      return;
    }
    if(data.erro){ document.getElementById('viaStatus').value='CEP não encontrado'; return; }
    document.getElementById('rua').value = data.logradouro || '';
    document.getElementById('bairro').value = data.bairro || '';
    document.getElementById('cidade').value = data.localidade || '';
    document.getElementById('estado').value = data.uf || '';
    document.getElementById('viaStatus').value='ViaCEP OK ✓';
  }catch(err){
    document.getElementById('viaStatus').value='Falha ViaCEP';
  }
});

document.getElementById('nome').addEventListener('input', e=>{
  const pm = gerarPastaMae(e.target.value);
  document.getElementById('pathPreview').textContent = pm ? 'login/contas/'+pm+'/'+pm+'.json' : '';
});

document.getElementById('btnCriar').addEventListener('click', async ()=>{
  const nome = document.getElementById('nome').value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const conf = document.getElementById('confSenha').value;
  const cpf = document.getElementById('cpf').value.trim();
  const whatsapp = document.getElementById('whatsapp').value.trim();
  const cep = document.getElementById('cep').value.trim();
  const numero = document.getElementById('numero').value.trim();
  const rua = document.getElementById('rua').value.trim();
  const bairro = document.getElementById('bairro').value.trim();
  const cidade = document.getElementById('cidade').value.trim();
  const estado = document.getElementById('estado').value.trim().toUpperCase();
  const log = document.getElementById('logBox');

  if(!nome || !email || !senha){ log.textContent='Preencha nome, email e senha *'; return; }
  if(senha!==conf){ log.textContent='Senhas não conferem'; return; }

  const pastaMae = gerarPastaMae(nome);
  const arquivo = pastaMae + '.json';
  const senha_hash = await sha256(senha);
  const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const agora = new Date().toISOString();
  const primeiro_nome = nome.split(/\s+/)[0];

  const conta = {
    id, arquivo, pasta_mae: pastaMae,
    nome_completo: nome,
    primeiro_nome,
    email, senha_hash,
    cpf, whatsapp, cep, rua, numero, bairro, cidade, estado,
    foto_perfil: fotoBase64 || '',
    criado_em: agora,
    atualizado_em: agora
  };

  log.textContent = 'Criando '+pastaMae+'/'+arquivo+' com todos dados exatamente como preencher...';

  // 1) Tenta Node API
  try{
    const res = await fetch('/api/criar-conta', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(conta)
    });
    const txt = await res.text();
    let json;
    try{ json = JSON.parse(txt); }catch{
      throw new Error('Resposta API não é JSON (corrige Unexpected token <): '+txt.slice(0,200));
    }
    if(!res.ok) throw new Error(json.error || 'Erro API');
    log.textContent = '✓ Pasta mãe criada via NODE: '+json.path;
    localStorage.setItem('korvil_user', JSON.stringify(conta));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    setTimeout(()=> location.href='../index.html', 800);
    return;
  }catch(e){
    console.warn('Node falhou, tentando Pages fallback', e);
    log.textContent = 'Node indisponível, tentando GitHub Pages com token interno... '+e.message;
  }

  // 2) Pages fallback: GitHub API PUT usando token interno salvo pelo MASTER MUDE
  try{
    const internalToken = localStorage.getItem('korvil_master_token') || localStorage.getItem('korvil_gh_token_internal');
    if(!internalToken){
      throw new Error('Sem GH_TOKEN interno. Rode o KORVIL MASTER MUDE e ative token.');
    }
    const path = 'korvil/sections/korvil-loja/login/contas/'+pastaMae+'/'+arquivo;
    const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(conta,null,2))));
    // verifica sha se existe
    let sha;
    try{
      const getRes = await fetch('https://api.github.com/repos/sistemak/korvil-app/contents/'+path+'?ref=main', {
        headers:{'Authorization':'Bearer '+internalToken}
      });
      if(getRes.ok){
        const j = await getRes.json();
        sha = j.sha;
      }
    }catch{}

    const putRes = await fetch('https://api.github.com/repos/sistemak/korvil-app/contents/'+path, {
      method:'PUT',
      headers:{
        'Authorization':'Bearer '+internalToken,
        'Content-Type':'application/json'
      },
      body: JSON.stringify({
        message: 'feat(contas): cria '+pastaMae+'/'+arquivo+' com todos dados exatos do Index login',
        content: contentB64,
        sha: sha,
        branch:'main'
      })
    });
    const putTxt = await putRes.text();
    let putJson;
    try{ putJson = JSON.parse(putTxt); }catch{ putJson = { raw: putTxt }; }
    if(!putRes.ok) throw new Error('GitHub PUT falhou: '+(putJson.message||putTxt).slice(0,300));

    log.textContent = '✓ Criado real em https://github.com/sistemak/korvil-app/tree/main/'+path;
    localStorage.setItem('korvil_user', JSON.stringify(conta));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    setTimeout(()=> location.href='../index.html', 1000);
  }catch(err){
    log.textContent = '✗ Erro final: '+err.message;
  }
});
</script>
</body>
</html>
