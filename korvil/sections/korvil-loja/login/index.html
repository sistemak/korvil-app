<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KORVIL — Criar Conta | SEM TOKEN</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#fff;font-family:'Space Grotesk',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#141414;border:1px solid #1F1F1F;border-radius:18px;width:100%;max-width:560px;padding:28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;background:#FF4D00;border-radius:12px;display:grid;place-items:center;font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#000}
.h1{font-family:'Syne',sans-serif;font-weight:800;letter-spacing:-.02em;font-size:22px}
.h1 span{color:#FF4D00}
.sub{color:#7A7A7A;font-size:12px;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#FF4D00;color:#000;font-weight:700;font-size:10px;letter-spacing:.08em;padding:5px 10px;border-radius:999px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{font-size:11px;color:#9A9A9A;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;display:block}
input,select{background:#0A0A0A;border:1px solid #262626;border-radius:12px;padding:13px 14px;color:#fff;width:100%;outline:none;font-size:14px;transition:.15s}
input:focus,select:focus{border-color:#FF4D00;box-shadow:0 0 0 3px rgba(255,77,0,.15)}
.row{display:flex;gap:10px}
.btn{background:#FF4D00;color:#000;border:none;border-radius:12px;padding:14px 16px;font-family:'Syne',sans-serif;font-weight:800;letter-spacing:.04em;width:100%;cursor:pointer;font-size:14px;transition:.15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.foto{display:flex;align-items:center;gap:12px;background:#0A0A0A;border:1px dashed #2A2A2A;border-radius:12px;padding:12px}
.foto img{width:48px;height:48px;border-radius:50%;object-fit:cover;background:#1A1A1A}
.mut{color:#666;font-size:12px}
.err{background:#2A1111;border:1px solid #5A2020;color:#FF8A8A;padding:10px 12px;border-radius:10px;font-size:13px;display:none;margin-bottom:12px}
.ok{background:#102A14;border:1px solid #1F5A26;color:#7CFF8E;padding:10px 12px;border-radius:10px;font-size:13px;display:none;margin-bottom:12px}
.link{color:#FF4D00;text-decoration:none;font-size:12px}
.link:hover{text-decoration:underline}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
  <div class="badge">● SEM TOKEN • NODE FILESYSTEM PURO</div>
  <div class="top">
    <div class="logo">K</div>
    <div>
      <div class="h1">KORVIL <span>STORE</span></div>
      <div class="sub">Criação de conta 100% via Node — cria pasta mãe + .json real</div>
    </div>
  </div>
  <div id="msgErr" class="err"></div>
  <div id="msgOk" class="ok"></div>
  <form id="formCriar" autocomplete="on">
    <div class="grid">
      <div class="full"><label>Foto de perfil</label><div class="foto"><img id="preview" src="" alt=""><input type="file" id="fotoInput" accept="image/*" style="border:none;padding:0"><span class="mut">opcional</span></div></div>
      <div class="full"><label>Nome completo *</label><input id="nome" required placeholder="João Silva Santos" /></div>
      <div class="full"><label>E-mail *</label><input id="email" type="email" required placeholder="joao@email.com" /></div>
      <div><label>Senha *</label><input id="senha" type="password" required placeholder="mín. 6" /></div>
      <div><label>Confirmar senha *</label><input id="confirma" type="password" required placeholder="repita" /></div>
      <div><label>CPF</label><input id="cpf" placeholder="000.000.000-00" /></div>
      <div><label>WhatsApp</label><input id="whats" placeholder="(11) 99999-9999" /></div>
      <div><label>CEP</label><input id="cep" placeholder="00000-000" /></div>
      <div><label>Número</label><input id="numero" placeholder="123" /></div>
      <div class="full"><label>Rua</label><input id="rua" placeholder="Rua das Flores" /></div>
      <div><label>Bairro</label><input id="bairro" placeholder="Centro" /></div>
      <div><label>Cidade</label><input id="cidade" placeholder="São Paulo" /></div>
      <div><label>Estado</label><select id="estado"><option value="">UF</option><option>AC</option><option>AL</option><option>AP</option><option>AM</option><option>BA</option><option>CE</option><option>DF</option><option>ES</option><option>GO</option><option>MA</option><option>MT</option><option>MS</option><option>MG</option><option>PA</option><option>PB</option><option>PR</option><option>PE</option><option>PI</option><option>RJ</option><option>RN</option><option>RS</option><option>RO</option><option>RR</option><option>SC</option><option>SP</option><option>SE</option><option>TO</option></select></div>
      <div><label>&nbsp;</label><div class="mut" id="viacepStatus">ViaCEP automático no CEP</div></div>
      <div class="full" style="margin-top:6px"><button class="btn" id="btnCriar" type="submit">CRIAR CONTA → PASTA MÃE + JSON</button></div>
      <div class="full" style="text-align:center;margin-top:10px"><span class="mut">Já tem conta? </span><a class="link" href="#" id="btnIrLogin">Fazer login</a></div>
    </div>
  </form>
  <form id="formLogin" style="display:none">
    <div class="grid">
      <div class="full"><label>E-mail</label><input id="loginEmail" type="email" required /></div>
      <div class="full"><label>Senha</label><input id="loginSenha" type="password" required /></div>
      <div class="full"><button class="btn" type="submit">ENTRAR NA LOJA</button></div>
      <div class="full" style="text-align:center;margin-top:10px"><a class="link" href="#" id="btnIrCriar">Criar nova conta</a></div>
    </div>
  </form>
</div>
<script>
const API = ''; // mesmo host
const fotoInput = document.getElementById('fotoInput');
const preview = document.getElementById('preview');
let fotoBase64 = '';
fotoInput?.addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ fotoBase64=r.result; preview.src=r.result; }; r.readAsDataURL(f);
});
const cepEl=document.getElementById('cep');
const ruaEl=document.getElementById('rua');
const bairroEl=document.getElementById('bairro');
const cidadeEl=document.getElementById('cidade');
const estadoEl=document.getElementById('estado');
const viacepStatus=document.getElementById('viacepStatus');
cepEl.addEventListener('blur', async()=>{
  const cep=cepEl.value.replace(/\D/g,''); if(cep.length!==8) return;
  viacepStatus.textContent='Buscando ViaCEP...';
  try{ const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/'); const d=await r.json(); if(d.erro){ viacepStatus.textContent='CEP não encontrado'; return; }
  ruaEl.value=d.logradouro||''; bairroEl.value=d.bairro||''; cidadeEl.value=d.localidade||''; estadoEl.value=d.uf||''; viacepStatus.textContent='ViaCEP OK ✓';
  }catch{ viacepStatus.textContent='Falha ViaCEP'; }
});

function showErr(t){ const e=document.getElementById('msgErr'); e.textContent=t; e.style.display='block'; setTimeout(()=>e.style.display='none',4000); }
function showOk(t){ const e=document.getElementById('msgOk'); e.textContent=t; e.style.display='block'; }

if(localStorage.getItem('korvil_user') && localStorage.getItem('korvil_primeiro_uso_feito')){
  showOk('Conta já criada — indo para loja...'); setTimeout(()=>location.href='../index.html',800);
}

document.getElementById('btnIrLogin').onclick=(e)=>{ e.preventDefault(); document.getElementById('formCriar').style.display='none'; document.getElementById('formLogin').style.display='block'; };
document.getElementById('btnIrCriar').onclick=(e)=>{ e.preventDefault(); document.getElementById('formLogin').style.display='none'; document.getElementById('formCriar').style.display='block'; };

document.getElementById('formCriar').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const nome_completo=document.getElementById('nome').value.trim();
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  const confirma=document.getElementById('confirma').value;
  const cpf=document.getElementById('cpf').value.trim();
  const whatsapp=document.getElementById('whats').value.trim();
  const cep=document.getElementById('cep').value.trim();
  const rua=document.getElementById('rua').value.trim();
  const numero=document.getElementById('numero').value.trim();
  const bairro=document.getElementById('bairro').value.trim();
  const cidade=document.getElementById('cidade').value.trim();
  const estado=document.getElementById('estado').value.trim();
  if(nome_completo.length<3){ showErr('Nome mínimo 3 letras'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showErr('E-mail inválido'); return; }
  if(senha.length<6){ showErr('Senha mínimo 6'); return; }
  if(senha!==confirma){ showErr('Senhas não conferem'); return; }
  const btn=document.getElementById('btnCriar'); btn.disabled=true; btn.textContent='CRIANDO PASTA MÃE...';
  try{
    const res=await fetch('/api/criar-conta',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome_completo,email,senha,cpf,whatsapp,cep,rua,numero,bairro,cidade,estado,foto_perfil:fotoBase64})});
    const data=await res.json();
    if(!res.ok || !data.ok){ throw new Error(data.erro||'Erro ao criar'); }
    const user={...data.conta, senha:undefined};
    localStorage.setItem('korvil_user', JSON.stringify(user));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    showOk('Conta criada! Pasta mãe: '+data.pastaMae+' → indo para loja');
    setTimeout(()=>location.href='../index.html',1100);
  }catch(err){ showErr(err.message); btn.disabled=false; btn.textContent='CRIAR CONTA → PASTA MÃE + JSON'; }
});

document.getElementById('formLogin').addEventListener('submit', async(e)=>{
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const senha=document.getElementById('loginSenha').value;
  try{
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
    const data=await res.json(); if(!res.ok||!data.ok) throw new Error(data.erro||'Login falhou');
    localStorage.setItem('korvil_user', JSON.stringify(data.conta)); localStorage.setItem('korvil_primeiro_uso_feito','1');
    location.href='../index.html';
  }catch(err){ showErr(err.message); }
});
</script>
</body>
</html>
