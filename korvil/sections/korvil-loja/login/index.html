<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KORVIL | Criar Conta</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{background:#0A0A0A;color:#fff;font-family:Inter,system-ui}
  .korvil-input{background:#151515;border:1px solid #222;padding:12px 14px;border-radius:12px;width:100%;outline:none;color:#fff}
  .korvil-input:focus{border-color:#FF4D00}
  .foto-wrap{width:84px;height:84px;border-radius:999px;overflow:hidden;background:#151515;border:2px solid #222;position:relative}
  .foto-wrap img{width:100%;height:100%;object-fit:contain;background:#0A0A0A}
  .lapis{position:absolute;right:-2px;bottom:-2px;background:#FF4D00;width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;border:2px solid #0A0A0A}
</style>
</head>
<body class="min-h-screen">
<div id="app" class="max-w-[720px] mx-auto px-6 py-8">
  <!-- TOPO -->
  <div class="flex items-center justify-between mb-8">
    <div class="flex items-center gap-4">
      <div class="foto-wrap" id="fotoWrap">
        <img id="previewFoto" src="https://i.pravatar.cc/200?img=1" alt="foto"/>
        <div class="lapis" id="btnFoto">✎</div>
      </div>
      <div>
        <h1 class="text-[22px] font-black tracking-tight">KORVIL LOJA</h1>
        <p class="text-[11px] tracking-[0.2em] text-zinc-500 -mt-1">CRIAR CONTA • PRIMEIRO USO ÚNICO</p>
      </div>
    </div>
    <div class="text-[10px] px-2 py-1 rounded-full border border-zinc-800 text-zinc-500">LOGIN/INDEX</div>
  </div>

  <!-- FORM -->
  <div class="bg-[#111111] border border-zinc-900 rounded-[20px] p-6 md:p-8">
    <h2 class="font-bold text-[18px] mb-1">Crie sua conta KORVIL</h2>
    <p class="text-zinc-500 text-[13px] mb-6">Preencha tudo. Ao criar, geramos pasta mãe + JSON no repo: <span class="text-white">contas/{pasta}/{arquivo}</span></p>
    
    <input type="file" id="inputFoto" accept="image/*" class="hidden"/>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="md:col-span-2"><label class="text-[11px] text-zinc-500">NOME COMPLETO *</label><input id="nome" class="korvil-input mt-1" placeholder="João Silva Santos"/></div>
      <div><label class="text-[11px] text-zinc-500">EMAIL *</label><input id="email" class="korvil-input mt-1" placeholder="joao@email.com"/></div>
      <div><label class="text-[11px] text-zinc-500">SENHA *</label><input id="senha" type="password" class="korvil-input mt-1" placeholder="••••••••"/></div>
      <div><label class="text-[11px] text-zinc-500">CPF *</label><input id="cpf" class="korvil-input mt-1" placeholder="000.000.000-00"/></div>
      <div><label class="text-[11px] text-zinc-500">WHATSAPP *</label><input id="zap" class="korvil-input mt-1" placeholder="(11) 99999-9999"/></div>
      <div><label class="text-[11px] text-zinc-500">CEP *</label><input id="cep" class="korvil-input mt-1" placeholder="00000-000"/></div>
      <div class="md:col-span-2"><label class="text-[11px] text-zinc-500">RUA</label><input id="rua" class="korvil-input mt-1"/></div>
      <div><label class="text-[11px] text-zinc-500">NÚMERO *</label><input id="numero" class="korvil-input mt-1" placeholder="123"/></div>
      <div><label class="text-[11px] text-zinc-500">BAIRRO</label><input id="bairro" class="korvil-input mt-1"/></div>
      <div><label class="text-[11px] text-zinc-500">CIDADE</label><input id="cidade" class="korvil-input mt-1"/></div>
      <div><label class="text-[11px] text-zinc-500">ESTADO</label><input id="estado" class="korvil-input mt-1"/></div>
    </div>

    <button id="btnCriar" class="mt-8 w-full bg-[#FF4D00] hover:bg-[#e64500] text-black font-black py-4 rounded-[14px] tracking-wide">CRIAR CONTA E ENTRAR NA LOJA →</button>
    <div class="mt-4 text-center text-[12px] text-zinc-500">Já tem conta? <button id="btnIrLogin" class="text-white underline">Fazer login</button></div>
    <div id="log" class="mt-4 text-[11px] text-zinc-500 whitespace-pre-wrap"></div>
  </div>

  <!-- LOGIN SIMPLES -->
  <div id="boxLogin" class="hidden mt-6 bg-[#111111] border border-zinc-900 rounded-[20px] p-6">
    <h3 class="font-bold">Entrar</h3>
    <input id="loginEmail" class="korvil-input mt-3" placeholder="email"/>
    <input id="loginSenha" type="password" class="korvil-input mt-3" placeholder="senha"/>
    <button id="btnLogin" class="mt-3 w-full bg-white text-black font-bold py-3 rounded-[12px]">ENTRAR</button>
  </div>
</div>

<script>
// CONFIG - usar secrets via localStorage do lojista ou window.KORVIL_GITHUB
const GH = {
  owner: localStorage.getItem('korvil_github_owner')||'SEU_OWNER',
  repo: localStorage.getItem('korvil_github_repo')||'SEU_REPO',
  branch: localStorage.getItem('korvil_github_branch')||'main',
  token: localStorage.getItem('loja_github_token')||''
};

// 1) PRIMEIRO USO ÚNICO
(function checkPrimeiroUso(){
  const user = localStorage.getItem('korvil_user');
  const feito = localStorage.getItem('korvil_primeiro_uso_feito');
  if(user && feito){ location.href='../index.html'; }
})();

let fotoBase64 = '';
const $ = (id)=>document.getElementById(id);
$('btnFoto').onclick=()=>$('inputFoto').click();
$('inputFoto').onchange=(e)=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ fotoBase64=r.result; $('previewFoto').src=fotoBase64; };
  r.readAsDataURL(f);
};

// ViaCEP
$('cep').addEventListener('blur', async ()=>{
  let cep=$('cep').value.replace(/\D/g,''); if(cep.length!==8) return;
  try{
    const j=await (await fetch('https://viacep.com.br/ws/'+cep+'/json/')).json();
    if(!j.erro){ $('rua').value=j.logradouro; $('bairro').value=j.bairro; $('cidade').value=j.localidade; $('estado').value=j.uf; }
  }catch{}
});

function gerarNomeArquivo(nomeCompleto){
  const partes=nomeCompleto.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if(partes.length===0) return {arquivo:'user.json', pastaMae:'user'};
  if(partes.length===1) return {arquivo: partes[0]+'.json', pastaMae: partes[0]};
  if(partes.length===2){
    const arq = `${partes[0]}-${partes[1][0]}.json`;
    return {arquivo: arq, pastaMae: arq.replace('.json','')};
  }
  // 3+ => nome-inicial segundo-inicial terceiro ex: joao-s-s
  const arq = `${partes[0]}-${partes[1][0]}-${partes[2][0]}.json`.replace(/[^a-z0-9-]/g,'');
  return {arquivo: arq, pastaMae: arq.replace('.json','')};
}

async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function githubPut(path, contentStr, msg){
  const api='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+path;
  let sha=null;
  const get=await fetch(api+'?ref='+GH.branch, {headers:{Authorization:'token '+GH.token}});
  if(get.ok){ const j=await get.json(); sha=j.sha; }
  const body={message:msg, content:btoa(unescape(encodeURIComponent(contentStr))), branch:GH.branch};
  if(sha) body.sha=sha;
  const put=await fetch(api,{method:'PUT',headers:{Authorization:'token '+GH.token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!put.ok) throw new Error('PUT falhou '+await put.text());
  return await put.json();
}

$('btnIrLogin').onclick=()=>{$('boxLogin').classList.toggle('hidden');};
$('btnLogin').onclick=async ()=>{
  // login busca JSON por email
  const email=$('loginEmail').value.trim().toLowerCase();
  const senha=$('loginSenha').value;
  const hash=await sha256(senha);
  // busca lista em contas/
  const api='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/korvil/sections/korvil-loja/login/contas?ref='+GH.branch;
  const r=await fetch(api,{headers:{Authorization:'token '+GH.token}});
  const files=await r.json();
  for(const f of files){ if(f.type!=='file') continue;
    const c=await (await fetch(f.download_url)).text(); try{ const j=JSON.parse(c); if(j.email.toLowerCase()===email && j.senha_hash===hash){
      localStorage.setItem('korvil_user', JSON.stringify(j));
      localStorage.setItem('korvil_primeiro_uso_feito','1');
      location.href='../index.html'; return;
    }}catch{}
  }
  alert('Email ou senha inválidos');
};

$('btnCriar').onclick=async ()=>{
  const nome=$('nome').value.trim();
  const email=$('email').value.trim().toLowerCase();
  const senha=$('senha').value;
  const cpf=$('cpf').value.trim();
  const zap=$('zap').value.trim();
  const cep=$('cep').value.trim();
  const rua=$('rua').value.trim();
  const numero=$('numero').value.trim();
  const bairro=$('bairro').value.trim();
  const cidade=$('cidade').value.trim();
  const estado=$('estado').value.trim();
  if(!nome||!email||!senha||!cpf||!zap||!cep||!numero){ alert('Preencha todos obrigatórios'); return; }
  if(!GH.token){ alert('Configure GH token no localStorage loja_github_token'); return; }
  $('log').textContent='Gerando hash e nomes...';
  const {arquivo,pastaMae}=gerarNomeArquivo(nome);
  const primeiro=nome.split(/\s+/)[0];
  const id='korvil_'+Date.now();
  const hash=await sha256(senha);
  const agora=new Date().toISOString();
  const conta={
    id, arquivo, pasta_mae:pastaMae,
    nome_completo:nome, primeiro_nome:primeiro,
    email, senha_hash:hash, cpf, whatsapp:zap,
    cep, rua, numero, bairro, cidade, estado,
    foto_perfil:fotoBase64||'', criado_em:agora, atualizado_em:agora,
    enderecos:[{cep,rua,numero,bairro,cidade,estado,tipo:'principal'}]
  };
  const conteudo=JSON.stringify(conta,null,2);
  try{
    $('log').textContent='Criando pasta mãe '+pastaMae+' e arquivo '+arquivo+'...';
    // path 1: contas/{pastaMae}/{arquivo}
    await githubPut('korvil/sections/korvil-loja/login/contas/'+pastaMae+'/'+arquivo, conteudo, 'KORVIL: cria conta '+arquivo);
    // path 2: contas/{arquivo} (compat)
    await githubPut('korvil/sections/korvil-loja/login/contas/'+arquivo, conteudo, 'KORVIL: mirror conta '+arquivo);
    $('log').textContent='Conta criada! Salvando sessão...';
    localStorage.setItem('korvil_user', JSON.stringify(conta));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    location.href='../index.html';
  }catch(e){ $('log').textContent='Erro: '+e.message; alert(e.message); }
};
</script>
</body>
</html>
