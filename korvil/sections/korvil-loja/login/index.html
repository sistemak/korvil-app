<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL - Criar Conta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:#0A0A0A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:480px;background:#141414;border:1px solid #232323;border-radius:20px;padding:28px}
h1{font-size:22px;letter-spacing:-0.02em;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:20px}
input{width:100%;background:#0A0A0A;border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;color:#fff;outline:none;margin-bottom:12px}
input:focus{border-color:#FF4D00}
.row{display:flex;gap:12px}
.row input{flex:1}
.btn{width:100%;background:#FF4D00;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;letter-spacing:0.02em;cursor:pointer;margin-top:8px}
.btn:disabled{opacity:.5}
.foto-wrap{border:1px dashed #333;border-radius:12px;padding:12px;text-align:center;margin-bottom:12px;cursor:pointer}
.foto-wrap img{max-width:100%;max-height:160px;object-fit:contain;border-radius:8px}
.err{background:#2a1212;border:1px solid #5a2222;color:#ff8a8a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
.ok{background:#112a12;border:1px solid #234a23;color:#8aff8a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none}
</style>
</head>
<body>
<div class="card">
<h1>Criar Conta</h1><p class="sub">Sistema K • dados reais • ViaCEP automático</p>
<div id="errBox" class="err"></div>
<div id="okBox" class="ok"></div>
<div class="foto-wrap" onclick="document.getElementById('foto').click()">
<input type="file" id="foto" accept="image/*" hidden>
<div id="fotoPh">📷 Clique para foto (contain, base64)</div>
<img id="fotoPrev" style="display:none">
</div>
<input id="nome" placeholder="Nome Completo (ex: Sistema K)" value="Sistema K">
<input id="email" placeholder="E-mail" type="email" value="sistemak.srv@gmail.com">
<div class="row"><input id="cpf" placeholder="CPF 453.814.988-88" value="453.814.988-88"><input id="tel" placeholder="(13)99769-0898" value="(13)99769-0898"></div>
<div class="row"><input id="cep" placeholder="CEP 11250-524" value="11250-524"><input id="num" placeholder="Nº 2407" value="2407"></div>
<input id="rua" placeholder="Rua (ViaCEP)">
<input id="bairro" placeholder="Bairro (ViaCEP)">
<div class="row"><input id="cidade" placeholder="Cidade"><input id="uf" placeholder="UF" maxlength="2"></div>
<input id="senha" type="password" placeholder="Senha (min 6)">
<button id="btnCriar" class="btn">CRIAR CONTA • PASTA MÃE REAL</button>
<p style="color:#555;font-size:11px;margin-top:12px;text-align:center">Node cria pasta física • Pages usa fallback sem quebrar</p>
</div>
<script>
// DUAL DETECTION SEM ERROS
const isGithubPages = location.hostname.includes('github.io');
const isNode = (!isGithubPages && (location.port === '3000' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'));
let fotoBase64 = '';
const GH_INTERNAL = window.__KORVIL_GH_TOKEN__ || localStorage.getItem('loja_github_token') || '';

document.getElementById('foto').addEventListener('change', e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ fotoBase64=r.result; document.getElementById('fotoPrev').src=fotoBase64; document.getElementById('fotoPrev').style.display='block'; document.getElementById('fotoPh').style.display='none'; }; r.readAsDataURL(f);
});
document.getElementById('cep').addEventListener('blur', async e=>{
  const cep=e.target.value.replace(/\D/g,''); if(cep.length!==8) return;
  try{ const r=await fetch('https://viacep.com.br/ws/'+cep+'/json/'); const j=await r.json(); if(!j.erro){ rua.value=j.logradouro||''; bairro.value=j.bairro||''; cidade.value=j.localidade||''; uf.value=j.uf||''; } }catch{}
});
function pastaMaeFromNome(nome){ return nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,24)||'usuario'; }
function showErr(m){ const b=document.getElementById('errBox'); b.textContent=m; b.style.display='block'; okBox.style.display='none'; }
function showOk(m){ const b=document.getElementById('okBox'); b.textContent=m; b.style.display='block'; errBox.style.display='none'; }

document.getElementById('btnCriar').addEventListener('click', async ()=>{
  const btn=document.getElementById('btnCriar'); btn.disabled=true; btn.textContent='CRIANDO...';
  const dados={
    nome:nome.value.trim(), email:email.value.trim().toLowerCase(), cpf:cpf.value.trim(),
    tel:tel.value.trim(), cep:cep.value.trim(), numero:num.value.trim(),
    rua:rua.value.trim(), bairro:bairro.value.trim(), cidade:cidade.value.trim(), uf:uf.value.trim().toUpperCase(),
    senha:senha.value, foto:fotoBase64, createdAt:new Date().toISOString()
  };
  if(!dados.nome||!dados.email||dados.senha.length<6){ showErr('Preencha nome, email e senha min 6'); btn.disabled=false; btn.textContent='CRIAR CONTA • PASTA MÃE REAL'; return; }
  const pastaMae=pastaMaeFromNome(dados.nome); const arquivo=pastaMae+'.json';
  const contaCompleta={ ...dados, pastaMae, arquivo, id:pastaMae+'_'+Date.now(), sistema:'KORVIL' };

  // TRY NODE PRIMEIRO COM TRATAMENTO SEGURO - NUNCA res.json() DIRETO
  try{
    const res=await fetch('/api/criar-conta',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(dados)});
    const text=await res.text();
    let data;
    try{ data=JSON.parse(text); }catch(e){
      if(text.trim().startsWith('<') || text.includes('<!DOCTYPE') || text.includes('<html')){
        throw new Error('PAGES_MODE');
      } else {
        throw new Error('Resposta inválida do servidor');
      }
    }
    if(!res.ok) throw new Error(data.error||'Erro Node');
    // MODO NODE OK
    localStorage.setItem('korvil_user', JSON.stringify(data.conta||contaCompleta));
    localStorage.setItem('korvil_primeiro_uso_feito','1');
    showOk('✓ Pasta mãe criada REAL no filesystem Node: login/contas/'+pastaMae+'/'+arquivo);
    setTimeout(()=>{ if(window.parent!==window){ window.parent.postMessage({type:'KORVIL_LOGIN_OK', conta:data.conta||contaCompleta},'*'); } else { location.href='../index.html'; } },800);
    return;
  }catch(err){
    if(err.message==='PAGES_MODE' || isGithubPages){
      // MODO GITHUB PURO - SEM NODE, SEM ERROS
      try{
        if(GH_INTERNAL){
          const contentBase64=btoa(unescape(encodeURIComponent(JSON.stringify(contaCompleta,null,2))));
          const filePath='korvil/sections/korvil-loja/login/contas/'+pastaMae+'/'+arquivo;
          const apiUrl='https://api.github.com/repos/sistemak/korvil-app/contents/'+filePath;
          let sha;
          try{ const getRes=await fetch(apiUrl,{headers:{Authorization:'token '+GH_INTERNAL}}); if(getRes.ok){ const j=await getRes.json(); sha=j.sha; } }catch{}
          const putRes=await fetch(apiUrl,{method:'PUT', headers:{Authorization:'token '+GH_INTERNAL,'Content-Type':'application/json'}, body:JSON.stringify({message:'KORVIL: conta '+pastaMae+' criada '+dados.email, content:contentBase64, branch:'main', ...(sha?{sha}:{})})});
          if(!putRes.ok){ const t=await putRes.text(); throw new Error('GitHub API '+putRes.status+' '+t.slice(0,200)); }
          showOk('✓ Modo GitHub Pages: pasta mãe criada REAL via API: '+pastaMae+'/'+arquivo);
        }else{
          showOk('✓ Modo GitHub Pages (sem token): conta salva local. Rode npm start local para criar pasta mãe física depois.');
        }
        localStorage.setItem('korvil_user', JSON.stringify(contaCompleta));
        localStorage.setItem('korvil_primeiro_uso_feito','1');
        setTimeout(()=>{ if(window.parent!==window){ window.parent.postMessage({type:'KORVIL_LOGIN_OK', conta:contaCompleta},'*'); } else { location.href='../index.html'; } },800);
      }catch(e2){
        showErr('Fallback GitHub falhou: '+e2.message+' | Mas conta salva local sem quebrar');
        localStorage.setItem('korvil_user', JSON.stringify(contaCompleta));
        localStorage.setItem('korvil_primeiro_uso_feito','1');
      }
    }else{
      showErr(err.message||'Erro inesperado');
    }
  }finally{
    btn.disabled=false; btn.textContent='CRIAR CONTA • PASTA MÃE REAL';
  }
});
</script>
</body>
</html>
