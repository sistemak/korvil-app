<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KORVIL - Criar Conta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#0A0A0A;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#141414;border:1px solid #222;border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
h1{font-size:22px;font-weight:900;letter-spacing:-0.02em}
h1 span{color:#FF4D00}
input,button{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2a2a2a;background:#0A0A0A;color:#fff;font-size:14px;outline:none}
input:focus{border-color:#FF4D00}
button{cursor:pointer;font-weight:800;transition:.2s}
.btn-main{background:#FF4D00;color:#000;border:none}
.btn-main:hover{background:#ff5e1a}
.btn-ghost{background:#222;color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
small.mut{color:#888;font-size:11px}
#tokenBox{background:#0A0A0A;border:1px dashed #FF4D00;border-radius:10px;padding:12px;margin-bottom:14px}
</style>
</head>
<body>
<div class="card">
  <!-- TOKEN BOX CORRIGIDO - NÃO BLOQUEIA COM ALERT -->
  <div id="tokenBox">
    <small style="color:#FF4D00;font-weight:800;letter-spacing:0.08em">GH_TOKEN necessário para commit real direto no repo</small>
    <input id="ghToken" type="password" placeholder="Cole ghp_... aqui" style="margin-top:8px" />
    <div style="display:flex;gap:8px;margin-top:8px">
      <button id="btnSalvarToken" style="flex:1;background:#FF4D00;color:#000;padding:8px;border-radius:8px;font-size:12px;font-weight:800">SALVAR TOKEN</button>
      <button id="btnValidarToken" style="flex:1;background:#222;color:#fff;padding:8px;border-radius:8px;font-size:12px">VALIDAR</button>
    </div>
    <div id="tokenStatus" style="margin-top:8px;font-size:11px;color:#888">Token não configurado. Crie em github.com/settings/tokens/new (scope repo)</div>
  </div>

  <h1>KORVIL <span>LOJA</span></h1>
  <p style="color:#666;font-size:13px;margin:6px 0 18px">Criar conta com commit real + pasta mãe</p>

  <div style="display:flex;flex-direction:column;gap:10px">
    <input id="nome_completo" placeholder="Nome completo" />
    <div class="grid2"><input id="primeiro_nome" placeholder="Primeiro nome" /><input id="cpf" placeholder="CPF" /></div>
    <input id="email" type="email" placeholder="E-mail" />
    <input id="senha" type="password" placeholder="Senha" />
    <div class="grid2"><input id="whatsapp" placeholder="WhatsApp" /><input id="cep" placeholder="CEP" /></div>
    <div class="grid2"><input id="rua" placeholder="Rua" /><input id="numero" placeholder="Número" /></div>
    <div class="grid2"><input id="bairro" placeholder="Bairro" /><input id="cidade" placeholder="Cidade" /></div>
    <div class="grid2"><input id="estado" placeholder="UF" /><input id="foto_perfil" placeholder="Foto URL (opcional)" /></div>
    <button id="btnCriar" class="btn-main" style="margin-top:6px">CRIAR CONTA AGORA</button>
    <div id="formStatus" style="font-size:12px;color:#888;min-height:18px"></div>
  </div>
</div>

<script>
const LS_TOKEN = 'loja_github_token';
const REPO_OWNER = 'sistemak';
const REPO_NAME = 'korvil-app';
const BRANCH = 'main';

function utf8ToBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function gerarNomeArquivo(nome,email){
  const base = (nome||'user').toLowerCase().normalize('NFD').replace(/[\W_]+/g,'-').replace(/^-|-$/g,'').slice(0,24);
  const mail = (email||'').split('@')[0].toLowerCase().replace(/\W/g,'').slice(0,12);
  return base + '-' + mail + '-' + Date.now().toString(36) + '.json';
}
function gerarPastaMae(nomeArq){ return nomeArq.replace('.json',''); }

function maskToken(t){ if(!t) return ''; if(t.length<=8) return t.slice(0,3)+'***'; return t.slice(0,7)+'***'+t.slice(-4); }

async function validarToken(token){
  const r = await fetch('https://api.github.com/user',{ headers:{ Authorization:'token '+token, Accept:'application/vnd.github.v3+json' } });
  if(r.status===401) throw new Error('Token inválido. Crie em github.com/settings/tokens/new com scope repo');
  if(r.status===403) throw new Error('Rate limit / token sem permissão repo');
  if(!r.ok){ const txt=await r.text(); throw new Error('Erro validação: '+r.status+' '+txt.slice(0,120)); }
  return await r.json();
}

async function commitRealConta(dados){
  let token = localStorage.getItem(LS_TOKEN) || document.getElementById('ghToken').value.trim();
  if(!token){
    document.getElementById('tokenBox').style.display='block';
    document.getElementById('tokenBox').scrollIntoView({behavior:'smooth'});
    throw new Error('Cole seu GH_TOKEN no campo acima e clique SALVAR TOKEN antes de criar conta');
  }
  const nomeArq = gerarNomeArquivo(dados.nome_completo, dados.email);
  const pastaMae = gerarPastaMae(nomeArq);
  const pathMae = `korvil/sections/korvil-loja/login/contas/${pastaMae}/${nomeArq}`;
  const pathCompat = `korvil/sections/korvil-loja/login/contas/${nomeArq}`;

  const payloadObj = {
    id: Date.now().toString(36)+Math.random().toString(36).slice(2,8),
    arquivo: nomeArq,
    pasta_mae: pastaMae,
    nome_completo: dados.nome_completo,
    primeiro_nome: dados.primeiro_nome || dados.nome_completo.split(' ')[0],
    email: dados.email,
    senha_hash: btoa(dados.senha||''),
    cpf: dados.cpf,
    whatsapp: dados.whatsapp,
    cep: dados.cep,
    rua: dados.rua,
    numero: dados.numero,
    bairro: dados.bairro,
    cidade: dados.cidade,
    estado: dados.estado,
    foto_perfil: dados.foto_perfil||'',
    criado_em: new Date().toISOString(),
    atualizado_em: new Date().toISOString()
  };
  const conteudo = utf8ToBase64(JSON.stringify(payloadObj,null,2));

  async function putFile(path){
    const urlGet = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}?ref=${BRANCH}`;
    let sha;
    try{
      const g = await fetch(urlGet,{ headers:{ Authorization:'token '+token, Accept:'application/vnd.github.v3+json' } });
      if(g.ok){ const j=await g.json(); sha=j.sha; }
      else if(g.status!==404){ const t=await g.text(); throw new Error('GET '+path+' '+g.status+' '+t.slice(0,200)); }
    }catch(e){ if(!(' + "'404'" + '.includes(e.message))) throw e; }

    const urlPut = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`;
    const body={ message: `KORVIL AUTO: nova conta ${nomeArq}`, content: conteudo, branch: BRANCH, ...(sha?{sha}:{}) };
    const r = await fetch(urlPut,{ method:'PUT', headers:{ Authorization:'token '+token, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' }, body: JSON.stringify(body) });
    if(!r.ok){
      const txt=await r.text();
      if(r.status===401) throw new Error('Token inválido (401). Gere novo com scope repo');
      if(r.status===403) throw new Error('403 sem permissão/rate limit: '+txt.slice(0,200));
      throw new Error('PUT '+path+' falhou '+r.status+' '+txt.slice(0,300));
    }
    return await r.json();
  }

  const resMae = await putFile(pathMae);
  try{ await putFile(pathCompat); }catch(e){ console.warn('Compat opcional falhou',e); }
  return { nomeArq, pastaMae, pathMae, resMae, payloadObj };
}

document.addEventListener('DOMContentLoaded', ()=>{
  const $token = document.getElementById('ghToken');
  const $status = document.getElementById('tokenStatus');
  const saved = localStorage.getItem(LS_TOKEN);
  if(saved){ $token.value=saved; $status.textContent='Token carregado: '+maskToken(saved)+' (salvo)'; $status.style.color='#2ecc71'; }

  document.getElementById('btnSalvarToken').onclick=()=>{
    const t=$token.value.trim(); if(!t){ $status.textContent='Cole um token válido ghp_...'; $status.style.color='#ff4d00'; return; }
    localStorage.setItem(LS_TOKEN,t); $status.textContent='Token salvo! '+maskToken(t); $status.style.color='#2ecc71';
  };
  document.getElementById('btnValidarToken').onclick=async()=>{
    const t=($token.value.trim()||localStorage.getItem(LS_TOKEN)||''); if(!t){ $status.textContent='Nenhum token para validar'; return; }
    $status.textContent='Validando...'; $status.style.color='#888';
    try{ const u=await validarToken(t); $status.textContent='Válido @'+u.login+' ✓ commit real liberado'; $status.style.color='#2ecc71'; }
    catch(e){ $status.textContent=e.message; $status.style.color='#ff4d00'; }
  };

  // primeiro uso único
  const user = localStorage.getItem('korvil_user');
  const primeiro = localStorage.getItem('korvil_primeiro_uso_feito');
  if(user && primeiro){
    const tb = document.getElementById('tokenBox');
    if(!tb || getComputedStyle(tb).display==='none'){ location.href='../index.html'; }
  }

  document.getElementById('btnCriar').onclick=async()=>{
    const $formStatus=document.getElementById('formStatus');
    const dados={
      nome_completo: document.getElementById('nome_completo').value.trim(),
      primeiro_nome: document.getElementById('primeiro_nome').value.trim(),
      email: document.getElementById('email').value.trim(),
      senha: document.getElementById('senha').value,
      cpf: document.getElementById('cpf').value.trim(),
      whatsapp: document.getElementById('whatsapp').value.trim(),
      cep: document.getElementById('cep').value.trim(),
      rua: document.getElementById('rua').value.trim(),
      numero: document.getElementById('numero').value.trim(),
      bairro: document.getElementById('bairro').value.trim(),
      cidade: document.getElementById('cidade').value.trim(),
      estado: document.getElementById('estado').value.trim(),
      foto_perfil: document.getElementById('foto_perfil').value.trim()
    };
    if(!dados.nome_completo || !dados.email || !dados.senha){ $formStatus.textContent='Preencha nome, email e senha'; $formStatus.style.color='#ff4d00'; return; }
    $formStatus.textContent='Criando conta + pasta mãe...'; $formStatus.style.color='#888';
    try{
      const r=await commitRealConta(dados);
      localStorage.setItem('korvil_user', JSON.stringify(r.payloadObj));
      localStorage.setItem('korvil_primeiro_uso_feito','1');
      $formStatus.textContent='Conta criada! '+r.pastaMae+'/'+r.nomeArq+' → indo para loja...'; $formStatus.style.color='#2ecc71';
      setTimeout(()=>location.href='../index.html',900);
    }catch(e){
      $formStatus.textContent=e.message; $formStatus.style.color='#ff4d00';
      console.error(e);
    }
  };
});
</script>
</body>
</html>
