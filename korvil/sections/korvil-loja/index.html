];const setores={"SISTEMA-K":{"Eletricista":["multímetro","maleta","materiais"]},"TECNOLOGIAS":{"Eletrônicos":["celulares"]},"K-TP":{"Suplementos":["Whey"]},"K-AFORTUNADO":{"Empreendedorismo":["ebook"]},"K-ALMA":{"Massoterapia":["oleo"]}};function renderFiltros(){let h='';for(const s in setores){h+=`<div class="mt-3 font-bold border-b cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">${s}</div><div class="hidden ml-2">`;for(const c in setores[s]){h+=`<div class="mt-2 font-semibold cursor-pointer" onclick="this.nextElementSibling.classList.toggle('hidden')">> ${c}</div><div class="hidden ml-3">`;setores[s][c].forEach(i=>{h+=`<div onclick="filtrar('${i}')">${i}</div>`});h+=`</div>`;}h+=`</div>`;}document.getElementById('filtros').innerHTML=h;}function renderVitrine(l=produtos){document.getElementById('vitrine').innerHTML=l.map(p=>`<div class="bg-white rounded-xl border shadow p-2"><img src="${p.foto}" class="h-32 object-cover rounded"/><div class="text-[10px]">${p.codigo}</div><div class="font-bold text-sm">${p.nome}</div><div class="font-black text-[#b89600]">R$ ${p.preco}</div><button onclick="location.href='${p.link}'" class="mt-2 bg-[#FFD700] w-full py-1 rounded font-bold">Comprar</button></div>`).join('');}function filtrar(q){renderVitrine(produtos.filter(p=>JSON.stringify(p).toLowerCase().includes(q.toLowerCase())));}document.getElementById('buscaKorvil').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(!q){renderVitrine();return;}renderVitrine(produtos.filter(p=>`${p.nome} ${p.codigo}`.toLowerCase().includes(q)));});renderFiltros();renderVitrine();<\/script></body></html>
