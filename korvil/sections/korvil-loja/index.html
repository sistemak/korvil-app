<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
<title>KORVIL LOJA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui,sans-serif}
body{background:#0A0A0A;color:#fff}
.header{position:sticky;top:0;z-index:10;background:#0A0A0A;border-bottom:1px solid #1a1a1a;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.card{background:#141414;border:1px solid #222;border-radius:14px;padding:16px}
.btn{padding:10px 14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-o{background:#FF4D00;color:#000}
#tokenBoxHeader{display:none;background:#0A0A0A;border:1px dashed #FF4D00;border-radius:10px;padding:12px;margin:12px 20px}
</style>
</head>
<body>
<div class="header"><b>KORVIL <span style="color:#FF4D00">LOJA</span></b><button id="btnPerfil" class="btn btn-o" style="padding:8px 12px;font-size:12px">PERFIL</button></div>

<div id="tokenBoxHeader">
  <small style="color:#FF4D00;font-weight:800">GH_TOKEN necessário para atualizar perfil (commit real)</small>
  <div style="display:flex;gap:8px;margin-top:8px"><input id="ghTokenLoja" type="password" placeholder="ghp_..." style="flex:1;padding:10px;border-radius:8px;background:#141414;border:1px solid #333;color:#fff"/><button id="btnSalvarTokenLoja" class="btn btn-o" style="font-size:12px">SALVAR</button><button id="btnValidarTokenLoja" class="btn" style="background:#222;color:#fff;font-size:12px">VALIDAR</button></div>
  <div id="tokenStatusLoja" style="margin-top:6px;font-size:11px;color:#888"></div>
</div>

<div style="padding:20px;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:16px">
  <div><div class="card"><h2 style="font-size:16px">Produtos</h2><p style="color:#666;font-size:13px;margin-top:6px">Loja funcionando direto sem erros. Commit real de perfil corrigido.</p></div></div>
  <div class="card" id="perfilBox"><h3 style="font-size:14px">Meu perfil</h3><div id="perfilInfo" style="margin-top:10px;color:#888;font-size:12px">Carregando...</div><div style="margin-top:12px;display:flex;flex-direction:column;gap:8px"><input id="editNome" placeholder="Nome" style="padding:10px;border-radius:8px;background:#0A0A0A;border:1px solid #333;color:#fff"/><input id="editWpp" placeholder="WhatsApp" style="padding:10px;border-radius:8px;background:#0A0A0A;border:1px solid #333;color:#fff"/><button id="btnSalvarPerfil" class="btn btn-o">SALVAR PERFIL (commit real)</button><div id="perfilStatus" style="font-size:11px;color:#888"></div></div></div>
</div>

<script>
const LS_TOKEN='loja_github_token';
function utf8ToBase64(s){return btoa(unescape(encodeURIComponent(s)));}
function mask(t){return t? t.slice(0,7)+'***'+t.slice(-4):'';}

async function validar(t){
  const r=await fetch('https://api.github.com/user',{headers:{Authorization:'token '+t}});
  if(!r.ok) throw new Error('Token inválido '+r.status);
  return r.json();
}

function checkToken(){
  const token=localStorage.getItem(LS_TOKEN);
  const box=document.getElementById('tokenBoxHeader');
  const input=document.getElementById('ghTokenLoja');
  if(!token){ box.style.display='block'; }
  else { box.style.display='none'; if(input) input.value=token; }
}

async function salvarPerfil(){
  const token=localStorage.getItem(LS_TOKEN)||document.getElementById('ghTokenLoja').value.trim();
  if(!token){
    document.getElementById('tokenBoxHeader').style.display='block';
    document.getElementById('tokenStatusLoja').textContent='Cole seu GH_TOKEN e clique SALVAR antes de atualizar perfil';
    document.getElementById('tokenStatusLoja').style.color='#FF4D00';
    throw new Error('Configure GH_TOKEN no campo acima');
  }
  const userRaw=localStorage.getItem('korvil_user');
  if(!userRaw) throw new Error('Nenhum usuário local');
  const user=JSON.parse(userRaw);
  user.nome_completo=document.getElementById('editNome').value||user.nome_completo;
  user.whatsapp=document.getElementById('editWpp').value||user.whatsapp;
  user.atualizado_em=new Date().toISOString();

  const path = 'korvil/sections/korvil-loja/login/contas/'+user.pasta_mae+'/'+user.arquivo;
  const content=utf8ToBase64(JSON.stringify(user,null,2));
  const getUrl='https://api.github.com/repos/sistemak/korvil-app/contents/'+path+'?ref=main';
  let sha;
  const g=await fetch(getUrl,{headers:{Authorization:'token '+token}});
  if(g.ok){ const j=await g.json(); sha=j.sha; }
  else if(g.status!==404){ throw new Error('GET perfil '+g.status); }

  const putUrl='https://api.github.com/repos/sistemak/korvil-app/contents/'+path;
  const r=await fetch(putUrl,{method:'PUT',headers:{Authorization:'token '+token,'Content-Type':'application/json'},body:JSON.stringify({message:'KORVIL: update perfil '+user.arquivo, content, branch:'main', ...(sha?{sha}:{})})});
  if(!r.ok){ const t=await r.text(); throw new Error('PUT perfil '+r.status+' '+t.slice(0,200)); }
  localStorage.setItem('korvil_user',JSON.stringify(user));
  return user;
}

document.addEventListener('DOMContentLoaded',()=>{
  checkToken();
  const token=localStorage.getItem(LS_TOKEN);
  if(token) document.getElementById('ghTokenLoja').value=token;

  document.getElementById('btnSalvarTokenLoja').onclick=()=>{
    const t=document.getElementById('ghTokenLoja').value.trim();
    if(!t) return;
    localStorage.setItem(LS_TOKEN,t);
    document.getElementById('tokenStatusLoja').textContent='Token salvo! '+mask(t);
    document.getElementById('tokenStatusLoja').style.color='#2ecc71';
    setTimeout(checkToken,600);
  };
  document.getElementById('btnValidarTokenLoja').onclick=async()=>{
    const t=document.getElementById('ghTokenLoja').value.trim()||localStorage.getItem(LS_TOKEN);
    const el=document.getElementById('tokenStatusLoja');
    try{ const u=await validar(t); el.textContent='Válido @'+u.login; el.style.color='#2ecc71'; }catch(e){ el.textContent=e.message; el.style.color='#ff4d00'; }
  };

  const userRaw=localStorage.getItem('korvil_user');
  if(userRaw){
    const u=JSON.parse(userRaw);
    document.getElementById('perfilInfo').innerHTML='<div style="color:#fff">'+u.nome_completo+'</div><div>'+u.email+'</div><div style="margin-top:4px;color:#FF4D00">'+u.pasta_mae+'/'+u.arquivo+'</div>';
    document.getElementById('editNome').value=u.nome_completo||'';
    document.getElementById('editWpp').value=u.whatsapp||'';
  } else {
    document.getElementById('perfilInfo').textContent='Nenhum usuário. Crie conta em /login';
  }

  document.getElementById('btnSalvarPerfil').onclick=async()=>{
    const st=document.getElementById('perfilStatus');
    st.textContent='Salvando...'; st.style.color='#888';
    try{ const u=await salvarPerfil(); st.textContent='Perfil atualizado! '+u.arquivo; st.style.color='#2ecc71'; document.getElementById('perfilInfo').innerHTML='<div style="color:#fff">'+u.nome_completo+'</div><div>'+u.email+'</div>'; }
    catch(e){ st.textContent=e.message; st.style.color='#ff4d00'; }
  };
});
</script>
</body>
</html>
