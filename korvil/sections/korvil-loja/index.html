<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KORVIL LOJA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}
body{background:#0A0A0A;color:#fff}
.header{position:sticky;top:0;z-index:10;background:#0A0A0A;border-bottom:1px solid #1e1e1e;display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo{font-weight:900;letter-spacing:-0.04em;font-size:20px}.logo span{color:#FF4D00}
.actions{display:flex;gap:12px;align-items:center}
.icon{width:40px;height:40px;border-radius:999px;background:#141414;border:1px solid #232323;display:grid;place-items:center;cursor:pointer}
.badge{position:absolute;top:-4px;right:-4px;background:#FF4D00;color:#fff;font-size:10px;font-weight:800;border-radius:999px;padding:2px 6px}
#loginAnchor{max-width:560px;margin:40px auto;background:#141414;border:1px solid #232323;border-radius:24px;overflow:hidden}
#lojaLogada{display:none;padding:20px;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-top:20px}
.cardProd{background:#141414;border:1px solid #1e1e1e;border-radius:16px;padding:12px}
.cardProd img{width:100%;height:140px;object-fit:contain;background:#0A0A0A;border-radius:12px}
.cardProd h4{font-size:13px;margin:8px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#FF4D00;font-weight:800;font-size:14px}
.btnBuy{margin-top:8px;width:100%;background:#fff;color:#000;border:none;border-radius:999px;padding:8px;font-weight:700;cursor:pointer}
.checkout{position:fixed;right:20px;bottom:20px;background:#FF4D00;color:#fff;border:none;border-radius:999px;padding:14px 22px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(255,77,0,.4)}
iframe#loginFrame{width:100%;height:820px;border:none;background:#0A0A0A}
</style>
</head>
<body>
<div class="header">
<div class="logo">KORVIL<span>.</span></div>
<div class="actions">
<div style="position:relative"><div class="icon" id="cartIcon">🛒<span class="badge" id="cartCount">0</span></div></div>
<div class="icon" id="perfilIcon">👤</div>
<div class="icon" id="sairIcon" title="Sair" style="display:none">↪</div>
</div>
</div>

<div id="loginAnchor">
<iframe id="loginFrame" src="./login/index.html"></iframe>
</div>

<div id="lojaLogada">
<h2 style="font-size:28px;letter-spacing:-0.03em">Bem-vindo, <span id="userNome" style="color:#FF4D00">—</span></h2>
<p id="userEmail" style="color:#777;font-size:13px;margin:4px 0 16px"></p>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
<span style="background:#141414;border:1px solid #232323;border-radius:999px;padding:6px 12px;font-size:12px">📦 40 produtos</span>
<span style="background:#141414;border:1px solid #232323;border-radius:999px;padding:6px 12px;font-size:12px">⚡ Pix Checkout</span>
<span id="pastaInfo" style="background:#1a1200;border:1px solid #332200;color:#ffb84d;border-radius:999px;padding:6px 12px;font-size:12px"></span>
</div>
<input id="busca" placeholder="Buscar produtos..." style="width:100%;background:#141414;border:1px solid #232323;border-radius:12px;padding:12px 14px;color:#fff;outline:none">
<div class="grid" id="grid"></div>
<button class="checkout" id="btnCheckout">CHECKOUT PIX • R$ <span id="total">0</span></button>
</div>

<script>
const isGithubPages = location.hostname.includes('github.io');
let user = null;
let carrinho = [];
try{ const u=localStorage.getItem('korvil_user'); if(u) user=JSON.parse(u); }catch{}
const primeiroUso = localStorage.getItem('korvil_primeiro_uso_feito');

function init(){
  if(user && primeiroUso){ mostrarLoja(); } else { mostrarLogin(); }
  gerarProdutos();
  window.addEventListener('message', e=>{ if(e.data?.type==='KORVIL_LOGIN_OK'){ user=e.data.conta; localStorage.setItem('korvil_user', JSON.stringify(user)); localStorage.setItem('korvil_primeiro_uso_feito','1'); mostrarLoja(); }});
}
function mostrarLogin(){
  document.getElementById('loginAnchor').style.display='block';
  document.getElementById('lojaLogada').style.display='none';
  document.getElementById('sairIcon').style.display='none';
}
function mostrarLoja(){
  document.getElementById('loginAnchor').style.display='none';
  document.getElementById('lojaLogada').style.display='block';
  document.getElementById('sairIcon').style.display='grid';
  document.getElementById('userNome').textContent=user.nome||user.pastaMae||'Sistema K';
  document.getElementById('userEmail').textContent=user.email||'';
  document.getElementById('pastaInfo').textContent='pasta mãe: '+ (user.pastaMae||'sistema-k') +'/'+ (user.arquivo||'sistema-k.json');
}
document.getElementById('sairIcon').addEventListener('click', ()=>{
  // Sair mostra tela login email/senha dentro Index da loja
  document.getElementById('loginAnchor').style.display='block';
  document.getElementById('lojaLogada').style.display='none';
  document.getElementById('loginAnchor').innerHTML='<div style="padding:20px"><h3 style="margin-bottom:12px">Login</h3><input id="loginEmail" placeholder="E-mail" style="width:100%;background:#0A0A0A;border:1px solid #2a2a2a;border-radius:12px;padding:12px;color:#fff;margin-bottom:12px"><input id="loginSenha" type="password" placeholder="Senha" style="width:100%;background:#0A0A0A;border:1px solid #2a2a2a;border-radius:12px;padding:12px;color:#fff;margin-bottom:12px"><button id="doLogin" style="width:100%;background:#FF4D00;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;cursor:pointer">ENTRAR</button><p style="color:#555;font-size:11px;margin-top:10px">Valida em /api/login com tratamento seguro text+JSON</p></div>';
  document.getElementById('doLogin').addEventListener('click', async ()=>{
    const email=document.getElementById('loginEmail').value.trim().toLowerCase();
    const senha=document.getElementById('loginSenha').value;
    try{
      const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
      const text=await res.text(); let data; try{data=JSON.parse(text);}catch{ if(text.trim().startsWith('<')) throw new Error('PAGES_MODE'); else throw new Error('Resposta inválida'); }
      if(!res.ok) throw new Error(data.error||'Login falhou');
      user=data.conta; localStorage.setItem('korvil_user', JSON.stringify(user)); mostrarLoja();
    }catch(err){
      if(err.message==='PAGES_MODE' || isGithubPages){
        // Pages: valida local
        try{ const u=JSON.parse(localStorage.getItem('korvil_user')||'null'); if(u && u.email.toLowerCase()===email){ user=u; mostrarLoja(); } else { alert('Modo Pages: use conta criada neste navegador. Email não confere.'); } }catch{ alert('Sem conta local. Crie conta primeiro.'); }
      } else { alert(err.message); }
    }
  });
});

function gerarProdutos(){
  const grid=document.getElementById('grid');
  const produtos=Array.from({length:40},(_,i)=>({id:i+1,nome:['Camisa Oversized KORVIL','Jaqueta Tech','Boné Black','Tênis Runner','Mochila Utility','Calça Cargo','Óculos Shield','Relógio Minimal'][i%8]+' '+(i+1), preco: (Math.floor(Math.random()*300)+79), img:'https://picsum.photos/seed/korvil'+(i+1)+'/300/300'}));
  grid.innerHTML=produtos.map(p=>'<div class="cardProd"><img src="'+p.img+'" loading="lazy"><h4>'+p.nome+'</h4><div class="price">R$ '+p.preco+'</div><button class="btnBuy" data-id="'+p.id+'" data-preco="'+p.preco+'" data-nome="'+p.nome+'">Adicionar</button></div>').join('');
  grid.querySelectorAll('.btnBuy').forEach(b=>b.addEventListener('click', e=>{ const id=+e.target.dataset.id; const preco=+e.target.dataset.preco; const nome=e.target.dataset.nome; carrinho.push({id,preco,nome}); atualizarCarrinho(); }));
}
function atualizarCarrinho(){
  document.getElementById('cartCount').textContent=carrinho.length;
  const total=carrinho.reduce((s,i)=>s+i.preco,0);
  document.getElementById('total').textContent=total.toFixed(2).replace('.',',');
}
document.getElementById('busca').addEventListener('input', e=>{
  const q=e.target.value.toLowerCase(); document.querySelectorAll('.cardProd').forEach(c=>{ c.style.display=c.textContent.toLowerCase().includes(q)?'block':'none'; });
});
document.getElementById('btnCheckout').addEventListener('click', ()=>{
  if(carrinho.length===0) return alert('Carrinho vazio');
  const total=carrinho.reduce((s,i)=>s+i.preco,0);
  const pix='00020126360014BR.GOV.BCB.PIX0114+5513997690898520400005303986540'+total.toFixed(2)+'5802BR5920SISTEMA K6009BERTIOGA62070503***6304';
  alert('PIX COPIA E COLA GERADO:\n'+pix.slice(0,80)+'...\nTotal R$ '+total.toFixed(2)+'\nChave: sistemak.srv@gmail.com');
});
init();
</script>
</body>
</html>
