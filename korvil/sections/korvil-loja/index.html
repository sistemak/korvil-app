function renderFiltros(){let h='';for(const s in setores){h+=`<div class="mt-3 font-bold border-b cursor-pointer py-1 uppercase text-xs bg-[#FFF9D6] px-2 rounded" onclick="this.nextElementSibling.classList.toggle('hidden')">${s} ▼</div><div class="ml-2">`;for(const c in setores[s]){h+=`<div class="mt-2 font-semibold text-zinc-700 cursor-pointer text-xs" onclick="this.nextElementSibling.classList.toggle('hidden')">> ${c}</div><div class="hidden ml-3">`;setores[s][c].forEach(i=>{h+=`<div class="cursor-pointer hover:text-[#b89600] text-[11px]" onclick="filtrar('${i}')">${i}</div>`});h+=`</div>`;}h+=`</div>`;}document.getElementById('filtros').innerHTML=h;}
function renderVitrine(lista=produtos){document.getElementById('vitrine').innerHTML=lista.map(p=>`<div class="bg-white rounded-xl border p-3 flex flex-col"><img src="${p.foto}" class="h-36 object-cover rounded-lg bg-[#C0C0C0]"/><div class="text-[10px] text-zinc-400 mt-2">${p.codigo} | ${p.setor}</div><div class="font-bold text-[13px] mt-1">${p.nome}</div><div class="mt-2"><span class="font-black text-lg text-[#b89600]">R$ ${p.preco}</span></div><button onclick="addCarrinho('${p.codigo}')" class="mt-2 bg-[#3483fa] text-white font-bold py-1.5 rounded-lg text-xs">Comprar</button><button onclick="location.href='${p.link}'" class="mt-1 border rounded-lg py-1 text-xs">Ver detalhes</button></div>`).join('');}
function filtrar(q){renderVitrine(produtos.filter(p=>JSON.stringify(p).toLowerCase().includes(q.toLowerCase())));}
document.getElementById('busca-korvil').addEventListener('input',e=>{const q=e.target.value.toLowerCase().trim();if(!q){renderVitrine();return;}renderVitrine(produtos.filter(p=>`${p.nome} ${p.codigo}`.toLowerCase().includes(q)));});
function addCarrinho(codigo){const p=produtos.find(x=>x.codigo===codigo);carrinho.push(p);localStorage.setItem('korvil-cart',JSON.stringify(carrinho));atualizarCart();abrirCarrinho();}

function remover(i){carrinho.splice(i,1);localStorage.setItem('korvil-cart',JSON.stringify(carrinho));atualizarCart();}
