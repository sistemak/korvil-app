import { NextResponse } from 'next/server';

export async function GET() {
  const GH_TOKEN = process.env.GH_TOKEN;
  const API_URL = "https://api.github.com/repos/sistemak/korvil-app/contents/korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/cronograma-de-alunos.json";

  if (!GH_TOKEN) {
    return NextResponse.json({ error: "GH_TOKEN não configurado" }, { status: 500 });
  }

  try {
    const res = await fetch(API_URL, {
      headers: {
        Authorization: \`Bearer \${GH_TOKEN}\`,
        Accept: "application/vnd.github.v3+json",
        "X-GitHub-Api-Version": "2022-11-28"
      },
      cache: "no-store"
    });

    if (!res.ok) {
      const txt = await res.text();
      return NextResponse.json({ error: "GitHub API falhou", status: res.status, body: txt }, { status: res.status });
    }

    const data = await res.json();
    // data.content é base64
    const buff = Buffer.from(data.content, 'base64');
    const jsonStr = buff.toString('utf-8');
    const cronograma = JSON.parse(jsonStr);

    return NextResponse.json(cronograma, {
      headers: { "Cache-Control": "no-store" }
    });
  } catch (e) {
    return NextResponse.json({ error: String(e) }, { status: 500 });
  }
}
