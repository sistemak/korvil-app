  const GH_TOKEN = process.env.GH_TOKEN;

        "Accept": "application/vnd.github.v3+json",
        "User-Agent": "korvil-verificador"
      }
    });

      source: "oficial",
      length: html.length,
      ativosCount: ativos,
      html 
    });
  } catch (e) {
    return res.status(500).json({ ok: false, error: String(e) });
  }
}
