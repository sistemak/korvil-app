<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inscricao Projeto Transformacao - MASTER V14 FIX</title>
<style>
  body{font-family:system-ui;background:#0a0a0a;color:#fff;margin:0;padding:16px}
  .tela{border:1px solid #222;padding:16px;border-radius:12px;margin-bottom:16px;background:#111}
  input,select,textarea{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#000;color:#fff}
  button{padding:12px 18px;border-radius:10px;border:0;font-weight:800;cursor:pointer}
  #btnFinalizar{background:#00ff88;color:#000;width:100%;margin-top:12px}
  #popupConfirmado{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#00ff88;color:#000;padding:18px 28px;border-radius:14px;font-weight:900;letter-spacing:1px;z-index:9999;box-shadow:0 10px 40px rgba(0,255,136,.4)}
</style>
</head>
<body>

<div id="tela1" class="tela">
  <h2>TELA 1 - Objetivos e Nivel</h2>
  <label>Objetivo principal</label>
  <select id="objetivo">
    <option value="">Selecione</option>
    <option value="perda de gordura">Perda de gordura</option>
    <option value="ganho de massa">Ganho de massa</option>
    <option value="definicao">Definicao</option>
    <option value="condicionamento">Condicionamento</option>
  </select>
  <label>Nivel atual</label>
  <select id="nivel">
    <option value="">Selecione</option>
    <option value="iniciante">Iniciante</option>
    <option value="intermediario">Intermediario</option>
    <option value="avancado">Avancado</option>
  </select>
</div>

<div id="tela2" class="tela">
  <h2>TELA 2 - Questionario 1-9</h2>
  <input id="q1" placeholder="Q1 - Ha quanto tempo treina?">
  <input id="q2" placeholder="Q2 - Quantas vezes por semana pode treinar?">
  <input id="q3" placeholder="Q3 - Possui lesoes?">
  <input id="q4" placeholder="Q4 - Usa suplementacao?">
  <input id="q5" placeholder="Q5 - Horario disponivel?">
  <input id="q6" placeholder="Q6 - Preferencia de treino?">
  <input id="q7" placeholder="Q7 - Objetivo em 90 dias?">
  <input id="q8" placeholder="Q8 - Ja fez acompanhamento antes?">
  <input id="q9" placeholder="Q9 - Algo mais que devemos saber?">
</div>

<div id="tela3" class="tela">
  <h2>TELA 3 - Plano e Dados Pessoais</h2>
  <label>Plano</label>
  <select id="plano">
    <option value="">Selecione</option>
    <option value="online 12 semanas">Online 12 semanas</option>
    <option value="presencial 12 semanas">Presencial 12 semanas</option>
    <option value="online vip">Online VIP</option>
    <option value="presencial vip">Presencial VIP</option>
  </select>
  <input id="nomeCompleto" placeholder="Nome completo real">
  <input id="telefone" placeholder="Telefone real com DDD">
  <input id="email" type="email" placeholder="Email real">
  <input id="cpf" placeholder="CPF real">
  <input id="dataNasc" type="date" placeholder="Data nascimento">
  <input id="endereco" placeholder="Endereco real completo - rua, numero, bairro, cidade">
  <input id="cep" placeholder="CEP">
</div>

<button id="btnFinalizar">FINALIZAR INSCRICAO</button>

<div id="popupConfirmado">CONFIRMADO</div>

<script>
const REPO_OWNER = "sistemak";
const REPO_NAME = "korvil-app";
const BRANCH = "main";
const BASE_ALUNOS = "korvil/sections/ktp/projetotransformacao/alunos";
const WORKFLOW_FILE = "inscricao-do-projeto.yml";

function slugifyPrimeiroNome(nomeCompletoReal){
  const primeiro = (nomeCompletoReal.trim().split(/\s+/)[0]||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
  return primeiro;
}
function getTipoByPlano(planoReal){
  return planoReal.toLowerCase().includes('presencial') ? 'presencial' : 'online';
}
function coletarDadosReaisDoForm(){
  return {
    objetivo: document.getElementById('objetivo').value.trim(),
    nivel: document.getElementById('nivel').value.trim(),
    q1: document.getElementById('q1').value.trim(),
    q2: document.getElementById('q2').value.trim(),
    q3: document.getElementById('q3').value.trim(),
    q4: document.getElementById('q4').value.trim(),
    q5: document.getElementById('q5').value.trim(),
    q6: document.getElementById('q6').value.trim(),
    q7: document.getElementById('q7').value.trim(),
    q8: document.getElementById('q8').value.trim(),
    q9: document.getElementById('q9').value.trim(),
    plano: document.getElementById('plano').value.trim(),
    nomeCompleto: document.getElementById('nomeCompleto').value.trim(),
    telefone: document.getElementById('telefone').value.trim(),
    email: document.getElementById('email').value.trim(),
    cpf: document.getElementById('cpf').value.trim(),
    dataNasc: document.getElementById('dataNasc').value.trim(),
    endereco: document.getElementById('endereco').value.trim(),
    cep: document.getElementById('cep').value.trim()
  };
}
function validarDadosReais(d){
  const obrig = ['objetivo','nivel','plano','nomeCompleto','telefone','email','endereco'];
  for(const k of obrig){ if(!d[k]) return false; }
  if(d.nomeCompleto.split(' ').length<2) return false;
  return true;
}
function gerarConteudoJsonOrdemTela123(dadosReais){
  return {
    TELA1_OBJETIVOS_NIVEL: {
      objetivo: dadosReais.objetivo,
      nivel: dadosReais.nivel
    },
    TELA2_QUESTIONARIO_1_9: {
      q1: dadosReais.q1,
      q2: dadosReais.q2,
      q3: dadosReais.q3,
      q4: dadosReais.q4,
      q5: dadosReais.q5,
      q6: dadosReais.q6,
      q7: dadosReais.q7,
      q8: dadosReais.q8,
      q9: dadosReais.q9
    },
    TELA3_PLANO_DADOS_PESSOAIS: {
      plano: dadosReais.plano,
      nome_completo: dadosReais.nomeCompleto,
      telefone: dadosReais.telefone,
      email: dadosReais.email,
      cpf: dadosReais.cpf,
      data_nascimento: dadosReais.dataNasc,
      endereco: dadosReais.endereco,
      cep: dadosReais.cep,
      STATUS: "ATIVO",
      data_inscricao: new Date().toISOString()
    }
  };
}
async function getUltimoNumeroReal(tipoReal){
  const url = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + BASE_ALUNOS + "/" + tipoReal + "?ref=" + BRANCH;
  try{
    const r = await fetch(url);
    if(!r.ok) return 0;
    const data = await r.json();
    let max = 0;
    for(const item of data){
      if(item.type!=="dir") continue;
      const m = item.name.match(/^(\d+)-/);
      if(!m) continue;
      const num = parseInt(m[1],10);
      if(num===43) continue;
      if(num>max) max=num;
    }
    return max;
  }catch(e){
    console.warn('Erro ao buscar ultimo numero', e);
    return 0;
  }
}
function formatarMensagemWhatsappOrdemReal(dados, pastaMae, tipo){
  let msg = "*NOVA INSCRICAO KTP - " + pastaMae.toUpperCase() + " [" + tipo.toUpperCase() + "]*\n\n";
  msg += "*TELA 1 - OBJETIVOS E NIVEL*\n";
  msg += "Objetivo: " + dados.objetivo + "\n";
  msg += "Nivel: " + dados.nivel + "\n\n";
  msg += "*TELA 2 - QUESTIONARIO 1-9*\n";
  for(let i=1;i<=9;i++){ msg += "Q" + i + ": " + (dados['q'+i]||'-') + "\n"; }
  msg += "\n*TELA 3 - PLANO E DADOS PESSOAIS*\n";
  msg += "Plano: " + dados.plano + "\n";
  msg += "Nome: " + dados.nomeCompleto + "\n";
  msg += "Telefone: " + dados.telefone + "\n";
  msg += "Email: " + dados.email + "\n";
  msg += "CPF: " + dados.cpf + "\n";
  msg += "Data Nasc: " + dados.dataNasc + "\n";
  msg += "Endereco: " + dados.endereco + "\n";
  msg += "CEP: " + dados.cep + "\n";
  msg += "STATUS: ATIVO\n";
  msg += "Pasta: " + pastaMae + "\nTipo: " + tipo + "\n";
  return msg;
}
function toBase64Utf8(str){
  const bytes = new TextEncoder().encode(str);
  let binary = "";
  bytes.forEach(function(b){ binary += String.fromCharCode(b); });
  return btoa(binary);
}
async function finalizarInscricaoReal(){
  const dados = coletarDadosReaisDoForm();
  if(!validarDadosReais(dados)){
    alert('Preencha todos os dados reais obrigatorios com nome completo verdadeiro');
    return;
  }
  const btn = document.getElementById('btnFinalizar');
  btn.disabled=true; btn.textContent='PROCESSANDO...';
  try{
    const tipo = getTipoByPlano(dados.plano);
    const slug = slugifyPrimeiroNome(dados.nomeCompleto);
    const ultimo = await getUltimoNumeroReal(tipo);
    let prox = ultimo+1;
    if(prox===43) prox=44;
    const pastaMae = prox + "-" + slug + prox;
    const nomeJson = pastaMae + ".json";
    const conteudoJsonExato = gerarConteudoJsonOrdemTela123(dados);
    const pathCompleto = BASE_ALUNOS + "/" + tipo + "/" + pastaMae + "/" + nomeJson;
    const ghToken = window.GH_TOKEN || localStorage.getItem('GH_TOKEN') || '';
    if(!ghToken){
      throw new Error('GH_TOKEN nao configurado no ambiente seguro');
    }
    const putUrl = "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + pathCompleto;
    const putBody = {
      message: "feat: inscricao " + pastaMae + " - " + dados.nomeCompleto + " [" + tipo + "]",
      content: toBase64Utf8(JSON.stringify(conteudoJsonExato,null,2)),
      branch: BRANCH
    };
    const putResp = await fetch(putUrl, {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + ghToken, 'Content-Type':'application/json' },
      body: JSON.stringify(putBody)
    });
    if(!putResp.ok){
      const err = await putResp.text();
      throw new Error('Falha ao criar pasta mae/json: '+err);
    }
    localStorage.setItem('ktp_pastaMae', pastaMae);
    localStorage.setItem('ktp_tipo', tipo);
    localStorage.setItem('ktp_path', BASE_ALUNOS + "/" + tipo + "/" + pastaMae);
    const popup = document.getElementById('popupConfirmado');
    popup.style.display='block';
    setTimeout(function(){popup.style.display='none';}, 3000);
    const mensagemWhatsapp = formatarMensagemWhatsappOrdemReal(dados, pastaMae, tipo);
    await fetch("https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/actions/workflows/" + WORKFLOW_FILE + "/dispatches", {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + ghToken, 'Content-Type':'application/json' },
      body: JSON.stringify({
        ref: BRANCH,
        inputs: {
          primeiro_nome: slug,
          tipo: tipo,
          nome_completo: dados.nomeCompleto,
          plano: dados.plano,
          texto_formatado: JSON.stringify(conteudoJsonExato,null,2),
          mensagem_whatsapp: mensagemWhatsapp
        }
      })
    });
    console.log('Inscricao finalizada:', pastaMae);
  }catch(err){
    console.error(err);
    alert('Erro: '+err.message);
  }finally{
    btn.disabled=false; btn.textContent='FINALIZAR INSCRICAO';
  }
}
document.getElementById('btnFinalizar').addEventListener('click', finalizarInscricaoReal);
</script>
</body>
</html>
