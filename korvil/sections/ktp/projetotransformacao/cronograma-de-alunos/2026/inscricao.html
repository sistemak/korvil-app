<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>KTP INSCRIÇÃO - CORRIGIDA BANCO CENTRAL</title>
<style>body{background:#000;color:#00ff88;font-family:monospace;padding:12px} input,select{margin:4px;padding:6px;background:#111;color:#00ff88;border:1px solid #00f5ff} .popup{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#00ff88;color:#000;padding:20px;border-radius:8px;display:none;font-weight:bold} .popup.show{display:block} button{background:#00f5ff;color:#000;padding:10px 20px;border:none;cursor:pointer;font-weight:bold}</style>
</head>
<body>
<h2>INSCRIÇÃO KTP - BANCO CENTRAL CORRIGIDO</h2>
<p>Form original literal mas com lógica central adicionada</p>

<input id="nomeCompleto" placeholder="Nome Completo" value="Maria Teste Silva">
<select id="hora"><option>06h00 🐦</option><option selected>08h00 🐢</option><option>19h00 ⭐</option></select><br>
<input id="cpf" placeholder="CPF" value="000.000.000-00">
<input id="nasc" type="date" value="1990-01-01">
<input id="idade" placeholder="Idade" value="34 anos">
<input id="publico" placeholder="Gênero" value="Feminino"><br>
<input id="whats" placeholder="Whats" value="(13) 99999-9999">
<input id="email" placeholder="Email" value="teste@email.com">
<input id="nivelAtividade" placeholder="Nivel" value="Iniciante"><br>
<input id="q1" placeholder="q1" value="Sim"><input id="q2" placeholder="q2" value="Boa"><input id="q3" placeholder="q3" value="8h"><input id="q4" placeholder="q4" value="Não"><input id="q5" placeholder="q5" value="Barriga"><input id="q6" placeholder="q6" value="Não"><input id="q7" placeholder="q7" value="Sim"><input id="q8" placeholder="q8" value="Sim"><input id="q9" placeholder="q9" value="Não"><br>
<input id="cep" placeholder="CEP" value="11250-000"><input id="rua" placeholder="Rua" value="Rua Teste"><input id="numero" placeholder="Numero" value="123"><input id="bairro" placeholder="Bairro" value="Centro"><input id="cidade" placeholder="Cidade" value="Bertioga"><br>

<div id="planoInfo" data-nome="Presencial 3x" data-freq="3" data-valor="100" data-mat="50" style="margin:8px 0;border:1px solid #00ff88;padding:6px">Plano: Presencial 3x - 3x - R$100 + R$50</div>
<div id="dias" data-dias="Segunda, Quinta, Sexta" style="margin:4px 0">Dias: Segunda, Quinta, Sexta</div>
<div id="objetivos" data-obj="Emagrecimento | Definição Muscular | Saúde" style="margin:4px 0">Objetivos: Emagrecimento | Definição | Saúde</div>

<button onclick="enviarWhatsApp()">ENVIAR WHATSAPP E SALVAR NO BANCO CENTRAL</button>
<div id="popupConfirmado" class="popup">CONFIRMADO - Aluno salvo no banco central! #00ff88</div>

<script>
// TOKEN LIVRE LOGIC
function getRealToken(){ 
  try{
    return window.GH_TOKEN_REAL || (document.getElementById('tokenInput') && document.getElementById('tokenInput').value) || '';
  }catch(e){ return window.GH_TOKEN_REAL || ''; }
}
var OWNER='sistemak', REPO='korvil-app', BRANCH='main';

async function getSha(path, token){
  try{
    var r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + path + '?ref=' + BRANCH, {headers:{Authorization:'Bearer ' + token}});
    if(!r.ok) return null;
    var j = await r.json();
    return j.sha;
  }catch{ return null; }
}
async function commitFile(path, content, token, sha){
  var b64 = btoa(unescape(encodeURIComponent(content)));
  var body = {message:'KTP inscricao ' + path + ' - ' + new Date().toISOString(), content:b64, branch:BRANCH};
  if(sha) body.sha = sha;
  var r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + path, {
    method:'PUT',
    headers:{Authorization:'Bearer ' + token, 'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('PUT falhou ' + path + ' ' + r.status);
  return r.json();
}

async function enviarWhatsApp(){
  var token = getRealToken();
  if(!token || token.length<8){ alert('Cole GH_TOKEN real ghp_... (8+ chars)'); return; }
  var nomeCompleto = (document.getElementById('nomeCompleto').value.trim() || 'Aluno Teste');
  var primeiroNomeReal = nomeCompleto.split(' ')[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  var diasStr = document.getElementById('dias').dataset.dias || 'Segunda, Quinta, Sexta';
  var dias = diasStr.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var objStr = document.getElementById('objetivos').dataset.obj || 'Emagrecimento | Saúde';
  var objetivosSelecionados = objStr.split('|').map(function(s){return s.trim();});
  var planoEl = document.getElementById('planoInfo');
  var plano = {nome: planoEl.dataset.nome, freq: planoEl.dataset.freq, valor: planoEl.dataset.valor, mat: planoEl.dataset.mat};
  var hora = document.getElementById('hora').value;

  // DETERMINA MAX IGNORANDO 42,43
  var max = 0;
  try{
    var db = window.KTP_CRONOGRAMA && window.KTP_CRONOGRAMA.ALUNOS_DB ? window.KTP_CRONOGRAMA.ALUNOS_DB : {};
    Object.keys(db).forEach(function(k){
      var m = k.match(/(\d+)$/);
      if(m){
        var num = parseInt(m[1],10);
        if(num===42 || num===43) return;
        if(num>max) max=num;
      }
    });
  }catch(e){}
  if(max<41) max=41;
  var prox = max+1;
  if(prox===42 || prox===43) prox=44;
  if(prox===43) prox=44;

  var pastaMae = prox + '-' + primeiroNomeReal + prox;
  var idAluno = primeiroNomeReal + prox;

  // CRIA ARQUIVO INDIVIDUAL
  var dadosIndividuais = {
    id: prox,
    nome: nomeCompleto,
    pasta: pastaMae,
    hora: hora, dias: dias, plano: plano.nome,
    cpf: document.getElementById('cpf').value,
    nasc: document.getElementById('nasc').value,
    idade: document.getElementById('idade').value,
    genero: document.getElementById('publico').value,
    whats: document.getElementById('whats').value,
    email: document.getElementById('email').value,
    nivel_atividade: document.getElementById('nivelAtividade').value,
    q1: document.getElementById('q1').value,
    q2: document.getElementById('q2').value,
    q3: document.getElementById('q3').value,
    q4: document.getElementById('q4').value,
    q5: document.getElementById('q5').value,
    q6: document.getElementById('q6').value,
    q7: document.getElementById('q7').value,
    q8: document.getElementById('q8').value,
    q9: document.getElementById('q9').value,
    cep: document.getElementById('cep').value,
    rua: document.getElementById('rua').value,
    numero: document.getElementById('numero').value,
    bairro: document.getElementById('bairro').value,
    cidade: document.getElementById('cidade').value
  };

  var individualPath = 'korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/' + pastaMae + '/' + pastaMae + '.json';
  var shaInd = await getSha(individualPath, token);
  await commitFile(individualPath, JSON.stringify(dadosIndividuais,null,2), token, shaInd);
  console.log('Individual salvo', individualPath);

  // ========== LÓGICA QUE FALTAVA - SALVAR NO BANCO CENTRAL ==========
  var centralPath = "korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/cronograma-de-alunos.js";
  var centralJsonPath = "korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/cronograma-de-alunos.json";

  var centralSha = null;
  var centralObj = window.KTP_CRONOGRAMA || {ALUNOS_DB:{}, ALUNOS_PRESENCIAL:{}, ALUNOS_ONLINE:{}, CRONOGRAMA_DB:{PRESENCIAL:[], ONLINE:[]}};

  try{
    var r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + centralPath + '?ref=' + BRANCH, {headers:{Authorization:'Bearer ' + token}});
    if(r.ok){
      var j = await r.json();
      centralSha = j.sha;
      var centralContent = atob(j.content.replace(/\n/g,''));
      try{
        var fn = new Function('window', centralContent + '; return window.KTP_CRONOGRAMA;');
        var w = {KTP_CRONOGRAMA:{}};
        var res = fn(w);
        if(res) centralObj = res;
      }catch(e){ console.warn('Parse central falhou, usando existente', e); }
    }
  }catch(e){ console.warn('Central não existe ainda', e); }

  centralObj.ALUNOS_DB = centralObj.ALUNOS_DB || {};
  centralObj.ALUNOS_PRESENCIAL = centralObj.ALUNOS_PRESENCIAL || {};
  centralObj.CRONOGRAMA_DB = centralObj.CRONOGRAMA_DB || {PRESENCIAL:[], ONLINE:[]};
  centralObj.CRONOGRAMA_DB.PRESENCIAL = centralObj.CRONOGRAMA_DB.PRESENCIAL || [];

  centralObj.ALUNOS_DB[idAluno] = {nome: nomeCompleto, tipo:"ALUNO", id: prox, pasta: pastaMae, hora: hora};
  centralObj.ALUNOS_PRESENCIAL[idAluno] = {nome: nomeCompleto, tipo:"ALUNO"};

  var slot = null;
  for(var i=0;i<centralObj.CRONOGRAMA_DB.PRESENCIAL.length;i++){
    if(centralObj.CRONOGRAMA_DB.PRESENCIAL[i].hora===hora){ slot = centralObj.CRONOGRAMA_DB.PRESENCIAL[i]; break; }
  }
  if(!slot){
    slot = {hora: hora || "08h00 🐢", status:"ATIVOS", alunos:[]};
    centralObj.CRONOGRAMA_DB.PRESENCIAL.push(slot);
  }

  var vencDate = new Date(); vencDate.setDate(vencDate.getDate()+30);
  var venc = ('0'+vencDate.getDate()).slice(-2) + '/' + ('0'+(vencDate.getMonth()+1)).slice(-2) + '/' + String(vencDate.getFullYear()).slice(-2);

  var novoAlunoCompleto = {
    n: prox,
    id: idAluno,
    aluno: nomeCompleto,
    dias: dias.join(', '),
    freq: plano.freq + 'x',
    objetivo: objetivosSelecionados.join(' | '),
    valor: 'R$' + plano.valor + ',00',
    matricula: 'R$' + plano.mat + ',00',
    total: 'R$' + (parseInt(plano.valor)+parseInt(plano.mat)) + ',00',
    venc: venc,
    status: "Ativo",
    cpf: document.getElementById('cpf').value,
    nasc: document.getElementById('nasc').value,
    idade: document.getElementById('idade').value,
    genero: document.getElementById('publico').value,
    whats: document.getElementById('whats').value,
    email: document.getElementById('email').value,
    nivel_atividade: document.getElementById('nivelAtividade').value,
    q1: document.getElementById('q1').value,
    q2: document.getElementById('q2').value,
    q3: document.getElementById('q3').value,
    q4: document.getElementById('q4').value,
    q5: document.getElementById('q5').value,
    q6: document.getElementById('q6').value,
    q7: document.getElementById('q7').value,
    q8: document.getElementById('q8').value,
    q9: document.getElementById('q9').value,
    plano: plano.nome,
    cep: document.getElementById('cep').value,
    rua: document.getElementById('rua').value,
    numero: document.getElementById('numero').value,
    bairro: document.getElementById('bairro').value,
    cidade: document.getElementById('cidade').value
  };

  slot.alunos.push(novoAlunoCompleto);

  var jsReconstruido = '// korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/cronograma-de-alunos.js\n' +
'// ARQUIVO EXTERNO - CRONOGRAMA COMPLETO - PUXADO POR ÂNCORA\n' +
'// Caminho GitHub: https://github.com/sistemak/korvil-app/edit/main/korvil/sections/ktp/projetotransformacao/cronograma-de-alunos/2026/cronograma-de-alunos.json\n' +
'window.KTP_CRONOGRAMA = window.KTP_CRONOGRAMA || {};\n\n' +
'window.KTP_CRONOGRAMA.ALUNOS_DB = ' + JSON.stringify(centralObj.ALUNOS_DB,null,2) + ';\n\n' +
'window.KTP_CRONOGRAMA.ALUNOS_PRESENCIAL = ' + JSON.stringify(centralObj.ALUNOS_PRESENCIAL,null,2) + ';\n\n' +
'window.KTP_CRONOGRAMA.ALUNOS_ONLINE = ' + JSON.stringify(centralObj.ALUNOS_ONLINE||{},null,2) + ';\n\n' +
'window.KTP_CRONOGRAMA.CRONOGRAMA_DB = ' + JSON.stringify(centralObj.CRONOGRAMA_DB,null,2) + ';\n\n' +
'// Compatibilidade - variáveis originais por âncora\n' +
'var Sr = window.KTP_CRONOGRAMA.ALUNOS_DB;\n' +
'var pf = window.KTP_CRONOGRAMA.CRONOGRAMA_DB;\n' +
'var ALUNOS_PRESENCIAL = window.KTP_CRONOGRAMA.ALUNOS_PRESENCIAL;\n' +
'var ALUNOS_ONLINE = window.KTP_CRONOGRAMA.ALUNOS_ONLINE;\n' +
'var CRONOGRAMA = window.KTP_CRONOGRAMA.CRONOGRAMA_DB;\n\n' +
'// TOKEN FALSO SÓ PRA LEMBRAR FORMATO (não usar): hp_RR67zU91Wyp59ES8wH2k4FZ8KS9XcM15PdHG\n';

  var shaCentral = centralSha || await getSha(centralPath, token);
  await commitFile(centralPath, jsReconstruido, token, shaCentral);

  try{
    var jsonEquiv = JSON.stringify(centralObj.CRONOGRAMA_DB,null,2);
    var shaJson = await getSha(centralJsonPath, token);
    await commitFile(centralJsonPath, jsonEquiv, token, shaJson);
  }catch(e){ console.warn('JSON central não atualizado', e); }

  var popup = document.getElementById('popupConfirmado');
  if(popup){ popup.classList.add('show'); setTimeout(function(){popup.classList.remove('show');},4000); }
  window.dispatchEvent(new CustomEvent('whatsapp.yml', {detail:{aluno: novoAlunoCompleto, pasta: pastaMae}}));
  var msg = 'Olá ' + nomeCompleto + '! Inscrição CONFIRMADA ' + pastaMae + ' - ' + plano.nome + ' - Venc ' + venc;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg),'_blank');
}
</script>
</body>
</html>
