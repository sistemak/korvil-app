<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>K-TP 2026 - Inscricao Aluno - V5 MASTER</title>
<style>
  body{margin:0;background:#000;color:#fff;font-family:Inter,Arial;padding:24px}
  .card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:16px;padding:20px;margin:0 auto 16px;max-width:720px}
  input,select,textarea{width:100%;background:#111;border:1px solid #222;color:#fff;border-radius:10px;padding:12px;margin:6px 0 12px;font-size:14px}
  button{background:#fff;color:#000;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.4}
  .badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid #222}
  .badge-red{border-color:#ff2a2a;color:#ff2a2a;background:#ff2a2a11}
  .log{font-family:monospace;font-size:12px;background:#050505;border:1px solid #111;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:300px;overflow:auto}
</style>
</head>
<body>
<div class="card">
  <h2 style="margin:0 0 6px">K-TP 2026 - Nova Inscricao V5</h2>
  <p style="color:#888;font-size:13px">Este form dispara workflow_dispatch que LIMPA 42-45 e CRIA pasta mae modelo 01-mag01.</p>
  <label>Slug / Primeiro nome (ex: mag1)</label>
  <input id="slug" placeholder="mag1" value="mag1">
  <label>Tipo</label>
  <select id="tipo"><option value="presencial" selected>presencial</option><option value="online">online</option></select>
  <label>Nome completo</label>
  <input id="nome" placeholder="Ex: Magno Silva">
  <label>Texto formatado (JSON do aluno - vai para 42-slug.json dentro da mae)</label>
  <textarea id="json" rows="10">{ "nome": "Magno", "objetivo": "K-TP 11o Ano" }</textarea>
  <div style="display:flex;gap:10px;margin-top:10px">
    <button id="btn" onclick="disparar()">GERAR ALUNO - COMMIT V5</button>
    <span id="status" class="badge">pronto</span>
  </div>
  <div id="log" class="log" style="margin-top:12px;display:none"></div>
</div>
<script>
const REPO = "sistemak/korvil-app";
const WORKFLOW = "gerar-aluno.yml";
async function disparar(){
  const slug = document.getElementById('slug').value.trim();
  const tipo = document.getElementById('tipo').value;
  const nome = document.getElementById('nome').value.trim();
  const dados = document.getElementById('json').value.trim();
  if(!slug || !nome || !dados){ alert('Preencha tudo'); return; }
  const token = prompt('Cole GH_TOKEN com repo + workflow');
  if(!token) return;
  document.getElementById('btn').disabled=true;
  document.getElementById('status').textContent='disparando...';
  const logEl=document.getElementById('log'); logEl.style.display='block'; logEl.textContent='Iniciando...';
  try{
    const res = await fetch('https://api.github.com/repos/'+REPO+'/actions/workflows/'+WORKFLOW+'/dispatches', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json', 'Accept':'application/vnd.github+json' },
      body: JSON.stringify({ ref:'main', inputs:{ slug, tipo, nome_completo:nome, dados_json:dados } })
    });
    logEl.textContent += "\nStatus: "+res.status+"\n";
    if(res.status===204){ logEl.textContent+="\nOK - Workflow disparado! Ele vai: 1) deletar 42-45 2) criar pasta mae 42-"+slug+" com 5 arquivos modelo 01-mag01"; document.getElementById('status').textContent='OK - workflow em execução'; }
    else{ const txt=await res.text(); logEl.textContent+="\nERRO: "+txt; document.getElementById('status').textContent='erro '+res.status; }
  }catch(e){ logEl.textContent+="\nERRO JS: "+e.message; }
  document.getElementById('btn').disabled=false;
}
</script>
</body>
</html>
