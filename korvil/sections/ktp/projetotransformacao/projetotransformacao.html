<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000" />
  <title>K-TP PROJETO TRANSFORMAÇÃO 2026</title>
  <style>
    :root {
      --c: #00f5ff;
      --bg: #000;
      --card: #0a0a0a;
      --text: #fff;
      --text2: #aaa;
      --borda: #1f1f1f;
      --ok: #00ff88;
      --erro: #ff4444;
      --aviso: #ffaa00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
    .header {
      position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between;
      align-items: center; padding: 12px 16px 12px 56px; border-bottom: 1px solid var(--borda);
      background: #0a0a0a;
    }
    h1 { font-size: 14px; font-weight: 900; color: var(--c); }
    .menu-btn {
      position: fixed; top: 10px; left: 12px; z-index: 101; background: var(--c); color: #000;
      border: 0; border-radius: 6px; padding: 6px 8px; font-weight: 900; font-size: 16px; cursor: pointer;
    }
    .btn-aluno {
      padding: 6px 10px; background: var(--c); color: #000; border: 0; border-radius: 6px;
      font-weight: 900; font-size: 10px; cursor: pointer;
    }
    .container { padding: 12px; max-width: 1200px; margin: auto; }
    .card-aluno {
      background: #001a1a; border: 2px solid var(--c); border-radius: 10px; padding: 12px;
      margin-bottom: 12px; position: relative;
    }
    .card-aluno h2 { font-size: 12px; color: var(--c); margin-bottom: 6px; }
    .card-aluno p { font-size: 11px; color: var(--text2); line-height: 1.6; }
    .btn-fechar-resultado {
      position: absolute; top: 8px; right: 8px; background: var(--erro); color: #fff; border: 0;
      border-radius: 50%; width: 22px; height: 22px; font-weight: 900; font-size: 12px; cursor: pointer;
    }
    .card-semana { background: #0a0a0a; border: 2px solid var(--c); border-radius: 10px; padding: 16px; margin-top: 20px; text-align: center; }
    .card-semana img { max-width: 100%; border-radius: 8px; margin: 12px 0; border: 1px solid var(--borda); }
    .card-semana h3 { color: var(--c); font-size: 16px; margin-bottom: 8px; }
    .card-semana p { font-size: 12px; color: var(--text2); line-height: 1.6; white-space: pre-line; }
    .card-semana.mensagem-semana { margin-top: 12px; padding: 12px; background: #001a1a; border: 1px solid var(--c); border-radius: 8px; font-size: 11px; color: var(--text); text-align: left; white-space: pre-line; }
    .msg-inicial { text-align: center; color: var(--text2); font-size: 12px; margin-top: 40px; }
    #menu-lateral {
      position: fixed; left: -280px; top: 0; width: 260px; height: 100%; background: #0a0a0a;
      border-right: 1px solid var(--c); z-index: 200; transition: .3s; overflow-y: auto; padding: 60px 0 20px;
    }
    #menu-lateral.ativo { left: 0; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.8);
      z-index: 199; display: none;
    }
    #overlay.ativo { display: block; }
    .menu-titulo { padding: 14px 16px; font-size: 11px; color: var(--c); font-weight: 900; letter-spacing: 1px; border-bottom: 2px solid var(--c); margin-top: 8px; }
    .semanas-da-fase { background: #050505; }
    .semana-item {
      padding: 10px 16px 10px 24px; font-size: 10px; cursor: pointer; border-bottom: 1px solid var(--borda);
      color: var(--text2); line-height: 1.4; text-decoration: none; display: block; transition: .2s;
    }
    .semana-item:hover { background: #111; color: #fff; }
    #modal-aluno {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.9);
      z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    #modal-aluno.ativo { display: flex; }
    .modal-card { background: var(--card); border: 2px solid var(--c); border-radius: 10px; padding: 16px; width: 100%; max-width: 400px; }
    .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .btn-fechar { background: var(--erro); color:#fff; border:0; border-radius:4px; padding:4px 8px; font-weight:900; cursor:pointer; }
    .busca-id { display:flex; gap:6px; }
    .busca-id input {
      flex: 1; padding: 8px; background: #000; border: 1px solid var(--borda); border-radius: 4px;
      color: #fff; font-size: 12px;
    }
    .busca-id button {
      padding: 8px 10px; background: var(--c); color:#000; border:0; border-radius:4px; font-weight:900; cursor:pointer;
    }
    .titulo-crono { font-size: 16px; font-weight: 900; text-align: center; color: var(--c); margin-bottom: 10px; }
    .obs-pix { padding: 14px; background: #0a0a0a; border: 1px dashed var(--c); border-radius: 8px; font-size: 11px; color: var(--text2); margin: 15px 0; text-align: center; line-height: 1.6; }
    .tabela-wrapper { overflow-x: auto; margin-bottom: 20px; border: 1px solid var(--borda); border-radius: 8px; }
    .tabela-crono { width: 100%; border-collapse: collapse; font-size: 10px; }
    .tabela-crono th { background: #111; color: var(--c); padding: 8px 6px; text-align: left; font-size: 9px; font-weight: 900; text-transform: uppercase; border-bottom: 2px solid var(--c); }
    .tabela-crono td { padding: 8px 6px; border-bottom: 1px solid #1a1a1a; }
    .grupo-horario { margin-top: 20px; margin-bottom: 8px; color: var(--c); font-weight: 900; font-size: 13px; padding: 8px; background: #0a0a0a; border-left: 3px solid var(--c); }
    .grupo-status { margin: 8px 0; color: var(--aviso); font-weight: 800; font-size: 11px; padding-left: 8px; }
    .status-ativo { color: var(--ok); font-weight: 900; }
    .status-desativado { color: var(--erro); font-weight: 900; }
  </style>
</head>
<body>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <div class="header">
    <h1>K-TP PROJETO TRANSFORMAÇÃO 2026</h1>
    <button class="btn-aluno" onclick="abrirBuscaAluno()">👤 ACESSAR ID</button>
  </div>

  <div id="overlay" onclick="toggleMenu()"></div>
  <div id="menu-lateral"></div>

  <div class="container">
    <div id="info-aluno-container"></div>
    <div class="card-aluno" style="background:#0a0a0a;border:1.5px solid var(--borda)">
      <img src="https://sistemak.github.io/korvil-app/korvil/sections/ktp/projetotransformacao/assets/imagens/logoprojetotransformacao.png" style="max-width:120px;display:block;margin:0 auto 8px" alt="logo" />
      <div class="sub-titulo" style="font-size:10px;color:var(--text2);text-align:center;">Link da semana: Atualiza automaticamente toda segunda-feira às 00h00</div>
    </div>
    <div id="cronograma-container">
      <div class="msg-inicial">Clique em "ACESSAR ID" e digite seu ID para ver seu cronograma</div>
    </div>
  </div>

  <div id="modal-aluno">
    <div class="modal-card">
      <div class="modal-header">
        <div style="font-weight:900;color:var(--c)">BUSCAR ALUNO</div>
        <button class="btn-fechar" onclick="fecharBuscaAluno()">X</button>
      </div>
      <div class="busca-id">
        <input type="text" id="input-id-aluno" placeholder="COLAR ID" onkeypress="if(event.key==='Enter') buscarAluno()" />
        <button onclick="buscarAluno()">BUSCAR</button>
      </div>
      <div id="resultado-aluno" style="margin-top:10px;font-size:11px;"></div>
    </div>
  </div>

  <script>
    const MENSAGENS_SEMANA = {
      "2026-01-05": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE MANUTENÇÃO\n\nEssa é uma semana única dentro do processo — uma pausa estratégica para ajustar, aprender e recuperar o corpo.",
      "2026-01-12": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE RESISTÊNCIA\nOBJETIVO DA FASE: Regeneração | Adaptações | Aprendizados",
      "2026-01-19": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE FORÇA\nOBJETIVO DA FASE: Regeneração | Adaptações | Aprendizados",
      "2026-01-26": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE HIPERTROFIA\nOBJETIVO DA FASE: Regeneração | Adaptações | Aprendizados",
      "2026-09-07": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 4: CUTTING\nSEMANA DE RESISTÊNCIA\nOBJETIVO DA FASE: Eliminar máximo de gordura | Manter máximo de massa muscular magra | Modelagem do corpo."
    };

    const MENU = {
      "2026-01-05": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE MANUTENÇÃO",
      "2026-01-12": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE RESISTÊNCIA",
      "2026-01-19": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE FORÇA",
      "2026-01-26": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 1: OFF SEASON\nSEMANA DE HIPERTROFIA",
      "2026-09-07": "K-TP | PROJETO TRANSFORMAÇÃO 11° ANO - FASE 4: CUTTING\nSEMANA DE RESISTÊNCIA"
    };

    const FASES_MENU = {
      "FASE 1: OFF SEASON": ["2026-01-05", "2026-01-12", "2026-01-19", "2026-01-26"],
      "FASE 4: CUTTING": ["2026-09-07"]
    };

    const ALUNOS_DB = {
      "ktp0": { nome: "SAY KORVIL", tipo: "ADMIN" },
      "mag1": { nome: "Magda Gomes dos Santos", tipo: "ADMIN" },
      "mcarla2": { nome: "Maria Carla Carvalho Santos", tipo: "ALUNO" },
      "hvitoria3": { nome: "Hellem Vitória Carvalho dos Santos", tipo: "ALUNO" },
      "tchuco1": { nome: "Tchuco Silva", tipo: "ALUNO" },
      "dani2": { nome: "Daniele Vieira Leite", tipo: "ALUNO" }
    };

    const CRONOGRAMA_DB = {
      PRESENCIAL: [
        { hora: "08h00 🐢", status: "ATIVOS", alunos: [
          { n: 0, id: "mcarla2", aluno: "Maria Carla Carvalho Santos", dias: "Segunda, Quinta, Sexta", freq: "3x", objetivo: "Emagrecimento | Saúde | Hipertrofia", valor: "R$150,00", venc: "24/10/25", status: "Ativo" },
          { n: 1, id: "hvitoria3", aluno: "Hellem Vitória Carvalho dos Santos", dias: "Segunda, Quinta, Sexta", freq: "3x", objetivo: "Definição Muscular | Saúde", valor: "R$150,00", venc: "24/10/25", status: "Ativo" }
        ] }
      ],
      ONLINE: [
        { hora: "14h00", status: "ATIVOS", alunos: [
          { n: 0, id: "tchuco1", aluno: "Tchuco Silva", dias: "Segunda a Sexta", freq: "5x", objetivo: "Condicionamento Físico | Saúde", valor: "R$60,00", venc: "15/07/26", status: "Ativo" },
          { n: 1, id: "dani2", aluno: "Daniele Vieira Leite", dias: "Seg a Sex", freq: "5x", objetivo: "Definição", valor: "R$60,00", venc: "13/05/26", status: "Ativo" }
        ] }
      ]
    };

    let planoAtivo = 'PRESENCIAL';
    let idLogado = localStorage.getItem('idLogado') || '';

    function toggleMenu(){
      document.getElementById('menu-lateral').classList.toggle('ativo');
      document.getElementById('overlay').classList.toggle('ativo');
    }

    function abrirBuscaAluno(){ document.getElementById('modal-aluno').classList.add('ativo'); }
    function fecharBuscaAluno(){ document.getElementById('modal-aluno').classList.remove('ativo'); }

    function formatarData(d){
      const dt = new Date(d + 'T12:00:00');
      return dt.toLocaleDateString('pt-BR');
    }

    function getSegundaDaSemana(){
      const agora = new Date();
      const data = new Date(agora);
      const diaSemana = data.getDay();
      const diff = data.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
      const segunda = new Date(data.setDate(diff));
      const ano = segunda.getFullYear();
      const mes = String(segunda.getMonth() + 1).padStart(2, '0');
      const dia = String(segunda.getDate()).padStart(2, '0');
      return `${ano}-${mes}-${dia}`;
    }

    function carregarMenu(){
      let html = '';
      for (const fase in FASES_MENU) {
        html += `<div class="menu-titulo">${fase}</div>`;
        html += `<div class="semanas-da-fase">`;
        FASES_MENU[fase].forEach(data => {
          const segundaLinha = MENU[data].split('\n')[1] || 'SEMANA';
          html += `<div class="semana-item" onclick="mostrarInfoSemana('${data}')">${formatarData(data)} - ${segundaLinha}</div>`;
        });
        html += `</div>`;
      }
      document.getElementById('menu-lateral').innerHTML = html;
    }

    function mostrarInfoSemana(data){
      const container = document.getElementById('cronograma-container');
      const infoCompleta = MENU[data] || 'K-TP | PROJETO TRANSFORMAÇÃO 2026\nSEMANA DE MANUTENÇÃO';
      const linhas = infoCompleta.split('\n');
      const titulo = linhas[0];
      const subtitulo = linhas[1] || 'SEMANA';
      const mensagem = MENSAGENS_SEMANA[data] || 'Mensagem da semana não cadastrada.';

      const imagens = {
        'MANUTENÇÃO': 'semana-de-manutencao',
        'RESISTÊNCIA': 'semana-de-resistencia',
        'FORÇA': 'semana-de-forca',
        'HIPERTROFIA': 'semana-de-hipertrofia'
      };

      let pastaImagem = 'semana-de-manutencao';
      for (const key in imagens) {
        if (subtitulo.includes(key)) { pastaImagem = imagens[key]; break; }
      }

      const baseURL = 'https://sistemak.github.io/korvil-app/korvil/sections/ktp/projetotransformacao/images/imagens/2026/imagens-dos-metodos';
      const caminhoImagem = `${baseURL}/${pastaImagem}/${pastaImagem}.png`;

      container.innerHTML = `
        <div class="card-semana">
          <h3>${titulo}</h3>
          <img src="${caminhoImagem}" alt="${subtitulo}" onerror="this.src='https://sistemak.github.io/korvil-app/korvil/sections/ktp/images/logoprojetotransformacao.png'" />
          <p><b>${subtitulo}</b></p>
          <div class="mensagem-semana">${mensagem}</div>
          <p style="margin-top:10px;font-size:11px;color:var(--aviso)">Semana inicia em: ${formatarData(data)}</p>
        </div>
      `;
      if (window.innerWidth < 768) toggleMenu();
    }

    function mostrarDadosAluno(id){
      const aluno = ALUNOS_DB[id];
      const container = document.getElementById('info-aluno-container');
      if (!aluno) return;

      if (aluno.tipo === 'ADMIN') {
        container.innerHTML = `<div class="card-aluno"><button class="btn-fechar-resultado" onclick="fecharResultado()">X</button><h2>👑 MODO ADMIN</h2><p><b>Usuário:</b> ${aluno.nome}<br><b>Tipo:</b> Administrador</p></div>`;
      } else {
        container.innerHTML = `<div class="card-aluno"><button class="btn-fechar-resultado" onclick="fecharResultado()">X</button><h2>👤 MEUS DADOS</h2><p><b>Nome:</b> ${aluno.nome}<br><b>ID:</b> ${id}</p></div>`;
      }
    }

    function fecharResultado(){
      idLogado = '';
      localStorage.removeItem('idLogado');
      document.getElementById('info-aluno-container').innerHTML = '';
      const dataAtual = getSegundaDaSemana();
      mostrarInfoSemana(MENSAGENS_SEMANA[dataAtual] ? dataAtual : '2026-01-05');
    }

    function mostrarCronograma(){
      const container = document.getElementById('cronograma-container');
      if (!idLogado) {
        const dataAtual = getSegundaDaSemana();
        mostrarInfoSemana(MENSAGENS_SEMANA[dataAtual] ? dataAtual : '2026-01-05');
        return;
      }

      const aluno = ALUNOS_DB[idLogado];
      if (!aluno) {
        fecharResultado();
        return;
      }

      let html = `<div class="titulo-crono">📋 CRONOGRAMA K-TP — PROJETO TRANSFORMAÇÃO</div>`;
      html += `<div class="obs-pix">Olá ${aluno.nome}, mensalidade em dia.<br><b>Pix: korvilloja@gmail.com</b></div>`;

      const ehAdm = aluno.tipo === 'ADMIN';
      const planosParaMostrar = ehAdm ? ['PRESENCIAL', 'ONLINE'] : [planoAtivo];

      planosParaMostrar.forEach(plano => {
        if (ehAdm) html += `<div style="font-size:14px;font-weight:900;color:var(--c);text-align:center;margin:20px 0">🌐 ${plano} 🌐</div>`;

        CRONOGRAMA_DB[plano].forEach(bloco => {
          const alunosDoBloco = ehAdm ? bloco.alunos : bloco.alunos.filter(a => a.id === idLogado);
          if (!alunosDoBloco.length) return;

          if (bloco.hora) html += `<div class="grupo-horario">🕒 ${bloco.hora}</div>`;
          html += `<div class="grupo-status">${bloco.status === 'ATIVOS' ? '✅ ATIVOS' : '❌ DESATIVADOS'}</div>`;
          html += `<div class="tabela-wrapper"><table class="tabela-crono"><thead><tr><th>Nº</th><th>Aluno</th><th>Dias</th><th>Freq</th><th>Objetivo</th><th>Valor</th><th>Vencimento</th><th>Status</th></tr></thead><tbody>`;

          alunosDoBloco.sort((a, b) => a.n - b.n).forEach(a => {
            html += `<tr class="destaque"><td>${a.n}</td><td>${a.aluno}</td><td>${a.dias}</td><td>${a.freq}</td><td>${a.objetivo}</td><td>${a.valor}</td><td>${a.venc}</td><td class="${a.status === 'Ativo' ? 'status-ativo' : 'status-desativado'}">${a.status}</td></tr>`;
          });
          html += `</tbody></table></div>`;
        });
      });

      container.innerHTML = html;
    }

    function buscarAluno(){
      const id = document.getElementById('input-id-aluno').value.toLowerCase().trim();
      if (!id) {
        document.getElementById('resultado-aluno').innerHTML = '<div style="color:var(--aviso)">Digite um ID</div>';
        return;
      }

      if (ALUNOS_DB[id]) {
        idLogado = id;
        localStorage.setItem('idLogado', id);
        fecharBuscaAluno();
        mostrarDadosAluno(id);
        mostrarCronograma();
        document.getElementById('resultado-aluno').innerHTML = '';
        document.getElementById('input-id-aluno').value = '';
      } else {
        document.getElementById('resultado-aluno').innerHTML = '<div style="color:var(--erro)">ID não encontrado</div>';
      }
    }

    function getSegundaSemana(data){
      const d = new Date(data);
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(d.setDate(diff));
    }

    function isDentroJanela(){
      const agora = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
      const segunda = getSegundaSemana(agora);
      segunda.setHours(0, 0, 0, 0);
      const sexta = new Date(segunda);
      sexta.setDate(segunda.getDate() + 5);
      const agoraBrasil = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
      return agoraBrasil >= segunda && agoraBrasil <= sexta;
    }

    function getPathPeso(id){
      const tipo = (id.includes('tchuco') || id.includes('dani')) ? 'online' : 'presencial';
      return `korvil/sections/ktp/projetotransformacao/projetos/2026/alunos/${tipo}/${id}/registros/pesos.html`;
    }

    async function salvarAutomaticoPesoNoArquivo(pesoDigitado){
      const id = localStorage.getItem('ktp_id') || localStorage.getItem('aluno_id') || window.alunoAtual || document.getElementById('idAluno')?.value || idLogado;
      if (!id) return;

      if (!isDentroJanela()) {
        alert('Fora do prazo - volta na próxima segunda 00h00');
        return;
      }

      const agoraBRT = new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Sao_Paulo' }));
      const dataRegistro = agoraBRT.toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo' });
      const segunda = getSegundaSemana(agoraBRT);
      segunda.setHours(0, 0, 0, 0);
      const semanaStr = segunda.toLocaleDateString('pt-BR');
      const payload = {
        id,
        pesoDigitado,
        dataRegistro,
        semanaStr,
        path: getPathPeso(id)
      };

      const endpoint = window.KTP_PESO_ENDPOINT || null;

      if (!endpoint) {
        console.warn('Registro de peso bloqueado por segurança: configure um backend seguro para gravar os dados em vez de usar token no front-end.');
        alert('Registro de peso desativado por segurança. Solicite ao administrador configurar um endpoint do lado do servidor.');
        return;
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('Falha ao registrar peso no servidor');
        }

        console.log('✅ peso registrado com sucesso no backend seguro');
      } catch (error) {
        console.error(error);
        alert('Não foi possível salvar o peso no momento. Tente novamente mais tarde.');
      }
    }

    window.salvarAutomaticoPesoNoArquivo = salvarAutomaticoPesoNoArquivo;

    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('btnRegistrarPeso') || document.getElementById('btnSalvarPeso') || document.querySelector("[onclick*='peso']");
      if (btn) {
        btn.addEventListener('click', () => {
          const input = document.getElementById('inputPeso') || document.getElementById('peso');
          if (input) salvarAutomaticoPesoNoArquivo(input.value);
        });
      }
    });

    window.onload = function(){
      carregarMenu();
      const dataISO = getSegundaDaSemana();
      mostrarInfoSemana(MENSAGENS_SEMANA[dataISO] ? dataISO : '2026-01-05');
      if (idLogado) {
        mostrarDadosAluno(idLogado);
        mostrarCronograma();
      }
    };
  </script>
