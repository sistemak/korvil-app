:root{--c:#00f5ff; --bg:#000; --card:#0a0a0a; --text:#fff; --text2:#aaa; --borda:#1f1f1f; --ok:#00ff88; --erro:#ff4444; --aviso:#ffaa00; --azul:#0084ff;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;max-width:100%;}
html,body{max-width:100vw;overflow-x:hidden;background:var(--bg);color:var(--text);}
.header{padding:12px 16px 12px 56px;text-align:left;border-bottom:1px solid var(--borda);background:#0a0a0a;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;}
h1{font-size:14px;font-weight:900;color:var(--c);}
.menu-btn{position:fixed;top:10px;left:12px;z-index:101;background:var(--c);color:#000;border:0;border-radius:6px;padding:6px 8px;font-weight:900;font-size:16px;cursor:pointer;}
.btn-aluno{padding:7px 14px;background:var(--c);color:#000;border:0;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;}
#menu-lateral{position:fixed;left:0;top:0;width:260px;height:100%;background:#0a0a0a;border-right:1px solid var(--c);z-index:200;overflow-y:auto;padding:60px 0 20px;display:none;}
#menu-lateral.ativo{display:block;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:199;display:none;}
#overlay.ativo{display:block;}
.menu-titulo{padding:14px 16px;font-size:11px;color:var(--c);font-weight:900;letter-spacing:1px;border-bottom:2px solid var(--c);margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;max-width:100%;box-sizing:border-box;}
.menu-titulo::after{content:'+';font-size:14px;color:var(--c);}
.menu-titulo.aberto::after{content:'−';}
.semanas-da-fase{background:#050505;display:none;max-width:100%;}
.semanas-da-fase.aberta{display:block;}
.semana-item{padding:10px 16px 10px 24px;font-size:10px;cursor:pointer;border-bottom:1px solid var(--borda);color:var(--text2);line-height:1.4;display:block;}
.semana-item.atual{color:#fff;background:#0d111a;border-left:3px solid var(--azul);box-shadow:inset 0 0 0 1px var(--azul);font-weight:800;}
.container{padding:12px;max-width:1200px;margin:auto;width:100%;overflow-x:hidden;box-sizing:border-box;}
.card-aluno{background:#001a1a;border:2px solid var(--c);border-radius:10px;padding:12px;margin-bottom:12px;position:relative;}
.btn-fechar-resultado{position:absolute;top:8px;right:8px;background:var(--erro);color:#fff;border:0;border-radius:50%;width:22px;height:22px;font-weight:900;font-size:12px;cursor:pointer;line-height:22px;text-align:center;z-index:2;}
.obs-pix{padding:14px;background:#0a0a0a;border:1px dashed var(--c);border-radius:8px;font-size:11px;color:var(--text2);margin:15px 0;text-align:center;line-height:1.6;}
.titulo-crono{font-size:16px;font-weight:900;text-align:center;color:var(--c);margin-bottom:10px;}
.aluno-box{background:#0a0a0a;border:1.5px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:16px;position:relative;max-width:100%;overflow:hidden;}
.aluno-box.destaque-aluno{border:2px solid var(--c);box-shadow:0 0 20px rgba(0,245,255,.15);}
.aluno-box-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--borda);padding-bottom:10px;margin-bottom:10px;}
.aluno-box-top h2{font-size:13px;color:var(--c);margin:0;}
.aluno-box-top .id-badge{background:var(--c);color:#000;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:900;}
.aluno-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:100%;}
.aluno-field{background:#000;border:1px solid #1a1a1a;border-radius:8px;padding:8px 10px;}
.aluno-field.full{grid-column:1 / -1;}
.aluno-field label{font-size:8px;color:var(--c);font-weight:900;letter-spacing:.8px;display:block;margin-bottom:2px;text-transform:uppercase;}
.aluno-field span{font-size:11px;color:#fff;line-height:1.3;display:block;word-break:break-word;}
.aluno-field span.vazio{color:#555;}
.aluno-status-box{grid-column:1 / -1;padding:10px;border-radius:8px;text-align:center;font-weight:900;font-size:11px;}
.aluno-status-box.ativo{background:rgba(0,255,136,.1);border:1px solid var(--ok);color:var(--ok);}
.aluno-status-box.inativo{background:rgba(255,68,68,.1);border:1px solid var(--erro);color:var(--erro);}
@media(max-width:600px){.aluno-grid{grid-template-columns:1fr;}}
.semana-org{background:#000;border:1.5px solid var(--c);border-radius:12px;overflow:hidden;margin-top:16px;max-width:100%;}
.semana-org-topo{padding:14px 16px;text-align:center;}
.semana-org-topo h3{color:var(--c);font-size:13px;font-weight:900;margin-bottom:4px;line-height:1.3;}
.semana-org-badge{display:inline-block;color:#aaa;font-size:11px;font-weight:700;letter-spacing:.3px;margin-top:4px;}
.semana-org-grid{display:grid;grid-template-columns:1fr;gap:10px;padding:12px;}
.topico{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:10px;padding:12px;}
.topico-texto{font-size:11px;color:#e0e0e0;line-height:1.5;white-space:pre-line;text-align:left;}
.semana-data{text-align:center;padding:10px;font-size:10px;color:#ffaa00;background:#000;border-top:1px solid #1a1a1a;}
.logo-card{background:#0a0a0a;border:1.5px solid #1a1a1a;border-radius:12px;padding:20px;margin:16px 0;text-align:center;max-width:100%;overflow:hidden;}
.logo-card img{max-width:160px;display:block;margin:0 auto 10px;}
.logo-card .sub-titulo{font-size:10px;color:#888;text-align:center;}
