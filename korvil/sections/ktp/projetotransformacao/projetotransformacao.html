:root{--c:#00f5ff; --bg:#000; --card:#0a0a0a; --text:#fff; --text2:#aaa; --borda:#1f1f1f; --ok:#00ff88; --erro:#ff4444; --aviso:#ffaa00; --azul:#0084ff;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;max-width:100%;}
html,body{max-width:100vw;overflow-x:hidden;}
body{background:var(--bg);color:var(--text);margin:0;overflow-x:hidden;max-width:100vw;}
.header{padding:12px 16px 12px 56px;text-align:left;border-bottom:1px solid var(--borda);background:#0a0a0a;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;}
h1{font-size:14px;font-weight:900;color:var(--c);}
.menu-btn{position:fixed;top:10px;left:12px;z-index:101;background:var(--c);color:#000;border:0;border-radius:6px;padding:6px 8px;font-weight:900;font-size:16px;cursor:pointer;}
.btn-aluno{padding:7px 14px;background:var(--c);color:#000;border:0;border-radius:8px;font-weight:900;font-size:11px;cursor:pointer;}
#menu-lateral{position:fixed;left:0;top:0;width:260px;height:100%;background:#0a0a0a;border-right:1px solid var(--c);z-index:200;overflow-y:auto;padding:60px 0 20px;display:block;}
.menu-titulo{padding:14px 16px;font-size:11px;color:var(--c);font-weight:900;letter-spacing:1px;border-bottom:2px solid var(--c);margin-top:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.semana-item{padding:10px 16px 10px 24px;font-size:10px;cursor:pointer;border-bottom:1px solid var(--borda);color:var(--text2);}
.semana-item.atual{color:#fff;background:#0d111a;border-left:3px solid var(--azul);font-weight:800;}
.container{padding:12px;max-width:1200px;margin:auto;}
.aluno-box{background:#0a0a0a;border:1.5px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:16px;}
.aluno-box.destaque-aluno{border:2px solid var(--c);box-shadow:0 0 20px rgba(0,245,255,.15);}
.peso-box{background:#080c12;border:1.5px solid var(--c);border-radius:12px;padding:12px;margin:16px 0;}
.semana-org{background:#000;border:1.5px solid var(--c);border-radius:12px;overflow:hidden;margin-top:16px;}

        .btn-anexar{background:var(--c);color:#000;}
        .btn-excluir{background:var(--erro);color:#fff;}
        .btn-github{background:#24292e;color:#fff;border:1px solid #555;}
