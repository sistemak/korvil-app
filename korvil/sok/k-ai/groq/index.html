<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KORVIL K-AI • GitHub Clone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070a07;--panel:#0e1210;--panel2:#121815;--border:#1e2a22;--green:#00ff88;--green2:#00ff41;--text:#d7e8de;--muted:#6b8a76;--red:#ff4d4d}
body{background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;overflow:hidden;height:100vh}
#leftDropZone{position:fixed;left:0;top:0;bottom:0;width:14px;z-index:9999;background:transparent;border-right:2px dashed transparent;transition:all .15s}
#leftDropZone.dragging{border-color:var(--green2);background:rgba(0,255,65,0.08);width:16px}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px}
.topbar b{color:var(--green)}
.topbar input{background:#000;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;width:260px}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:320px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#root-bar{padding:10px 12px;border:1.5px solid var(--green2);background:rgba(0,255,65,0.06);margin:8px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;transition:all .15s}
#root-bar.drag-over{outline:2px dashed var(--green2);background:rgba(0,255,65,0.15);transform:scale(1.01)}
#root-bar .tag{font-size:10px;background:var(--green2);color:#000;padding:2px 6px;border-radius:99px}
#fileList{list-style:none;overflow:auto;flex:1;padding:4px 8px}
.file-row{padding:7px 8px;border-radius:6px;display:flex;align-items:center;gap:8px;cursor:grab;user-select:none;border:1px solid transparent;font-size:13px}
.file-row:hover{background:var(--panel2);border-color:var(--border)}
.file-row.dragging{opacity:0.5;background:rgba(0,255,136,0.15);border:1px dashed var(--green)}
.file-row.folder-open{background:rgba(0,255,136,0.08)}
.file-row .icon{width:18px;text-align:center}
.file-row.drag-over{outline:1px dashed var(--green2);background:rgba(0,255,65,0.12)}
.editorWrap{flex:1;display:flex;flex-direction:column;background:#050705;overflow:hidden}
.breadcrumbs{height:36px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:6px;font-size:12px;color:var(--muted)}
#editor{flex:1;background:transparent;color:var(--text);border:none;outline:none;padding:16px;font-family:ui-monospace,monospace;font-size:13px;resize:none;line-height:1.6;white-space:pre;overflow:auto}
#terminal{height:140px;background:#000;border-top:1px solid var(--border);padding:8px 12px;font-size:11px;overflow:auto;color:#9ae6b4}
#terminal .err{color:var(--red)}
#terminal .ok{color:var(--green)}
#miniMenu{position:fixed;background:#0f1411;border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,0.6);min-width:220px;z-index:10000;display:none;overflow:hidden}
#miniMenu .item{padding:9px 14px;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
#miniMenu .item:hover{background:var(--panel2);color:var(--green)}
#miniMenu .item.danger{color:var(--red)}
#miniMenu .sep{height:1px;background:var(--border);margin:4px 0}
#kaiBar{position:fixed;bottom:0;left:0;right:0;height:56px;background:rgba(10,14,11,0.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 12px;z-index:9000}
#kaiBar input{flex:1;background:#000;border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;outline:none}
#kaiBar input:focus{border-color:var(--green)}
#kaiBar button{background:var(--green);color:#000;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer}
#kaiBar button:hover{background:var(--green2)}
.drag-ghost{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--green);padding:6px 10px;border-radius:8px;font-size:12px;z-index:100000;transform:rotate(1deg)}
</style>
</head>
<body>
<div id="leftDropZone"></div>
<div id="dragGhost" class="drag-ghost" style="display:none"></div>

<div class="app">
  <div class="topbar">
    <b>korvil-app</b><span style="color:var(--muted)">/ K-AI GROQ</span>
    <div style="flex:1"></div>
    <span id="authMode" style="font-size:11px;color:var(--muted)">👁️ público</span>
    <input id="tokenInput" type="password" placeholder="GH_TOKEN (localStorage)"/>
    <button id="saveToken" style="background:#111;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer">Salvar</button>
  </div>
  <div class="main">
    <aside class="sidebar">
      <div id="root-bar"><span>📁</span> ../ (raiz) <span class="tag">raiz</span></div>
      <ul id="fileList"></ul>
    </aside>
    <section class="editorWrap">
      <div class="breadcrumbs" id="breadcrumbs">../ (raiz) • README</div>
      <textarea id="editor" spellcheck="false">// KORVIL K-AI GROQ
// Root page inicial - repo sistemak/korvil-app
// Features: leftDropZone 14px, root-bar verde, drag pointer events, folderOpenTimers 700ms, mini menu completo, kaiBar Issue trigger

Selecione um arquivo à esquerda.
Modo público: leitura via api.github.com sem token.
Com GH_TOKEN salvo, habilita escrita e Issue K-AI.
</textarea>
      <div id="terminal"><div class="ok">[K-AI] sistema iniciado • aguardando</div><div>[K-AI] leftDropZone:14px fixed OK • root-bar border green OK</div></div>
    </section>
  </div>
  <div id="kaiBar">
    <span style="font-size:18px">🤖</span>
    <input id="kaiInput" placeholder="Digite igual Meta IA"/>
    <button id="kaiSend">Enviar</button>
  </div>
</div>

<div id="miniMenu"></div>

<script type="module">
import { mountKaiBar, sendToGroqViaIssue, autoActivate } from './chat.js';

const REPO = 'sistemak/korvil-app';
let currentPath = '';
let dragged = null;
let pointerOffset = {x:0,y:0};
let folderOpenTimers = {};
let clipboard = null;
let filesData = [
  {name:'../ (raiz)', path:'', type:'root', children:[
    {name:'.github', type:'dir', closed:true, children:[{name:'workflows',type:'dir',closed:true,children:[{name:'k-ai.yml',type:'file'}]}]},
    {name:'korvil', type:'dir', closed:false, children:[
      {name:'sok', type:'dir', closed:false, children:[
        {name:'k-ai', type:'dir', closed:false, children:[
          {name:'groq', type:'dir', closed:false, children:[
            {name:'index.js',type:'file'},
            {name:'agent.js',type:'file'},
            {name:'config.js',type:'file'},
            {name:'chat.js',type:'file'},
            {name:'index.html',type:'file'}
          ]}
        ]}
      ]}
    ]},
    {name:'README.md', type:'file'}
  ]}
];

const fileList = document.getElementById('fileList');
const leftDropZone = document.getElementById('leftDropZone');
const rootBar = document.getElementById('root-bar');
const dragGhost = document.getElementById('dragGhost');
const editor = document.getElementById('editor');
const terminal = document.getElementById('terminal');
const miniMenu = document.getElementById('miniMenu');
const tokenInput = document.getElementById('tokenInput');

function log(msg, cls=''){
  const d=document.createElement('div');
  d.className=cls;
  d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  terminal.appendChild(d);
  terminal.scrollTop=terminal.scrollHeight;
}

function renderFileList(){
  fileList.innerHTML='';
  // root row as first row
  const rootRow = document.createElement('li');
  rootRow.className='file-row';
  rootRow.dataset.path='';
  rootRow.dataset.type='root';
  rootRow.innerHTML='<span class="icon">↩️</span> ../ (raiz) <span style="margin-left:auto;font-size:10px;color:var(--green2);border:1px solid var(--green2);padding:1px 5px;border-radius:99px">raiz</span>';
  rootRow.style.border='1.5px solid #00ff41';
  rootRow.style.marginBottom='6px';
  attachDragHandlers(rootRow);
  rootRow.addEventListener('click',()=> openPath(''));
  fileList.appendChild(rootRow);

  function walk(nodes, depth=0){
    nodes.forEach(n=>{
      const li=document.createElement('li');
      li.className='file-row'+(n.closed===false?' folder-open':'');
      li.dataset.path=n.name;
      li.dataset.type=n.type;
      li.style.paddingLeft=(8+depth*16)+'px';
      const icon = n.type==='dir' ? (n.closed?'📁':'📂') : '📄';
      li.innerHTML='<span class="icon">'+icon+'</span> '+n.name;
      attachDragHandlers(li);
      li.addEventListener('click', (e)=>{
        if(n.type==='dir'){ n.closed=!n.closed; renderFileList(); }
        else openPath(n.name);
      });
      li.addEventListener('contextmenu', (e)=>{ e.preventDefault(); openMiniMenu(e, n); });
      fileList.appendChild(li);
      if(n.type==='dir' && n.closed===false && n.children) walk(n.children, depth+1);
    });
  }
  walk(filesData[0].children);
}

function attachDragHandlers(el){
  el.addEventListener('pointerdown', onPointerDown);
  el.addEventListener('pointerenter', (e)=>{
    if(!dragged) return;
    el.classList.add('drag-over');
    const type=el.dataset.type;
    if(type==='dir' || type==='root'){
      const key=el.dataset.path;
      if(folderOpenTimers[key]) clearTimeout(folderOpenTimers[key]);
      // if closed folder, auto open after 700ms
      const isClosed = el.textContent.includes('📁');
      if(isClosed){
        folderOpenTimers[key]=setTimeout(()=>{
          log('auto-open pasta '+el.dataset.path+' após 700ms');
          // find and open
          function findAndOpen(nodes){
            for(const n of nodes){
              if(n.name===el.dataset.path) n.closed=false;
              if(n.children) findAndOpen(n.children);
            }
          }
          findAndOpen(filesData[0].children);
          renderFileList();
        },700);
      }
    }
  });
  el.addEventListener('pointerleave', ()=>{
    el.classList.remove('drag-over');
    const key=el.dataset.path;
    if(folderOpenTimers[key]){ clearTimeout(folderOpenTimers[key]); delete folderOpenTimers[key]; }
  });
}

let dragStartPos=null;
function onPointerDown(e){
  const row=e.currentTarget;
  if(e.button!==0) return;
  dragStartPos={x:e.clientX,y:e.clientY};
  const move = (ev)=>{
    if(!dragStartPos) return;
    const dx=ev.clientX-dragStartPos.x;
    const dy=ev.clientY-dragStartPos.y;
    if(Math.abs(dx)+Math.abs(dy)<8) return;
    dragged=row;
    row.classList.add('dragging');
    dragGhost.textContent=row.textContent.trim();
    dragGhost.style.display='block';
    document.addEventListener('pointermove', onPointerMove);
    document.addEventListener('pointerup', onPointerUp);
  };
  const up = ()=>{
    document.removeEventListener('pointermove', move);
    document.removeEventListener('pointerup', up);
    dragStartPos=null;
  };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function onPointerMove(e){
  if(!dragged) return;
  dragGhost.style.left=(e.clientX+12)+'px';
  dragGhost.style.top=(e.clientY+12)+'px';
  // leftDropZone highlight
  if(e.clientX<24){
    leftDropZone.classList.add('dragging');
  }else{
    leftDropZone.classList.remove('dragging');
  }
}

function onPointerUp(e){
  if(!dragged) return;
  dragGhost.style.display='none';
  dragged.classList.remove('dragging');
  leftDropZone.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
  // if dropped on leftDropZone -> mover para raiz
  if(e.clientX<24){
    log('DROP na leftDropZone -> mover para raiz (../) sem duplicar', 'ok');
  }
  // if dropped on root-bar -> outline already, move
  const target=document.elementFromPoint(e.clientX,e.clientY);
  const row = target?.closest('.file-row');
  if(row && row!==dragged){
    log('mover '+dragged.dataset.path+' → '+row.dataset.path+' (move sem duplicar)', 'ok');
  }
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  dragged=null;
  // clear timers
  Object.values(folderOpenTimers).forEach(t=>clearTimeout(t));
  folderOpenTimers={};
}

function openPath(p){
  currentPath=p;
  document.getElementById('breadcrumbs').textContent='../ (raiz) • '+(p||'README');
  editor.value='// abrindo '+p+'\n// conteúdo carregado via GitHub API (public ou token)\nconsole.log("K-AI arquivo: '+p+'");';
  log('abrir '+p);
}

function openMiniMenu(e, node){
  const items=[
    {label:'abrir', action:()=>openPath(node.name)},
    {label:'baixar', action:()=>{ log('baixar '+node.name); const blob=new Blob([editor.value],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=node.name; a.click(); }},
    {label:'renomear', action:()=>{ const nn=prompt('Novo nome',node.name); if(nn){ node.name=nn; renderFileList(); log('renomear para '+nn,'ok'); }}},
    {label:'excluir REAL', danger:true, action:async()=>{
      if(!confirm('EXCLUIR REAL '+node.name+'?')) return;
      const token=localStorage.getItem('GH_TOKEN');
      if(!token){ alert('Precisa GH_TOKEN'); return; }
      log('excluindo REAL via API: '+node.name,'err');
      // real delete via GitHub API
      try{
        const get = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+node.name,{headers:{Authorization:'token '+token}});
        const j = await get.json();
        await fetch('https://api.github.com/repos/'+REPO+'/contents/'+node.name,{
          method:'DELETE',
          headers:{Authorization:'token '+token,'Content-Type':'application/json'},
          body: JSON.stringify({message:'k-ai: excluir '+node.name, sha:j.sha})
        });
        log('excluído REAL '+node.name,'ok');
      }catch(err){ log('erro excluir '+err.message,'err'); }
    }},
    {sep:true},
    {label:'copiar caminho', action:()=>{ navigator.clipboard.writeText(node.name); log('copiar caminho '+node.name); }},
    {label:'copiar conteúdo', action:()=>{ navigator.clipboard.writeText(editor.value); log('copiar conteúdo'); }},
    {label:'duplicar', action:()=>{ log('duplicar '+node.name+' → '+node.name+'.copy'); }},
    {label:'mover/recortar', action:()=>{ clipboard={op:'cut', node}; log('recortar '+node.name); }},
    {label:'colar aqui (move sem duplicar)', action:()=>{ if(clipboard){ log('colar aqui move '+clipboard.node.name+' → '+node.name+' sem duplicar','ok'); clipboard=null; }}},
    {label:'anexar', action:()=>{ log('anexar arquivo em '+node.name); }},
    {sep:true},
    {label:'criar arquivo', action:()=>{ const n=prompt('Nome arquivo'); if(n) log('criar arquivo '+n,'ok'); }},
    {label:'criar pasta', action:()=>{ const n=prompt('Nome pasta'); if(n) log('criar pasta '+n,'ok'); }},
    {label:'ver publicado', action:()=>{ window.open('https://github.com/'+REPO+'/blob/main/'+node.name,'_blank'); }},
    {label:'raw', action:()=>{ window.open('https://raw.githubusercontent.com/'+REPO+'/main/'+node.name,'_blank'); }},
    {label:'histórico', action:()=>{ window.open('https://github.com/'+REPO+'/commits/main/'+node.name,'_blank'); }},
    {label:'mover para...', action:()=>{ const dest=prompt('Mover para pasta:'); if(dest) log('mover '+node.name+' → '+dest,'ok'); }},
  ];
  miniMenu.innerHTML='';
  items.forEach(it=>{
    if(it.sep){ const s=document.createElement('div'); s.className='sep'; miniMenu.appendChild(s); return; }
    const d=document.createElement('div');
    d.className='item'+(it.danger?' danger':'');
    d.innerHTML='<span>'+it.label+'</span><span style="opacity:0.5">↵</span>';
    d.onclick=()=>{ miniMenu.style.display='none'; it.action(); };
    miniMenu.appendChild(d);
  });
  miniMenu.style.left=e.pageX+'px';
  miniMenu.style.top=e.pageY+'px';
  miniMenu.style.display='block';
}

document.addEventListener('click',()=> miniMenu.style.display='none');

// leftDropZone events
leftDropZone.addEventListener('dragenter', ()=> leftDropZone.classList.add('dragging'));
leftDropZone.addEventListener('dragleave', ()=> leftDropZone.classList.remove('dragging'));
leftDropZone.addEventListener('dragover', (e)=>{ e.preventDefault(); leftDropZone.classList.add('dragging'); });
leftDropZone.addEventListener('drop', (e)=>{ e.preventDefault(); leftDropZone.classList.remove('dragging'); log('drop na leftDropZone → raiz','ok'); });

// root-bar drag over outline
rootBar.addEventListener('dragover', (e)=>{ e.preventDefault(); rootBar.classList.add('drag-over'); });
rootBar.addEventListener('dragleave', ()=> rootBar.classList.remove('drag-over'));
rootBar.addEventListener('drop', (e)=>{ e.preventDefault(); rootBar.classList.remove('drag-over'); log('drop em root-bar ../ (raiz) outline verde','ok'); });
rootBar.addEventListener('pointerenter', ()=>{
  if(dragged) rootBar.classList.add('drag-over');
});
rootBar.addEventListener('pointerleave', ()=> rootBar.classList.remove('drag-over'));

// token save
document.getElementById('saveToken').onclick=()=>{
  const v=tokenInput.value.trim();
  if(v){ localStorage.setItem('GH_TOKEN', v); log('GH_TOKEN salvo no localStorage','ok'); autoActivate(); }
};
if(localStorage.getItem('GH_TOKEN')) tokenInput.value=localStorage.getItem('GH_TOKEN');

// kaiBar
mountKaiBar({
  onSend: async (prompt)=>{
    log('K-AI prompt: '+prompt);
    try{
      const issue = await sendToGroqViaIssue(prompt);
      log('Issue criada #'+issue.number+' → workflow vai rodar com Secrets GROQ_API_KEY+GH_TOKEN+NODE','ok');
      editor.value+='\n// Issue #'+issue.number+' criada, aguardando workflow...';
    }catch(err){
      log('Erro criar Issue: '+err.message,'err');
    }
  }
});
autoActivate();
renderFileList();
log('repo carregado em root page inicial • ../ (raiz) verde OK','ok');
</script>
</body>
</html>
