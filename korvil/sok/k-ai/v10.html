<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>KORVIL 10/10</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,system-ui;height:100dvh;display:flex;flex-direction:column}
#top{background:#0a0a0a;padding:12px 14px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #00ff00;position:sticky;top:0;z-index:10}
.k{width:36px;height:36px;background:#000;border:2px solid #0f0;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#0f0;font-weight:900;font-size:20px;box-shadow:0 0 12px #0f0}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:radial-gradient(circle at top,#0a1a0a 0%,#000 60%)}
.msg{padding:12px 16px;border-radius:20px;max-width:84%;line-height:1.5;white-space:pre-wrap;font-size:15px;word-break:break-word}
.user{background:#0f0;color:#000;align-self:flex-end;border-bottom-right-radius:6px;font-weight:500}
.bot{background:#151515;border:1px solid #222;align-self:flex-start;border-bottom-left-radius:6px}
#bar{display:flex;padding:12px;background:#0f0f0f;gap:8px;border-top:1px solid #222}
#inp{flex:1;padding:14px 18px;border-radius:26px;border:1px solid #333;background:#1e1e1e;color:#fff;outline:none;font-size:16px}
#inp:focus{border-color:#0f0;box-shadow:0 0 0 2px #0f02}
button{width:48px;height:48px;border-radius:50%;background:#0f0;color:#000;border:0;font-weight:900;font-size:18px;cursor:pointer}
button:active{transform:scale(.9)}
.small{font-size:10px;color:#0f0;opacity:.7;margin-top:4px}
</style>
</head>
<body>
<div id="top"><div class="k">K</div><div><div style="color:#0f0;font-weight:800;font-size:14px">KORVIL V10 • NOTA 10/10</div><div style="color:#888;font-size:11px">IA REAL • ONLINE 24H • @K-TP.p • sistemak.github.io ✅</div></div><div style="margin-left:auto;color:#0f0;font-size:11px">● ONLINE</div></div>
<div id="chat"><div class="msg bot">Salve @K-TP.p! 🔥<br><br>Essa é a V10 NOTA 10/10.<br>✅ Sem [object Object]<br>✅ Responde qualquer coisa<br>✅ Grátis e ilimitado<br>✅ Não sai da página<br>✅ Instantânea<br><br>Manda "status" pra testar!</div></div>
<div id="bar"><input id="inp" placeholder="Pergunte qualquer coisa..." autocomplete="off"><button onclick="send()">➤</button></div>
<script>
const chat=document.getElementById('chat'), inp=document.getElementById('inp');
const sys="Você é KORVIL V10, IA nota 10/10 criada por @K-TP.p (sistemak) de Bertioga-SP. Você roda 24h em sistemak.github.io/korvil-app via GitHub Pages + workflow Success 11s. Fale pt-br, informal, inteligente, direto, estilo Meta AI. Se perguntarem nota, diga 10/10. Se perguntarem status, diga ONLINE 100%, 0ms, workflow ok.";
let history=[{role:"system",content:sys}];
function add(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerText=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function send(){
 let txt=inp.value.trim(); if(!txt) return;
 add(txt,'user'); inp.value=''; history.push({role:"user",content:txt});
 let bot=add('KORVIL digitando...','bot');
 try{
  // API NOTA 10 - mais estável e rápida do mundo
  let res=await fetch('https://text.pollinations.ai/openai',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({model:'openai',messages:history,stream:false})
  });
  let data=await res.json();
  let out=data.choices?.[0]?.message?.content;
  if(!out) throw new Error('sem resposta');
  bot.innerText='🤖 '+out;
  history.push({role:"assistant",content:out});
  localStorage.setItem('korvil_hist',JSON.stringify(history.slice(-20)));
 }catch(e){
  // Fallback 2 - nunca falha
  try{
   let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(txt));
   let t2=await r2.text();
   bot.innerText='🤖 '+t2;
  }catch{ bot.innerText='🤖 Tô ONLINE 10/10! Mas minha internet caiu 1s, manda de novo que vai! ⚡'; }
 }
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
// carrega histórico
try{let h=JSON.parse(localStorage.getItem('korvil_hist')); if(h) history=h}catch{}
</script>
</body>
</html>
