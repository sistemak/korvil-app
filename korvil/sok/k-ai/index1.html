        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap');
        :root{
          --bg:#050b0d;
          --chat-bg:#0b171a;
          --chat-inner:#0f2124;
          --border:rgba(0,245,255,0.26);
          --cyan:#00f5ff;
          --cyan-light:#76f7ff;
          --green:#6ef7b1;
          --gray:#9fb3b6;
          --gray-dark:#5a7073;
        }
        *{box-sizing:border-box}
        .root{
          min-height:100vh;
          min-height:100dvh;
          background:var(--bg);
          color:#cfecee;
          position:relative;
          overflow:clip;
          font-family:"Space Grotesk", system-ui, -apple-system, sans-serif;
          padding-top: var(--safe-area-inset-top, 0px);
          display:flex;
          align-items:center;
          justify-content:center;
        }
        .bg-decor{
          position:absolute; inset:0;
          overflow:hidden;
          pointer-events:none;
        }
        .korvil-huge{
          position:absolute;
          left:50%; top:42%;
          transform:translate(-50%,-50%);
          font-family:"JetBrains Mono", monospace;
          font-size:clamp(84px, 22vw, 220px);
          max-width:100%;
          width:100%;
          text-align:center;
          overflow:hidden;
          font-weight:800;
          letter-spacing:-0.08em;
          color:transparent;
          -webkit-text-stroke:1px rgba(0,245,255,0.07);
          line-height:0.8;
        }
        .korvil-subline{
          position:absolute;
          left:50%; top:12%;
          transform:translateX(-50%);
          display:flex; gap:12px;
          font-family:"JetBrains Mono", monospace;
          font-size:10px;
          letter-spacing:0.18em;
          color:rgba(159,179,182,0.45);
          white-space:nowrap;
          max-width:90vw;
          overflow:hidden;
          text-overflow:ellipsis;
        }
        .korvil-subline .dot{opacity:0.3}
        .grid-lines{
          position:absolute; inset:0;
          background:
            linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
          background-size:42px 42px;
          mask-image: radial-gradient(60% 60% at 50% 50%, black 60%, transparent 100%);
        }
        .glow-blob{
          position:absolute; border-radius:50%; filter:blur(90px);
        }
        .glow-1{ width:420px; height:420px; left:-80px; top:20%; background:rgba(0,245,255,0.08); }
        .glow-2{ width:520px; height:520px; right:-120px; bottom:5%; background:rgba(110,247,177,0.06); }

        .stage{
          position:relative;
          width:100%;
          max-width:520px;
          padding:24px 16px 32px;
          display:flex; flex-direction:column; align-items:center; gap:18px;
          z-index:1;
          overflow:clip;
        }
        .mini-chat-anchor-wrapper{
          position:relative;
          width:100%;
          max-width:390px;
          padding-bottom:116px;
          display:flex; justify-content:center;
        }
        .mini-chat{
          width:100%;
          height:min(640px, 78vh);
          background:linear-gradient(180deg, #0e1f23 0%, #0b171a 100%);
          border:1px solid var(--border);
          border-radius:28px;
          box-shadow:
            0 0 0 1px rgba(0,245,255,0.06) inset,
            0 20px 60px rgba(0,0,0,0.6),
            0 0 80px rgba(0,245,255,0.10);
          display:flex;
          flex-direction:column;
          overflow:hidden;
          position:relative;
        }
        .mini-header{
          height:64px;
          display:flex; align-items:center; gap:10px;
          padding:0 14px;
          border-bottom:1px solid rgba(0,245,255,0.12);
          background:rgba(8,20,22,0.9);
          flex-shrink:0;
        }
        .menu-btn{
          width:38px; height:38px;
          border-radius:50%;
          border:1px solid rgba(0,245,255,0.24);
          background:rgba(0,0,0,0.35);
          display:grid; place-items:center;
          cursor:pointer;
          transition:all .18s;
        }
        .menu-btn:hover{ background:rgba(0,245,255,0.08); box-shadow:0 0 12px rgba(0,245,255,0.25); }
        .hamburger{ display:flex; flex-direction:column; gap:4px; }
        .hamburger i{ display:block; width:14px; height:1.8px; background:var(--cyan-light); border-radius:2px; }
        .logo-k{
          width:36px; height:36px;
          border-radius:10px;
          border:1.6px solid var(--cyan);
          background:#000;
          display:grid; place-items:center;
          font-weight:800; color:var(--cyan);
          font-size:16px;
          box-shadow:0 0 12px rgba(0,245,255,0.35);
          flex-shrink:0;
        }
        .header-titles{ flex:1; min-width:0; }
        .title-kai{
          font-weight:700; font-size:14px; letter-spacing:0.06em;
          color:var(--cyan);
          text-shadow:0 0 12px rgba(0,245,255,0.7);
          line-height:1;
        }
        .title-sub{
          margin-top:3px;
          font-size:9px; letter-spacing:0.14em; color:var(--gray-dark);
          font-family:"JetBrains Mono", monospace;
        }
        .header-right{ display:flex; align-items:center; gap:10px; }
        .online-badge{
          display:flex; align-items:center; gap:6px;
          font-family:"JetBrains Mono", monospace;
          font-size:10px; letter-spacing:0.12em;
          color:var(--green);
          border:1px solid rgba(110,247,177,0.28);
          background:rgba(110,247,177,0.08);
          padding:6px 10px; border-radius:999px;
        }
        .pulse-dot{
          width:7px; height:7px; border-radius:50%;
          background:var(--green);
          box-shadow:0 0 8px var(--green);
          position:relative;
        }
        .pulse-dot::after{
          content:""; position:absolute; inset:-4px; border-radius:50%;
          border:1px solid var(--green);
          animation:pulse 1.6s infinite;
        }
        @keyframes pulse{ 0%{transform:scale(0.6); opacity:1} 100%{transform:scale(1.8); opacity:0} }
        .close-btn{
          width:30px; height:30px; border-radius:50%;
          border:1px solid rgba(255,255,255,0.12);
          background:rgba(0,0,0,0.3); color:#8aa6a9;
          cursor:pointer; font-size:12px;
        }

        .chat-body{
          flex:1; position:relative; overflow:hidden;
          background: radial-gradient(120% 80% at 50% 0%, rgba(0,245,255,0.06), transparent 60%), var(--chat-inner);
        }
        .messages{
          height:100%; overflow:auto; padding:18px 14px;
          scrollbar-width:thin; scrollbar-color:rgba(0,245,255,0.2) transparent;
        }
        .messages::-webkit-scrollbar{ width:4px }
        .messages::-webkit-scrollbar-thumb{ background:rgba(0,245,255,0.18); border-radius:10px }
        .bubble{
          background:#111f22;
          border:1px solid rgba(0,245,255,0.14);
          border-radius:18px 18px 18px 6px;
          padding:14px 16px;
          font-size:13.5px; line-height:1.45;
          color:#c8e6e8;
          max-width:92%;
          box-shadow:0 4px 18px rgba(0,0,0,0.35);
          margin-bottom:10px;
        }
        .spacer-20{ height:24px }

        /* side menu */
        .side-menu{
          position:absolute; top:0; left:0; bottom:0;
          width:84%;
          max-width:300px;
          background:linear-gradient(180deg, #0c1d20 0%, #0a1719 100%);
          border-right:1px solid var(--border);
          border-top:1px solid rgba(0,245,255,0.08);
          transform:translateX(-102%);
          transition:transform .32s cubic-bezier(.22,.8,.3,1);
          z-index:10;
          display:flex; flex-direction:column;
          box-shadow:8px 0 28px rgba(0,0,0,0.5);
        }
        .side-menu.open{ transform:translateX(0); }
        .side-dim{
          position:absolute; inset:0; background:rgba(0,0,0,0.45);
          backdrop-filter:blur(2px);
          z-index:5;
          animation:fadeIn .22s;
        }
        @keyframes fadeIn{ from{opacity:0} to{opacity:1} }
        .side-header{
          height:56px; display:flex; align-items:center; justify-content:space-between;
          padding:0 14px; border-bottom:1px solid rgba(0,245,255,0.12);
          font-size:13px; font-weight:600; letter-spacing:0.04em; color:var(--cyan-light);
        }
        .side-close{
          width:28px; height:28px; border-radius:50%;
          border:1px solid rgba(255,255,255,0.12); background:rgba(0,0,0,0.3);
          color:#8aa6a9; cursor:pointer;
        }
        .side-content{
          flex:1; overflow:auto; padding:12px 12px 18px;
          display:flex; flex-direction:column; gap:12px;
        }
        .primary-btn{
          height:40px; border-radius:12px;
          border:1px solid var(--cyan);
          background:rgba(0,245,255,0.10);
          color:var(--cyan-light);
          font-weight:600; font-size:13px; letter-spacing:0.02em;
          display:flex; align-items:center; justify-content:center; gap:8px;
          cursor:pointer;
          box-shadow:0 0 16px rgba(0,245,255,0.18) inset;
          transition:all .18s;
        }
        .primary-btn:hover{ background:rgba(0,245,255,0.16); box-shadow:0 0 20px rgba(0,245,255,0.28) inset; }
        .primary-btn.outline{ background:transparent; }
        .primary-btn .plus{ font-size:18px; line-height:1 }
        .primary-btn .target{ font-size:16px }
        .search-wrap{
          position:relative; height:40px;
          background:#081315; border:1px solid rgba(0,245,255,0.16);
          border-radius:12px; display:flex; align-items:center;
        }
        .search-icon{ padding:0 10px; color:var(--gray-dark); font-size:16px; }
        .search-wrap input{
          flex:1; background:transparent; border:0; outline:0;
          color:#9fcfd2; font-size:12.5px; font-family:"JetBrains Mono", monospace;
        }
        .search-wrap input::placeholder{ color:#4f6669; }
        .section-label{
          font-family:"JetBrains Mono", monospace;
          font-size:10px; letter-spacing:0.16em; color:var(--gray-dark);
          margin-top:2px;
        }
        .mt-18{ margin-top:10px }
        .action-list{ display:flex; flex-direction:column; gap:8px; }
        .action-item{
          height:42px; border-radius:12px;
          border:1px solid rgba(255,255,255,0.06);
          background:rgba(255,255,255,0.03);
          color:#b7d2d4; font-size:13px; text-align:left;
          padding:0 12px; display:flex; align-items:center; gap:10px;
          cursor:pointer; transition:all .18s;
        }
        .action-item:hover{ border-color:rgba(0,245,255,0.22); background:rgba(0,245,255,0.06); color:var(--cyan-light); }
        .ai-ic{ width:24px; height:24px; border-radius:50%; background:rgba(0,245,255,0.10); border:1px solid rgba(0,245,255,0.18); display:grid; place-items:center; font-size:11px; color:var(--cyan); flex-shrink:0; }
        .tags{ display:flex; flex-wrap:wrap; gap:8px; }
        .tag{
          padding:6px 10px; border-radius:999px;
          background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
          font-size:11px; color:#8fb0b3; font-family:"JetBrains Mono", monospace;
          cursor:pointer;
        }
        .tag:hover{ border-color:rgba(0,245,255,0.25); color:var(--cyan-light); }

        .mini-footer{
          height:72px; display:flex; align-items:center; gap:10px;
          padding:0 12px;
          border-top:1px solid rgba(0,245,255,0.12);
          background:rgba(8,20,22,0.95);
          flex-shrink:0;
        }
        .mic-btn{
          width:42px; height:42px; border-radius:50%;
          border:1px solid rgba(255,255,255,0.10);
          background:rgba(255,255,255,0.04); color:#9fb3b6;
          display:grid; place-items:center; cursor:pointer; flex-shrink:0;
        }
        .input-wrap{
          flex:1; height:44px; border-radius:999px;
          border:1px solid rgba(0,245,255,0.18);
          background:#0a1719;
          display:flex; align-items:center; padding:0 14px;
          box-shadow:0 0 0 1px rgba(0,245,255,0.05) inset;
        }
        .input-wrap input{
          width:100%; background:transparent; border:0; outline:0;
          color:#cfecee; font-size:13.5px;
        }
        .input-wrap input::placeholder{ color:#5a7073; }
        .send-btn{
          width:44px; height:44px; border-radius:50%;
          border:0; background:var(--cyan);
          box-shadow:0 0 18px rgba(0,245,255,0.55);
          display:grid; place-items:center; cursor:pointer; flex-shrink:0;
          transition:transform .15s, box-shadow .15s;
        }
        .send-btn:hover{ transform:scale(1.04); box-shadow:0 0 24px rgba(0,245,255,0.75); }
        .send-btn:active{ transform:scale(0.96); }

        /* K-AI anchored icon */
        .kai-anchor{
          position:absolute;
          right:10px;
          bottom:6px;
          width:100px;
          display:flex; flex-direction:column; align-items:center;
          gap:8px;
          z-index:20;
          touch-action:none;
          user-select:none;
          cursor:grab;
          max-width:100%;
        }
        .kai-anchor.dragging{ cursor:grabbing; z-index:50; }
        .kai-anchor.holding .kai-circle{ box-shadow:0 0 0 2px var(--cyan), 0 0 26px var(--cyan), 0 0 56px rgba(0,245,255,0.45); }
        .kai-name{
          font-size:12px; font-weight:700; letter-spacing:0.18em;
          color:var(--cyan);
          text-shadow:0 0 10px rgba(0,245,255,0.8), 0 0 20px rgba(0,245,255,0.4);
          line-height:1;
        }
        .kai-circle{
          width:80px; height:80px; border-radius:50%;
          background:#000;
          border:2px solid var(--cyan);
          box-shadow:0 0 0 2px rgba(0,245,255,0.18), 0 0 22px rgba(0,245,255,0.55), 0 0 48px rgba(0,245,255,0.22);
          position:relative;
          display:grid; place-items:center;
          overflow:hidden;
