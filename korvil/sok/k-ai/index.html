<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-AI • Multi IA</title>
  <style>
    :root {
      --bg: #071012;
      --bg-2: #0d1b20;
      --panel: rgba(14, 23, 26, 0.96);
      --panel-2: rgba(7, 15, 17, 0.88);
      --line: rgba(0, 245, 255, 0.25);
      --cyan: #00f5ff;
      --green: #6ef7b1;
      --amber: #ffcb6b;
      --text: #edfefc;
      --muted: #8cb9ba;
      --user: linear-gradient(135deg, #00f5ff, #5de7ff);
      --bot: linear-gradient(135deg, #101b20, #172f36);
      --shadow: 0 0 30px rgba(0, 245, 255, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background:
        radial-gradient(circle at top, rgba(0, 245, 255, 0.1), transparent 30%),
        linear-gradient(180deg, var(--bg), #04090a 100%);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(980px, 100%);
      height: min(92vh, 860px);
      display: flex;
      flex-direction: column;
      background: rgba(6, 14, 16, 0.82);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(14, 19, 20, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-weight: 900;
      color: var(--cyan);
      background: #000;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 16px rgba(0, 245, 255, 0.25);
    }

    .brand-title {
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--cyan);
      font-size: 0.82rem;
    }

    .brand-sub {
      color: var(--muted);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border: 1px solid rgba(110, 247, 177, 0.4);
      background: rgba(110, 247, 177, 0.08);
      border-radius: 999px;
      padding: 8px 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(110, 247, 177, 0.8);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.7; }
    }

    .chat-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: linear-gradient(180deg, rgba(4, 12, 16, 0.95), rgba(4, 15, 14, 0.9));
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: min(78%, 700px);
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: enter 0.2s ease;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.bot {
      align-self: flex-start;
    }

    .bubble {
      border-radius: 18px;
      padding: 12px 16px;
      line-height: 1.5;
      font-size: 0.96rem;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .message.user .bubble {
      background: var(--user);
      color: #031114;
      border-bottom-right-radius: 6px;
      font-weight: 600;
    }

    .message.bot .bubble {
      background: var(--bot);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.04);
      border-bottom-left-radius: 6px;
    }

    .message .meta {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 4px;
    }

    .composer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 14px;
      background: rgba(10, 18, 20, 0.96);
      border-top: 1px solid var(--line);
    }

    .btn,
    .send {
      border: 0;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.2s ease;
      user-select: none;
    }

    .btn:hover,
    .send:hover {
      filter: brightness(1.08);
    }

    .btn:active,
    .send:active {
      transform: scale(0.96);
    }

    .btn {
      background: rgba(255,255,255,0.04);
      color: var(--cyan);
      border: 1px solid rgba(0,245,255,0.35);
    }

    .send {
      background: linear-gradient(135deg, #00f5ff, #7cf3ff);
      color: #021b1d;
      font-size: 1.2rem;
      font-weight: 900;
      box-shadow: 0 0 18px rgba(0, 245, 255, 0.28);
    }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(0,245,255,0.2);
      border-radius: 18px;
      min-height: 52px;
      padding: 0 12px;
    }

    #input {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 0.96rem;
      outline: none;
      min-width: 0;
    }

    #input::placeholder {
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 12px 14px;
      }

      .brand-title {
        font-size: 0.72rem;
      }

      .status {
        font-size: 0.64rem;
        padding: 7px 9px;
      }

      .message {
        max-width: 88%;
      }

      .bubble {
        padding: 10px 12px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">K</div>
        <div>
          <div class="brand-title">K-AI v42</div>
          <div class="brand-sub">IA real • multi model</div>
        </div>
      </div>
      <div class="status"><span class="dot"></span> Online</div>
    </header>

    <div class="chat-wrap">
      <main id="chat" class="chat" aria-live="polite"></main>

      <div class="composer">
        <button id="clearBtn" class="btn" title="Limpar conversa" aria-label="Limpar conversa">✕</button>
        <div class="input-wrap">
          <input id="input" type="text" placeholder="Pergunte qualquer coisa..." autocomplete="off" />
        </div>
        <button id="sendBtn" class="send" title="Enviar" aria-label="Enviar">➤</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'korvil_kai_v42_multiai';
    const SYSTEM_PROMPT = `Você é o K-AI, uma IA de alto nível criada por @K-TP.p / sistemak. Responda em português do Brasil, de forma direta, útil e amigável. Quando possível, seja objetivo e prático. Você pode ajudar com programação, ideias, redação, resumo, dicas, automação, configuração de sites, troubleshooting e prompts. Sempre prefira clareza e ação.`;

    let history = [{ role: 'system', content: SYSTEM_PROMPT }];
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
          history = parsed.slice(-18);
        }
      } catch (error) {
        console.warn('Histórico ruim, ignorando:', error);
      }
    }

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-18)));
    }

    function addMessage(role, text) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message ' + role;

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'user' ? 'Você' : 'K-AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      wrapper.appendChild(meta);
      wrapper.appendChild(bubble);
      chatEl.appendChild(wrapper);
      chatEl.scrollTop = chatEl.scrollHeight;
      return bubble;
    }

    function renderHistory() {
      chatEl.innerHTML = '';
      for (const item of history.filter(item => item.role !== 'system')) {
        addMessage(item.role, item.content || '');
      }
    }

    function fallbackLocalReply(prompt) {
      const p = String(prompt || '').toLowerCase();

      if (!p.trim()) return 'Manda a pergunta que eu respondo direto.';
      if (p.includes('status') || p.includes('online') || p.includes('vivo')) {
        return 'K-AI está ONLINE 100% • multi IA • fallback funcionando • pronta para responder e ajudar.';
      }
      if (p.includes('oi') || p.includes('olá') || p.includes('salve')) {
        return 'Olá! Sou o K-AI. Posso ajudar com código, ideias, chat, resumo, textos e suporte rápido.';
      }
      if (p.includes('código') || p.includes('html') || p.includes('javascript') || p.includes('js') || p.includes('css')) {
        return 'Claro. Posso te ajudar com HTML, CSS, JS, componentes, layout responsivo, integração e bugs. Me manda o objetivo e o trecho que quer montar.';
      }
      if (p.includes('resumo') || p.includes('summar')) {
        return 'Resumo rápido: o ideal é explicar a ideia, separar o objetivo, os passos e o resultado esperado. Se quiser, posso transformar qualquer texto em resumo, plano ou versão mais clara.';
      }
      if (p.includes('prompt') || p.includes('ia')) {
        return 'Posso criar prompts para copiar e colar em IA, melhorar textos, gerar scripts de automação e estruturar instruções para qualquer fluxo de trabalho.';
      }
      return 'Tô online no fallback local e posso resolver com foco. Me diga o objetivo exato, contexto e o que você quer receber: resposta, código, resumo, estratégia ou prompt.';
    }

    async function callPollinationsOpenAI(prompt) {
      const payload = {
        model: 'openai',
        messages: [...history.filter(item => item.role !== 'system'), { role: 'user', content: prompt }],
        stream: false
      };

      const res = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error('Pollinations OpenAI falhou: ' + res.status);
      }

      const data = await res.json();
      const output = data?.choices?.[0]?.message?.content || data?.message?.content || data?.text || null;
      if (!output || !String(output).trim()) {
        throw new Error('Resposta vazia do Pollinations OpenAI');
      }
      return String(output).trim();
    }

    async function callPollinationsMistral(prompt) {
      const payload = {
        model: 'mistral',
        messages: [...history.filter(item => item.role !== 'system'), { role: 'user', content: prompt }],
        stream: false
      };

      const res = await fetch('https://text.pollinations.ai/openai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        throw new Error('Pollinations Mistral falhou: ' + res.status);
      }

      const data = await res.json();
      const output = data?.choices?.[0]?.message?.content || data?.message?.content || data?.text || null;
      if (!output || !String(output).trim()) {
        throw new Error('Resposta vazia do Pollinations Mistral');
      }
      return String(output).trim();
    }

    async function callTextEndpoint(prompt) {
      const url = 'https://text.pollinations.ai/' + encodeURIComponent(prompt);
      const res = await fetch(url);
      if (!res.ok) {
        throw new Error('Fallback text falhou: ' + res.status);
      }
      const text = await res.text();
      if (!text || !String(text).trim()) {
        throw new Error('Fallback text vazio');
      }
      return String(text).trim();
    }

    async function requestAITeams(prompt) {
      const attempts = [
        () => callPollinationsOpenAI(prompt),
        () => callPollinationsMistral(prompt),
        () => callTextEndpoint(prompt)
      ];

      let lastError = null;
      for (const fn of attempts) {
        try {
          return await fn();
        } catch (err) {
          lastError = err;
          console.warn('IA tentativa falhou:', err);
        }
      }

      console.warn('Todas as IAs falharam, usando fallback local:', lastError);
      return fallbackLocalReply(prompt);
    }

    async function sendMessage() {
      const value = inputEl.value.trim();
      if (!value) return;

      inputEl.value = '';
      addMessage('user', value);
      history.push({ role: 'user', content: value });
      saveHistory();

      const thinking = addMessage('bot', 'K-AI pensando...');

      try {
        const reply = await requestAITeams(value);
        thinking.textContent = reply;
        history.push({ role: 'assistant', content: reply });
        saveHistory();

        if ('speechSynthesis' in window) {
          try {
            const utterance = new SpeechSynthesisUtterance(reply.replace(/\s+/g, ' ').trim());
            utterance.lang = 'pt-BR';
            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
          } catch (error) {
            console.warn('Speech synthesis falhou:', error);
          }
        }
      } catch (error) {
        console.error(error);
        thinking.textContent = 'K-AI online, mas houve problema ao acessar as IA. Tente de novo em 1 segundo.';
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        sendMessage();
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      history = [{ role: 'system', content: SYSTEM_PROMPT }];
      saveHistory();
      renderHistory();
    });

    renderHistory();
    inputEl.focus();
  </script>
</body>
</html>
