        .main{flex:1;background:#0a0a0a;display:flex;flex-direction:column;overflow:hidden;position:relative}
        .main-content{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}

        /* MINI MENU VERTICAL */
        #mini-menu-vertical{
          position:absolute;top:64px;left:0;width:240px;background:rgba(14,14,14,0.98);border-right:1px solid rgba(255,255,255,0.12);border-bottom:1px solid rgba(255,255,255,0.12);border-bottom-right-radius:16px;

          transform:translateX(-100%);opacity:0;pointer-events:none;transition:all .28s cubic-bezier(.4,0,.2,1);overflow:hidden

        .mini-head{padding:16px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between}

        #iframe-container{flex:1;display:none;flex-direction:column;background:#000;position:relative}
        #iframe-container.active{display:flex}
        .iframe-topbar{height:52px;min-height:52px;background:rgba(14,14,14,0.98);border-bottom:1px solid rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px}
        .iframe-title{font-size:12px;letter-spacing:0.08em;color:var(--k-cyan);font-weight:800;text-transform:uppercase;display:flex;align-items:center;gap:8px}
        .iframe-actions{display:flex;gap:8px}
        .iframe-btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
        .iframe-btn.primary{background:linear-gradient(135deg,#00f5ff,#76f7ff);color:#000;border-color:var(--k-cyan);font-weight:900}

        #menu-overlay{position:absolute;inset:64px 0 0 0;background:rgba(0,0,0,0.4);z-index:20;opacity:0;pointer-events:none;transition:.25s}
