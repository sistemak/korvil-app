<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#25D366"/>
<link id="dynamic-manifest" rel="manifest" href="./manifest.json"/>
<title>KORVIL MESTRE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>*{font-family:'Inter',system-ui,sans-serif}::-webkit-scrollbar{width:0}.no-scrollbar{scrollbar-width:none}</style>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen flex flex-col overflow-hidden">
<header class="h-[64px] flex items-center justify-between px-4 md:px-6 border-b border-white/10 bg-black/60 backdrop-blur sticky top-0 z-20">
  <div class="flex items-center gap-3">
    <img id="headerLogo" src="https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png" class="w-9 h-9 rounded-full object-cover bg-white"/>
    <div>
      <p class="font-extrabold tracking-tight leading-none text-[15px]">KORVIL MESTRE</p>
      <p id="headerSub" class="text-[10px] opacity-60 tracking-[0.2em] uppercase">Hub Dinâmico v5</p>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <span id="sectorBadge" class="hidden md:inline text-[10px] px-2 py-1 rounded-full bg-white/10 border border-white/10">KORVIL</span>
    <button id="btnInstall" class="hidden bg-[#25D366] text-black font-bold text-[12px] px-4 py-2 rounded-full">INSTALAR APP</button>
  </div>
</header>

<div class="flex flex-1 overflow-hidden">
  <aside class="w-[86px] md:w-[104px] bg-[#111] border-r border-white/10 flex flex-col items-center py-4 gap-3 overflow-y-auto no-scrollbar relative">
    <div id="hubList" class="flex flex-col gap-3"></div>

    <!-- VERSÃO NO LUGAR DO SISTEMA K -->
    <div class="mt-auto w-full px-2 relative">
      <button id="versionBtn" class="w-full text-[9px] opacity-60 hover:opacity-100 bg-white/[0.06] border border-white/10 rounded-[10px] py-2 px-1 text-center leading-[1.2] transition">
        <span id="versionLabel">v.2026</span><br/>
        <span id="versionDate" class="text-[8px] opacity-60">--/--/----</span>
      </button>

      <!-- MINI POPUP NO MESMO LUGAR -->
      <div id="versionPopup" class="hidden absolute bottom-[60px] left-2 right-2 bg-[#1a1a1a] border border-white/10 rounded-[14px] p-3 z-50 shadow-[0_20px_60px_rgba(0,0,0,0.5)] animate-[scaleIn_0.2s_ease]">
        <p class="text-[11px] font-bold mb-1">Versão instalada</p>
        <p id="popupVersion" class="text-[12px] font-mono text-[#25D366]">v.2026</p>
        <p id="popupDateTime" class="text-[10px] opacity-60 mt-1 leading-[1.4]">--/--/---- --:--</p>
        <div class="mt-2 pt-2 border-t border-white/10">
          <p class="text-[9px] opacity-40">Última verificação</p>
          <p id="popupCheck" class="text-[9px]">agora</p>
        </div>
        <button id="btnUpdateApp" class="hidden mt-3 w-full bg-[#25D366] text-black font-bold text-[11px] py-2.5 rounded-full hover:bg-[#20bd5a] active:scale-[0.97]">ATUALIZAR AGORA</button>
        <p id="upToDateMsg" class="mt-2 text-[9px] text-center opacity-50">App atualizado ✓</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 relative bg-[#0a0a0a]">
    <iframe id="sectorFrame" class="w-full h-full border-0 bg-white" src="../korvil/index.html"></iframe>
    <div id="loading" class="absolute inset-0 grid place-items-center bg-[#0a0a0a] transition-opacity">
      <div class="flex flex-col items-center gap-3">
        <div class="w-10 h-10 border-2 border-white/20 border-t-[#25D366] rounded-full animate-spin"></div>
        <p class="text-xs opacity-60">Carregando setor...</p>
      </div>
    </div>
  </main>
</div>

<script>
// ==== CONTROLE DE VERSÃO - MUDA AQUI TODA VEZ QUE ATUALIZAR ====
const APP_VERSION = "v2026.10"; // v.ANO.versão
const APP_BUILD = "2026-10-07T21:00:00"; // ISO - muda quando atualizar
// ===============================================================

const SECTORS = [
  { id:'korvil', name:'KORVIL', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png', entry:'../korvil/index.html'},
  { id:'sistemak', name:'SISTEMA K', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/sistemak/images/logosistemak.png', entry:'../korvil/sections/sistemak/index.html'},
  { id:'kafortunado', name:'K-AFORTUNADO', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/kafortunado/images/logokafortunado.png', entry:'../korvil/sections/kafortunado/index.html'},
  { id:'kalma', name:'K-ALMA', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/kalma/images/logokalma.png', entry:'../korvil/sections/kalma/index.html'},
  { id:'ktp', name:'K-TP', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/ktp/projetotransformacao/assets/images/logotipos/logoprojetotransformacao.png', entry:'../korvil/sections/ktp/projetotransformacao/index.html'}
];

const LS_KEY='korvil_last_sector';
const LS_VERSION='korvil_version_installed';
const hubList=document.getElementById('hubList');
const frame=document.getElementById('sectorFrame');
const loading=document.getElementById('loading');
const headerLogo=document.getElementById('headerLogo');
const headerSub=document.getElementById('headerSub');
const sectorBadge=document.getElementById('sectorBadge');
let currentSector = localStorage.getItem(LS_KEY) || 'korvil';
let lastIconSector = currentSector;
let idleTimer=null;
let deferredPrompt=null;

function formatBR(iso){
  const d=new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatDateShort(iso){
  const d=new Date(iso);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}

// VERSÃO UI
function initVersionUI(){
  document.getElementById('versionLabel').textContent = APP_VERSION;
  document.getElementById('versionDate').textContent = formatDateShort(APP_BUILD);
  document.getElementById('popupVersion').textContent = localStorage.getItem(LS_VERSION) || APP_VERSION;
  document.getElementById('popupDateTime').textContent = formatBR(APP_BUILD);
  document.getElementById('popupCheck').textContent = formatBR(new Date());

  // Salva versão atual instalada
  const installed = localStorage.getItem(LS_VERSION);
  if(!installed){ localStorage.setItem(LS_VERSION, APP_VERSION); }

  checkForUpdate();
}

async function checkForUpdate(){
  try{
    // Tenta pegar version.json do servidor (você cria esse arquivo)
    const res = await fetch('./version.json?v='+Date.now(), {cache:'no-store'});
    if(res.ok){
      const data = await res.json();
      const latest = data.version;
      if(latest!== APP_VERSION){
        document.getElementById('btnUpdateApp').classList.remove('hidden');
        document.getElementById('upToDateMsg').classList.add('hidden');
        document.getElementById('popupVersion').innerHTML = `${localStorage.getItem(LS_VERSION)} → <span class="text-white">${latest}</span>`;
      }
    } else {
      // fallback: compara com localStorage
      if(localStorage.getItem(LS_VERSION)!== APP_VERSION){
        document.getElementById('btnUpdateApp').classList.remove('hidden');
        document.getElementById('upToDateMsg').classList.add('hidden');
      }
    }
  }catch(e){
    if(localStorage.getItem(LS_VERSION)!== APP_VERSION){
      document.getElementById('btnUpdateApp').classList.remove('hidden');
      document.getElementById('upToDateMsg').classList.add('hidden');
    }
  }
}

document.getElementById('versionBtn').onclick = (e)=>{
  e.stopPropagation();
  const p=document.getElementById('versionPopup');
  p.classList.toggle('hidden');
  if(!p.classList.contains('hidden')){
    document.getElementById('popupCheck').textContent = formatBR(new Date());
    checkForUpdate();
  }
};
document.addEventListener('click', (e)=>{
  if(!e.target.closest('#versionBtn') &&!e.target.closest('#versionPopup')){
    document.getElementById('versionPopup').classList.add('hidden');
  }
});

// BOTÃO ATUALIZAR SEM EXCLUIR
document.getElementById('btnUpdateApp').onclick = async ()=>{
  const btn=document.getElementById('btnUpdateApp');
  btn.textContent='ATUALIZANDO...';
  try{
    if('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.ready;
      await reg.update();
      if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
      // limpa caches antigos
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    localStorage.setItem(LS_VERSION, APP_VERSION);
    location.reload(true);
  }catch(err){
    location.reload(true);
  }
};

function renderHub(){
  hubList.innerHTML='';
  SECTORS.forEach(s=>{
    const btn=document.createElement('button');
    btn.className='group flex flex-col items-center gap-1.5';
    btn.innerHTML = `
      <div class="w-[56px] h-[56px] rounded-full p-[2px] ${currentSector===s.id?'bg-[#25D366]':'bg-white/10 group-hover:bg-white/20'} transition">
        <img src="${s.logo}" class="w-full h-full rounded-full object-cover bg-white"/>
      </div>
      <span class="text-[9px] tracking-widest ${currentSector===s.id?'text-[#25D366] font-bold':'opacity-60'}">${s.id.toUpperCase()}</span>
    `;
    btn.onclick=()=> switchSector(s.id, true);
    hubList.appendChild(btn);
  });
}
function updateAppIcon(opts){
  const sector = SECTORS.find(x=>x.id===opts.id) || SECTORS[0];
  try{
    const manifest = {
      name: sector.name+' - KORVIL MESTRE',
      short_name: sector.name,
      start_url: './index.html?sector='+sector.id,
      display: 'standalone',
      background_color: '#0a0a0a',
      theme_color: '#25D366',
      icons: [{ src: sector.logo, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    document.getElementById('dynamic-manifest').href=url;
    lastIconSector = sector.id;
  }catch(e){}
}
function switchSector(id, saveIcon){
  const sector = SECTORS.find(s=>s.id===id) || SECTORS[0];
  currentSector=id;
  localStorage.setItem(LS_KEY, id);
  if(saveIcon) updateAppIcon({id});
  renderHub();
  headerLogo.src=sector.logo;
  headerSub.textContent=sector.name+' • '+APP_VERSION;
  sectorBadge.textContent=sector.name;
  loading.style.opacity='1'; loading.style.pointerEvents='auto';
  frame.src=sector.entry+'?v='+Date.now();
  frame.onload=()=>{ loading.style.opacity='0'; loading.style.pointerEvents='none'; };
}

// INIT
initVersionUI();
renderHub();
switchSector(currentSector, false);
updateAppIcon({id: currentSector});

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){
    idleTimer=setTimeout(()=>{ switchSector('korvil', false); }, 60000);
  } else { clearTimeout(idleTimer); }
});

// SW NETWORK FIRST - ATUALIZA NA HORA
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='korvil-v10-network-first';
    self.addEventListener('install',e=>{ self.skipWaiting(); });
    self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())); });
    self.addEventListener('message',e=>{ if(e.data && e.data.type==='SKIP_WAITING') self.skipWaiting(); });
    self.addEventListener('fetch',e=>{
      e.respondWith(
        fetch(e.request).then(res=>{
          if(e.request.method==='GET' && res.status===200){
            const clone=res.clone(); caches.open(CACHE).then(c=>c.put(e.request, clone));
          }
          return res;
        }).catch(()=>caches.match(e.request).then(r=> r || caches.match('./index.html')))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob));
}
</script>
</body>
</html>
