/* K-AI - LOGO INTEIRA DENTRO DO CIRCULO + BORDA NEON TURQUESA PULSANTE */
:root{
 --k-cyan:#00f5ff;
 --k-cyan2:#76f7ff;
 --k-green:#6ef7b1;
}
#k-ai-float-btn{
 position:fixed;
 bottom:18px;
 right:12px;
 width:92px;
 height:92px;
 border-radius:50%;
 background: radial-gradient(circle at 35% 35%, #2b2b2b 0%, #1a1a1a 100%);
 border:2.5px solid #00f5ff;
 box-shadow:0 0 16px rgba(0,245,255,0.85), 0 0 32px rgba(0,245,255,0.45), 0 0 48px rgba(0,245,255,0.25), 0 12px 32px rgba(0,0,0,0.85);
 display:grid;
 place-items:center;
 cursor:pointer;
 z-index:99999;
 transition:.18s ease;
 user-select:none;
 animation:k-neon-pulse 1.8s infinite ease-in-out;
 overflow:hidden;
 padding:0;
}
#k-ai-float-btn:hover{transform:scale(1.06);filter:brightness(1.15)}
#k-ai-float-btn:active{transform:scale(0.94)}
#k-ai-float-btn img{
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center;
 padding:10px;
 border-radius:50%;
 display:block;
}
@keyframes k-neon-pulse{
 0%,100%{box-shadow:0 0 14px rgba(0,245,255,0.75), 0 0 28px rgba(0,245,255,0.4), 0 0 44px rgba(0,245,255,0.15), 0 12px 32px rgba(0,0,0,0.8); border-color:#00f5ff}
 50%{box-shadow:0 0 22px rgba(0,245,255,1), 0 0 40px rgba(0,245,255,0.7), 0 0 64px rgba(0,245,255,0.35), 0 12px 32px rgba(0,0,0,0.8); border-color:#7af0ff}
}


@keyframes k-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

#k-ai-widget{
 position:fixed;
 bottom:94px;
 right:22px;
 width:min(380px, calc(100vw - 24px));
 height:min(560px, 68vh);
 background:rgba(6,12,14,0.98);
 border:1px solid rgba(0,245,255,0.28);
 border-radius:22px;
 box-shadow:0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(0,245,255,0.18);
 display:flex;
 flex-direction:column;
 overflow:hidden;
 z-index:9998;
 backdrop-filter:blur(14px);
 transform:translateY(16px) scale(0.96);
 opacity:0;
 pointer-events:none;
 transition:.22s cubic-bezier(.2,.8,.2,1);
}
#k-ai-widget.open{
 transform:translateY(0) scale(1);
 opacity:1;
 pointer-events:auto;
}
.k-top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:12px 14px;
 background:rgba(10,20,22,0.96);
 border-bottom:1px solid rgba(255,255,255,0.06);
}
.k-brand{display:flex; align-items:center; gap:10px}
.k-mark{
 width:32px;height:32px;border-radius:10px;
 display:grid;place-items:center;
 background:#000;border:2px solid var(--k-cyan);
 color:var(--k-cyan); font-weight:900; box-shadow:0 0 12px rgba(0,245,255,0.25)
}
.k-title{font-size:.78rem; letter-spacing:.1em; color:var(--k-cyan); font-weight:900; line-height:1}
.k-sub{font-size:.58rem; letter-spacing:.12em; color:#8db7ba; text-transform:uppercase}
.k-online{
 display:inline-flex;align-items:center;gap:6px;
 border-radius:999px;border:1px solid rgba(110,247,177,0.4);
 background:rgba(110,247,177,0.08);color:var(--k-green);
 padding:4px 8px;font-size:.62rem;font-weight:800;letter-spacing:.08em;
}
.k-dot-sm{width:7px;height:7px;border-radius:50%;background:var(--k-green);box-shadow:0 0 8px var(--k-green)}
.k-chat{
 flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 12px;
 background:linear-gradient(180deg, rgba(5,11,13,0.9), rgba(7,18,19,0.95));
}
.k-msg{max-width:84%;display:flex;flex-direction:column;gap:4px;animation:k-in .18s ease}
@keyframes k-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.k-msg.user{align-self:flex-end}
.k-msg.bot{align-self:flex-start}
.k-meta{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:#8db7ba;padding:0 4px}
.k-bubble{border-radius:16px;padding:10px 13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;border:1px solid rgba(255,255,255,0.04);font-size:.86rem}
.k-msg.user .k-bubble{background:linear-gradient(135deg,#00f5ff,#7aeaff);color:#021a1d;border-bottom-right-radius:6px;font-weight:600}
.k-msg.bot .k-bubble{background:linear-gradient(135deg,#13272d,#0d1d22);color:#eefdfd;border-bottom-left-radius:6px}
.k-composer{display:flex;align-items:center;gap:8px;padding:10px 10px 12px;border-top:1px solid rgba(255,255,255,0.06);background:rgba(9,17,19,0.98)}
.k-input-wrap{flex:1;display:flex;align-items:center;gap:8px;border-radius:16px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,245,255,0.26);min-height:46px;padding:0 10px}
#k-input{flex:1;min-width:0;background:transparent;border:0;color:#eefdfd;font-size:.9rem;outline:none}
#k-input::placeholder{color:#8db7ba}
.k-act{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(0,245,255,0.28);background:rgba(255,255,255,0.03);color:var(--k-cyan);cursor:pointer}
.k-send{background:linear-gradient(135deg,#00f5ff,#82f4ff);color:#032124;border:0;font-weight:900;box-shadow:0 0 14px rgba(0,245,255,0.25)}
.k-quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 8px}
.k-q{font-size:.68rem;padding:6px 9px;border-radius:999px;border:1px solid rgba(0,245,255,0.22);background:rgba(255,255,255,0.03);color:#cfe;cursor:pointer}
</style>

<script>
// ==== CONTROLE DE VERSÃO ====
const APP_VERSION = "v2026.10";
const APP_BUILD = "2026-10-07T21:00:00";
const SECTORS = [
{ id:'korvil', name:'KORVIL', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/assets/images/logokorvil.png', entry:'../korvil/index.html'},
{ id:'sistemak', name:'SISTEMA K', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/sistemak/images/logosistemak.png', entry:'../korvil/sections/sistemak/index.html'},
{ id:'kafortunado', name:'K-AFORTUNADO', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/kafortunado/images/logokafortunado.png', entry:'../korvil/sections/kafortunado/index.html'},
{ id:'kalma', name:'K-ALMA', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/kalma/images/logokalma.png', entry:'../korvil/sections/kalma/index.html'},
{ id:'ktp', name:'K-TP', logo:'https://raw.githubusercontent.com/sistemak/korvil-app/main/korvil/sections/ktp/projetotransformacao/assets/images/logotipos/logoprojetotransformacao.png', entry:'../korvil/sections/ktp/projetotransformacao/index.html'}
];
const LS_KEY='korvil_last_sector';
const LS_VERSION='korvil_version_installed';
const hubList=document.getElementById('hubList');
const frame=document.getElementById('sectorFrame');
const loading=document.getElementById('loading');
const headerLogo=document.getElementById('headerLogo');
const headerSub=document.getElementById('headerSub');
const sectorBadge=document.getElementById('sectorBadge');
let currentSector = localStorage.getItem(LS_KEY) || 'korvil';
let idleTimer=null;
function formatBR(iso){ const d=new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function formatDateShort(iso){ const d=new Date(iso); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function initVersionUI(){
document.getElementById('versionLabel').textContent = APP_VERSION;
document.getElementById('versionDate').textContent = formatDateShort(APP_BUILD);
document.getElementById('popupVersion').textContent = localStorage.getItem(LS_VERSION) || APP_VERSION;
document.getElementById('popupDateTime').textContent = formatBR(APP_BUILD);
document.getElementById('popupCheck').textContent = formatBR(new Date());
const installed = localStorage.getItem(LS_VERSION);
if(!installed){ localStorage.setItem(LS_VERSION, APP_VERSION); }
checkForUpdate();
}
async function checkForUpdate(){
try{
const res = await fetch('./version.json?v='+Date.now(), {cache:'no-store'});
if(res.ok){
const data = await res.json();
const latest = data.version;
if(latest!== APP_VERSION){
document.getElementById('btnUpdateApp').classList.remove('hidden');
document.getElementById('upToDateMsg').classList.add('hidden');
document.getElementById('popupVersion').innerHTML = `${localStorage.getItem(LS_VERSION)} → <span class="text-white">${latest}</span>`;
}
} else {
if(localStorage.getItem(LS_VERSION)!== APP_VERSION){
document.getElementById('btnUpdateApp').classList.remove('hidden');
document.getElementById('upToDateMsg').classList.add('hidden');
}
}
}catch(e){
if(localStorage.getItem(LS_VERSION)!== APP_VERSION){
document.getElementById('btnUpdateApp').classList.remove('hidden');
document.getElementById('upToDateMsg').classList.add('hidden');
}
}
}
document.getElementById('versionBtn').onclick = (e)=>{
e.stopPropagation();
const p=document.getElementById('versionPopup');
p.classList.toggle('hidden');
if(!p.classList.contains('hidden')){
document.getElementById('popupCheck').textContent = formatBR(new Date());
checkForUpdate();
}
};
document.addEventListener('click', (e)=>{
if(!e.target.closest('#versionBtn') &&!e.target.closest('#versionPopup')){
document.getElementById('versionPopup').classList.add('hidden');
}
});
document.getElementById('btnUpdateApp').onclick = async ()=>{
const btn=document.getElementById('btnUpdateApp');
btn.textContent='ATUALIZANDO...';
try{
if('serviceWorker' in navigator){
const reg = await navigator.serviceWorker.ready;
await reg.update();
if(reg.waiting){ reg.waiting.postMessage({type:'SKIP_WAITING'}); }
const keys = await caches.keys();
await Promise.all(keys.map(k=>caches.delete(k)));
}
localStorage.setItem(LS_VERSION, APP_VERSION);
location.reload(true);
}catch(err){ location.reload(true); }
};
function renderHub(){
hubList.innerHTML='';
SECTORS.forEach(s=>{
const btn=document.createElement('button');
btn.className='group flex flex-col items-center gap-1.5';
btn.innerHTML = `
<div class="w-[56px] h-[56px] rounded-full p-[2px] ${currentSector===s.id?'bg-[#25D366]':'bg-white/10 group-hover:bg-white/20'} transition">
<img src="${s.logo}" class="w-full h-full rounded-full object-cover bg-white"/>
</div>
<span class="text-[9px] tracking-widest ${currentSector===s.id?'text-[#25D366] font-bold':'opacity-60'}">${s.id.toUpperCase()}</span>
`;
btn.onclick=()=> switchSector(s.id, true);
hubList.appendChild(btn);
});
}
function updateAppIcon(opts){
const sector = SECTORS.find(x=>x.id===opts.id) || SECTORS[0];
try{
const manifest = { name: sector.name+' - KORVIL MESTRE', short_name: sector.name, start_url: './index.html?sector='+sector.id, display: 'standalone', background_color: '#0a0a0a', theme_color: '#25D366', icons: [{ src: sector.logo, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
const url = URL.createObjectURL(blob);
document.getElementById('dynamic-manifest').href=url;
}catch(e){}
}
function switchSector(id, saveIcon){
const sector = SECTORS.find(s=>s.id===id) || SECTORS[0];
currentSector=id;
localStorage.setItem(LS_KEY, id);
if(saveIcon) updateAppIcon({id});
renderHub();
headerLogo.src=sector.logo;
headerSub.textContent=sector.name+' • '+APP_VERSION;
sectorBadge.textContent=sector.name;
loading.style.opacity='1';
loading.style.pointerEvents='auto';
frame.src=sector.entry+'?v='+Date.now();
frame.onload=()=>{
loading.style.opacity='0';
loading.style.pointerEvents='none';
};
}
initVersionUI();
renderHub();
switchSector(currentSector, false);
updateAppIcon({id: currentSector});
document.addEventListener('visibilitychange', ()=>{
if(document.hidden){
idleTimer=setTimeout(()=>{ switchSector('korvil', false); }, 60000);
} else { clearTimeout(idleTimer); }
});
if('serviceWorker' in navigator){
const swCode = `
const CACHE='korvil-v10-network-first';
self.addEventListener('install',e=>{ self.skipWaiting(); });
self.addEventListener('activate',e=>{ e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())); });
self.addEventListener('message',e=>{ if(e.data && e.data.type==='SKIP_WAITING') self.skipWaiting(); });
self.addEventListener('fetch',e=>{
e.respondWith( fetch(e.request).then(res=>{
if(e.request.method==='GET' && res.status===200){
const clone=res.clone();
caches.open(CACHE).then(c=>c.put(e.request, clone));
}
return res;
}).catch(()=>caches.match(e.request).then(r=> r || caches.match('./index.html')))
);
});
`;
const blob = new Blob([swCode], {type:'application/javascript'});
navigator.serviceWorker.register(URL.createObjectURL(blob));
}

// ================= K-AI LOGIC INTEGRADA (MINI CHAT) =================
const K_STORAGE_KEY='korvil_kai_v42_multiia';
const K_SYSTEM_PROMPT=`Você é o K-AI v42, IA criada por @K-TP.p / sistemak. Responda em português do Brasil, sempre útil, direta e prática. Pode ajudar com programação, código, HTML, CSS, JavaScript, análise, estratégia, prompts, negócios, design e automação. Está funcionando como assistente flutuante dentro do app KORVIL MESTRE (app-not).`;

const kBtn=document.getElementById('k-ai-float-btn');
const kWidget=document.getElementById('k-ai-widget');
const kChatEl=document.getElementById('k-chat');
const kInput=document.getElementById('k-input');
let kHistory=[{role:'system', content:K_SYSTEM_PROMPT}];
try{
const saved=JSON.parse(localStorage.getItem(K_STORAGE_KEY)||'null');
if(Array.isArray(saved)&&saved.length) kHistory=saved.slice(-18);
}catch(e){}

function kSave(){ localStorage.setItem(K_STORAGE_KEY, JSON.stringify(kHistory.slice(-18))); }

function kAdd(role,text){
const wrap=document.createElement('div');
wrap.className='k-msg '+role;
const meta=document.createElement('div');
meta.className='k-meta';
meta.textContent=role==='user'?'Você':'K-AI';
const bubble=document.createElement('div');
bubble.className='k-bubble';
bubble.textContent=String(text||'');
wrap.appendChild(meta);
wrap.appendChild(bubble);
kChatEl.appendChild(wrap);
kChatEl.scrollTop=kChatEl.scrollHeight;
return bubble;
}
function kRender(){
kChatEl.innerHTML='';
for(const item of kHistory.filter(i=>i.role!=='system')){
kAdd(item.role, item.content||'');
}
if(kHistory.filter(i=>i.role!=='system').length===0){
kAdd('bot','Salve! Sou o K-AI v42. Tô online aqui dentro do KORVIL MESTRE. Como posso te ajudar agora?');
}
}
function kFallback(prompt){
const p=String(prompt||'').toLowerCase();
if(!p.trim()) return 'Manda a pergunta que eu respondo direto.';
if(p.includes('status')||p.includes('online')) return 'K-AI ONLINE 100% • Multi IA ativa • Fallback local funcionando dentro do app-not • pronto.';
if(p.includes('oi')||p.includes('olá')||p.includes('salve')) return 'Olá! Sou o K-AI, rodando como ícone flutuante dentro do KORVIL MESTRE. Posso ajudar com código, ideias, textos, automação e loja.';
if(p.includes('loja')||p.includes('ecommerce')) return 'Posso montar uma loja virtual completa. Me diga a categoria e o estilo.';
if(p.includes('código')||p.includes('html')||p.includes('css')||p.includes('js')) return 'Manda o objetivo e o stack. Posso criar componentes, corrigir bugs, landing pages e scripts prontos.';
if(p.includes('prompt')) return 'Posso criar prompts profissionais para IA. Me diz o objetivo do prompt.';
return 'Tô online aqui no widget e posso resolver com foco. Me diga o objetivo, contexto e formato da resposta.';
}
async function kCallOpenAI(payload){
const res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:payload,stream:false})});
if(!res.ok) throw new Error('OpenAI falhou');
const data=await res.json();
const out=data?.choices?.[0]?.message?.content||data?.message?.content||data?.text||null;
if(!out||!String(out).trim()) throw new Error('vazia');
return String(out).trim();
}
async function kCallMistral(payload){
const res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'mistral',messages:payload,stream:false})});
if(!res.ok) throw new Error('Mistral falhou');
const data=await res.json();
const out=data?.choices?.[0]?.message?.content||data?.message?.content||data?.text||null;
if(!out||!String(out).trim()) throw new Error('vazia');
return String(out).trim();
}
async function kCallText(prompt){
const res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt));
if(!res.ok) throw new Error('Text falhou');
const t=await res.text();
if(!t||!String(t).trim()) throw new Error('vazia');
return String(t).trim();
}
async function kRequestAI(prompt){
const payload=kHistory.filter(i=>i.role!=='system');
payload.push({role:'user',content:prompt});
const attempts=[()=>kCallOpenAI(payload),()=>kCallMistral(payload),()=>kCallText(prompt)];
let last=null;
for(const a of attempts){
try{ return await a(); }catch(e){ last=e; console.warn('K-AI tentativa falhou',e); }
}
return kFallback(prompt);
}
async function kSend(){
const text=kInput.value.trim();
if(!text) return;
kInput.value='';
kAdd('user',text);
kHistory.push({role:'user',content:text});
kSave();
const thinking=kAdd('bot','K-AI pensando...');
try{
const reply=await kRequestAI(text);
thinking.textContent=reply;
kHistory.push({role:'assistant',content:reply});
kSave();
if('speechSynthesis' in window){
try{
const ut=new SpeechSynthesisUtterance(String(reply).replace(/\s+/g,' ').trim());
ut.lang='pt-BR';
speechSynthesis.cancel();
speechSynthesis.speak(ut);
}catch(e){}
}
}catch(e){
thinking.textContent='Erro de conexão, mas estou online no fallback. Tente novamente.';
}
}

// INTERAÇÃO DO ÍCONE - 1 clique rápido abre mini chat
let kOpen=false;
function toggleKAI(){
kOpen=!kOpen;
kWidget.classList.toggle('open',kOpen);
if(kOpen){
kRender();
setTimeout(()=>kInput.focus(),120);
}
}
kBtn.addEventListener('click', toggleKAI);
document.getElementById('k-close').addEventListener('click', toggleKAI);
document.getElementById('k-send').addEventListener('click', kSend);
kInput.addEventListener('keydown', e=>{ if(e.key==='Enter') kSend(); });
document.querySelectorAll('.k-q').forEach(b=>{
b.addEventListener('click', ()=>{
kInput.value=b.dataset.q;
kSend();
});
});
document.getElementById('k-mic').addEventListener('click', ()=>{
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){ kAdd('bot','Microfone não disponível neste navegador.'); return; }
const rec=new SR();
rec.lang='pt-BR';
rec.interimResults=false;
rec.onresult=(ev)=>{
const transcript=ev.results[0][0].transcript;
kInput.value=transcript;
kSend();
};
rec.start();
});

// Fechar ao clicar fora
document.addEventListener('click', (e)=>{
if(kOpen && !e.target.closest('#k-ai-widget') && !e.target.closest('#k-ai-float-btn') && !e.target.closest('#versionPopup') && !e.target.closest('#versionBtn')){
kWidget.classList.remove('open');
kOpen=false;
}
});

// Atalho teclado
document.addEventListener('keydown', e=>{
if(e.key==='Escape' && kOpen){ toggleKAI(); }
});
</script>
