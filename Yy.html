<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GTA KORVIL</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');*{margin:0;padding:0;box-sizing:border-box;font-family:'Press Start 2P',monospace}body{background:#000;color:#fff;overflow:hidden}.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}.screen.active{display:flex}.gta-logo{font-size:42px;color:#ff0;text-shadow:4px 4px 0 #000,8px 8px 0 #f00;transform:skew(-5deg);text-align:center;line-height:50px;animation:glitch .3s infinite}@keyframes glitch{0%{text-shadow:4px 4px 0 #000,8px 8px 0 #f00}50%{text-shadow:-4px 4px 0 #000,8px -8px 0 #0ff}100%{text-shadow:4px 4px 0 #000,8px 8px 0 #f00}}.card{border:4px solid #444;padding:20px;margin:10px;cursor:pointer;width:240px;text-align:center;background:#111}.card.sel{border-color:#ff0;background:#222}.color-dot{width:22px;height:22px;border-radius:50%;display:inline-block;margin:3px;cursor:pointer;border:2px solid #000}.color-dot.sel{border-color:#ff0;transform:scale(1.2)}.btn{padding:12px 24px;background:#ff0;color:#000;border:none;font-size:10px;cursor:pointer;margin:8px}#gameCanvas{border:4px solid #ff0;max-width:95vw;max-height:70vh}.hud{position:absolute;top:10px;left:10px;font-size:9px;line-height:16px;z-index:10;background:rgba(0,0,0,.8);padding:8px;border:1px solid #555}.objective{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000;color:#fff;padding:8px 12px;border:2px solid #ff0;font-size:8px;z-index:10}.minimap{position:absolute;bottom:10px;left:10px;width:130px;height:130px;border:2px solid #fff;background:#000;z-index:10}.dialog{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);background:#000;border:3px solid #ff0;padding:14px;width:90%;max-width:560px;font-size:9px;line-height:14px;z-index:20}</style></head><body>
<div id="menu" class="screen active"><div class="gta-logo">GTA<br>KORVIL</div><div style="margin-top:20px;font-size:9px;color:#666">KORVIL CITY 1997 EDITION</div><div style="margin-top:30px"><div style="color:#ff0;margin:12px;cursor:pointer" onclick="go('select')">► START GAME</div><div style="color:#888;margin:12px">OPTIONS</div></div><div style="margin-top:30px;font-size:8px;animation:blink 1s infinite">PRESS START - IGUAL GTA 1 ORIGINAL</div></div>
<div id="select" class="screen"><div style="font-size:14px;color:#ff0;margin-bottom:15px">CHOOSE YOUR PLAYER</div><div style="display:flex;flex-wrap:wrap;justify-content:center"><div class="card sel" id="cardM" onclick="pick('M')"><div style="width:100px;height:100px;margin:auto;background:#222;display:flex;align-items:center;justify-content:center;font-size:40px">👨</div><div>KORV</div><div style="font-size:7px;color:#aaa">SPEED 7<br>STRENGTH 8</div></div><div class="card" id="cardF" onclick="pick('F')"><div style="width:100px;height:100px;margin:auto;background:#300;display:flex;align-items:center;justify-content:center;font-size:40px">👩</div><div>VIL</div><div style="font-size:7px;color:#aaa">SPEED 9<br>STRENGTH 6</div></div></div><button class="btn" onclick="go('custom')">NEXT →</button></div>
<div id="custom" class="screen"><div style="font-size:12px;color:#ff0">CUSTOMIZE YOUR SKIN</div><div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center"><div id="preview" style="width:140px;height:200px;background:#111;border:3px solid #ff0;position:relative"></div><div style="width:300px"><div style="font-size:7px;margin:6px 0">PELE</div><div id="skinColors"></div><div style="font-size:7px;margin:6px 0">CABELO TIPO</div><div id="hairTypes"></div><div style="font-size:7px;margin:6px 0">CABELO COR</div><div id="hairColors"></div><div style="font-size:7px;margin:6px 0">CAMISA</div><div id="shirtColors"></div><div style="font-size:7px;margin:6px 0">CALÇA</div><div id="pantsColors"></div></div></div><button class="btn" style="margin-top:16px;background:#0f0" onclick="startGame()">▶ PLAY MISSION 1</button></div>
<div id="game" class="screen" style="background:#2d5a27"><div class="hud" id="hud"></div><div class="objective" id="obj"></div><canvas id="gameCanvas" width="800" height="600"></canvas><canvas id="mini" class="minimap" width="130" height="130"></canvas><div class="dialog" id="dialog" style="display:none"></div></div>
<script>
let gender='M',custom={skin:'#f8d2a0',hairType:'curto',hairColor:'#222',shirt:'#111',pants:'#224'};const skins=['#f8d2a0','#e8b88a','#c68642','#8d5524','#5a3a28','#f5d0b8'],hairCols=['#111','#a33','#ff0','#fff','#964','#f80'],shirtCols=['#111','#c00','#00c','#0a0','#ff0','#fff','#f0f'],pantsCols=['#224','#111','#442','#060','#400'],hairTypes=['curto','longo','moicano','careca','bone'];
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='custom')renderCustom();}
function pick(g){gender=g;document.getElementById('cardM').classList.toggle('sel',g==='M');document.getElementById('cardF').classList.toggle('sel',g==='F');}
function renderCustom(){let a=document.getElementById('skinColors');a.innerHTML='';skins.forEach(c=>{let d=document.createElement('div');d.className='color-dot'+(custom.skin===c?' sel':'');d.style.background=c;d.onclick=()=>{custom.skin=c;updatePreview();renderCustom()};a.appendChild(d)});let b=document.getElementById('hairTypes');b.innerHTML='';hairTypes.forEach(t=>{let e=document.createElement('button');e.textContent=t;e.style.cssText='font-size:6px;padding:4px;margin:2px;background:'+(custom.hairType===t?'#ff0':'#333')+';color:'+(custom.hairType===t?'#000':'#fff')+';border:none';e.onclick=()=>{custom.hairType=t;updatePreview();renderCustom()};b.appendChild(e)});let c=document.getElementById('hairColors');c.innerHTML='';hairCols.forEach(col=>{let d=document.createElement('div');d.className='color-dot'+(custom.hairColor===col?' sel':'');d.style.background=col;d.onclick=()=>{custom.hairColor=col;updatePreview();renderCustom()};c.appendChild(d)});let d=document.getElementById('shirtColors');d.innerHTML='';shirtCols.forEach(col=>{let e=document.createElement('div');e.className='color-dot'+(custom.shirt===col?' sel':'');e.style.background=col;e.onclick=()=>{custom.shirt=col;updatePreview();renderCustom()};d.appendChild(e)});let e=document.getElementById('pantsColors');e.innerHTML='';pantsCols.forEach(col=>{let f=document.createElement('div');f.className='color-dot'+(custom.pants===col?' sel':'');f.style.background=col;f.onclick=()=>{custom.pants=col;updatePreview();renderCustom()};e.appendChild(f)});updatePreview();}
function updatePreview(){document.getElementById('preview').innerHTML=`<div style="position:absolute;left:50px;top:20px;width:40px;height:40px;border-radius:50%;background:${custom.skin}"></div>${custom.hairType!=='careca'?`<div style="position:absolute;left:${custom.hairType==='moicano'?'60px':'48px'};top:12px;width:${custom.hairType==='moicano'?'12px':'44px'};height:${custom.hairType==='longo'?'28px':'16px'};background:${custom.hairType==='bone'?'#00f':custom.hairColor};border-radius:8px 8px 0 0"></div>`:''}<div style="position:absolute;left:40px;top:60px;width:60px;height:50px;background:${custom.shirt}"></div><div style="position:absolute;left:40px;top:110px;width:24px;height:50px;background:${custom.pants}"></div><div style="position:absolute;left:76px;top:110px;width:24px;height:50px;background:${custom.pants}"></div>`;}
let ctx,miniCtx,keys={},player,buildings,cars,police,phone,garage,targetCar,missionStep,wanted,money,health,hideTimer,missionTime;
function startGame(){go('game');ctx=document.getElementById('gameCanvas').getContext('2d');miniCtx=document.getElementById('mini').getContext('2d');buildings=[{x:80,y:80,w:160,h:90},{x:320,y:60,w:140,h:120},{x:540,y:80,w:180,h:90},{x:80,y:260,w:160,h:130},{x:320,y:280,w:140,h:130},{x:540,y:260,w:180,h:130},{x:80,y:480,w:640,h:20}];player={x:400,y:520,w:14,h:14,speed:3,inCar:false,car:null,dir:0};phone={x:400,y:110,w:16,h:16};garage={x:400,y:540,w:90,h:40};targetCar={x:200,y:60,w:30,h:18,color:'#0af',taken:false,dir:0};cars=[targetCar,{x:600,y:200,w:30,h:18,color:'#f33',vx:2},{x:150,y:250,w:30,h:18,color:'#3f3',vx:1.5},{x:500,y:350,w:30,h:18,color:'#ff3',vx:-1.8}];police=[];missionStep=0;wanted=0;money=0;health=100;hideTimer=0;missionTime=0;keys={};showDialog('FASE 1: BEM-VINDO A KORVIL<br><br>Vá até o telefone amarelo no norte!<br>Siga a seta amarela!');window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')keys['e']=true});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);requestAnimationFrame(loop);}
function showDialog(t){let d=document.getElementById('dialog');d.style.display='block';d.innerHTML=t+'<br><br><span style="color:#ff0">[TOQUE]</span>';d.onclick=()=>d.style.display='none';setTimeout(()=>d.style.display='none',6000);}
function setObj(t){document.getElementById('obj').innerHTML=t;}
function collide(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function loop(){requestAnimationFrame(loop);missionTime++;let dx=0,dy=0;if(keys['w']||keys['arrowup'])dy=-1;if(keys['s']||keys['arrowdown'])dy=1;if(keys['a']||keys['arrowleft'])dx=-1;if(keys['d']||keys['arrowright'])dx=1;if(player.inCar){let car=player.car,move=0;if(keys['w'])move=1;if(keys['s'])move=-1;if(dx)car.dir+=dx*0.06;let nx=player.x+Math.cos(car.dir)*4*move,ny=player.y+Math.sin(car.dir)*4*move;if(!buildings.some(b=>collide(nx-15,ny-9,30,18,b.x,b.y,b.w,b.h))){player.x=nx;player.y=ny;car.x=player.x;car.y=player.y;}}else{if(dx||dy){player.dir=Math.atan2(dy,dx);let nx=player.x+dx*player.speed,ny=player.y+dy*player.speed;if(!buildings.some(b=>collide(nx-player.w/2,ny-player.h/2,player.w,player.h,b.x,b.y,b.w,b.h))){player.x=nx;player.y=ny;}}}cars.forEach(c=>{if(c===player.car)return;if(c.vx){c.x+=c.vx;if(c.x<40||c.x>760)c.vx*=-1;if(buildings.some(b=>collide(c.x-15,c.y-9,30,18,b.x,b.y,b.w,b.h)))c.vx*=-1;}});if(wanted>0){police.forEach(p=>{let ang=Math.atan2(player.y-p.y,player.x-p.x);p.x+=Math.cos(ang)*2.3;p.y+=Math.sin(ang)*2.3;p.dir=ang;if(Math.hypot(player.x-p.x,player.y-p.y)<22){health-=0.6;if(health<=0){alert('WASTED!');startGame();return;}if(Math.hypot(player.x-p.x,player.y-p.y)<16){alert('BUSTED!');startGame();return;}}});let near=police.some(p=>Math.hypot(player.x-p.x,player.y-p.y)<160);if(!near)hideTimer++;else hideTimer=0;if(hideTimer>300){wanted=0;hideTimer=0;showDialog('Despistou a polícia! Vá para garagem VERDE no sul!');}}if(missionStep===0){setObj('➤ VÁ ATÉ O TELEFONE AMARELO');if(Math.hypot(player.x-phone.x,player.y-phone.y)<30){missionStep=1;showDialog('MARCOS: Roube o BANSHEE AZUL no norte!');setObj('➤ ROUBE O BANSHEE AZUL (E)');}}else if(missionStep===1){setObj('➤ ROUBE O BANSHEE AZUL - Pressione E');if(!player.inCar&&Math.hypot(player.x-targetCar.x,player.y-targetCar.y)<32&&keys['e']){player.inCar=true;player.car=targetCar;targetCar.taken=true;wanted=1;police=[{x:100,y:100,dir:0},{x:700,y:100,dir:0}];showDialog('ALARME! POLÍCIA A CAMINHO! FUJA!');setObj('★ PROCURADO! FUJA P/ GARAGEM VERDE');missionStep=2;keys['e']=false;}}else if(missionStep===2){setObj((wanted>0?'★ PROCURADO! ':'')+'➤ LEVE PARA GARAGEM VERDE NO SUL');if(Math.hypot(player.x-garage.x,player.y-garage.y)<60&&player.inCar&&player.car===targetCar&&wanted===0){missionStep=3;money=5000;document.getElementById('obj').innerHTML=`<span style="color:#0f0">MISSION PASSED! $5000</span><br><button class="btn" onclick="startGame()">REJOGAR</button><button class="btn" style="background:#0f0" onclick="missionStep=99;setObj('FREE ROAM - Korvil é sua!')">FREE ROAM</button>`;showDialog('FASE 1 COMPLETA! Korvil é sua!');return;}}ctx.fillStyle='#3a6b35';ctx.fillRect(0,0,800,600);ctx.fillStyle='#777';ctx.fillRect(0,0,800,600);ctx.fillStyle='#333';buildings.forEach(b=>{ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#222';ctx.fillRect(b.x+4,b.y+4,b.w-8,b.h-8);ctx.fillStyle='#333';});ctx.fillStyle=missionStep===2?'#0f0':'#060';ctx.fillRect(garage.x-garage.w/2,garage.y-garage.h/2,garage.w,garage.h);ctx.fillStyle='#fff';ctx.font='9px monospace';ctx.fillText('GARAGE',garage.x-24,garage.y+3);ctx.fillStyle=missionStep===0?(Math.floor(missionTime/12)%2?'#ff0':'#fa0'):'#665500';ctx.fillRect(phone.x-8,phone.y-10,16,20);ctx.fillStyle='#000';ctx.fillText('T',phone.x-3,phone.y+2);cars.forEach(c=>{ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.dir||0);ctx.fillStyle=c.color;ctx.fillRect(-15,-9,30,18);ctx.fillStyle='#000';ctx.fillRect(-10,-6,8,4);ctx.fillRect(4,-6,8,4);ctx.restore();});police.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir);ctx.fillStyle='#fff';ctx.fillRect(-14,-8,28,16);ctx.fillStyle='#00f';ctx.fillRect(-10,-5,20,3);if(Math.floor(missionTime/6)%2){ctx.fillStyle='#f00';ctx.fillRect(-4,-12,8,4);}ctx.restore();});if(!player.inCar){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.dir);ctx.fillStyle=custom.skin;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();if(custom.hairType!=='careca'){ctx.fillStyle=custom.hairType==='bone'?'#00f':custom.hairColor;ctx.fillRect(-7,-12,14,6);}ctx.fillStyle=custom.shirt;ctx.fillRect(-6,5,12,10);ctx.fillStyle=custom.pants;ctx.fillRect(-5,15,5,9);ctx.fillRect(1,15,5,9);ctx.fillStyle='#fff';ctx.fillRect(6,-2,7,2);ctx.restore();let tx=missionStep===0?phone.x:missionStep===1?targetCar.x:garage.x,ty=missionStep===0?phone.y:missionStep===1?targetCar.y:garage.y,ang=Math.atan2(ty-player.y,tx-player.x);ctx.save();ctx.translate(player.x+Math.cos(ang)*42,player.y+Math.sin(ang)*42);ctx.rotate(ang);ctx.fillStyle='#ff0';ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-6,-5);ctx.lineTo(-6,5);ctx.fill();ctx.restore();}miniCtx.fillStyle='#000';miniCtx.fillRect(0,0,130,130);miniCtx.fillStyle='#555';buildings.forEach(b=>miniCtx.fillRect(b.x/800*130,b.y/600*130,b.w/800*130,b.h/600*130));let mtx=missionStep===0?phone.x:missionStep===1?targetCar.x:garage.x,mty=missionStep===0?phone.y:missionStep===1?targetCar.y:garage.y;miniCtx.fillStyle='#ff0';miniCtx.beginPath();miniCtx.arc(mtx/800*130,mty/600*130,4,0,Math.PI*2);miniCtx.fill();miniCtx.fillStyle='#fff';miniCtx.beginPath();miniCtx.arc(player.x/800*130,player.y/600*130,3,0,Math.PI*2);miniCtx.fill();}
</script></body></html>
