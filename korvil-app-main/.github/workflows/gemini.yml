name: Gemini + Github JUNTOS

on:
  workflow_dispatch: # pra rodar manual em Actions
  push:
    branches: [ main ] # ou roda automático quando der push

jobs:
  rodar-ia:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Separar os 2 tokens do secret TOKENS
        id: tokens
        run: |
          # Pega AQ_TOKEN = antes do ###
          AQ=$(echo "${{ secrets.TOKENS }}" | awk -F'###' '{print $1}')
          # Pega GH_TOKEN = depois do ###
          GH=$(echo "${{ secrets.TOKENS }}" | awk -F'###' '{print $2}')
          echo "aq=$AQ" >> $GITHUB_OUTPUT
          echo "gh=$GH" >> $GITHUB_OUTPUT

      - name: Chamar Gemini IA
        env:
          AQ_TOKEN: ${{ steps.tokens.outputs.aq }}
        run: |
          echo "Mandando prompt pro Gemini..."
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$AQ_TOKEN" \
          -H "Content-Type: application/json" \
          -d '{"contents":[{"parts":[{"text":"Gere um README.md em portugues para este repositorio. Seja criativo."}]}]}' \
          | jq -r '.candidates[0].content.parts[0].text' > README_GERADO.md

          cat README_GERADO.md

      - name: Commitar no Github com GH_TOKEN
        env:
          GH_TOKEN: ${{ steps.tokens.outputs.gh }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:$GH_TOKEN@github.com/${{ github.repository }}
          mv README_GERADO.md README.md
          git add README.md
          git commit -m "🤖 IA Gemini gerou README automaticamente" || echo "Nada pra commitar"
          git push
