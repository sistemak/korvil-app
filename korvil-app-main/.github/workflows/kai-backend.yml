name: K-AI BACKEND
on: workflow_dispatch:
  inputs: {comando: {}, arquivo: {}, codigo: {}}
jobs:
  editar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
        with: {token: ${{ secrets.KAI_TOKEN }}}
      - run: echo '${{ inputs.codigo }}' > ${{ inputs.arquivo }}
      - run: |
          git config user.name "K-AI BOT"
          git commit -am "KAI: ${{ inputs.comando }}"
          git push
