<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KORVIL LOJA - K.L</title>
<script>
  // CONFIG REAL - SETOR KORVIL-LOJA - ANO/MES COM NOME
  const GITHUB_REPO = "sistemak/korvil-app";
  const GITHUB_BRANCH = "main";
  const ASAAS_CONTA = "korvil.p@gmail.com";
  const MESES_NOME = ['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const agoraPagamento = new Date();
  const ANO_ATUAL = agoraPagamento.getFullYear();
  const MES_ATUAL_NOME = MESES_NOME[agoraPagamento.getMonth()];
  const RAW_BASE_KORVIL_LOJA = `https://raw.githubusercontent.com/${GITHUB_REPO}/${GITHUB_BRANCH}/korvil/sections/korvil-loja/pagamentos`;

  async function verificarPagamentoReal(pixId) {
    try {
      let url = `${RAW_BASE_KORVIL_LOJA}/${ANO_ATUAL}/${MES_ATUAL_NOME}/${pixId}.json?t=${Date.now()}`;
      let r = await fetch(url, {cache:'no-store'});
      if (r.ok) return await r.json();
      let mesAnt = new Date(agoraPagamento.getFullYear(), agoraPagamento.getMonth()-1, 1);
      let url2 = `${RAW_BASE_KORVIL_LOJA}/${mesAnt.getFullYear()}/${MESES_NOME[mesAnt.getMonth()]}/${pixId}.json?t=${Date.now()}`;
      let r2 = await fetch(url2, {cache:'no-store'});
      if (r2.ok) return await r2.json();
      return {pago:false};
    } catch(e) { return {pago:false}; }
  }
</script>
